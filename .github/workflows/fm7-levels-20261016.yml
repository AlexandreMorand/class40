name: Add FM7 Medium Difficult Expert
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add checked levels and preserve every old question
        run: |
          cat > /tmp/patch.py <<'END-PATCH'
          import json,base64,gzip,re
          qs=json.loads(gzip.decompress(base64.b64decode('')))
          p='data.js';s=open(p).read();d=json.loads(s[15:-2]);old=json.loads(s[15:-2]);assert set(d['QCM_LEVELS']['fm'])=={'9'}
          target='"QCM_LEVELS":'+json.dumps(d['QCM_LEVELS'],ensure_ascii=False,separators=(',',':'));assert s.count(target)==1
          d['QCM_LEVELS']['fm']['7']=qs
          replacement='"QCM_LEVELS":'+json.dumps(d['QCM_LEVELS'],ensure_ascii=False,separators=(',',':'))
          s=s.replace(target,replacement);after=json.loads(s[15:-2]);old['QCM_LEVELS']['fm']['7']=qs;assert after==old
          assert len(qs)==30 and len({q['id']for q in qs})==30
          for l in [1,2,3]:assert sum(q['level']==l for q in qs)==10
          open(p,'w').write(s)
          p='sw.js';s=open(p).read();assert "const CACHE='c40-fm9-levels-20261016';"in s
          s=s.replace("const CACHE='c40-fm9-levels-20261016';","const CACHE='c40-fm79-levels-20261016';",1)
          assert "if(/\.pdf$/i.test(url.pathname)) return;"in s
          open(p,'w').write(s)
          END-PATCH
          python3 /tmp/patch.py
          node --check data.js
          git config user.name 'class40-bot'
          git config user.email 'bot@class40.local'
          git add data.js sw.js
          git rm -q .github/workflows/fm7-levels-20261016.yml
          git commit -m 'Add 30 FM7 questions with Medium Difficult Expert levels'
          git push
