name: publish-cr12daily25
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: echo "" | base64 -d > q.b64 && echo "" | base64 -d > patch.py && python3 patch.py
      - name: commit
        run: |
          rm -f patch.py q.b64 .github/workflows/publish-cr12daily25.yml
          git config user.email "bot@class40.local"
          git config user.name "class40 bot"
          git add -A
          git commit -m "CR: ajout distinct de 30 QCM IAS 36 en trois niveaux"
          git push
