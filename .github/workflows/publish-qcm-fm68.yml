name: Publish QCM FM sessions 6 and 8
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          set -euo pipefail
          base64 -d > /tmp/patch_live.py <<'P1'
          
          P1
          base64 -d > /tmp/qcm-fm68.json <<'P2'
          
          P2
          python3 /tmp/patch_live.py
          rm .github/workflows/publish-qcm-fm68.yml
          git config user.name AlexandreMorand
          git config user.email alexandre.morandd@gmail.com
          git add data.js sw.js .github/workflows/publish-qcm-fm68.yml
          git commit -m 'Add QCM for Financial Management sessions 6 and 8'
          git push
