name: CR choices option correction
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked CR level corrections
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib,base64,zlib
          p=pathlib.Path('data.js');s=p.read_text();orig=s
          assert hashlib.sha256(s.encode()).hexdigest()=='bc1de2f5f60bf7cb3b0ee4d4ac1c504001be4c17049c121a39d61cc05debeb10'
          patch=json.loads(zlib.decompress(base64.b64decode(open('/tmp/cr8/patch.b64').read() if False else '')))
          dec=json.JSONDecoder()
          for k,q,ch,key in patch:
              tok='{"id":'+json.dumps(k)+','
              assert s.count(tok)==1,k
              st=s.index(tok);a=s.index('"choices":',st)+10
              old,l=dec.raw_decode(s[a:]);assert len(old)==4
              c=re.compile('"correct_index":(\\d)').search(s,a);assert int(c.group(1))==key and c.start()-a<2500
              new=json.dumps(ch,ensure_ascii=True,separators=(',',':'))
              s=s[:a]+new+s[a+l:]
          b=json.loads(s[len('window.C40DATA='):].strip().rstrip(';'));o=json.loads(orig[len('window.C40DATA='):].strip().rstrip(';'))
          ids={x[0] for x in patch}
          def walk(x,y):
              if isinstance(x,dict):
                  assert x.keys()==y.keys()
                  if x.get('id') in ids:
                      for kk in x:
                          if kk!='choices': assert x[kk]==y[kk]
                      return 1
                  return sum(walk(x[kk],y[kk]) for kk in x)
              if isinstance(x,list):
                  assert len(x)==len(y);return sum(walk(i,j) for i,j in zip(x,y))
              assert x==y;return 0
          n=walk(o,b);assert n==len(patch),n
          p.write_text(s)
          sw=pathlib.Path('sw.js');t=sw.read_text();assert 'c40-cr-weak-20261021' in t
          sw.write_text(t.replace('c40-cr-weak-20261021','c40-cr-choices-20261021'))
          print(len(patch),hashlib.sha256(s.encode()).hexdigest())
          PY
          rm .github/workflows/cr-choices.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js sw.js .github/workflows/cr-choices.yml
          git commit -m 'Rebalance CR choices options'
          git push
