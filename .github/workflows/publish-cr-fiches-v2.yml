      - name: commit
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@localhost"
          rm -f .github/workflows/publish-cr-fiches-v2.yml
          git add app.js sw.js fiches/ .github/workflows/publish-cr-fiches-v2.yml
          git commit -m "Fiches CR: textes epures (tirets, points-virgules, watch out) et aeration"
          git push
