name: clarify-cr-qcm
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clarify ten reviewed CR questions
        run: |
          python3 - <<'PYTHON'
          import base64,gzip
          exec(gzip.decompress(base64.b64decode('')))
          PYTHON
          sed -i "s/c40-fiche-clean-20261023/c40-qcm-clarity-20261023/" sw.js
          node --check data.js
      - name: Publish
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@localhost"
          rm .github/workflows/clarify-cr-qcm.yml
          git add data.js sw.js .github/workflows/clarify-cr-qcm.yml
          git commit -m "CR: clarifier dix questions relues et leurs explications"
          git push
