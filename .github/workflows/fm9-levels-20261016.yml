name: Add FM9 Medium Difficult Expert
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add checked levels without touching old questions or storage
        run: |
          cat > /tmp/levels_patch.py <<'END-PATCH'
          import json,base64,gzip,hashlib,re
          payload=json.loads(gzip.decompress(base64.b64decode('')))
          def sha(s):return hashlib.sha256(s.encode()).hexdigest()
          p='app.js';s=open(p).read();assert sha(s)=='2c59422552c1819dfb69fef2bfe8d8ee022929ffd455ed0473f380e0200be612'
          open(p,'w').write(payload['app'])
          p='data.js';s=open(p).read();before=json.loads(s[15:-2]);assert 'QCM_LEVELS'not in before
          addition=',"QCM_LEVELS":'+json.dumps(payload['levels'],ensure_ascii=False,separators=(',',':'))
          after_s=s[:-3]+addition+'};\n'
          after=json.loads(after_s[15:-2]);check=dict(after);del check['QCM_LEVELS'];assert check==before
          assert s[:-3]==after_s[:len(s)-3]
          ids=[q['id']for bank in before['QCM'].values()for q in bank]
          for cid,groups in payload['levels'].items():
           for n,qs in groups.items():
            assert len(qs)==30
            for l in [1,2,3]:assert sum(q['level']==l for q in qs)==10
            for q in qs:
             assert q['id']not in ids;ids.append(q['id']);assert len(set(q['choices']))==4
          open(p,'w').write(after_s)
          p='sw.js';s=open(p).read();assert sha(s)=='338c144ac8c950109077dd76484936a91a0c1230193a8ec893ebb9309bea9038'
          s=re.sub(r"const CACHE='[^']+';","const CACHE='c40-fm9-levels-20261016';",s,count=1)
          assert "if(/\.pdf$/i.test(url.pathname)) return;"in s
          open(p,'w').write(s)
          p='index.html';s=open(p).read();assert sha(s)=='35713bac9092dfc869275e5f30a7ef8d059b140e6dec19e9d126d75a2cb5fa93'
          assert s.count('app.js?v=sets-20261015')==1
          s=s.replace('app.js?v=sets-20261015','app.js?v=levels-20261016')
          open(p,'w').write(s)
          END-PATCH
          python3 /tmp/levels_patch.py
          node --check app.js
          node --check data.js
          git config user.name 'class40-bot'
          git config user.email 'bot@class40.local'
          git add app.js data.js index.html sw.js
          git rm -q .github/workflows/fm9-levels-20261016.yml
          git commit -m 'Add genuine FM9 Medium Difficult Expert levels and preserve legacy progression'
          git push
