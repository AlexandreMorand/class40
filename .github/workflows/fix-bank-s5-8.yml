name: fix-cr-bank-s5-s8-20261026
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebalance 6 flagged CR bank questions in sessions 5 to 8
        run: |
          python3 << 'PYEOF'
          import base64, gzip, json
          fixes = json.loads(gzip.decompress(base64.b64decode("")))
          assert len(fixes) == 6
          s = open('data.js', encoding='utf8').read()
          for o in fixes:
              iid = o['id']
              start = s.find('{"id":"%s"' % iid)
              assert start > 0, iid + ': not found'
              depth = 0
              i = start
              while True:
                  c = s[i]
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: break
                  i += 1
              oldj = json.loads(s[start:i+1])
              assert oldj['id'] == iid
              assert oldj['question'] == o['question'], iid + ': stem drift'
              s = s[:start] + json.dumps(o, ensure_ascii=False, separators=(',',':')) + s[i+1:]
          open('data.js', 'w', encoding='utf8').write(s)
          sw = open('sw.js', encoding='utf8').read()
          assert 'c40-cr-bank-s14a-20261026' in sw
          sw = sw.replace('c40-cr-bank-s14a-20261026', 'c40-cr-bank-s58a-20261026')
          open('sw.js', 'w', encoding='utf8').write(sw)
          print('6 bank questions rebalanced, cache bumped')
          PYEOF
      - name: Commit and push content
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git add data.js sw.js
          git commit -m "Banque CR sessions 5 a 8: reequilibrage de 6 questions (indices de longueur)"
          git push
      - name: Remove one-shot workflow
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git rm -q .github/workflows/*.yml
          git commit -m "Remove one-shot publish workflow"
          git push
