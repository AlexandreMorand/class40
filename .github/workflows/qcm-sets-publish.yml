name: qcm-sets-publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch data.js, app.js, index.html, sw.js
        run: |
          python3 - <<'PYEOF'
          import base64, json, math, re
          def sub_once(text, o64, n64, tag):
              o = base64.b64decode(o64).decode()
              n = base64.b64decode(n64).decode()
              assert text.count(o) == 1, tag
              return text.replace(o, n)
          adds = json.loads(base64.b64decode(""))
          raw = open('data.js', encoding='utf-8').read()
          m = re.search(r'window\.C40DATA\s*=\s*(\{.*\})\s*;?\s*$', raw, re.S)
          data = json.loads(m.group(1))
          orig = json.loads(json.dumps(data['QCM']))
          for q in adds:
              data['QCM']['fm'].append(q)
          for cid, qs in data['QCM'].items():
              g = {}
              for q in qs:
                  g.setdefault(str(q['session']), []).append(q)
              for key, lst in g.items():
                  lst.sort(key=lambda q: int(re.search(r'q(\d+)$', q['id']).group(1)))
                  n = len(lst)
                  k = 1 if n <= 15 else math.ceil(n/15)
                  base, rem = divmod(n, k)
                  if k > 1 and base < 10: k = 1
                  if k == 1:
                      for q in lst: q['set'] = 1
                  else:
                      i = 0
                      for s in range(1, k+1):
                          size = base + (1 if s <= rem else 0)
                          for q in lst[i:i+size]: q['set'] = s
                          i += size
          for cid in orig:
              pb = {q['id']: q for q in data['QCM'][cid]}
              for q in orig[cid]:
                  assert {k2: v2 for k2, v2 in pb[q['id']].items() if k2 != 'set'} == q, (cid, q['id'])
          fm = data['QCM']['fm']
          assert len(fm) == 147, len(fm)
          out = 'window.C40DATA=' + json.dumps(data, ensure_ascii=True, separators=(',',':')) + ';\n'
          json.loads(re.search(r'window\.C40DATA\s*=\s*(\{.*\})\s*;?\s*$', out, re.S).group(1))
          open('data.js', 'w', encoding='utf-8').write(out)
          app = open('app.js', encoding='utf-8').read()
          app = sub_once(app, "ZnVuY3Rpb24gYmFuayhjaWQsIG4pewogIHJldHVybiAoRC5RQ01bY2lkXXx8W10pLmZpbHRlcihmdW5jdGlvbihxKXsgcmV0dXJuIG1hdGNoZXNTZXNzaW9uKGNpZCxxLG4pOyB9KTsKfQ==", "", "E1")
          app = sub_once(app, "ICBlbHNlIGlmKG49PW51bGwgfHwgbj09PSdhbGwnKXsgYiA9IChELlFDTVtjaWRdfHxbXSkuc2xpY2UoKTsgfQogIGVsc2UgeyBiID0gYmFuayhjaWQsbikuc2xpY2UoKTsgfQ==", "ICBlbHNlIGlmKG49PW51bGwgfHwgbj09PSdhbGwnKXsgYiA9IChELlFDTVtjaWRdfHxbXSkuc2xpY2UoKTsgfQogIGVsc2UgaWYoL15zZXRbMC05XSskLy50ZXN0KFN0cmluZyhzcmMpKSl7IGIgPSBiYW5rKGNpZCxuLHBhcnNlSW50KFN0cmluZyhzcmMpLnNsaWNlKDMpLDEwKSkuc2xpY2UoKTsgfQogIGVsc2UgeyBiID0gYmFuayhjaWQsbikuc2xpY2UoKTsgfQ==", "E2")
          app = sub_once(app, "", "", "E3")
          app = sub_once(app, "", "", "E4")
          app = sub_once(app, "KyAnPGJ1dHRvbiBjbGFzcz0iZ28iIGRhdGEtZ289IiMvcS8nK2NpZCsnLycrcy5rZXkrJyI+Jw==", "KyAnPGJ1dHRvbiBjbGFzcz0iZ28iIGRhdGEtZ289IiMvcy8nK2NpZCsnLycrcy5rZXkrJyI+Jw==", "E5")
          open('app.js', 'w', encoding='utf-8').write(app)
          idx = open('index.html', encoding='utf-8').read()
          assert idx.count('app.js?v=cleanup-20261015') == 1
          idx = idx.replace('app.js?v=cleanup-20261015', 'app.js?v=sets-20261015')
          open('index.html', 'w', encoding='utf-8').write(idx)
          sw = open('sw.js', encoding='utf-8').read()
          sw2 = re.sub(r'c40-[a-z0-9-]+', 'c40-qcm-sets-20261015', sw, count=1)
          assert sw2 != sw
          open('sw.js', 'w', encoding='utf-8').write(sw2)
          print('patched all four files; fm total', len(fm))
          PYEOF
          node --check app.js && echo "app.js syntax OK"
      - name: Commit, push, self-delete
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q .github/workflows/qcm-sets-publish.yml
          git add data.js app.js index.html sw.js
          git commit -q -m "QCM sets of 10-15 per session with own progression; FM s7+4, s9+6"
          git push
