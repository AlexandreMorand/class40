        run: |
          git config user.name "class40-bot"
          git config user.email "bot@localhost"
          rm .github/workflows/rewrite-cr-book.yml
          git add data.js sw.js .github/workflows/rewrite-cr-book.yml
          git commit -m "CR: reprise pedagogique complete sessions 9 a 14 et deux mocks"
          git push
