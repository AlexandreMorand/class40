name: qcm-s6-s78en-publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch data.js and bump SW cache
        run: |
          python3 - <<'PYEOF'
          import base64, json, re
          repl = json.loads(base64.b64decode(""))
          adds = json.loads(base64.b64decode(""))
          raw = open('data.js', encoding='utf-8').read()
          for q in repl:
              pat = re.compile(r'\{"id":"' + q['id'] + r'".*?\}')
              m = pat.findall(raw)
              assert len(m) == 1, (q['id'], len(m))
              news = json.dumps(q, ensure_ascii=True, separators=(',',':'))
              raw = pat.sub(lambda _: news, raw, count=1)
          anchor = '"fm":['
          i = raw.find(anchor)
          assert i > 0, 'anchor not found'
          block = json.dumps(adds, ensure_ascii=True, separators=(',',':'))[1:-1]
          raw = raw[:i+len(anchor)] + block + ',' + raw[i+len(anchor):]
          m = re.search(r'window\.C40DATA\s*=\s*(\{.*\})\s*;?\s*$', raw, re.S)
          data = json.loads(m.group(1))
          fm = data['QCM']['fm']
          s6 = [q for q in fm if q['session'] == '6']
          assert len(s6) == 20, f'expected 20 s6, got {len(s6)}'
          assert len(fm) == 137, f'fm total {len(fm)}'
          q17 = [q for q in fm if q['id'] == 'fm-s7-q17'][0]
          assert q17['question'].startswith('When estimating'), 's7-q17 not english'
          open('data.js', 'w', encoding='utf-8').write(raw)
          sw = open('sw.js', encoding='utf-8').read()
          sw2 = re.sub(r'c40-[a-z0-9-]+', 'c40-qcm-s6en-20261015', sw, count=1)
          assert sw2 != sw, 'sw cache name not bumped'
          open('sw.js', 'w', encoding='utf-8').write(sw2)
          print('patched: fm total', len(fm), '| s6:', len(s6))
          PYEOF
      - name: Commit, push, self-delete
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q .github/workflows/qcm-s6-s78en-publish.yml
          git add data.js sw.js
          git commit -q -m "Add FM session 6 top-up (6 questions), rewrite s7/s8 top-up in English"
          git push
