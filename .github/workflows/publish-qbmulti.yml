name: publish-qbmulti
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: precondition
        run: |
          test "$(sha256sum app.js | cut -d' ' -f1)" = "7eed8a554cb1925b2de2ff3dc9e3b8ca704feb6af406681506a458f973124040"
      - name: write payload
        run: echo "" | base64 -d > /tmp/payload.py && python3 /tmp/payload.py
      - name: commit
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@localhost"
          rm -f .github/workflows/publish-qbmulti.yml
          git add app.js sw.js .github/workflows/publish-qbmulti.yml
          git commit -m "QCM a la carte: selection multiple de sessions"
          git push
