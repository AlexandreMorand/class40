name: CR levels option correction
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked CR level corrections
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib,base64,zlib
          p=pathlib.Path('data.js');s=p.read_text();orig=s
          assert hashlib.sha256(s.encode()).hexdigest()=='750dda89ba1e5301cecc0f5d668ade1eea43283a503b948f3d000ce1597bcea5'
          patch=json.loads(zlib.decompress(base64.b64decode('')))
          dec=json.JSONDecoder()
          for k,q,ch in patch:
              tok='{"id":'+json.dumps(k)+','
              assert s.count(tok)==1,k
              st=s.index(tok)
              qa=s.index('"question":',st)+11;oq,ql=dec.raw_decode(s[qa:])
              ca=s.index('"choices":',st)+10;oc,cl=dec.raw_decode(s[ca:]);assert len(oc)==4 and len(ch)==4 and qa<ca and ca-qa<3000
              nq=json.dumps(q,ensure_ascii=True,separators=(',',':'));nc=json.dumps(ch,ensure_ascii=True,separators=(',',':'))
              s=s[:ca]+nc+s[ca+cl:]
              s=s[:qa]+nq+s[qa+ql:]
          b=json.loads(s[len('window.C40DATA='):].strip().rstrip(';'));o=json.loads(orig[len('window.C40DATA='):].strip().rstrip(';'))
          ids={x[0] for x in patch}
          def walk(x,y):
              if isinstance(x,dict):
                  assert x.keys()==y.keys()
                  if x.get('id') in ids:
                      for kk in x:
                          if kk not in('choices','question'): assert x[kk]==y[kk],kk
                      return 1
                  return sum(walk(x[kk],y[kk]) for kk in x)
              if isinstance(x,list):
                  assert len(x)==len(y);return sum(walk(i,j) for i,j in zip(x,y))
              assert x==y;return 0
          n=walk(o,b);assert n==len(patch),n
          p.write_text(s)
          sw=pathlib.Path('sw.js');t=sw.read_text();assert 'c40-fm-legacy-20261021' in t
          sw.write_text(t.replace('c40-fm-legacy-20261021','c40-cr-levels-20261021'))
          print(len(patch),hashlib.sha256(s.encode()).hexdigest())
          PY
          rm .github/workflows/cr-levels.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js sw.js .github/workflows/cr-levels.yml
          git commit -m 'Rebalance CR levels options'
          git push
