name: Publish FM sessions 4-5 and 6 set 3
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Append original questions and validate unchanged existing content
        run: |
          cat > /tmp/patch.py <<'END-PATCH-SCRIPT'
          import json,re
          from collections import Counter
          NEW=json.loads('[{"id":"fm-s45-q21","session":"4-5","topic":"Annualized forward premium","question":"A currency is quoted in dollars per unit. Spot is $0.80 and the 90-day forward is $0.804. Using a 360-day year and (F / S - 1) x 360 / 90, what is the annualized forward premium?","choices":["0.5%, the premium over the 90-day period.","2.0%, the 90-day premium annualized four times.","0.125%, the premium divided by four.","4.0%, the forward price minus the spot price."],"correct_index":1,"explanation":"The 90-day premium is 0.804 / 0.80 - 1 = 0.5%. Multiplying by 360 / 90 gives a 2.0% annualized premium. The quote convention is stated explicitly.","set":3},{"id":"fm-s45-q22","session":"4-5","topic":"Forward cash settlement","question":"A US exporter will receive EUR 2 million in six months and sells that amount forward at $1.12 per euro. At settlement, spot is $1.18 per euro. Ignoring fees, what are the total dollar proceeds from the receivable and matched forward?","choices":["$2.36 million, because spot replaces the forward rate.","$2.48 million, adding the forward gain to spot proceeds.","$2.24 million, because the forward fixes the conversion.","$2.12 million, subtracting the loss twice from the receipt."],"correct_index":2,"explanation":"The receivable is worth $2.36 million at spot, while the short forward loses EUR 2 million x ($1.18 - $1.12) = $0.12 million. Together they produce $2.24 million, equal to EUR 2 million x $1.12.","set":3},{"id":"fm-s45-q23","session":"4-5","topic":"Put net floor","question":"A US exporter expects a GBP 3 million contractual receipt and buys puts on the entire amount with a strike of $1.25 per pound. The premium is $0.03 per pound, paid today. Ignore financing of the premium. What is the minimum net dollar receipt after premium?","choices":["$3.66 million, using the strike less the premium.","$3.75 million, ignoring the cost of protection.","$3.84 million, adding the premium to the strike.","$0.09 million, using only the premium payment."],"correct_index":0,"explanation":"The put guarantees gross conversion at $1.25 per pound. Subtracting the $0.03 premium gives a $1.22 net floor. GBP 3 million x $1.22 = $3.66 million.","set":3},{"id":"fm-s45-q24","session":"4-5","topic":"Call above strike","question":"A US importer owes GBP 4 million. It buys calls with a $1.30 per pound strike and a $0.02 per pound premium. At maturity, spot is $1.38 per pound. Ignoring premium financing, what total dollar cost does the importer incur?","choices":["$5.52 million, buying all pounds at spot and ignoring the call.","$5.12 million, deducting the premium from the strike cost.","$5.60 million, paying spot plus the premium despite exercise.","$5.28 million, paying the strike price plus the premium."],"correct_index":3,"explanation":"The importer exercises because spot exceeds the strike. The currency costs GBP 4 million x $1.30 = $5.20 million, plus GBP 4 million x $0.02 = $0.08 million premium, for $5.28 million.","set":3},{"id":"fm-s45-q25","session":"4-5","topic":"Call below strike","question":"A US importer owes GBP 4 million. It buys calls with a $1.30 per pound strike and a $0.02 per pound premium. At maturity, spot is $1.24 per pound. Ignoring premium financing, what total dollar cost does the importer incur?","choices":["$4.96 million, because an unused option has no premium cost.","$5.28 million, because the call forces purchase at the strike.","$5.04 million, buying at spot and retaining the premium cost.","$5.20 million, because the premium is refunded on expiry."],"correct_index":2,"explanation":"The call expires unused and pounds are purchased at spot for $4.96 million. The $0.08 million premium remains a cost even without exercise. Total cost is $5.04 million.","set":3},{"id":"fm-s45-q26","session":"4-5","topic":"Hedge comparison","question":"A US exporter will receive GBP 2 million. It can sell pounds forward at $1.40 or buy a put with strike $1.38 and premium $0.02 per pound. At maturity, spot is $1.45. Ignoring premium financing, which strategy yields more net dollars?","choices":["The forward by $40,000, since its rate exceeds the strike.","The put by $60,000, after selling at spot and paying premium.","The put by $100,000, since its premium is refunded.","Both give $2.80 million because either contract fixes proceeds."],"correct_index":1,"explanation":"The forward yields GBP 2 million x $1.40 = $2.80 million. The unexercised put strategy yields GBP 2 million x ($1.45 - $0.02) = $2.86 million. The difference is $60,000.","set":3},{"id":"fm-s45-q27","session":"4-5","topic":"Partial forward coverage","question":"A euro-based exporter has a certain $1 million receipt and sells $600,000 forward at EUR 0.90 per dollar. At settlement, spot is EUR 0.85 per dollar. Ignoring fees, what total euro receipt results?","choices":["EUR 850,000, converting the entire receipt at spot.","EUR 900,000, applying the forward to the entire receipt.","EUR 540,000, omitting the uncovered portion of the receipt.","EUR 880,000, combining covered and uncovered portions."],"correct_index":3,"explanation":"The covered $600,000 gives EUR 540,000. The remaining $400,000 converts at spot for EUR 340,000. Total proceeds are EUR 880,000. Only the uncovered portion remains exposed to spot movements.","set":3},{"id":"fm-s45-q28","session":"4-5","topic":"Quantity risk reversal","question":"A euro-based exporter sells a forecast $1 million receipt forward at EUR 0.90 per dollar. Actual receipts fall to $700,000. At settlement, spot is EUR 0.95 per dollar. What is the gain or loss on the unsupported $300,000 forward portion alone?","choices":["A EUR 15,000 loss from buying dollars above the delivery rate.","A EUR 15,000 gain from receiving the higher spot rate.","A EUR 285,000 loss with no proceeds from forward delivery.","No gain or loss because the forecast automatically resizes the hedge."],"correct_index":0,"explanation":"The firm must buy the missing $300,000 at EUR 0.95, costing EUR 285,000, then deliver those dollars for EUR 270,000 under the forward. The unsupported portion loses EUR 15,000.","set":3},{"id":"fm-s45-q29","session":"4-5","topic":"Two-stage forward policy","question":"A euro-based exporter will certainly collect $500,000. At budget time it could lock EUR 0.92 per dollar, but it waits until invoicing and locks EUR 0.88. Ignoring fees, how do the two forward choices compare?","choices":["Waiting raises fixed euro receipts by EUR 20,000.","Both lock EUR 460,000 because the dollar amount is unchanged.","Waiting lowers fixed euro receipts by EUR 20,000.","Waiting leaves the full receipt exposed to settlement spot."],"correct_index":2,"explanation":"An early forward would lock $500,000 x EUR 0.92 = EUR 460,000. The later forward locks EUR 440,000. Waiting changed the available rate before the hedge, reducing locked receipts by EUR 20,000.","set":3},{"id":"fm-s45-q30","session":"4-5","topic":"Spot versus contractual forecast","question":"A European exporter has two dollar exposures: a signed invoice payable in 90 days, and possible sales next year that depend on competitiveness. Which distinction matters when using matched currency forwards?","choices":["Both have identical certainty of amount, so both can always be fully matched.","The invoice has a contractual amount, while future sales carry quantity uncertainty.","Only future sales are transaction exposure, while the invoice is translation exposure.","Neither creates currency risk until cash has already been converted into euros."],"correct_index":1,"explanation":"A signed foreign-currency invoice creates transaction exposure with a known contractual amount. Future sales depend on competitive conditions and may differ from forecasts. Hedging them in full before certainty can create an unsupported forward obligation.","set":3},{"id":"fm-s6-q21","session":"6","topic":"Swap settlement amount","question":"A company has a $12 million floating loan at SOFR + 1.4%. A matching swap requires it to pay 4.2% fixed and receive SOFR annually on $12 million. SOFR is 5.0% for the year. What net cash flow arises from the swap alone?","choices":["A $96,000 receipt, because the floating leg exceeds the fixed leg.","A $96,000 payment, because the fixed leg exceeds the floating leg.","A $672,000 payment, including the separate loan interest.","A $504,000 receipt, ignoring the floating leg of the swap."],"correct_index":0,"explanation":"The swap pays $12 million x 4.2% = $504,000 and receives $12 million x 5.0% = $600,000. The net swap receipt is $96,000. The loan is separate from this swap-only calculation.","set":3},{"id":"fm-s6-q22","session":"6","topic":"Fixed to floating conversion","question":"A firm pays a 6.0% fixed coupon on $10 million of debt. It enters a matched swap to receive 5.0% fixed and pay SOFR on the same notional. Ignoring fees, what effective interest rate results?","choices":["A fixed 1.0%, because all floating payments disappear.","SOFR minus 1.0%, subtracting the debt coupon from receipts.","A fixed 11.0%, adding both fixed rates and ignoring SOFR.","SOFR plus 1.0%, combining the debt and both swap legs."],"correct_index":3,"explanation":"The combined rate is 6.0% debt coupon minus 5.0% received on the swap plus SOFR paid on the swap. The result is SOFR + 1.0%, converting fixed debt into floating exposure.","set":3},{"id":"fm-s6-q23","session":"6","topic":"Notional mismatch","question":"A firm has a $10 million loan at SOFR + 1.5%, but swaps only $6 million by paying 4.0% fixed and receiving SOFR. All rates reset annually on the same date. If SOFR rises by 1 percentage point, by how much does annual combined interest cost rise?","choices":["$100,000, because the swap provides no interest protection.","$40,000, because only $4 million remains floating.","$60,000, because the covered portion remains floating.","$0, because any swap fixes the entire loan balance."],"correct_index":1,"explanation":"The swap cancels SOFR on $6 million only. SOFR still applies to $4 million of the loan. A 1 percentage point increase therefore raises annual combined cost by $4 million x 1% = $40,000.","set":3},{"id":"fm-s6-q24","session":"6","topic":"Loan spread survives swap","question":"A borrower pays SOFR + 2.0% on its loan and swaps a matching notional to pay 4.5% fixed and receive SOFR. Loan terms allow the spread to rise to 2.5% after a covenant breach. If that happens, what is the combined rate?","choices":["4.5%, because the swap absorbs every component of loan cost.","6.5%, because the original spread cannot affect the swap.","7.0%, because the new spread remains payable above 4.5%.","SOFR + 2.5%, because the covenant breach cancels the swap."],"correct_index":2,"explanation":"The matched SOFR legs cancel, but the swap does not cancel the loan spread. The new combined rate is 4.5% + 2.5% = 7.0%. Fixing the reference rate does not remove a separate contractual spread change.","set":3},{"id":"fm-s6-q25","session":"6","topic":"IRR cash flow construction","question":"A $5 million three-year bullet loan charges a 2% up-front fee, withheld at inception, and 6% annual interest on the full notional. Principal is repaid with the final coupon. Which cash flows should be used to calculate the borrower\'s all-in cost?","choices":["+$4.90m today, then -$0.30m, -$0.30m, -$5.30m annually.","+$5.00m today, then -$0.30m, -$0.30m, -$5.30m annually.","+$4.90m today, then -$0.294m, -$0.294m, -$5.194m annually.","+$4.90m today, then -$0.30m, -$0.30m, -$0.30m annually."],"correct_index":0,"explanation":"The fee reduces proceeds to $5 million x 98% = $4.90 million. Interest remains 6% x $5 million = $0.30 million per year. The year-three outflow includes the full $5 million principal, giving $5.30 million.","set":3},{"id":"fm-s6-q26","session":"6","topic":"All-in cost after hedge","question":"A $4 million three-year bullet loan has a 1% up-front fee withheld today and pays SOFR + 1.0% annually. A matched swap pays 3.0% fixed and receives SOFR, with no swap fee. What are the combined initial proceeds and annual interest payment?","choices":["$4.00 million and $160,000, ignoring the loan fee.","$3.96 million and $120,000, omitting the loan spread.","$3.96 million and $158,400, using proceeds as notional.","$3.96 million and $160,000, with the full principal repaid at maturity."],"correct_index":3,"explanation":"Initial proceeds are $4 million x 99% = $3.96 million. After SOFR cancellation the rate is 3.0% + 1.0% = 4.0% on $4 million, or $160,000 annually. The fee affects IRR through proceeds, not the interest notional.","set":3},{"id":"fm-s6-q27","session":"6","topic":"Comparative borrowing advantage","question":"Firm A can borrow at 5.0% fixed or SOFR + 0.2%. Firm B can borrow at 6.4% fixed or SOFR + 0.8%. Using the fixed-rate gap minus the floating-rate gap, what total annual saving is available before intermediary fees?","choices":["2.0 percentage points, adding both borrowing gaps.","0.6 percentage points, using only the floating gap.","0.8 percentage points, subtracting 0.6 from 1.4.","1.4 percentage points, using only the fixed gap."],"correct_index":2,"explanation":"The fixed-rate quality gap is 6.4% - 5.0% = 1.4 percentage points. The floating-rate gap is 0.8% - 0.2% = 0.6 percentage points. Their difference is 0.8 percentage points, or 80 basis points, before fees.","set":3},{"id":"fm-s6-q28","session":"6","topic":"Allocation of swap benefit","question":"A proposed fixed-for-floating financing swap offers total savings of 80 basis points. The intermediary keeps 10 basis points and the borrowers split the remaining saving equally. How much does each borrower save annually on a $20 million notional?","choices":["$80,000, using 40 basis points before the intermediary fee.","$70,000, using 35 basis points after sharing the fee.","$140,000, allocating the full net saving to each borrower.","$20,000, allocating the intermediary fee to each borrower."],"correct_index":1,"explanation":"The net saving is 80 - 10 = 70 basis points. Each borrower receives 35 basis points, or 0.35%. On $20 million that equals $70,000 annually.","set":3},{"id":"fm-s6-q29","session":"6","topic":"Refinancing versus repricing","question":"A borrower needs funds for three years. Strategy A is one committed three-year floating-rate loan. Strategy B is a one-year fixed-rate loan renewed each year. Which risk is added by strategy B at each renewal?","choices":["The lender may refuse renewal or require a new credit spread.","The principal becomes equity without the borrower\'s consent.","The existing one-year coupon changes before its fixed period ends.","The borrower must exchange principal through an interest rate swap."],"correct_index":0,"explanation":"Annual renewal requires a new credit decision, creating refinancing or credit availability risk as well as uncertainty about the new terms. A committed three-year floating loan has reference-rate repricing, but no scheduled annual refinancing need.","set":3},{"id":"fm-s6-q30","session":"6","topic":"Effect of lower reference rate","question":"A company pays SOFR + 1.2% on a loan and has a perfectly matched swap paying 4.0% fixed and receiving SOFR. If SOFR falls from 5.0% to 3.0%, ignoring fees, what happens to its combined interest rate?","choices":["It falls from 6.2% to 4.2%, as though no swap existed.","It falls from 5.2% to 3.2%, keeping the full SOFR benefit.","It rises from 5.2% to 7.2%, because the swap doubles the fall.","It remains 5.2%, since lower loan interest is offset by lower swap receipts."],"correct_index":3,"explanation":"The combined rate is always SOFR + 1.2% + 4.0% - SOFR = 5.2%. Lower SOFR reduces the loan payment but also reduces the floating amount received on the swap by the same amount.","set":3}]')
          raw=open('data.js').read()
          assert raw.startswith('window.C40DATA=') and raw.endswith(';\n')
          d=json.loads(raw[len('window.C40DATA='):-2]); old=json.loads(raw[len('window.C40DATA='):-2])
          fm=d['QCM']['fm']; ids={q['id'] for q in fm}
          assert len(NEW)==20 and all(q['id'] not in ids for q in NEW)
          for s in ('4-5','6'):
              assert Counter(q.get('set',1) for q in fm if q['session']==s)==Counter({1:10,2:10})
          # Locate existing FM array as an exact serialized block, then insert only new entries.
          compact=lambda obj:json.dumps(obj,ensure_ascii=True,separators=(',',':'))
          old_array=compact(fm)
          assert raw.count(old_array)==1
          new_array=old_array[:-1]+','+','.join(compact(q) for q in NEW)+']'
          out=raw.replace(old_array,new_array,1)
          nd=json.loads(out[len('window.C40DATA='):-2])
          assert nd['QCM']['fm'][:-20]==old['QCM']['fm']
          check=json.loads(json.dumps(nd)); check['QCM']['fm']=check['QCM']['fm'][:-20]
          assert check==old
          assert len({q['id'] for q in nd['QCM']['fm']})==len(nd['QCM']['fm'])
          for s in ('4-5','6'):
              assert Counter(q.get('set',1) for q in nd['QCM']['fm'] if q['session']==s)==Counter({1:10,2:10,3:10})
          open('data.js','w').write(out)
          sw=open('sw.js').read(); sw2,n=re.subn(r"CACHE='[^']+'","CACHE='c40-fm456-set3-20261016'",sw,count=1); assert n==1
          assert sw2.replace("c40-fm456-set3-20261016",re.search(r"CACHE='([^']+)'",sw)[1])==sw
          open('sw.js','w').write(sw2)
          print('PASS appended only 20 questions, all original entries unchanged. FM bank',len(nd['QCM']['fm']))
          END-PATCH-SCRIPT
          python3 /tmp/patch.py
      - name: Commit and self-destruct
        run: |
          git config user.name 'class40-bot'
          git config user.email 'bot@class40.local'
          git add data.js sw.js
          git rm -q .github/workflows/qcm-fm456-set3.yml
          git commit -m 'FM sessions 4-5 and 6 third sets, 20 original questions'
          git push
