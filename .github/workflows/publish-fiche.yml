name: publish-fiche-layout
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: precondition
        run: |
          test "$(sha256sum app.js | cut -d' ' -f1)" = "3f2b9c185ebf61fcd065b7f32866af0d9dd5eb949a0032cd8a421aa0c253a939"
      - name: write payload
        run: echo "" | base64 -d > /tmp/payload.py && python3 /tmp/payload.py
      - name: commit
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@localhost"
          rm -f .github/workflows/publish-fiche.yml
          git add app.js sw.js .github/workflows/publish-fiche.yml
          git commit -m "CR: lien prive exercices corriges + version fiches"
          git push
