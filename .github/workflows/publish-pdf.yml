name: publish-pdf-cr1
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch fiche
        run: |
          curl -sL "https://drive.google.com/uc?export=download&id=1-7cyg_G134-4WX48IylUhknggU-g2N1B" -o fiches/cr-1.pdf
          test "$(sha256sum fiches/cr-1.pdf | cut -d' ' -f1)" = "d56200bfd52176d7eaaa56ed8043ca69eaa3dba96e1d8e08a6d946cfd996d3b9"
      - name: commit
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@localhost"
          rm -f .github/workflows/publish-pdf.yml
          git add fiches/cr-1.pdf .github/workflows/publish-pdf.yml
          git commit -m "Fiche CR 1: nouvelle mise en page"
          git push
