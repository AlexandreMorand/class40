name: Add CR5 to CR8 graded challenges
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add original challenges and preserve all existing questions
        run: |
          cat > /tmp/patch.py <<'END-PATCH'
          import json,base64,gzip,hashlib
          adds=json.loads(gzip.decompress(base64.b64decode('')))
          p='data.js';s=open(p).read();assert hashlib.sha256(s.encode()).hexdigest()=='0dbb2e8a736058819486bfcda3b65d7e27e317404a62b7b96fce0fa410b87d1b'
          d=json.loads(s[15:-2]);old=json.loads(s[15:-2]);assert set(d['QCM_LEVELS']['fm'])=={'1','2','3','4-5','6','7','8','9'};assert set(d['QCM_LEVELS']['cr'])=={'1','2','3','4'}
          target='"QCM_LEVELS":'+json.dumps(d['QCM_LEVELS'],ensure_ascii=False,separators=(',',':'));assert s.count(target)==1
          d['QCM_LEVELS']['cr'].update(adds)
          for k,qs in adds.items():
           assert len(qs)==30 and len({q['id']for q in qs})==30
           for l in [1,2,3]:assert sum(q['level']==l for q in qs)==10
          replacement='"QCM_LEVELS":'+json.dumps(d['QCM_LEVELS'],ensure_ascii=False,separators=(',',':'))
          s=s.replace(target,replacement);after=json.loads(s[15:-2]);old['QCM_LEVELS']['cr'].update(adds);assert after==old
          open(p,'w').write(s)
          p='sw.js';s=open(p).read();assert "const CACHE='c40-fm-all-cr34-levels-20261016';"in s
          s=s.replace("const CACHE='c40-fm-all-cr34-levels-20261016';","const CACHE='c40-fm-all-cr58-levels-20261016';",1)
          assert "if(/\.pdf$/i.test(url.pathname)) return;"in s
          open(p,'w').write(s)
          END-PATCH
          python3 /tmp/patch.py
          node --check data.js
          git config user.name 'class40-bot'
          git config user.email 'bot@class40.local'
          git add data.js sw.js
          git rm -q .github/workflows/cr58-levels-20261016.yml
          git commit -m 'Add 120 original CR5 to CR8 Medium Difficult Expert cases'
          git push
