name: Finish FM Medium Difficult Expert
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add checked levels and preserve all existing progress
        run: |
          cat > /tmp/patch.py <<'END-PATCH'
          import json,base64,gzip,hashlib
          adds=json.loads(gzip.decompress(base64.b64decode('')))
          p='data.js';s=open(p).read();assert hashlib.sha256(s.encode()).hexdigest()=='ece0d1c035ef096c05435a85727689bc1e66f66823078df6e726d325b2c81bbc'
          d=json.loads(s[15:-2]);old=json.loads(s[15:-2]);assert set(d['QCM_LEVELS']['fm'])=={'6','7','8','9'}
          target='"QCM_LEVELS":'+json.dumps(d['QCM_LEVELS'],ensure_ascii=False,separators=(',',':'));assert s.count(target)==1
          for k,qs in adds.items():
           assert k not in d['QCM_LEVELS']['fm'];assert len(qs)==30 and len({q['id']for q in qs})==30
           for l in [1,2,3]:assert sum(q['level']==l for q in qs)==10
           d['QCM_LEVELS']['fm'][k]=qs
          replacement='"QCM_LEVELS":'+json.dumps(d['QCM_LEVELS'],ensure_ascii=False,separators=(',',':'))
          s=s.replace(target,replacement);after=json.loads(s[15:-2]);old['QCM_LEVELS']['fm'].update(adds);assert after==old
          open(p,'w').write(s)
          p='sw.js';s=open(p).read();assert "const CACHE='c40-fm6789-levels-20261016';"in s
          s=s.replace("const CACHE='c40-fm6789-levels-20261016';","const CACHE='c40-fm-all-levels-20261016';",1)
          assert "if(/\.pdf$/i.test(url.pathname)) return;"in s
          open(p,'w').write(s)
          END-PATCH
          python3 /tmp/patch.py
          node --check data.js
          git config user.name 'class40-bot'
          git config user.email 'bot@class40.local'
          git add data.js sw.js
          git rm -q .github/workflows/fm12345-levels-20261016.yml
          git commit -m 'Add 120 graded questions and finish FM levels with progress preserved'
          git push
