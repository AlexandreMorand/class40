name: fix-cr13b-20261026
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebalance CR13 supplement choices, self-contain legacy questions and flashcards, bump cache
        run: |
          python3 << 'PYEOF'
          import base64, gzip, json, re
          objs = json.loads(gzip.decompress(base64.b64decode("")))
          assert len(objs) == 45
          s = open('data.js', encoding='utf8').read()
          assert s.count('cr-s13-d20261026') == 30, 'expected 30 existing supplement questions'
          for q in objs:
              pat = re.compile(r'\{"id":"' + q['id'] + r'".*?\}')
              found = pat.findall(s)
              assert len(found) == 1, q['id'] + ': ' + str(len(found))
              s = pat.sub(lambda m: json.dumps(q, ensure_ascii=False, separators=(',',':')), s, count=1)
          open('data.js', 'w', encoding='utf8').write(s)
          sw = open('sw.js', encoding='utf8').read()
          assert 'c40-cr-s13fix-20261026' in sw
          sw = sw.replace('c40-cr-s13fix-20261026', 'c40-cr-s13fix2-20261026')
          open('sw.js', 'w', encoding='utf8').write(sw)
          print('replaced 45 objects in place, cache bumped')
          PYEOF
      - name: Commit and push content
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git add data.js sw.js
          git commit -m "CR session 13: choix reequilibres, questions et flashcards autonomes"
          git push
      - name: Remove one-shot workflow
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git rm -q .github/workflows/*.yml
          git commit -m "Remove one-shot publish workflow"
          git push
