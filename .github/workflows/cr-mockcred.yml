name: CR mock credibility and J-0 fix
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked CR level corrections
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib
          p=pathlib.Path('data.js');s=p.read_text();orig=s
          assert hashlib.sha256(s.encode()).hexdigest()=='b8c7839e52e6ae542b74dd05ffda5e5458e219b07e46deaa60d6c412275d9bc5'
          E1=[
           (0,{"q":"Shareholders of a listed company cannot observe how its managers run the business day to day. Which regulatory response best reflects the agency theory rationale for financial reporting regulation?",
            "choices":["A cap on executive pay linked to reported profit, so managers cannot manage earnings","Standardized audited statements that let owners monitor managers and compare companies","Fair value for every asset and liability, so managers cannot choose a measurement basis","Each board choosing its own accounting policies, since managers know the business best"],
            "correct":1,
            "expl":"Agency theory starts from the information gap between managers and outside investors. Regulation narrows it by requiring standardized, audited statements that owners can use to monitor managers and compare firms. Pay caps are a contracting tool, not a reporting rule. Fair value for everything is not what the rationale requires. Letting each board pick its policies would widen the gap."}),
           (1,{"q":"A company discloses a major lawsuit but, to protect reported results, management records its estimated loss at an amount it knows is understated. Which fundamental qualitative characteristic of useful financial information is primarily breached?",
            "choices":["Relevance, because the information no longer has predictive value for users","Comparability, because other companies measure similar lawsuits at higher amounts","Faithful representation, because the amount is biased and so not neutral","Verifiability, because auditors could not corroborate the understated figure"],
            "correct":2,
            "expl":"Faithful representation requires information to be complete, neutral and free from error. A deliberately understated estimate is biased, so neutrality fails. Comparability and verifiability are enhancing characteristics, not the primary breach here, and the lawsuit is disclosed, so the information is not irrelevant."}),
           (2,{"choices":["As a correction of a prior period error, restating the comparative periods","As a change in accounting policy, applied retrospectively","As a change in estimate, applied retrospectively through opening equity","As a change in estimate, applied prospectively from the current period"]}),
           (3,{"choices":["Debit Buildings EUR 60,000, credit Revaluation surplus in OCI EUR 60,000","Debit Buildings EUR 60,000, credit Gain in profit or loss EUR 60,000","Debit Revaluation surplus in OCI EUR 60,000, credit Buildings EUR 60,000","Debit Buildings EUR 60,000, credit Retained earnings EUR 60,000"]}),
           (5,{"choices":["Operating, because dividends distribute profit generated by operations","Financing, because dividends are a return to providers of equity finance","Either operating or financing, as a policy applied consistently","Operating or investing, depending on the nature of the entity's business"]}),
          ]
          dec=json.JSONDecoder()
          i0=s.index('"id":"cr-p1-b1"');m0=s.index('"mcq":[',i0)+len('"mcq":[')
          objs=[]; pos=m0
          for n in range(18):
              old,l=dec.raw_decode(s[pos:]);objs.append((pos,l,old));pos+=l
              assert s[pos]==',' or n==17; pos+=1
          assert json.dumps(objs[0][2],ensure_ascii=False,separators=(',',':'))==s[objs[0][0]:objs[0][0]+objs[0][1]]
          for n,upd in sorted(E1,reverse=True):
              ps,l,old=objs[n];new=dict(old);new.update(upd)
              assert json.dumps(old,ensure_ascii=False,separators=(',',':'))==s[ps:ps+l]
              if 'correct' not in upd: assert new['correct']==old['correct']
              if n==3: assert old['correct']==0
              if n==2: assert old['correct']==3
              if n==5: assert old['correct']==2
              s=s[:ps]+json.dumps(new,ensure_ascii=False,separators=(',',':'))+s[ps+l:]
          i0=s.index('"id":"cr-p1-b2"');m0=s.index('"mcq":[',i0)+len('"mcq":[')
          pos=m0;ob=[]
          for n in range(18):
              old,l=dec.raw_decode(s[pos:]);ob.append((pos,l,old));pos+=l+1
          ps,l,old=ob[16];assert old['correct']==0 and old['q'].startswith('Which statement about goodwill')
          new=dict(old);new['choices']=["Goodwill is tested CGU by CGU, so a group can impair small CGUs and keep the largest intact.","Goodwill is amortized over at most ten years and tested only when an impairment indicator exists.","An impairment loss on goodwill is reversed when the recoverable amount of the CGU later recovers.","A market capitalization below net assets is an indicator only when the CGU carries allocated goodwill."]
          assert old['choices'][:3][1:]==new['choices'][1:3]
          s=s[:ps]+json.dumps(new,ensure_ascii=False,separators=(',',':'))+s[ps+l:]
          E1.append(('b2',16))
          b=json.loads(s[len('window.C40DATA='):].strip().rstrip(';'));o=json.loads(orig[len('window.C40DATA='):].strip().rstrip(';'))
          for k,it in o['PARTIELS']['items'].items():
              for n,(x,y) in enumerate(zip(it.get('mcq',[]),b['PARTIELS']['items'][k].get('mcq',[]))):
                  ch=(k=='cr-p1-b1' and n in [e[0] for e in E1 if e[0]!='b2']) or (k=='cr-p1-b2' and n==16)
                  assert (x==y)!=ch,(k,n)
                  assert x['session']==y['session'] and len(y['choices'])==len(x['choices'])
                  assert x['correct']==y['correct'] or n in (0,1) and y['correct'] in (1,2)
          assert {k:v for k,v in o.items() if k!='PARTIELS'}=={k:v for k,v in b.items() if k!='PARTIELS'}
          for k in o['PARTIELS']:
              if k!='items': assert o['PARTIELS'][k]==b['PARTIELS'][k]
          assert {k:v for k,v in o['PARTIELS']['items'].items() if k not in ('cr-p1-b1','cr-p1-b2')}=={k:v for k,v in b['PARTIELS']['items'].items() if k not in ('cr-p1-b1','cr-p1-b2')}
          p.write_text(s)
          # J-0 fix
          a=pathlib.Path('app.js');t=a.read_text()
          old="function ptDays(dateStr){ var d=new Date(dateStr); if(isNaN(d)) return null; return Math.ceil((d.getTime()-Date.now())/86400000); }"
          assert t.count(old)==1
          new="function ptDays(dateStr){ var d=new Date(dateStr); if(isNaN(d)) return null; var now=new Date(); if(d.getTime()<now.getTime()) return -1; var a=new Date(d.getFullYear(),d.getMonth(),d.getDate()), c=new Date(now.getFullYear(),now.getMonth(),now.getDate()); return Math.round((a-c)/86400000); }"
          t=t.replace(old,new)
          oldb="(days!=null && days>=0 ? '<span class=\"pt-badge\">J-'+days+'</span>' : '');"
          assert t.count(oldb)==1
          t=t.replace(oldb,"(days!=null && days>=0 ? '<span class=\"pt-badge\">'+(days===0?\"aujourd&#39;hui\":'J-'+days)+'</span>' : (days!=null ? '<span class=\"pt-badge soft\">passe</span>' : ''));")
          a.write_text(t)
          h=pathlib.Path('index.html');u=h.read_text();assert u.count('app.js?v=levels-20261016')==1
          h.write_text(u.replace('app.js?v=levels-20261016','app.js?v=ptdays-20261021'))
          sw=pathlib.Path('sw.js');w=sw.read_text();assert 'c40-cg-choices-20261021' in w
          sw.write_text(w.replace('c40-cg-choices-20261021','c40-cr-mockcred-20261021'))
          print(hashlib.sha256(s.encode()).hexdigest())
          PY
          rm .github/workflows/cr-mockcred.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js app.js index.html sw.js .github/workflows/cr-mockcred.yml
          git commit -m 'Improve CR mock distractors and fix past exam badge'
          git push
