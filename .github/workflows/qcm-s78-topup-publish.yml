name: qcm-s78-topup-publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch data.js and bump SW cache
        run: |
          python3 - <<'PYEOF'
          import base64, json, re, sys
          qs = json.loads(base64.b64decode(""))
          raw = open('data.js', encoding='utf-8').read()
          anchor = '"fm":['
          i = raw.find(anchor)
          assert i > 0, 'anchor not found'
          block = json.dumps(qs, ensure_ascii=True, separators=(',',':'))[1:-1]
          new = raw[:i+len(anchor)] + block + ',' + raw[i+len(anchor):]
          m = re.search(r'window\.C40DATA\s*=\s*(\{.*\})\s*;?\s*$', new, re.S)
          data = json.loads(m.group(1))
          fm7 = [q for q in data['QCM']['fm'] if q['session'] == '7']
          fm8 = [q for q in data['QCM']['fm'] if q['session'] == '8']
          assert len(fm7) == 16, f'expected 16 s7 questions, got {len(fm7)}'
          assert len(fm8) == 20, f'expected 20 s8 questions, got {len(fm8)}'
          assert len(data['QCM']['fm']) == 131, f"fm total {len(data['QCM']['fm'])}"
          open('data.js', 'w', encoding='utf-8').write(new)
          sw = open('sw.js', encoding='utf-8').read()
          sw2 = re.sub(r'c40-[a-z0-9-]+', 'c40-qcm-s78-20261015', sw, count=1)
          assert sw2 != sw, 'sw cache name not bumped'
          open('sw.js', 'w', encoding='utf-8').write(sw2)
          print('patched: fm total', len(data['QCM']['fm']), '| s7:', len(fm7), '| s8:', len(fm8))
          PYEOF
      - name: Commit, push, self-delete
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q .github/workflows/qcm-s78-topup-publish.yml
          git add data.js sw.js
          git commit -q -m "Add FM session 7+8 top-up QCM (12 questions, self-contained)"
          git push
