name: CR mock option correction
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked mock option corrections
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib,base64,zlib
          p=pathlib.Path('data.js');s=p.read_text();orig=s
          assert hashlib.sha256(s.encode()).hexdigest()=='90b045586c961571ea97448ad2770830de4bdb7754f5e10ca73e4e6dbcb7f79a'
          patch=json.loads(zlib.decompress(base64.b64decode('')))
          dec=json.JSONDecoder()
          spans=[]
          for q,ch,key in patch:
              tok='"q":'+json.dumps(q,ensure_ascii=True,separators=(',',':'))+','
              assert s.count(tok)==1,q
              st=s.index(tok);m=re.compile('"choices":').search(s,st);a=m.end()
              old,l=dec.raw_decode(s[a:]);assert len(old)==4 and s.index('"correct":',a)-a<5000
              c=re.compile('"correct":(\\d)').search(s,a);assert int(c.group(1))==key
              new=json.dumps(ch,ensure_ascii=True,separators=(',',':'))
              spans.append((st,s[a:a+l],new));s=s[:a]+new+s[a+l:]
          b=json.loads(s[len('window.C40DATA='):].strip().rstrip(';'));o=json.loads(orig[len('window.C40DATA='):].strip().rstrip(';'))
          for k,it in o['PARTIELS']['items'].items():
              for x,y in zip(it.get('mcq',[]),b['PARTIELS']['items'][k].get('mcq',[])):
                  assert x['correct']==y['correct'] and x['q']==y['q'] and x['expl']==y['expl'] and len(y['choices'])==len(x['choices'])
          o['PARTIELS']['items']={k:dict(v) for k,v in o['PARTIELS']['items'].items()}
          changed=sum(1 for k,it in o['PARTIELS']['items'].items() for x,y in zip(it.get('mcq',[]),b['PARTIELS']['items'][k].get('mcq',[])) if x['choices']!=y['choices'])
          assert changed==len(patch),changed
          assert {k:v for k,v in o.items() if k!='PARTIELS'}=={k:v for k,v in b.items() if k!='PARTIELS'}
          p.write_text(s)
          sw=pathlib.Path('sw.js');t=sw.read_text();assert 'c40-cr-structure-20261020' in t
          sw.write_text(t.replace('c40-cr-structure-20261020','c40-cr-mocks-20261021'))
          print(len(patch),hashlib.sha256(s.encode()).hexdigest())
          PY
          rm .github/workflows/cr-mocks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js sw.js .github/workflows/cr-mocks.yml
          git commit -m 'Rebalance CR mock options'
          git push
