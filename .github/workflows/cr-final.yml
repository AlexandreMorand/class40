name: Final CR numeric option review
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed numeric options
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib,base64,zlib
          p=pathlib.Path('data.js');s=p.read_text();original=s
          assert hashlib.sha256(s.encode()).hexdigest()=='a43262c1825496270919bce049b1a66bad03a4e32af8309219ccf8efde9590bc'
          patch=json.loads(zlib.decompress(base64.b64decode(
          'eNqFVU2L4zAM/Ssh0FtqJH8l2fPAMDAsyx53mEPpmCHQbZik7WXY/76JEztS3I+bJUtP0vOL8p3vu22vtwd3cQe5veD2CyH/8Zb/dJ+7U3Nxmcr+NodD'
          '0x5FXuS/2r7xXnvVi4a6/7iuFfl74UtUrMRY4bXt+wyBZjzvmmMmIQWZr2j0NVwz4vpI1oivlHoQbnZbT6joUcsRtaaxPBORWlXSIgOb2AUBjEEQips1'
          'N20CipAMHqhCwWbV1FAPgOwIpCRNMWxYzS2Z4iEd1zdW0hSOffMFUKaslavBuFlR4wphM6Ba5oyEsZm4/qikA5KmrckRSWpTAEDmzl3bTyDAHWOtxeLh'
          'K1zypLiGeYCLBh4CezmbCcf3ouNRLV5l52PAsBSj8s0x+lHd+UKuyKRKnkOZjR9xeObN1IKw5eSCTUyUQBPrKXFNErfNHc4CKlOtH08SWsJJmnBCTo+U'
          'lB6vCRRsL6CAmhO2uk2FxkH9qJL2Eo9YLV5YNaaTwZ7cvnO73q0W4MvxvluaG36dbuVQVS1S/j3Yx7PLOvdx3p+G4KEOAwwBzdLH/XsDtxe4ZHLV/j2i'
          'nNDraZbVsDiouixtXMf/FAhZ2fjnGNY1miqaVkzchzvCfpmoHLHAWvkPr9Bl6ZdVfMdZXu///gNb4SNe'
          )))
          for qid,choices in patch.items():
              token='{"id":'+json.dumps(qid,separators=(',',':'))+','
              assert s.count(token)==1,(qid,s.count(token))
              start=s.index(token)
              obj,end=json.JSONDecoder().raw_decode(s[start:])
              assert len(choices)==4 and all(isinstance(c,str) and len(c)>0 for c in choices)
              chunk=s[start:start+end]
              match=re.search(r'"choices":\s*\[',chunk);assert match,qid
              a=match.end()-1
              old,b=json.JSONDecoder().raw_decode(chunk[a:]);assert old==obj['choices']
              new=json.dumps(choices,ensure_ascii=True,separators=(',',':'))
              s=s[:start+a]+new+s[start+a+b:]
          assert s!=original
          # Everything except choices must be byte identical after reversing each surgical change.
          back=s
          for qid,choices in patch.items():
              token='{"id":'+json.dumps(qid,separators=(',',':'))+','
              oa=original.index(token);oo,oe=json.JSONDecoder().raw_decode(original[oa:]);om=re.search(r'"choices":\s*\[',original[oa:oa+oe]);os=om.end()-1;_,ol=json.JSONDecoder().raw_decode(original[oa+os:]);oldraw=original[oa+os:oa+os+ol]
              a=back.index(token);o,e=json.JSONDecoder().raw_decode(back[a:]);m=re.search(r'"choices":\s*\[',back[a:a+e]);b=m.end()-1;_,l=json.JSONDecoder().raw_decode(back[a+b:]);back=back[:a+b]+oldraw+back[a+b+l:]
          assert back==original
          json.loads(s[len('window.C40DATA='):].strip().rstrip(';'))
          p.write_text(s)
          sw=pathlib.Path('sw.js');t=sw.read_text();t,n=re.subn(r'c40-cr-credible-20261020','c40-cr-credible-final-20261020',t);assert n>=1;sw.write_text(t)
          print(len(patch),'questions patched',hashlib.sha256(s.encode()).hexdigest())
          PY
          rm .github/workflows/cr-final.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js sw.js .github/workflows/cr-final.yml
          git commit -m 'Keep CR numeric options concise and uniquely correct'
          git push
