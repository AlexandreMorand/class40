name: qcm-cleanup-publish
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch app.js, index.html and bump SW cache
        run: |
          python3 - <<'PYEOF'
          import base64, re
          OLD1 = base64.b64decode("ICB2YXIgc3MgPSBzZXNzaW9uc09mKGNpZCk7CiAgdmFyIHJvd3MgPSBzcy5tYXAoZnVuY3Rpb24ocyl7").decode()
          NEW1 = base64.b64decode("ICB2YXIgc3MgPSBzZXNzaW9uc09mKGNpZCkuZmlsdGVyKGZ1bmN0aW9uKHMpeyByZXR1cm4gYmFuayhjaWQscy5rZXkpLmxlbmd0aD4wIHx8IGNhcmRzKGNpZCxzLmtleSkubGVuZ3RoPjAgfHwgISFmaWNoZVVybChjaWQscy5rZXkpOyB9KTsKICB2YXIgcm93cyA9IHNzLm1hcChmdW5jdGlvbihzKXs=").decode()
          OLD2 = base64.b64decode("c2Vzc2lvbnNPZihjLmlkKS5mb3JFYWNoKGZ1bmN0aW9uKHMpeyBpZHgucHVzaCh7azonU2Vzc2lvbics").decode()
          NEW2 = base64.b64decode("c2Vzc2lvbnNPZihjLmlkKS5mb3JFYWNoKGZ1bmN0aW9uKHMpeyBpZighKGJhbmsoYy5pZCxzLmtleSkubGVuZ3RofHxjYXJkcyhjLmlkLHMua2V5KS5sZW5ndGh8fGZpY2hlVXJsKGMuaWQscy5rZXkpKSkgcmV0dXJuOyBpZHgucHVzaCh7azonU2Vzc2lvbics").decode()
          app = open('app.js', encoding='utf-8').read()
          assert app.count(OLD1)==1 and app.count(OLD2)==1, 'app anchors not unique'
          app = app.replace(OLD1, NEW1).replace(OLD2, NEW2)
          open('app.js','w',encoding='utf-8').write(app)
          idx = open('index.html', encoding='utf-8').read()
          assert idx.count('app.js?v=partiels-20261015')==1, 'index tag anchor'
          idx = idx.replace('app.js?v=partiels-20261015', 'app.js?v=cleanup-20261015')
          open('index.html','w',encoding='utf-8').write(idx)
          sw = open('sw.js', encoding='utf-8').read()
          sw2 = re.sub(r'c40-[a-z0-9-]+', 'c40-cleanup-20261015', sw, count=1)
          assert sw2 != sw, 'sw cache name not bumped'
          open('sw.js','w',encoding='utf-8').write(sw2)
          print('patched app.js + index.html + sw.js')
          PYEOF
          node --check app.js && echo "node syntax OK"
      - name: Commit, push, self-delete
        run: |
          git config user.name "class40-bot"
          git config user.email "bot@users.noreply.github.com"
          git rm -q .github/workflows/qcm-cleanup-publish.yml
          git add app.js index.html sw.js
          git commit -q -m "Hide sessions with no content from course pages and search"
          git push
