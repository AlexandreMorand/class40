name: Remove public official-derived FM method sheet
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked CR level corrections
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib
          p=pathlib.Path('data.js');s=p.read_text();orig=s
          assert hashlib.sha256(s.encode()).hexdigest()=='a3bb1a316df78b9139a0d22f633ae203626cb767f4610cd74926840f1e2a84ed'
          a='"items":["fm-p1-method",'
          assert s.count(a)==1; s=s.replace(a,'"items":[')
          k='"fm-p1-method":{"id"'
          assert s.count(k)==1
          i=s.index(k)+len('"fm-p1-method":')
          dec=json.JSONDecoder();obj,l=dec.raw_decode(s[i:])
          assert obj['url'].startswith('fiches/fm-mock-methode')
          assert s[i+l]==','
          s=s[:s.index(k)]+s[i+l+1:]
          b=json.loads(s[len('window.C40DATA='):].strip().rstrip(';'));o=json.loads(orig[len('window.C40DATA='):].strip().rstrip(';'))
          del o['PARTIELS']['items']['fm-p1-method']
          for e in o['PARTIELS']['exams']:
              if e['id']=='fm-p1': e['items'].remove('fm-p1-method')
          assert o==b
          assert 'fm-p1-official' in b['PARTIELS']['items'] and 'fm-p1-official' in [x for e in b['PARTIELS']['exams'] for x in e['items']]
          p.write_text(s)
          w=pathlib.Path('sw.js');t=w.read_text()
          m=re.search(r"'fiches/fm-mock-methode\.html\?v=\d+',",t);assert m
          t=t.replace(m.group(0),'');assert 'c40-cr-mockcred-20261021' in t
          w.write_text(t.replace('c40-cr-mockcred-20261021','c40-private-method-20261021'))
          print(hashlib.sha256(s.encode()).hexdigest())
          PY
          rm .github/workflows/private-method.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -q fiches/fm-mock-methode.html fiches/fm-mock-methode.pdf
          git add data.js sw.js .github/workflows/private-method.yml
          git commit -m 'Remove public official-derived FM method sheet'
          git push
