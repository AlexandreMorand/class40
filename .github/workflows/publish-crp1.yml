name: Publish CR Partiels must-know and mock
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check data.js
          node --check app.js
          rm .github/workflows/publish-crp1.yml
          git config user.name AlexandreMorand
          git config user.email alexandre.morandd@gmail.com
          git add data.js app.js sw.js .github/workflows/publish-crp1.yml
          git commit -m 'Add CR Partial I must-know and partiel blanc, 4-option partiel support'
          git push
