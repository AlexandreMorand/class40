name: rework-cr-mocks-20261026
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace CR mock exams b1 and b2 with reworked reference-style versions
        run: |
          python3 << 'PYEOF'
          import base64, gzip, json, re
          objs = json.loads(gzip.decompress(base64.b64decode("")))
          assert len(objs) == 2
          s = open('data.js', encoding='utf8').read()
          for o in objs:
              iid = o['id']
              start = s.find('"%s":{"id":"%s"' % (iid, iid))
              assert start > 0, iid + ': not found'
              depth = 0
              k = start + len(iid) + 2
              k = s.find('{', start)
              i = k
              while True:
                  c = s[i]
                  if c == '{': depth += 1
                  elif c == '}':
                      depth -= 1
                      if depth == 0: break
                  i += 1
              old = s[k:i+1]
              oldj = json.loads(old)
              assert oldj['revision'] == 1, iid + ': revision changed'
              s = s[:k] + json.dumps(o, ensure_ascii=False, separators=(',',':')) + s[i+1:]
          open('data.js', 'w', encoding='utf8').write(s)
          sw = open('sw.js', encoding='utf8').read()
          assert 'c40-cr-s13fix3-20261026' in sw
          sw = sw.replace('c40-cr-s13fix3-20261026', 'c40-cr-mocks2-20261026')
          open('sw.js', 'w', encoding='utf8').write(sw)
          print('2 mocks replaced, cache bumped')
          PYEOF
      - name: Commit and push content
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git add data.js sw.js
          git commit -m "CR partiel blanc: refonte qualite des deux mocks au style de reference"
          git push
      - name: Remove one-shot workflow
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git rm -q .github/workflows/*.yml
          git commit -m "Remove one-shot publish workflow"
          git push
