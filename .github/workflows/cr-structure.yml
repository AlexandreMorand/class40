name: CR question structure correction
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  revise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply checked question corrections
        run: |
          python3 - <<'PY'
          import json,re,pathlib,hashlib,base64,zlib
          p=pathlib.Path('data.js');s=p.read_text();original=s
          assert hashlib.sha256(s.encode()).hexdigest()=='d66612144db3e3114bd9b321b0957eedbcfdea456be36fff79fab90f0ab9c542'
          patch=json.loads(zlib.decompress(base64.b64decode('')))
          original_spans=[]
          for qid,fields in patch.items():
              token='{"id":'+json.dumps(qid,separators=(',',':'))+','
              assert s.count(token)==1,qid
              start=s.index(token);obj,end=json.JSONDecoder().raw_decode(s[start:])
              assert set(fields)<=set(['question','choices','explanation'])
              for field,newvalue in fields.items():
                  chunk=s[start:start+end]
                  match=re.search('"'+field+'":',chunk);assert match,qid
                  a=match.end()
                  old,length=json.JSONDecoder().raw_decode(chunk[a:]);assert old==obj[field]
                  replacement=json.dumps(newvalue,ensure_ascii=True,separators=(',',':'))
                  original_spans.append((qid,field,chunk[a:a+length]))
                  s=s[:start+a]+replacement+s[start+a+length:]
                  obj,end=json.JSONDecoder().raw_decode(s[start:])
          back=s
          for qid,field,oldraw in reversed(original_spans):
              token='{"id":'+json.dumps(qid,separators=(',',':'))+','
              start=back.index(token);obj,end=json.JSONDecoder().raw_decode(back[start:])
              match=re.search('"'+field+'":',back[start:start+end]);a=match.end()
              _,length=json.JSONDecoder().raw_decode(back[start+a:])
              back=back[:start+a]+oldraw+back[start+a+length:]
          assert back==original
          before=json.loads(original[len('window.C40DATA='):].strip().rstrip(';'))
          after=json.loads(s[len('window.C40DATA='):].strip().rstrip(';'))
          for course,levels in before['QCM_LEVELS'].items():
              for level,questions in levels.items():
                  for q,n in zip(questions,after['QCM_LEVELS'][course][level]):
                      assert q['id']==n['id'] and q['correct_index']==n['correct_index']
                      if q['id'] not in patch:assert q==n
                      assert len(n['choices'])==4 and len(set(n['choices']))==4
          p.write_text(s)
          sw=pathlib.Path('sw.js');t=sw.read_text();assert 'c40-cr-credible-final-20261020' in t
          sw.write_text(t.replace('c40-cr-credible-final-20261020','c40-cr-structure-20261020'))
          print(len(patch),'questions',hashlib.sha256(s.encode()).hexdigest())
          PY
          rm .github/workflows/cr-structure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data.js sw.js .github/workflows/cr-structure.yml
          git commit -m 'Correct CR question cues in a checked subset'
          git push
