name: publish-cr13-20261026
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Splice CR13 supplement into data.js and bump cache
        run: |
          python3 << 'PYEOF'
          import base64, json
          qs = json.loads(base64.b64decode("").decode())
          assert len(qs) == 30
          s = open('data.js', encoding='utf8').read()
          assert '2026-10-26' not in s, 'supplement already present'
          pos = s.index('],"fm":[')
          objs = ','.join(json.dumps(q, ensure_ascii=False, separators=(',',':')) for q in qs)
          s = s[:pos] + ',' + objs + s[pos:]
          open('data.js', 'w', encoding='utf8').write(s)
          sw = open('sw.js', encoding='utf8').read()
          assert 'c40-cr-dlfix-20261025' in sw
          sw = sw.replace('c40-cr-dlfix-20261025', 'c40-cr-s13-20261026')
          open('sw.js', 'w', encoding='utf8').write(sw)
          print('spliced 30 questions, cache bumped')
          PYEOF
      - name: Commit and push content
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git add data.js sw.js
          git commit -m "CR session 13: supplement 2026-10-26 (sets 2/3/4, 30 QCM)"
          git push
      - name: Remove one-shot workflow
        run: |
          git config user.email "alexandre.morand@studbocconi.it"
          git config user.name "Alexandre Morand"
          git rm -q .github/workflows/*.yml
          git commit -m "Remove one-shot publish workflow"
          git push
