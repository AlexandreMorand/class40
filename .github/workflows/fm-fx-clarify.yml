name: Clarify FM FX study formulas
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/patch.py
          python3 /tmp/patch.py
          node --check data.js
          rm .github/workflows/fm-fx-clarify.yml
          git config user.name AlexandreMorand
          git config user.email alexandre.morandd@gmail.com
          git add data.js sw.js .github/workflows/fm-fx-clarify.yml
          git commit -m 'Clarify FX option ceiling and break even quote conventions'
          git push
