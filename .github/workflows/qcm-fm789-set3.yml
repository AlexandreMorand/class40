name: Publish FM sessions 7 8 9 set 3
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Append original questions and validate unchanged existing content
        run: |
          cat > /tmp/patch.py <<'END-PATCH-SCRIPT'
          import json,re
          from collections import Counter
          NEW=json.loads('[{"id":"fm-s7-q27","session":"7","topic":"Market value weights","question":"A firm has market debt of EUR 60 million and market equity of EUR 140 million. Its book debt is EUR 50 million and book equity EUR 50 million. Which debt weight belongs in the course WACC formula?","choices":["25%, using book debt over total market financing.","50%, using the book capital structure.","30%, using market debt over total market financing.","42.9%, using market debt divided by market equity."],"correct_index":2,"explanation":"The debt weight is D / (D + E) using market values: 60 / (60 + 140) = 30%. D/E is a different ratio, and book weights do not enter this formula.","set":3},{"id":"fm-s7-q28","session":"7","topic":"CAPM calculation","question":"A firm has an equity beta of 1.2, a risk-free rate of 3% and a market risk premium of 5%. Using CAPM, what is its cost of equity?","choices":["9.0%, adding beta times the premium to the risk-free rate.","6.0%, multiplying beta by the premium without adding the base rate.","9.6%, multiplying the entire expected market return by beta.","8.0%, adding the premium without adjusting for beta."],"correct_index":0,"explanation":"CAPM gives ke = rf + beta x MRP = 3% + 1.2 x 5% = 9%. The risk-free return is added once, not multiplied by beta.","set":3},{"id":"fm-s7-q29","session":"7","topic":"Unlever peer beta","question":"A listed peer has equity beta 1.5, market D/E of 0.5 and a 20% marginal tax rate. Using betaL = betaU x [1 + (1 - t) x D/E], with negligible debt beta, what is its unlevered beta?","choices":["0.75, dividing equity beta by two.","1.20, multiplying equity beta by one minus tax.","2.10, levering the equity beta a second time.","About 1.071, dividing equity beta by 1.4."],"correct_index":3,"explanation":"The leverage adjustment is 1 + 0.8 x 0.5 = 1.4. Removing it gives betaU = 1.5 / 1.4 = 1.0714. This separates business risk from the peer\'s financing risk.","set":3},{"id":"fm-s7-q30","session":"7","topic":"Bottom-up beta arithmetic","question":"Two comparable firms have unlevered betas of 0.8 and 1.0. Use their simple average for a target with market D/E of 0.6 and tax rate 25%. With negligible debt beta, what target equity beta follows?","choices":["0.90, because unlevered beta is already an equity beta.","1.305, relevering the average business beta at target leverage.","1.44, multiplying the average by one plus D/E without tax.","0.621, dividing the average by the target leverage adjustment."],"correct_index":1,"explanation":"The average unlevered beta is (0.8 + 1.0) / 2 = 0.9. Relever at the target structure: 0.9 x [1 + (1 - 0.25) x 0.6] = 0.9 x 1.45 = 1.305.","set":3},{"id":"fm-s7-q31","session":"7","topic":"Historical premium uncertainty","question":"Annual equity returns have a standard deviation of 18%. Using standard error = standard deviation / square root of years, what standard error results from 81 independent annual observations?","choices":["18.0 percentage points, unchanged by sample length.","0.22 percentage points, dividing by all 81 years.","2.0 percentage points, dividing by the square root of 81.","9.0 percentage points, taking the square root of 81 as the answer."],"correct_index":2,"explanation":"The square root of 81 is 9. Standard error is 18% / 9 = 2 percentage points. Even a long historical sample can leave material uncertainty around the risk premium estimate.","set":3},{"id":"fm-s7-q32","session":"7","topic":"Risk-free consistency","question":"An analyst discounts long-horizon euro cash flows using a default-free long-term euro rate, but estimates the historical market risk premium relative to short-term bills. Which correction best addresses consistency?","choices":["Use a risk premium measured relative to a risk-free security consistent with the chosen base rate.","Remove the base rate entirely because the premium already includes every return.","Keep the mismatch because any government security is interchangeable at every maturity.","Use the firm\'s debt coupon as the base rate without changing the premium."],"correct_index":0,"explanation":"The historical MRP depends on the risk-free benchmark chosen. A consistent cost of equity combines a base rate with a premium estimated using a compatible benchmark, rather than mixing bill-based and long-bond-based conventions.","set":3},{"id":"fm-s7-q33","session":"7","topic":"Current borrowing cost","question":"A firm\'s old fixed-rate bond pays a 2% coupon. A liquid straight bond of the firm with the relevant maturity now yields 5%. Ignoring tax, which rate is the better observable input for its current cost of debt?","choices":["2%, since past contractual coupons define all new funding.","3%, subtracting the original coupon from the current yield.","7%, adding the original coupon to the current yield.","5%, reflecting the return now required by debt investors."],"correct_index":3,"explanation":"Cost of debt is the rate at which the firm can currently borrow for the relevant maturity. The current yield on suitable liquid debt is informative, whereas the old coupon describes a historical contract.","set":3},{"id":"fm-s7-q34","session":"7","topic":"Synthetic spread arithmetic","question":"A firm\'s EBIT is EUR 18 million and annual interest EUR 3 million. A supplied synthetic rating table assigns a 1.2% default spread to coverage between 5x and 7x. With a 3% risk-free rate, what pretax cost of debt does this method imply?","choices":["3.0%, since coverage removes the default spread.","4.2%, adding the assigned spread to the risk-free rate.","7.2%, multiplying the spread by the coverage ratio.","6.0%, treating the coverage ratio as a percentage rate."],"correct_index":1,"explanation":"Coverage is 18 / 3 = 6x, which falls in the supplied 5x to 7x band. The assigned spread is 1.2%, so pretax cost of debt is 3% + 1.2% = 4.2%. The table is supplied in the question, not assumed.","set":3},{"id":"fm-s7-q35","session":"7","topic":"Integrated WACC","question":"A company has market debt of EUR 80 million and equity of EUR 120 million. Its pretax debt cost is 5%, marginal tax rate 25%, risk-free rate 3%, equity beta 1.1 and market risk premium 5%. What is its WACC?","choices":["6.60%, combining 40% after-tax debt and 60% CAPM equity.","7.10%, combining the weights but ignoring the debt tax shield.","5.65%, reversing the debt and equity weights.","8.50%, using the cost of equity for every financing source."],"correct_index":0,"explanation":"CAPM gives ke = 3% + 1.1 x 5% = 8.5%. After-tax kd is 5% x 75% = 3.75%. Market weights are 40% debt and 60% equity. WACC = 0.4 x 3.75% + 0.6 x 8.5% = 6.6%.","set":3},{"id":"fm-s7-q36","session":"7","topic":"Business versus financial risk","question":"Two divisions have the same unlevered beta of 0.9 and the same 30% tax rate. Division A has D/E of zero, while division B has D/E of 1.0. Using the course leverage adjustment, which pair of equity betas is correct?","choices":["A 0.9 and B 0.9, since business risk is the same.","A 0.9 and B 0.27, reducing beta by the tax rate.","A 0.9 and B 1.53, adding financing risk to B\'s equity.","A 1.53 and B 0.9, assigning more risk to the unlevered division."],"correct_index":2,"explanation":"A has no debt, so its equity beta equals 0.9. For B, betaL = 0.9 x [1 + 0.7 x 1] = 1.53. Identical business risk does not imply identical equity risk when leverage differs.","set":3},{"id":"fm-s8-q21","session":"8","topic":"Debt weight versus D/E","question":"A firm has market D/E of 0.5. What proportion of its total debt plus equity financing is debt?","choices":["50.0%, treating D/E as a debt weight.","33.3%, converting D/E into D/(D+E).","66.7%, using the equity share instead.","25.0%, dividing D/E by two regardless of capital mix."],"correct_index":1,"explanation":"Set E = 1 and D = 0.5. Total financing is 1.5, so the debt weight is 0.5 / 1.5 = one third. Leverage ratios and financing weights are related but not interchangeable.","set":3},{"id":"fm-s8-q22","session":"8","topic":"Unused debt capacity","question":"A profitable firm expects a large acquisition next year. It keeps borrowing capacity unused even though more debt might lower its current financing cost. Which rationale best explains the decision?","choices":["It assumes equity investors require no return.","It treats every unused credit line as cash already received.","It expects all debt interest to become tax-free income.","It values financial flexibility for future funding needs."],"correct_index":3,"explanation":"Unused debt capacity can help fund later opportunities and withstand shocks. Capital structure practice therefore weighs financial flexibility alongside today\'s financing cost, rather than mechanically using all available debt.","set":3},{"id":"fm-s8-q23","session":"8","topic":"Rating discontinuity","question":"A company considers extra borrowing that could push its rating below investment grade. Its lenders would then require a sharply higher spread. Which practical factor must the company include in its capital structure decision?","choices":["A rating threshold can cause a discontinuous increase in funding cost.","Debt cost must decline continuously whenever leverage increases.","A rating change affects accounting profit but never cash interest.","The tax shield guarantees that a higher spread cannot matter."],"correct_index":0,"explanation":"Ratings and covenants are real-world frictions. Crossing an investment-grade threshold can make funding much more expensive, so the cost of extra leverage need not change smoothly.","set":3},{"id":"fm-s8-q24","session":"8","topic":"Working capital cash release","question":"A company has EBIT of EUR 200 million, taxes on EBIT of EUR 50 million, D&A of EUR 30 million, a EUR 20 million decrease in working capital and EUR 70 million net capex. What is FCFO?","choices":["EUR 90 million, treating the working-capital decrease as a cash use.","EUR 160 million, omitting net capex.","EUR 130 million, including the working-capital release as a source.","EUR 70 million, subtracting D&A rather than adding it back."],"correct_index":2,"explanation":"NOPAT is 200 - 50 = 150. FCFO = 150 + 30 - (-20) - 70 = 130. A decrease in working capital releases cash, so subtracting its negative change adds cash.","set":3},{"id":"fm-s8-q25","session":"8","topic":"External funding gap","question":"A growing firm forecasts NOPAT of EUR 90 million, D&A of EUR 20 million, a EUR 35 million working-capital increase and EUR 100 million net capex. It has no opening spare cash or other cash flows. What external funding is needed to cover this operating plan?","choices":["EUR 25 million, because FCFO is negative by that amount.","EUR 45 million, omitting the D&A cash-flow add-back.","EUR 75 million, treating capex as a source of financing.","No funding, because positive NOPAT guarantees positive FCFO."],"correct_index":0,"explanation":"FCFO = 90 + 20 - 35 - 100 = -25. With no available opening cash or other sources, the plan needs EUR 25 million of external funding. Accounting profitability alone does not cover investment and working capital.","set":3},{"id":"fm-s8-q26","session":"8","topic":"Debt maturity alignment","question":"A company finances a long-lived production facility entirely with debt that must be renewed every three months. Cash receipts from the facility arrive gradually over several years. Which issue is most directly relevant to avoiding financial tension?","choices":["The accounting depreciation method must equal the loan coupon.","Long-lived assets make refinancing risk disappear.","The company can ignore debt maturities if EBIT is positive.","Cash inflow timing must be aligned with debt maturities."],"correct_index":3,"explanation":"Capital structure management includes matching cash generation with payment obligations. Funding long-lived investment with repeatedly renewed short-term debt can create a refinancing need well before the asset generates enough cash.","set":3},{"id":"fm-s8-q27","session":"8","topic":"Debt-strategy classification","question":"Firm A has working capital / debt of 65% and uses debt mainly for short-term operations. Firm B has capex / debt of 70% and uses borrowing for a predictable expansion programme. Which course categories fit best?","choices":["A debt for growth and B ordinary debt.","A ordinary debt and B debt for growth.","Both low leverage because their assets are productive.","Both aggressive leverage solely because either ratio exceeds 50%."],"correct_index":1,"explanation":"The course typology associates working capital / debt above 50% with ordinary debt, and capex / debt above 50% with debt for growth. High investment shares alone do not establish the aggressive leverage category.","set":3},{"id":"fm-s8-q28","session":"8","topic":"Downside debt capacity","question":"Two firms have identical average operating cash flow. Firm A\'s cash flow is stable through the cycle, while firm B often has sharply negative cash flow in downturns. Other things equal, why can A support more debt?","choices":["A\'s stable cash flow removes all lender default risk.","Average cash flow is irrelevant to every financing decision.","Predictable cash flow makes scheduled debt service easier to sustain.","B\'s volatility guarantees higher tax shields in every downturn."],"correct_index":2,"explanation":"Debt requires scheduled payments even in weak periods. Stable cash generation supports those payments more reliably. Averages alone hide downside shortfalls, and stability does not mean risk is zero.","set":3},{"id":"fm-s8-q29","session":"8","topic":"Tax shield calculation","question":"A firm has EUR 100 million of debt at a 6% interest rate and a 25% marginal tax rate. Assume interest is fully deductible and the firm can use the deduction this year. What is the annual interest tax saving?","choices":["EUR 1.5 million, equal to interest expense times the tax rate.","EUR 4.5 million, equal to the after-tax interest expense.","EUR 6.0 million, equal to the entire interest payment.","EUR 25.0 million, applying the tax rate directly to principal."],"correct_index":0,"explanation":"Annual interest is EUR 100 million x 6% = EUR 6 million. The tax deduction saves EUR 6 million x 25% = EUR 1.5 million. After-tax interest cost is the remaining EUR 4.5 million.","set":3},{"id":"fm-s8-q30","session":"8","topic":"Leverage sensitivity","question":"A company has unlevered beta 0.8 and a 25% tax rate. Market D/E rises from 0.5 to 1.0, with business risk unchanged. Using betaL = betaU x [1 + (1 - t) x D/E], what happens to equity beta?","choices":["It stays at 0.8 because business risk has not changed.","It falls from 1.4 to 1.1 because debt absorbs the risk.","It rises from 1.1 to 1.4 because equity carries more financing risk.","It rises from 1.2 to 1.6 because tax never enters the adjustment."],"correct_index":2,"explanation":"At D/E 0.5, betaL = 0.8 x 1.375 = 1.1. At D/E 1.0, betaL = 0.8 x 1.75 = 1.4. More debt increases the risk borne by the residual equity claim even with unchanged business risk.","set":3},{"id":"fm-s9-q21","session":"9","topic":"Exit equity bridge","question":"At an LBO exit, EBITDA is EUR 60 million and the enterprise-value multiple is 8x. Gross financial debt is EUR 200 million and cash EUR 30 million. Ignoring fees, what equity proceeds are available to the sponsor?","choices":["EUR 280 million, subtracting gross debt but ignoring cash.","EUR 480 million, treating enterprise value as equity value.","EUR 650 million, adding net debt to enterprise value.","EUR 310 million, subtracting EUR 170 million net debt."],"correct_index":3,"explanation":"Enterprise value is 60 x 8 = 480. Net debt is 200 - 30 = 170. Equity value is EV minus net debt: EUR 480 million - EUR 170 million = EUR 310 million.","set":3},{"id":"fm-s9-q22","session":"9","topic":"Entry price discipline","question":"A sponsor expects EUR 400 million of equity proceeds at exit. Financing and all exit assumptions are unchanged. If the sponsor\'s initial equity cheque rises from EUR 160 million to EUR 200 million, how does MOIC change?","choices":["It rises from 2.0x to 2.5x because the sponsor invested more.","It falls from 2.5x to 2.0x because the same proceeds cost more.","It stays at 2.5x because exit proceeds are unchanged.","It falls from 2.5x to 1.0x because equity cannot exceed proceeds."],"correct_index":1,"explanation":"MOIC is cash received divided by initial equity invested. It falls from 400 / 160 = 2.5x to 400 / 200 = 2.0x. Paying more reduces the return without requiring any deterioration in the business.","set":3},{"id":"fm-s9-q23","session":"9","topic":"Annualized sponsor return","question":"A sponsor invests EUR 100 million and receives EUR 172.8 million exactly three years later, with no interim distributions. What is the annual IRR?","choices":["20%, since 1.20 cubed equals 1.728.","24.27%, dividing the total percentage gain by three.","72.8%, treating the total gain as a one-year return.","17.28%, dividing proceeds by ten times the investment."],"correct_index":0,"explanation":"With one initial outflow and one exit receipt, IRR = (172.8 / 100)^(1/3) - 1 = 20%. Dividing total growth by years ignores compounding.","set":3},{"id":"fm-s9-q24","session":"9","topic":"Cash sweep arithmetic","question":"An LBO generates EUR 45 million free cash flow before principal repayment. Mandatory amortization is EUR 10 million. After that payment, TLA has EUR 20 million outstanding and TLB EUR 80 million. Under a 100% sweep to TLA then TLB, how is the remaining cash allocated?","choices":["EUR 45 million to TLA, because mandatory amortization is separate.","EUR 10 million to TLA and EUR 35 million to TLB.","EUR 20 million to TLA and EUR 15 million to TLB.","EUR 35 million to TLB while TLA remains outstanding."],"correct_index":2,"explanation":"Mandatory amortization leaves 45 - 10 = EUR 35 million for the sweep. TLA is paid off with EUR 20 million, and the remaining EUR 15 million goes to TLB. Cash cannot be swept twice.","set":3},{"id":"fm-s9-q25","session":"9","topic":"SOFR floor","question":"A term loan pays SOFR plus 3%, with a 1% floor on SOFR. Its contract uses the greater of observed SOFR and the floor, then adds the spread. If observed SOFR is 0.4%, what coupon applies?","choices":["3.4%, adding the spread directly to observed SOFR.","3.0%, since a floor eliminates the reference-rate component.","1.0%, using the floor as the entire loan coupon.","4.0%, applying the 1% reference-rate floor before the spread."],"correct_index":3,"explanation":"The reference rate is max(0.4%, 1.0%) = 1.0%. Adding the 3% spread gives a 4% coupon. The question specifies that the floor applies to the base rate, not the all-in coupon.","set":3},{"id":"fm-s9-q26","session":"9","topic":"Average debt interest","question":"A debt tranche opens the year at EUR 120 million and closes at EUR 80 million after repayments. The model calculates annual cash interest at 6% on the simple average of opening and closing balances. What is the interest expense?","choices":["EUR 7.2 million, using only the opening balance.","EUR 6.0 million, applying 6% to EUR 100 million average debt.","EUR 4.8 million, using only the closing balance.","EUR 12.0 million, applying 6% to the sum of both balances."],"correct_index":1,"explanation":"Average debt is (120 + 80) / 2 = EUR 100 million. Interest is 6% x EUR 100 million = EUR 6 million. Using an average is why same-year repayments can interact with interest calculations.","set":3},{"id":"fm-s9-q27","session":"9","topic":"Peer median valuation","question":"Three comparable businesses trade at EV/EBITDA multiples of 6x, 8x and 16x. Apply the median to a target with EUR 25 million EBITDA and EUR 50 million net debt. Ignoring other adjustments, what equity value results?","choices":["EUR 150 million, bridging median-based enterprise value to equity.","EUR 200 million, omitting the net-debt adjustment.","EUR 250 million, adding net debt instead of subtracting it.","EUR 350 million, using the highest peer multiple."],"correct_index":0,"explanation":"The median multiple is 8x. Target EV is 8 x 25 = EUR 200 million, then equity value is 200 - 50 = EUR 150 million. The median limits the effect of the 16x observation.","set":3},{"id":"fm-s9-q28","session":"9","topic":"Liquidity headroom","question":"An LBO company has EUR 12 million cash and a EUR 40 million committed revolver, of which EUR 15 million is drawn. Assume the undrawn amount is fully available and there are no restrictions. What immediate liquidity buffer is available?","choices":["EUR 52 million, adding the entire revolver without subtracting drawings.","EUR 27 million, adding cash to the drawn revolver amount.","EUR 37 million, adding cash to EUR 25 million undrawn capacity.","EUR 25 million, ignoring the cash already on hand."],"correct_index":2,"explanation":"Undrawn revolver capacity is 40 - 15 = EUR 25 million. The liquidity buffer is cash plus available undrawn capacity: 12 + 25 = EUR 37 million. Drawn debt is not additional unused capacity.","set":3},{"id":"fm-s9-q29","session":"9","topic":"Leverage downside","question":"A sponsor buys a company for EUR 200 million with EUR 140 million debt and EUR 60 million equity. At exit, enterprise value has fallen to EUR 160 million and debt is unchanged. Ignoring fees and dividends, what is the sponsor\'s equity loss percentage?","choices":["20.0%, equal to the decline in enterprise value.","40.0%, treating the value decline as a percentage of debt.","33.3%, treating EUR 20 million proceeds as the loss.","66.7%, since equity proceeds fall from EUR 60 million to EUR 20 million."],"correct_index":3,"explanation":"Exit equity is 160 - 140 = EUR 20 million. The equity loss is 60 - 20 = EUR 40 million, or 40 / 60 = 66.7%. Debt held flat magnifies the downside relative to the 20% fall in enterprise value.","set":3},{"id":"fm-s9-q30","session":"9","topic":"Coverage calculation","question":"An LBO company has EBITDA of EUR 90 million, capex of EUR 30 million and annual cash interest of EUR 20 million. A supplied covenant requires (EBITDA - capex) / interest of at least 2.5x. Does it meet that test?","choices":["No, because the ratio is 1.5x using capex divided by interest.","Yes, because the ratio is 3.0x after subtracting capex.","Yes, because the ratio is 4.5x when capex is ignored.","No, because the ratio is 0.33x using interest divided by available cash."],"correct_index":1,"explanation":"The specified coverage measure is (90 - 30) / 20 = 3.0x, above 2.5x. EBITDA / interest is a different metric and would ignore the capex deduction required by this covenant.","set":3}]')
          raw=open('data.js').read()
          assert raw.startswith('window.C40DATA=') and raw.endswith(';\n')
          d=json.loads(raw[len('window.C40DATA='):-2]); old=json.loads(raw[len('window.C40DATA='):-2])
          fm=d['QCM']['fm']; ids={q['id'] for q in fm}
          assert len(NEW)==30 and all(q['id'] not in ids for q in NEW)
          for s in ('7','8','9'):
              assert Counter(q.get('set',1) for q in fm if q['session']==s)==Counter({1:10,2:10})
          # Locate existing FM array as an exact serialized block, then insert only new entries.
          compact=lambda obj:json.dumps(obj,ensure_ascii=True,separators=(',',':'))
          old_array=compact(fm)
          assert raw.count(old_array)==1
          new_array=old_array[:-1]+','+','.join(compact(q) for q in NEW)+']'
          out=raw.replace(old_array,new_array,1)
          nd=json.loads(out[len('window.C40DATA='):-2])
          assert nd['QCM']['fm'][:-30]==old['QCM']['fm']
          check=json.loads(json.dumps(nd)); check['QCM']['fm']=check['QCM']['fm'][:-30]
          assert check==old
          assert len({q['id'] for q in nd['QCM']['fm']})==len(nd['QCM']['fm'])
          for s in ('7','8','9'):
              assert Counter(q.get('set',1) for q in nd['QCM']['fm'] if q['session']==s)==Counter({1:10,2:10,3:10})
          open('data.js','w').write(out)
          sw=open('sw.js').read(); sw2,n=re.subn(r"CACHE='[^']+'","CACHE='c40-fm789-set3-20261016'",sw,count=1); assert n==1
          assert sw2.replace("c40-fm789-set3-20261016",re.search(r"CACHE='([^']+)'",sw)[1])==sw
          open('sw.js','w').write(sw2)
          print('PASS appended only 30 questions, all original entries unchanged. FM bank',len(nd['QCM']['fm']))
          END-PATCH-SCRIPT
          python3 /tmp/patch.py
      - name: Commit and self-destruct
        run: |
          git config user.name 'class40-bot'
          git config user.email 'bot@class40.local'
          git add data.js sw.js
          git rm -q .github/workflows/qcm-fm789-set3.yml
          git commit -m 'FM sessions 7 8 9 third sets, 30 original questions'
          git push
