<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self'; connect-src 'self'; worker-src 'self'; manifest-src 'self'">
<title>Classe 40</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --bg:#f7f8fc; --surface:#fff; --ink:#161c34; --muted:#5d6580; --line:#e7eaf3;
  --pri:#4f46e5; --pri-soft:#eef0ff; --ok:#0ea47a; --ok-soft:#e4f8f1;
  --bad:#e11d48; --warn:#b45309; --warn-soft:#fdf3e3;
  --shadow:0 1px 2px rgba(22,28,52,.05),0 6px 20px rgba(22,28,52,.06);
  --r:16px;
}
*{margin:0;box-sizing:border-box;font-family:'Inter','Segoe UI',system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--ink)}
a{color:inherit;text-decoration:none}
button{font:inherit}
.app{display:flex;min-height:100vh}
.rail{width:216px;background:var(--surface);border-right:1px solid var(--line);padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;flex:none}
.logo{display:flex;align-items:center;gap:10px;padding:4px 10px 18px}
.logo .mark{width:34px;height:34px;border-radius:10px;background:var(--pri);display:grid;place-items:center;color:#fff;font-weight:800;font-size:15px}
.logo b{font-size:16px;letter-spacing:-.02em}
.logo small{display:block;color:var(--muted);font-size:11px;font-weight:600}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--muted);font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s;background:none;border:none;text-align:left;width:100%}
.nav:hover{background:#f2f3fa;color:var(--ink)}
.nav.on{background:var(--pri-soft);color:var(--pri)}
.nav svg{width:16px;height:16px;flex:none}
.rail .sp{flex:1}
.streak{background:var(--warn-soft);border:1px solid #f3e2bd;border-radius:12px;padding:12px;font-size:12px;font-weight:600;color:var(--warn)}
.streak b{font-size:20px;display:block}
.main{flex:1;padding:26px 30px 90px;max-width:1040px;width:100%;margin:0 auto}
.topbar{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.search{flex:1;display:flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 15px;color:var(--muted);font-size:13.5px;box-shadow:var(--shadow);cursor:pointer;text-align:left}
.search svg{width:16px;height:16px;flex:none}
.search kbd{margin-left:auto;background:#f0f1f8;border:1px solid var(--line);border-radius:6px;padding:2px 7px;font-size:11px;color:var(--muted);font-weight:700}
.netdot{width:9px;height:9px;border-radius:50%;background:var(--ok);flex:none}
.netdot.off{background:var(--bad)}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.hero{background:var(--pri);border-radius:20px;color:#fff;padding:26px 28px;display:flex;gap:26px;align-items:center;position:relative;overflow:hidden;box-shadow:0 10px 26px rgba(79,70,229,.25)}
.hero:after{content:"";position:absolute;right:-70px;top:-90px;width:260px;height:260px;border-radius:50%;background:rgba(255,255,255,.10)}
.hero .ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-size:23px;display:block;line-height:1}
.ring .val span{display:block;font-size:8px;font-weight:700;letter-spacing:.06em;opacity:.85;margin-top:3px}
.hero h1{font-size:20px;letter-spacing:-.02em;margin:2px 0 6px}
.hero .eyebrow{font-size:11px;font-weight:800;letter-spacing:.14em;opacity:.85}
.hero p{font-size:13px;opacity:.92;max-width:430px}
.cta{display:inline-flex;align-items:center;gap:8px;background:#fff;color:var(--pri);font-weight:800;font-size:13px;border:none;border-radius:11px;padding:11px 18px;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.16);transition:.15s}
.cta:hover{transform:translateY(-2px)}
.cta.ghost{background:rgba(255,255,255,.16);color:#fff;box-shadow:none}
.cta.pri{background:var(--pri);color:#fff;box-shadow:0 6px 16px rgba(79,70,229,.3)}
.cta.line{box-shadow:none;border:1.5px solid var(--line);background:#fff;color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:20px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:block;text-align:left}
.stat:hover{transform:translateY(-2px);border-color:#d4d9ee}
.stat b{font-size:21px;letter-spacing:-.02em}
.stat>span{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin-top:1px}
.stat small{font-size:10.5px;font-weight:800;color:var(--ok)}
.courses{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 16px}
.pill{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:30px;padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.pill .code{width:22px;height:22px;border-radius:7px;background:#f0f1f8;color:var(--muted);display:grid;place-items:center;font-size:9.5px;font-weight:800}
.pill.on{border-color:var(--pri);color:var(--pri);background:var(--pri-soft)}
.pill.on .code{background:var(--pri);color:#fff}
.pill small{color:var(--muted);font-weight:700}
.grid{display:grid;grid-template-columns:1.65fr 1fr;gap:20px;align-items:start}
.grid>*{min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px}
.card h2{font-size:14.5px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h2 .tag{margin-left:auto;font-size:11px;font-weight:700;color:var(--pri);background:var(--pri-soft);padding:4px 10px;border-radius:20px;cursor:pointer;border:none}
.ch{display:flex;align-items:center;gap:13px;padding:11px 10px;border-radius:12px;transition:.15s;cursor:pointer}
.ch:hover{background:#f6f7fd;transform:translateX(3px)}
.ch .num{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:12px;flex:none;background:#f0f1f8;color:var(--muted)}
.ch.done .num{background:var(--ok-soft);color:var(--ok)}
.ch.cur .num{background:var(--pri);color:#fff}
.ch .tx{flex:1;min-width:0;overflow:hidden}
.ch .tx b{font-size:13px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ch .tx span{font-size:11px;color:var(--muted);font-weight:600}
.bar{height:6px;border-radius:4px;background:#eef0f7;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px;background:var(--pri);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.bar i.full{background:var(--ok)}
.pct{font-size:11px;font-weight:800;color:var(--muted);width:34px;text-align:right;flex:none}
.go{font-size:11px;font-weight:800;color:var(--pri);background:var(--pri-soft);border-radius:8px;padding:6px 10px;flex:none;border:none;cursor:pointer}
.ch.done .go{color:var(--ok);background:var(--ok-soft)}
.dl{display:flex;gap:12px;align-items:flex-start;padding:10px 4px;border-bottom:1px dashed var(--line);border-radius:8px}
.dl:last-child{border:none}
a.dl{cursor:pointer}
a.dl:hover{background:#f6f7fd}
.dl .when{flex:none;text-align:center;background:#f6f7fd;border:1px solid var(--line);border-radius:10px;padding:6px 9px;min-width:52px}
.dl .when b{display:block;font-size:15px}
.dl .when span{font-size:9.5px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.dl .tx b{font-size:12.5px;display:block}
.dl .tx span{font-size:11px;color:var(--muted);font-weight:600}
.chip2{margin-left:auto;font-size:10px;font-weight:800;padding:4px 9px;border-radius:14px;flex:none;align-self:center;background:#f0f1f8;color:var(--muted)}
.dl.soon .when{background:var(--warn-soft);border-color:#f3e2bd}
.dl.soon .when b{color:var(--warn)}
.back{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--muted);cursor:pointer;margin-bottom:14px;background:none;border:none;padding:0}
.back:hover{color:var(--pri)}
.page-h{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:4px}
.page-sub{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:18px}
.sess-head{display:flex;align-items:center;gap:16px;margin-bottom:18px}
.sess-head .num{width:54px;height:54px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;display:flex;flex-direction:column;gap:6px}
.tile:hover{transform:translateY(-2px);border-color:#cdd3ec}
.tile .ic{width:34px;height:34px;border-radius:10px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
.tile .ic svg{width:17px;height:17px}
.tile b{font-size:14px}
.tile span{font-size:11.5px;color:var(--muted);font-weight:600}
.tile .arrow{margin-top:auto;font-size:11px;font-weight:800;color:var(--pri)}
.tile.off{opacity:.55;cursor:default}
.tile.off:hover{transform:none;border-color:var(--line)}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:24px;max-width:720px}
.qmeta{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;color:var(--muted);margin-bottom:14px}
.qmeta .bar{flex:1;margin:0}
.qq{font-size:16px;font-weight:700;line-height:1.45;margin-bottom:16px;white-space:pre-wrap}
.opt{display:flex;gap:12px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:13px 15px;font-size:13.5px;font-weight:600;margin-bottom:9px;cursor:pointer;transition:.12s;background:#fff;text-align:left;width:100%}
.opt:hover{border-color:var(--pri);background:var(--pri-soft)}
.opt .k{width:24px;height:24px;border-radius:8px;background:#f0f1f8;display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--muted);flex:none}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:#fdeef2}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55;pointer-events:none}
.expl{background:#f6f7fd;border-left:3px solid var(--pri);border-radius:8px;padding:12px 14px;font-size:12.5px;color:#3c4465;margin:6px 0 14px;line-height:1.5}
.qfoot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.score-big{font-size:44px;font-weight:800;letter-spacing:-.03em}
.flash-wrap{max-width:560px;margin:0 auto;text-align:center}
.flashcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:44px 30px;min-height:230px;display:grid;place-items:center;cursor:pointer;transition:.15s;user-select:none;width:100%;border:none;text-align:center}
.flashcard:hover{transform:translateY(-2px)}
.flashcard .q{font-size:16px;font-weight:700;line-height:1.5}
.flashcard .a{font-size:14px;color:#3c4465;line-height:1.55}
.flashcard .side{font-size:10px;font-weight:800;letter-spacing:.12em;color:var(--muted);margin-bottom:12px}
.flash-btns{display:flex;gap:10px;justify-content:center;margin-top:16px}
.md{font-size:13.5px;line-height:1.75;color:#2c3452}
.md h3{font-size:15px;margin:16px 0 6px;color:var(--ink)}
.md h4{font-size:13.5px;margin:12px 0 4px;color:var(--ink)}
.md li{margin-left:18px;margin-bottom:3px}
.md code{background:#f0f1f8;border-radius:5px;padding:1px 5px;font-size:12px}
footer{margin-top:26px;text-align:center;color:var(--muted);font-size:11px}
.view{animation:vin .25s both}
@keyframes vin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* search overlay */
.overlay{position:fixed;inset:0;background:rgba(22,28,52,.45);z-index:60;display:grid;place-items:start center;padding:12vh 16px 16px}
.omni{background:var(--surface);border-radius:16px;box-shadow:0 24px 60px rgba(0,0,0,.3);width:100%;max-width:600px;overflow:hidden}
.omni input{width:100%;border:none;outline:none;padding:16px 18px;font-size:15px;background:transparent;color:var(--ink)}
.omni .res{max-height:50vh;overflow:auto;border-top:1px solid var(--line)}
.omni .hit{display:flex;gap:11px;align-items:center;padding:11px 16px;cursor:pointer;font-size:13px}
.omni .hit:hover,.omni .hit.sel{background:var(--pri-soft)}
.omni .hit .k{font-size:9.5px;font-weight:800;background:#f0f1f8;color:var(--muted);border-radius:6px;padding:3px 7px;flex:none}
.omni .hit span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.omni .hint{padding:14px 16px;font-size:12px;color:var(--muted)}
/* bottom nav mobile */
.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:50;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar .nav{flex:1;flex-direction:column;gap:3px;font-size:10px;padding:6px 2px;width:auto;align-items:center}
.tabbar .nav svg{width:18px;height:18px}
@media(max-width:900px){
  .rail{display:none}
  .tabbar{display:flex}
  .grid{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:1fr}
  .main{padding:16px 14px 90px}
  .hero{flex-direction:column;align-items:flex-start;gap:16px;padding:20px}
  .search svg{width:16px;height:16px;flex:none}
.search kbd{display:none}
}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="c40root"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
<style>
@media(max-width:900px){
  .ch{gap:10px;padding:10px 6px}
  .ch .num{width:32px;height:32px;font-size:11px}
  .ch .tx b{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ch .pct{display:none}
  .go{padding:6px 8px;font-size:10.5px}
}
</style>
