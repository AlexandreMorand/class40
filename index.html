<style>
  /* Layout: course rail on the left (stacks into a scrolling strip on phones), working pane on the right; one next-deadline banner on top. */
  :root{
    --bg:#F1F3F7; --surface:#FFFFFF; --surface-2:#F6F8FB; --line:#D9DEE7; --line-2:#E7EBF1;
    --ink:#16243A; --ink-2:#52607A; --ink-3:#8793A8;
    --accent:#D9621A; --accent-ink:#FFFFFF; --accent-soft:#FCEBDD; --navy:#16243A; --navy-2:#20314C; --navy-ink:#E9EEF6; --navy-ink-2:#9AA9BF;
    --good:#2F7A57; --good-soft:#E1F0E7; --bad:#B0413E; --bad-soft:#F7E3E1; --warn:#9A6B12; --warn-soft:#F6ECD6;
    --c-da:#0F7C79; --c-cr:#2A5DA8; --c-fm:#B0621C; --c-cg:#7A4B8C;
    --shadow:0 1px 2px rgba(23,33,43,.06), 0 6px 18px rgba(23,33,43,.06);
    --display:'Newsreader', Georgia, 'Times New Roman', serif;
    --sans:'Figtree', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono:'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --r:12px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0F1419; --surface:#171E25; --surface-2:#1D252D; --line:#2B3640; --line-2:#232D36;
      --ink:#E6EAEE; --ink-2:#A3AEB8; --ink-3:#74808B;
      --accent:#F08A4B; --accent-ink:#1A0F07; --accent-soft:#3A2416; --navy:#0B121C; --navy-2:#162235; --navy-ink:#E6EAEE; --navy-ink-2:#8E9BB0;
      --good:#6CC49A; --good-soft:#18302A; --bad:#EE8B86; --bad-soft:#3A1F1F; --warn:#E3B45C; --warn-soft:#342A16;
      --c-da:#43C2BC; --c-cr:#7AA6EA; --c-fm:#E69A55; --c-cg:#C392D6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0F1419; --surface:#171E25; --surface-2:#1D252D; --line:#2B3640; --line-2:#232D36;
    --ink:#E6EAEE; --ink-2:#A3AEB8; --ink-3:#74808B;
    --accent:#F08A4B; --accent-ink:#1A0F07; --accent-soft:#3A2416; --navy:#0B121C; --navy-2:#162235; --navy-ink:#E6EAEE; --navy-ink-2:#8E9BB0;
    --good:#6CC49A; --good-soft:#18302A; --bad:#EE8B86; --bad-soft:#3A1F1F; --warn:#E3B45C; --warn-soft:#342A16;
    --c-da:#43C2BC; --c-cr:#7AA6EA; --c-fm:#E69A55; --c-cg:#C392D6;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
  *{box-sizing:border-box;}
  body{background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15px; line-height:1.45; margin:0; padding-inline:16px; padding-block:16px 48px;}
  h1,h2,h3{font-family:var(--display); font-weight:600; margin:0; text-wrap:balance; letter-spacing:-.01em;}
  button{font:inherit; color:inherit;}
  button:focus-visible, a:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
  .mono{font-family:var(--mono); font-variant-numeric:tabular-nums;}
  .app{max-width:1120px; margin:0 auto; display:grid; grid-template-columns:240px minmax(0,1fr); gap:20px; align-items:start;}
  @media (max-width:820px){ .app{grid-template-columns:minmax(0,1fr); gap:14px;} }

  /* rail */

  .brand{display:flex; flex-direction:column; gap:2px; padding:2px 4px;}
  .brand h1{font-size:30px; line-height:1;}
  .brand .sub{font-size:12px; color:var(--ink-3); font-family:var(--mono); letter-spacing:.02em;}
  .courses{display:flex; flex-direction:column; gap:4px;}

  .cbtn.active{background:var(--surface); border-color:var(--line); box-shadow:var(--shadow);}
  .cbtn .dot{width:10px; height:10px; border-radius:3px; background:var(--cc);}
  .cbtn .nm{font-weight:600; font-size:14px; line-height:1.2; min-width:0;}
  .cbtn .nm small{display:block; font-weight:400; color:var(--ink-3); font-size:11.5px; font-family:var(--mono); margin-top:2px;}
  .cbtn .pct{font-family:var(--mono); font-size:12px; color:var(--ink-2);}
  .railnote{font-size:11.5px; color:var(--ink-3); line-height:1.45; padding:0 4px;}
  @media (max-width:820px){
    .rail{position:static;}
    .brand{flex-direction:row; align-items:baseline; justify-content:space-between; flex-wrap:wrap; gap:6px;}
    .brand h1{font-size:26px;}
    .courses{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px; scrollbar-width:none;}
    .cbtn{flex:0 0 auto; grid-template-columns:8px auto auto; padding:8px 12px; background:var(--surface-2); border-color:var(--line-2);}
    .cbtn .nm small{display:none;}
    .railnote{display:none;}
  }

  /* next deadline banner */
  .main{display:flex; flex-direction:column; gap:14px; min-width:0;}
  .next{display:flex; gap:14px; align-items:stretch; flex-wrap:wrap;}
  .hero{flex:1 1 320px; min-width:0; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:14px 16px; display:flex; gap:14px; align-items:center; box-shadow:var(--shadow);}
  .hero .count{font-family:var(--mono); font-weight:600; font-size:26px; line-height:1; color:var(--cc,var(--accent)); min-width:64px; text-align:center;}
  .hero .count small{display:block; font-size:10.5px; font-weight:400; color:var(--ink-3); margin-top:4px; letter-spacing:.05em; text-transform:uppercase;}
  .hero .txt{min-width:0; display:flex; flex-direction:column; gap:2px;}
  .eyebrow{font-family:var(--mono); font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-3);}
  .hero .lbl{font-weight:600; font-size:15px;}
  .hero .meta{font-size:12.5px; color:var(--ink-2);}
  .late{flex:1 1 100%; display:flex; flex-direction:column; gap:8px; border:1px solid var(--bad); background:var(--bad-soft); border-radius:var(--r); padding:12px 16px;}
  .late b{font-size:14.5px;}
  .upnext{flex:1 1 300px; min-width:0; display:flex; flex-direction:column; gap:6px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r); padding:12px 14px;}
  .uprow{display:grid; grid-template-columns:8px minmax(0,1fr) auto; gap:10px; align-items:center; font-size:13px;}
  .uprow .dot{width:8px; height:8px; border-radius:50%; background:var(--cc);}
  .uprow .l{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .uprow .w{font-family:var(--mono); font-size:11.5px; color:var(--ink-2);}
  .uprow.tbd .w{font-style:italic; color:var(--ink-3);}
  .uprow.past{opacity:.5;}
  .uprow.past .l{text-decoration:line-through;}
  .linkbtn{align-self:flex-start; background:none; border:none; padding:2px 0; color:var(--accent); font-size:12.5px; cursor:pointer; text-decoration:underline; text-underline-offset:3px;}

  /* course pane */
  .pane{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow); min-width:0;}
  .phead{display:flex; justify-content:space-between; gap:16px; align-items:center; padding:18px 20px 12px; flex-wrap:wrap;}
  .phead h2{font-size:25px; line-height:1.15;}
  .phead .meta{font-size:12.5px; color:var(--ink-2); margin-top:4px;}
  .ring{display:flex; align-items:center; gap:10px; cursor:help;}
  .ring svg{display:block;}
  .ring .rl{font-size:11.5px; color:var(--ink-3); line-height:1.3; max-width:120px;}
  .tabs{display:flex; gap:2px; padding:0 14px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; position:sticky; top:env(safe-area-inset-top,0px); background:var(--surface); z-index:5; border-radius:0;}
  .tab{flex:0 0 auto; background:none; border:none; padding:10px 10px 11px; font-size:14px; color:var(--ink-2); cursor:pointer; border-bottom:2px solid transparent; margin-bottom:-1px; display:flex; gap:6px; align-items:center;}
  .tab:hover{color:var(--ink);}
  .tab.active{color:var(--ink); border-bottom-color:var(--cc); font-weight:600;}
  .tab .n{font-family:var(--mono); font-size:11px; color:var(--ink-3); font-weight:400;}
  .body{padding:18px 20px 22px; display:flex; flex-direction:column; gap:14px; min-width:0;}
  @media (max-width:560px){ .phead{padding:16px 14px 10px;} .body{padding:14px;} .tabs{padding:0 6px;} }

  .btn{font-size:13px; padding:7px 12px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; line-height:1.2; display:inline-flex; align-items:center; gap:6px;}
  .btn:hover{border-color:var(--ink-3);}
  .btn:disabled{opacity:.45; cursor:default;}
  .btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink); font-weight:600;}
  .btn.primary:hover{filter:brightness(1.08);}
  .btn.ghost{border-color:transparent; background:transparent; color:var(--ink-2);}
  .btn.ghost:hover{background:var(--surface-2); color:var(--ink);}
  .btn.on{background:var(--good-soft); border-color:var(--good); color:var(--good);}
  .kbd{font-family:var(--mono); font-size:10.5px; padding:1px 5px; border:1px solid var(--line); border-bottom-width:2px; border-radius:4px; color:var(--ink-3);}
  .empty{color:var(--ink-2); font-size:13.5px; border:1px dashed var(--line); border-radius:10px; padding:16px; line-height:1.5;}

  /* sessions */
  .slist{display:flex; flex-direction:column;}
  .sgroup{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3); padding:14px 0 6px;}
  .sgroup:first-child{padding-top:0;}
  .srow{display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; padding:10px 0; border-bottom:1px solid var(--line-2);}
  .srow:last-child{border-bottom:none;}
  .srow .n{font-family:var(--mono); font-size:12px; color:var(--ink-3);}
  .srow .t{font-size:14px; line-height:1.35; min-width:0;}
  .srow .t .sub{display:flex; gap:8px; flex-wrap:wrap; margin-top:3px; font-size:11.5px; color:var(--ink-3); font-family:var(--mono);}
  .srow .acts{display:flex; gap:6px; align-items:center; flex-wrap:wrap; justify-content:flex-end;}
  .chip{font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); color:var(--ink-2); font-family:var(--sans); white-space:nowrap;}
  .chip.case{border-color:var(--warn); color:var(--warn); background:var(--warn-soft);}
  .chip.ok{border-color:var(--good); color:var(--good); background:var(--good-soft);}
  .chip.ko{border-color:var(--bad); color:var(--bad); background:var(--bad-soft);}
  .seen{width:30px; height:30px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; display:grid; place-items:center; color:var(--ink-3);}
  .seen.on{background:var(--good); border-color:var(--good); color:#fff;}
  @media (max-width:560px){ .srow{grid-template-columns:34px minmax(0,1fr);} .srow .acts{grid-column:2; justify-content:flex-start;} }

  /* QCM config */
  .seg{display:inline-flex; background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:3px; gap:2px; flex-wrap:wrap;}
  .seg button{border:none; background:transparent; padding:7px 14px; border-radius:7px; font-size:13.5px; cursor:pointer; color:var(--ink-2);}
  .seg button.active{background:var(--surface); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .cfg{display:grid; grid-template-columns:minmax(0,1fr); gap:16px;}
  .field{display:flex; flex-direction:column; gap:8px;}
  .flabel{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .flabel span{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-3);}
  .pills{display:flex; gap:6px; flex-wrap:wrap;}
  .pill{font-size:13px; padding:6px 12px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-2); cursor:pointer;}
  .pill:hover{border-color:var(--ink-3);}
  .pill.active{background:var(--accent-soft); border-color:var(--accent); color:var(--ink);}
  .pill.mini{font-size:11.5px; padding:3px 9px;}
  .cfgfoot{display:flex; align-items:center; gap:12px; flex-wrap:wrap; padding-top:4px;}
  .cfgfoot .cnt{font-size:13px; color:var(--ink-2);}
  .callout{border:1px solid var(--line); border-radius:10px; background:var(--surface-2); padding:12px 14px; display:flex; flex-direction:column; gap:8px;}
  .callout.warn{border-color:var(--warn); background:var(--warn-soft);}
  .callout h4{margin:0; font-size:13.5px; font-family:var(--sans);}
  .ds{display:grid; grid-template-columns:minmax(0,1fr); gap:4px; padding:8px 0; border-top:1px solid var(--line-2);}
  .ds:first-of-type{border-top:none;}
  .ds b{font-size:13.5px;}
  .ds .dm{font-size:12px; color:var(--ink-2);}
  .code{display:flex; gap:8px; align-items:flex-start;}
  .code pre{flex:1; min-width:0; margin:0; font-family:var(--mono); font-size:12px; background:var(--surface); border:1px solid var(--line-2); border-radius:6px; padding:6px 8px; overflow-x:auto; white-space:pre;}
  .mistakes{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 14px; border-radius:10px; background:var(--bad-soft); border:1px solid var(--bad);}
  .mistakes span{font-size:13.5px;}

  /* QCM quiz */
  .qtop{display:flex; align-items:center; gap:12px;}
  .qprog{flex:1; height:6px; border-radius:3px; background:var(--surface-2); border:1px solid var(--line-2); overflow:hidden; display:flex;}
  .qprog i{display:block; height:100%;}
  .qprog i.g{background:var(--good);} .qprog i.a{background:var(--ink-3);} .qprog i.b{background:var(--bad);} .qprog i.n{background:var(--line);}
  .qcount{font-family:var(--mono); font-size:12px; color:var(--ink-2); white-space:nowrap;}
  .qcard{display:flex; flex-direction:column; gap:14px;}
  .qmeta{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
  .qtext{font-size:17px; line-height:1.45; font-weight:500;}
  .qcode{font-family:var(--mono); font-size:12px; color:var(--ink-2);}
  .choices{display:flex; flex-direction:column; gap:8px;}
  .choice{display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; align-items:center; text-align:left; padding:11px 12px; border-radius:10px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-size:14.5px; line-height:1.35; transition:border-color .12s, background .12s, transform .12s;}
  .choice:hover:not(:disabled){border-color:var(--accent); transform:translateX(2px);}
  .choice .k{width:26px; height:26px; border-radius:7px; display:grid; place-items:center; font-family:var(--mono); font-size:12px; background:var(--surface-2); border:1px solid var(--line-2); color:var(--ink-2);}
  .choice:disabled{cursor:default;}
  .choice.picked{border-color:var(--accent); background:var(--accent-soft);}
  .choice.correct{border-color:var(--good); background:var(--good-soft);}
  .choice.correct .k{background:var(--good); color:#fff; border-color:var(--good);}
  .choice.wrong{border-color:var(--bad); background:var(--bad-soft);}
  .choice.wrong .k{background:var(--bad); color:#fff; border-color:var(--bad);}
  .choice.dim{opacity:.55;}
  .explain{font-size:13.5px; line-height:1.5; color:var(--ink); background:var(--surface-2); border-left:3px solid var(--good); border-radius:0 8px 8px 0; padding:10px 12px;}
  .explain.bad{border-left-color:var(--bad);}
  .qnav{display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap;}
  .hint{font-size:11.5px; color:var(--ink-3); display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  @media (hover:none){ .hint{display:none;} }
  .shake{animation:shake .3s;}
  @keyframes shake{0%,100%{transform:none}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

const QCM = {"da":[{"id":"da-s1-q1","session":1,"topic":"Why regression models","question":"In the broad sense, a regression model expresses:","choices":["A summary of Y (typically its mean) as a function of x1,...,xp","A summary of each xj as a function of Y and the other x's","The joint distribution of Y and the x's, with no causal ordering","A ranking of the x's by their simple correlation with Y"],"correct_index":0,"explanation":"The fiche's definition: 'un aspect ou un résumé de Y en fonction de variables explicatives x1,...,xp'. The other options invert the roles or describe unrelated tools."},{"id":"da-s1-q2","session":1,"topic":"Theoretical equation","question":"In Y = β0 + β1x1 + ... + βpxp + ε, what is the role of ε?","choices":["It captures every influence on Y not included among x1,...,xp","It is the measurement error on Y only, the x's being error-free","It is a fixed constant estimated by the intercept β0","It captures the error made when measuring the x's themselves"],"correct_index":0,"explanation":"Without ε, two units with identical x's would need identical Y, which is unrealistic. ε covers 'tout le reste' (renovation quality, exposure, negotiation luck, etc.)."},{"id":"da-s1-q3","session":1,"topic":"Five assumptions","question":"Which assumption is homoskedasticity?","choices":["Var(εi) = σ² for every unit i","E(εi) = 0 for every unit i","Cov(εk, εi) = 0 for every k ≠ i","εi ~ N(0, σ²) for every unit i"],"correct_index":0,"explanation":"Homoskedasticity (assumption 2) means constant error variance across all units. Assumption 1 is zero-mean error, assumption 3 is uncorrelated errors, assumption 4 is normality."},{"id":"da-s1-q4","session":1,"topic":"Five assumptions","question":"What does the 'no perfect multicollinearity' assumption (assumption 5) guarantee?","choices":["That the least squares system has a unique solution for the b's","That the x's are uncorrelated with each other, so each VIF equals 1","That the standard errors of the b's stay small enough for t-tests","That the errors are uncorrelated with every explanatory variable"],"correct_index":0,"explanation":"If assumption 5 were exactly violated, the coefficients could no longer be estimated at all — the least-squares system would not have a unique solution. Mild (imperfect) multicollinearity is always present and handled later."},{"id":"da-s1-q5","session":1,"topic":"Meaning of 'linear'","question":"\"Linear\" in \"linear regression model\" means the model is linear with respect to:","choices":["The parameters βj, so terms such as x² or log(x) are allowed","The explanatory variables, so x² or log(x) break the model","Both the βj and the x's, which must all enter to the power 1","The fitted values, which must lie on a straight line in every plot"],"correct_index":0,"explanation":"The fiche's explicit warning: the same theory applies to models where x appears as x² or log(x), as long as the equation stays linear in the β's."},{"id":"da-s1-q6","session":1,"topic":"Least squares estimation","question":"The least squares method chooses b0,...,bp to:","choices":["Minimize Σ(yi − ŷi)², the sum of squared residuals","Minimize Σ|yi − ŷi|, the sum of absolute residuals","Maximize R² subject to the b's being significant","Minimize Σ(ŷi − ȳ)², the explained deviance"],"correct_index":0,"explanation":"minimize Σ[yi − (β0+β1xi1+...+βpxip)]² over β0,...,βp — this is the literal least-squares objective from the fiche."},{"id":"da-s1-q7","session":1,"topic":"Marginal effect","question":"The marginal effect bj of xj is interpreted as:","choices":["The change in the mean of Y for +1 unit of xj, other x's fixed","The change in Y for every unit when xj rises by one, other x's fixed","The change in the mean of Y for +1 unit of xj, other x's free to vary","The share of the variability of Y that xj explains on its own"],"correct_index":0,"explanation":"bj is an effect on the MEAN of Y (not on each individual Y, which also contains ε), and only holds 'all else equal'. Letting the other x's vary would mix in their effects."},{"id":"da-s1-q8","session":1,"topic":"Spurious effect","question":"A spurious effect (effet fallacieux) arises when:","choices":["An omitted variable correlated with both xj and Y drives the observed link","xj is correlated with another x already included in the model","The errors are heteroskedastic, which biases the t-test on xj","An influential point with high leverage distorts the slope of xj"],"correct_index":0,"explanation":"A spurious effect is omitted-variable bias. Correlation between included x's is multicollinearity (inflates SEs, does not create a false effect), and heteroskedasticity or influential points are different problems."},{"id":"da-s1-q9","session":1,"topic":"Spurious effect example","question":"In the fiche's coastal-housing example, why did the coefficient on distance-to-coast flip from positive to negative once age was added to the model?","choices":["Newer homes sat farther from the coast, and age drove both distance and price","Distance and age were perfectly collinear, so R could not separate them","Adding age increased the SE of distance until its sign became random","Distance had been coded in hundreds of metres, so its scale changed"],"correct_index":0,"explanation":"Age was the omitted variable correlated with both x (distance) and Y (price), creating a false positive relationship until it was controlled for."},{"id":"da-s1-q10","session":1,"topic":"Confidence intervals","question":"Holding everything else fixed, increasing the confidence level (1−α) for a coefficient's CI makes the interval:","choices":["Wider, because the t quantile increases","Narrower, because we are more confident about βj","Wider, because the standard error of bj increases","Unchanged, only the p-value of the test changes"],"correct_index":0,"explanation":"ME = t quantile × SE(bj). SE(bj) does not depend on the confidence level, only the quantile grows."},{"id":"da-s1-q11","session":1,"topic":"Hypothesis test on a coefficient","question":"In the test H0: βj = 0 vs H1: βj ≠ 0, rejecting H0 means:","choices":["There is evidence that xj affects the mean of Y, other x's held fixed","It is proven that xj causes Y, other x's held fixed","There is evidence that xj affects Y, whatever the other x's do","The model as a whole is significant at level α"],"correct_index":0,"explanation":"Rejecting H0 is evidence of a real effect (significance), not proof of causation and not a statement about the whole model's fit."},{"id":"da-s1-q12","session":1,"topic":"Prediction","question":"For a given x0, how do the point predictions for a single unit and for the mean of all units sharing x0 compare?","choices":["Same point prediction ŷ0, but the interval for one unit is wider","Same point prediction ŷ0, but the interval for the mean is wider","Different point predictions, because one unit also includes ε","Same point prediction and same interval, since ε is predicted as 0"],"correct_index":0,"explanation":"Since ε cannot itself be predicted (its best estimate is always 0), y-hat0 = b0+b1x1^0+...+bpxp^0 answers both questions identically — only the width of the surrounding interval differs."},{"id":"da-s1-q13","session":1,"topic":"Extrapolation","question":"What is the risk of predicting y-hat0 for x values outside the range observed in the sample (extrapolation)?","choices":["It assumes the estimated relationship still holds where no data exist","It makes R² fall, because the new point lies far from ȳ","It biases the b's, which must then be re-estimated","It is only a problem for dummy variables, not quantitative ones"],"correct_index":0,"explanation":"The fiche explicitly warns: never predict outside the observed range of x — the model's validity there is unverified."},{"id":"da-s1-q14","session":1,"topic":"R²","question":"R² = 0 occurs specifically when:","choices":["ŷi = ȳ for every unit, so explained deviance is zero","Residual deviance is zero, so every point lies on the fit","The b's are all non-significant at the 5% level","The x's are perfectly correlated with each other"],"correct_index":0,"explanation":"R² = EXP.DEV / TOT.DEV. It is 0 only when EXP.DEV = Σ(ŷi − ȳ)² = 0. Non-significant b's usually still give a small positive R²."},{"id":"da-s1-q15","session":1,"topic":"Adjusted R²","question":"Why does adjusted R² exist?","choices":["R² never falls when a variable is added, even a useless one","R² can fall when a variable is added, which is misleading","R² cannot be computed when p is close to n","R² is only valid for nested models, adjusted R² for any model"],"correct_index":0,"explanation":"R² never decreases when you add a variable, so it always appears to favor the bigger model. Adjusted R² penalizes model size (p) to correct for this."},{"id":"da-s1-q16","session":1,"topic":"Comparing models","question":"For two nested models, what is the statistically correct way to decide whether the extra variables in the larger model matter?","choices":["The partial F-test","The model with the higher adjusted R²","The model with the higher raw R²","A t-test on each extra variable separately"],"correct_index":0,"explanation":"For nested models the partial F-test is the inferential tool. Adjusted R² is descriptive (non-nested models), raw R² always favours the bigger model, and separate t-tests do not test the group jointly."},{"id":"da-s2-q1","session":2,"topic":"Dummy variable coding","question":"A dummy variable is coded so that:","choices":["1 if the characteristic is present, 0 if absent","1 if present, −1 if absent, so the mean is 0","0, 1, 2... one code per category of the variable","The group mean of Y for each category"],"correct_index":0,"explanation":"Convention from the fiche: 1 = characteristic present, 0 = absent. It splits the population into exactly two groups (coded 0 and coded 1)."},{"id":"da-s2-q2","session":2,"topic":"Reading a dummy coefficient","question":"In y-hat = b0 + b1x1 + bBOXxBOX, the coefficient bBOX estimates:","choices":["The mean price gap between homes with and without a box, age fixed","The mean price of homes with a box, age fixed","The mean price gap between homes with and without a box, age free","The effect of one extra box on price, age fixed"],"correct_index":0,"explanation":"A dummy variable generates two parallel equations (same slope b1), separated by a constant distance bBOX — exactly the average price gap between the two groups, age held constant."},{"id":"da-s2-q3","session":2,"topic":"k-1 dummy rule","question":"A categorical variable with k = 4 categories requires how many dummy variables, and why?","choices":["3, and one category becomes the reference","4, one per category, with no intercept problem","1, coded 0/1/2/3 to keep the model parsimonious","2, since only half the categories need contrasts"],"correct_index":0,"explanation":"k − 1 = 3 dummies. Four dummies plus an intercept is perfect collinearity. A single 0/1/2/3 variable imposes an artificial order and equal spacing."},{"id":"da-s2-q4","session":2,"topic":"Reference category","question":"With zones A, B, C coded via dummies xB and xC (A is the reference), what does bB measure?","choices":["The mean price gap between zone B and zone A, age fixed","The mean price of zone B, age fixed","The mean price gap between zone B and zones A and C together","The mean price gap between zone B and zone C, age fixed"],"correct_index":0,"explanation":"Every dummy coefficient is a comparison ('contrast') against the reference category only — here, zone A."},{"id":"da-s2-q5","session":2,"topic":"Reference category trap","question":"With zone A as the reference (dummies xB, xC), how do you get the price gap between zone C and zone B?","choices":["bC − bB, which needs its own test (or a re-levelled model)","bC − bB, whose significance follows from the two t-tests","bC + bB, since both are measured from the same reference","bC alone, since zone B is closer to the reference"],"correct_index":0,"explanation":"ŷC − ŷB = bC − bB (the intercept and age terms cancel). Its significance cannot be read from the separate t-tests on bB and bC: re-level the factor or run a dedicated test."},{"id":"da-s2-q6","session":2,"topic":"Testing a dummy coefficient","question":"How is a dummy variable's coefficient tested for significance?","choices":["Same t-test and CI formulas as for any coefficient","Only jointly, with a partial F-test","With a chi-square test on the two groups","With a t-test that uses n − 2 degrees of freedom"],"correct_index":0,"explanation":"The fiche states explicitly: 'rien de nouveau ici' — a dummy variable is treated exactly like any other explanatory variable for CIs and t-tests."},{"id":"da-s2-q7","session":2,"topic":"Partial F-test purpose","question":"What is the partial F-test used for?","choices":["Testing whether a group of coefficients is jointly zero","Testing whether one coefficient is zero when SEs are large","Testing whether two non-nested models fit equally well","Testing whether the errors have constant variance"],"correct_index":0,"explanation":"The partial F-test compares RED.M (q variables) against COMP.M (p > q variables) to test H0: βq+1=...=βp=0 jointly — exactly the situation left open when testing a whole categorical variable's dummies together."},{"id":"da-s2-q8","session":2,"topic":"Partial F-test formula","question":"In the partial F-test formula F = [(RES.DEV.RED − RES.DEV.COMP)/(p−q)] / [RES.DEV.COMP/(n−p−1)], the numerator measures:","choices":["The drop in residual deviance per added variable","The residual deviance of the complete model per residual df","The increase in R² from the reduced to the complete model","The explained deviance of the complete model per variable"],"correct_index":0,"explanation":"Numerator = drop in residual deviance per added variable; denominator = leftover unexplained deviance per residual degree of freedom, a 'typical noise level' benchmark."},{"id":"da-s2-q9","session":2,"topic":"Nested vs non-nested","question":"The partial F-test can be used to compare two models only when:","choices":["The reduced model's variables are a subset of the complete model's","Both models have the same number of explanatory variables","Both models have a significant global F-test","Both models use the same dependent variable, whatever the x's"],"correct_index":0,"explanation":"For non-nested models, the partial F-test is unusable; adjusted R² is the only available (descriptive) comparison."},{"id":"da-s2-q10","session":2,"topic":"Global F-test","question":"The global F-test is best understood as:","choices":["A partial F-test whose reduced model is the null model (q = 0)","A partial F-test whose complete model is the null model","A t-test on the intercept β0","The average of the t-tests on all slopes"],"correct_index":0,"explanation":"The global F-test uses the null model Y = β0 + ε as the reduced model — since the null model has zero explained deviance, its residual deviance equals total deviance, giving F = (EXP.DEV./p) / (RES.DEV./(n−p−1))."},{"id":"da-s2-q11","session":2,"topic":"Total deviance invariance","question":"Across different models fit to the same sample and same Y, which quantity never changes?","choices":["Total deviance","Residual deviance","Explained deviance","Residual degrees of freedom"],"correct_index":0,"explanation":"Total deviance is a property of the observed y's alone; only residual deviance and explained deviance shift between models."},{"id":"da-s2-q12","session":2,"topic":"Not rejecting H0 in the global F-test","question":"If the global F-test does NOT reject H0, the correct conclusion is:","choices":["Not enough evidence that the x's are jointly significant at level α","Proof that all slopes are zero in the population","Evidence that at least one slope is zero","The x's are jointly significant but individually not"],"correct_index":0,"explanation":"The fiche's explicit trap: failing to reject H0 means insufficient evidence, not proof that the model has zero effect."},{"id":"da-s2-q13","session":2,"topic":"k-1 rule mistake","question":"A 3-category variable is coded with 3 dummies plus an intercept. What happens?","choices":["Perfect collinearity: the dummies sum to the intercept column","High but imperfect multicollinearity, detectable with the GVIF","Nothing, R simply reports one more coefficient","The reference becomes the category with the most observations"],"correct_index":0,"explanation":"xA + xB + xC = 1 = the intercept column, so least squares has no unique solution (R returns NA for one dummy). k − 1 dummies are required."},{"id":"da-s3-q1","session":3,"topic":"Linearity vs additivity","question":"The base linear-additive model hides two assumptions. Which pair correctly separates them and their fixes?","choices":["Linearity fixed by transforming x, additivity fixed by an interaction","Linearity fixed by an interaction, additivity fixed by transforming x","Both fixed by log-transforming Y","Linearity fixed by adding dummies, additivity fixed by dropping variables"],"correct_index":0,"explanation":"Non-linearity (the effect of xj itself changes with xj's level) is corrected via variable transformation; non-additivity (the effect of one variable depends on another variable's level) is corrected via an interaction term. These are two distinct problems with two distinct fixes."},{"id":"da-s3-q2","session":3,"topic":"Transformation rules","question":"Which of these is a correct practical rule for variable transformations, per the fiche?","choices":["When x² is added, keep the lower-order term x","When x² is added, drop x to avoid multicollinearity","log(x) works for any x, including zeros and negatives","Decide on a transformation from theory only, never from data"],"correct_index":0,"explanation":"The three rules: log needs strictly positive values, keep lower powers when adding x², and the decision to transform rests on both context and the data (tested formally)."},{"id":"da-s3-q3","session":3,"topic":"Reading a transformed effect","question":"With y-hat = 2 + 6x1 − x1², why can't you read a single fixed coefficient as 'the effect of x1'?","choices":["The slope 6 − 2x1 changes with x1 and even changes sign","The coefficient 6 alone is the marginal effect at every x1","The coefficient −1 alone is the marginal effect at every x1","The effect is 6 − 1 = 5 per unit of x1 everywhere"],"correct_index":0,"explanation":"With a quadratic term, the instantaneous slope (derivative) is not constant — it depends on x1's own value, unlike a plain linear term."},{"id":"da-s3-q4","session":3,"topic":"Derivative vs finite difference","question":"To get the real change in y-hat when x1 moves from 1 to 2 (x2 fixed) in a quadratic model, you should:","choices":["Compute ŷ(x1 = 2) − ŷ(x1 = 1)","Use the derivative evaluated at x1 = 1","Use the derivative evaluated at x1 = 2","Use the coefficient of x1 alone"],"correct_index":0,"explanation":"The derivative gives only a local/instantaneous rate; the true change over a real interval requires the finite difference between the two fitted values."},{"id":"da-s3-q5","session":3,"topic":"Log transformation shortcut","question":"In y-hat = b0 + b1·log(x), a 1% increase in x is associated with approximately what change in mean(Y)?","choices":["About 0.01 × b1, valid for small % changes","About b1 %, valid for any change","Exactly b1 × log(1.01), valid only for large changes","About 100 × b1, since x rises by 1%"],"correct_index":0,"explanation":"y-hat_incr − y-hat = b1·log(1.01) ≈ 0.01·b1 — a first-order approximation valid only for small percentage shifts, not exact for large jumps."},{"id":"da-s3-q6","session":3,"topic":"Interaction term definition","question":"An interaction term x1·x2 added to a model that already has x1 and x2 as main effects allows:","choices":["The effect of x1 to depend on the level of x2","The effect of x1 to depend on the level of x1","x1 and x2 to be estimated without an intercept","The model to drop the main effects of x1 and x2"],"correct_index":0,"explanation":"Without the product term, the effect of x1 can never change regardless of x2's level (additivity). Adding x1x2 lets the effect vary — βint measures the size of that variation."},{"id":"da-s3-q7","session":3,"topic":"Quantitative × dummy interaction","question":"With y-hat = b0 + b1x1 + b2x2 + bint·x1x2 (x2 a 0/1 dummy), what do the two resulting equations (x2=0 vs x2=1) look like graphically?","choices":["Different intercepts and different slopes","Same slope, different intercepts","Same intercept, different slopes","Two identical lines"],"correct_index":0,"explanation":"x2 = 0: ŷ = b0 + b1x1. x2 = 1: ŷ = (b0 + b2) + (b1 + bint)x1. Both the intercept and the slope shift."},{"id":"da-s3-q8","session":3,"topic":"Non-significant interaction","question":"If bint in a quantitative × dummy interaction model turns out non-significant, what does the model reduce to in practice?","choices":["Parallel lines, possibly with different intercepts","Two identical lines","Lines with the same intercept, different slopes","A single line, since the dummy effect also disappears"],"correct_index":0,"explanation":"A non-significant interaction means the slopes aren't statistically different — the model effectively behaves like the no-interaction case (parallel lines), though the main-effect dummy can still shift the intercept."},{"id":"da-s3-q9","session":3,"topic":"Interaction with k categories","question":"For an interaction between a quantitative variable x1 and a categorical variable with k=3 categories (reference A, dummies xB, xC), the resulting model produces:","choices":["Three lines, each with its own intercept and slope","Three parallel lines with different intercepts","Two lines, since the reference has no equation","Three lines with the same intercept, different slopes"],"correct_index":0,"explanation":"Each category (including the reference) gets its own full line: category A uses b0+b1x1; B and C add their own intercept and slope shifts via bB/bC and bintB/bintC."},{"id":"da-s3-q10","session":3,"topic":"Testing interactions jointly","question":"How should you test whether two interaction terms belonging to the same categorical variable (e.g. x1xB and x1xC) matter together?","choices":["One partial F-test on x1xB and x1xC together","Two separate t-tests, one per interaction term","A global F-test on the whole model","A t-test on the main effect of x1"],"correct_index":0,"explanation":"Multiple interaction terms together require a partial F-test for joint significance, exactly mirroring how a whole categorical variable's dummies are tested jointly in Session 2."},{"id":"da-s3-q11","session":3,"topic":"Variable appearing in multiple forms","question":"If a variable appears in a model both as a main effect, inside an interaction, and in a quadratic form, how do you judge whether that variable matters overall?","choices":["One partial F-test on all its terms together","The t-test on its main effect","The t-test on its quadratic term","The t-tests on each term, all required to be significant"],"correct_index":0,"explanation":"The fiche is explicit: when a variable shows up in several forms, only a joint partial F-test across all its terms correctly judges its overall relevance."},{"id":"da-s3-q12","session":3,"topic":"Confusing non-linearity and non-additivity","question":"Which statement correctly distinguishes the two model failures covered in this session?","choices":["Non-linearity: effect of x depends on x. Non-additivity: it depends on another x","Non-linearity: effect of x depends on another x. Non-additivity: it depends on x","Both mean the effect of x depends on x, fixed by x²","Both mean the errors are not normal, fixed by log(Y)"],"correct_index":0,"explanation":"This exact confusion is listed as a common exam trap in the fiche: transformation fixes non-linearity, interaction fixes non-additivity — they are not interchangeable."},{"id":"da-s4-q1","session":4,"topic":"Multicollinearity definition","question":"What is the actually relevant exam question about multicollinearity?","choices":["Is multicollinearity high enough to cause a real problem?","Is there any multicollinearity at all in the model?","Are any two x's correlated above 0.5?","Is the global F-test significant despite multicollinearity?"],"correct_index":0,"explanation":"Some multicollinearity is always present. The only useful question is whether it is high enough to matter (VIF/GVIF)."},{"id":"da-s4-q2","session":4,"topic":"Effect of high multicollinearity","question":"The main mechanical effect of high multicollinearity on a coefficient's test is:","choices":["SE(bj) rises, |t| falls, H0 is harder to reject","bj becomes biased toward zero, |t| falls","SE(bj) falls, |t| rises, false positives multiply","R² falls because the x's share information"],"correct_index":0,"explanation":"Since t = estimate/standard error, an inflated standard error mechanically shrinks |t| and can make a genuinely important variable look statistically non-significant."},{"id":"da-s4-q3","session":4,"topic":"Multicollinearity extreme case","question":"What is the classic 'extreme case' signature of severe multicollinearity described in the fiche?","choices":["No correlated x is individually significant, yet the global F is","Every correlated x is individually significant, yet the global F is not","R² is close to 0 even though every t-test is significant","The VIFs are all below 10 but the SEs are huge"],"correct_index":0,"explanation":"The group's total information is real (global significance holds), but because contributions overlap heavily, no single variable's marginal contribution is large enough to be individually significant."},{"id":"da-s4-q4","session":4,"topic":"VIF","question":"VIFj is computed from:","choices":["Regressing xj on the other x's (Y not used)","Regressing Y on xj alone","Regressing Y on all x's except xj","Regressing xj on Y and the other x's"],"correct_index":0,"explanation":"VIFj = 1/(1−Rj²), where Rj² comes from regressing xj on the other explanatory variables — a completely separate regression from the main Y model."},{"id":"da-s4-q5","session":4,"topic":"VIF threshold","question":"What is the conventional VIF threshold for 'high' multicollinearity, and what should be used instead for dummy variables?","choices":["VIF > 10, and the GVIF for dummies","VIF > 5, and the same VIF for dummies","VIF > 1, and the GVIF for dummies","VIF > 10, and the correlation matrix for dummies"],"correct_index":0,"explanation":"VIF > 10 is the conventional (somewhat arbitrary) rule of thumb; GVIF replaces VIF for dichotomous explanatory variables, with the same interpretation."},{"id":"da-s4-q6","session":4,"topic":"Remedies for multicollinearity","question":"Which of the following is NOT one of the three remedies for high multicollinearity given in the fiche?","choices":["Applying a Box-Cox transformation to Y","Dropping one of the correlated variables","Collecting more data","Combining correlated variables into one indicator"],"correct_index":0,"explanation":"Check the fiche's list: dropping a variable, collecting more data and combining variables are the remedies. Transforming Y does not address correlation among the x's."},{"id":"da-s4-q7","session":4,"topic":"Residual plots","question":"A residuals-vs-fitted-values plot showing a widening 'funnel' shape as y-hat increases indicates:","choices":["Heteroskedasticity","Non-normality of the errors","Correlated errors over time","Multicollinearity"],"correct_index":0,"explanation":"A funnel shape (dispersion widening/narrowing with y-hat) signals heteroskedasticity; a systematic parabola-like curve instead signals non-linearity — these look different and mean different things."},{"id":"da-s4-q8","session":4,"topic":"Q-Q plot","question":"A Q-Q plot is used to check which assumption?","choices":["Normality of the residuals","Homoskedasticity of the residuals","Linearity of the relationship","Independence of the residuals"],"correct_index":0,"explanation":"Under perfect normality the points align on a straight line; systematic curvature signals a departure from normality (e.g. skew)."},{"id":"da-s4-q9","session":4,"topic":"Log-log vs log-lin","question":"Once Y itself is log-transformed (log-lin or log-log model), how should a coefficient bj be read?","choices":["As an approximate % change in Y","As a change in Y in its original units","As a change in log(Y) in % points","As an elasticity in every case, log-lin included"],"correct_index":0,"explanation":"With log(Y) on the left, 100·bj ≈ % change in Y (log-lin: per unit of xj; log-log: per 1% of xj, i.e. an elasticity). Only log-log gives an elasticity."},{"id":"da-s4-q10","session":4,"topic":"Outlier vs leverage point","question":"What structurally distinguishes an outlier from a leverage point?","choices":["Outlier: large residual (y side). Leverage: unusual x values","Outlier: unusual x values. Leverage: large residual","Both are defined by a large Cook's distance","Outlier: changes the fit. Leverage: never changes the fit"],"correct_index":0,"explanation":"Outlier = large residual (y-side problem). Leverage point = unusual x values (x-side problem), even if the point fits the model perfectly."},{"id":"da-s4-q11","session":4,"topic":"Influential observations","question":"What formally defines an influential observation, and what two measures quantify it?","choices":["Removing it changes the results a lot; dfbeta and Cook's distance","It has a large residual; rstudent and hatvalues","It has unusual x values; hatvalues and VIF","It lies far from ȳ; R² and adjusted R²"],"correct_index":0,"explanation":"Influence is defined by the counterfactual 'does removing it change the results significantly?' — dfbeta answers this per coefficient, Cook's distance gives one combined number per observation."},{"id":"da-s4-q12","session":4,"topic":"Common mistake","question":"If a variable correlated with others in the model shows a non-significant t-test, what should you avoid concluding?","choices":["That xj has no effect on Y","That SE(bj) is inflated","That xj is correlated with other x's","That the global F-test may still be significant"],"correct_index":0,"explanation":"A non-significant t under multicollinearity may just reflect an inflated SE. Concluding 'no effect' is the mistake; the other statements are plausible readings."},{"id":"da-s5-q1","session":5,"topic":"Panel data definition","question":"What structurally distinguishes panel (longitudinal) data from cross-sectional data?","choices":["n units each observed at T instants","n units observed once at the same instant","One unit observed at T instants","n units observed at different, non-overlapping instants"],"correct_index":0,"explanation":"n units × T time points, each unit observed repeatedly over time — this double dimension is exactly what defines panel/longitudinal data."},{"id":"da-s5-q2","session":5,"topic":"Balanced panel","question":"A 'balanced' panel with n units and T time points has exactly how many observations per variable?","choices":["n × T","n + T","n","T"],"correct_index":0,"explanation":"Balanced means every unit is observed at every one of the T instants with no gaps, giving exactly n×T observations per variable."},{"id":"da-s5-q3","session":5,"topic":"Why classic regression fails","question":"Why doesn't a classic (cross-sectional) linear regression generally work on panel data?","choices":["Repeated observations of one unit are not independent","The number of observations n × T is too large for OLS","The x's become perfectly collinear across time","The dependent variable is no longer continuous"],"correct_index":0,"explanation":"Successive observations of the same unit tend to be correlated over time, directly violating the Session 1 assumption that errors are uncorrelated."},{"id":"da-s5-q4","session":5,"topic":"Pooling model","question":"The Pooling Model's core flaw is that it:","choices":["It treats all n·T rows as unrelated units","It gives each unit its own intercept","It needs generalized least squares","It drops the time dimension by averaging"],"correct_index":0,"explanation":"The Pooling Model is literally an ordinary cross-sectional OLS regression on n·T points; it ignores which observations belong to the same unit, so it inherits the same spurious-correlation risk as the coastal-housing example."},{"id":"da-s5-q5","session":5,"topic":"Fixed Effects Model","question":"In the Fixed Effects Model, μi is best understood as:","choices":["A fixed, unit-specific intercept for time-constant traits","A random draw, unit-specific, uncorrelated with the x's","A time-specific shock common to all units","A unit-specific slope on each x"],"correct_index":0,"explanation":"μi is fixed/deterministic and unique to each unit — 'everything about unit i that never changes over time and wasn't measured' — purging β of that heterogeneity."},{"id":"da-s5-q6","session":5,"topic":"Random Effects Model","question":"What is the key requirement for the Random Effects Model's estimates to be valid (consistent)?","choices":["μi uncorrelated with the explanatory variables","μi correlated with the explanatory variables","εit correlated across time for each unit","A balanced panel with T > n"],"correct_index":0,"explanation":"REM validity hinges on μi (now random) being uncorrelated with the x's; if this fails, REM estimates become inconsistent."},{"id":"da-s5-q7","session":5,"topic":"FEM vs REM parameter count","question":"Why does the fiche say REM is preferable 'when it is valid'?","choices":["It estimates only α and β, so it is more efficient","It removes all omitted-variable bias, unlike FEM","It needs no assumption on μi","It gives each unit its own slope"],"correct_index":0,"explanation":"FEM must estimate n separate μi values in addition to α, β — burning degrees of freedom. REM estimates only α and β, so it's more efficient whenever its validity assumption holds."},{"id":"da-s5-q8","session":5,"topic":"Individual vs idiosyncratic error","question":"What is the difference between the individual-specific error μi and the idiosyncratic error εit?","choices":["μi is time-constant per unit; εit varies across units and time","μi varies over time; εit is constant per unit","μi is common to all units; εit is unit-specific","Both vary over time, μi is just larger"],"correct_index":0,"explanation":"μi = persistent unit-level traits (e.g. a firm's culture); εit = short-term shocks/measurement noise that vary unit-by-unit and time-by-time."},{"id":"da-s5-q9","session":5,"topic":"Hausman test decision rule","question":"In the Hausman test comparing FEM and REM, what does rejecting H0 mean, and which model do you then use?","choices":["REM is inconsistent, use FEM","FEM is inconsistent, use REM","Both are consistent, use REM as it is more efficient","Neither is valid, go back to pooling"],"correct_index":0,"explanation":"H0: REM assumptions hold. Rejecting H0 (p ≤ α) means μi is correlated with the x's, so REM is inconsistent and FEM is used."},{"id":"da-s5-q10","session":5,"topic":"High individual-error variance","question":"If the REM output shows the individual-error variance dominating the idiosyncratic-error variance, what does this imply?","choices":["Unexplained variance is mostly persistent differences between units","Unexplained variance is mostly shocks varying over time","The REM coefficients are unreliable and FEM must be used","The Hausman test will necessarily reject H0"],"correct_index":0,"explanation":"A dominant individual-error variance signals persistent between-unit differences, not a broken model — it's informative, not automatically a problem."},{"id":"da-s5-q11","session":5,"topic":"fixef() prediction","question":"When predicting for a specific unit in a fixed-effects panel model, you should use:","choices":["That unit's own fixef() intercept","The mean of all fixef() intercepts","The intercept of the pooling model","The intercept of the REM"],"correct_index":0,"explanation":"Explicit fiche warning: never use a generic/averaged intercept to predict a specific panel unit — always use that unit's own fixef() intercept."},{"id":"da-s6-q1","session":6,"topic":"Probability vs odds","question":"If an event E has probability p = 0.8, what is ODDS(E)?","choices":["4","0.8","0.25","1.25"],"correct_index":0,"explanation":"ODDS = p/(1−p) = 0.8/0.2 = 4. 0.25 is the odds of the complement (0.2/0.8). 1.25 is 1/0.8."},{"id":"da-s6-q2","session":6,"topic":"Probability vs odds","question":"Which statement about probability p and ODDS is correct?","choices":["p ∈ [0,1], ODDS ∈ [0,+∞)","p ∈ [0,1], ODDS ∈ (−∞,+∞)","p ∈ [0,1], ODDS ∈ [0,1]","p ∈ (−∞,+∞), ODDS ∈ [0,+∞)"],"correct_index":0,"explanation":"log(ODDS) ranges over (−∞,+∞), not ODDS itself."},{"id":"da-s6-q3","session":6,"topic":"Probability vs odds","question":"ODDS(E) = 3. What is p?","choices":["0.75","0.33","0.67","0.25"],"correct_index":0,"explanation":"p = ODDS/(1+ODDS) = 3/4 = 0.75. 0.25 is 1/(1+3), the probability of the complement."},{"id":"da-s6-q4","session":6,"topic":"Log-odds behavior","question":"As p approaches 1, what happens to log(ODDS)?","choices":["It tends to +∞","It tends to 1","It tends to 0","It tends to −∞"],"correct_index":0,"explanation":"log(ODDS) is a strictly increasing function of p; as p -> 1, log(ODDS) -> +infinity (and as p -> 0, it -> -infinity)."},{"id":"da-s6-q5","session":6,"topic":"Logistic regression setup","question":"In the logistic regression model, what kind of variable is the dependent variable Y?","choices":["A 0/1 (Bernoulli) variable","A probability between 0 and 1","A count of successes","A log-odds on (−∞,+∞)"],"correct_index":0,"explanation":"Y itself is 0/1. p is its probability, log(p/(1−p)) is what the model makes linear."},{"id":"da-s6-q6","session":6,"topic":"Logistic regression setup","question":"In the logit model, what does p represent besides P(Y=1)?","choices":["E(Y), the mean of Y","The variance of Y","The odds of Y = 1","The log-odds of Y = 1"],"correct_index":0,"explanation":"For a Bernoulli variable E(Y) = p. Its variance is p(1−p)."},{"id":"da-s6-q7","session":6,"topic":"Model equation","question":"Which equation is the standard formulation of the logit model used in practice?","choices":["log(p/(1−p)) = b0 + b1x1 + ... + bpxp","p = b0 + b1x1 + ... + bpxp","p/(1−p) = b0 + b1x1 + ... + bpxp","log(p) = b0 + b1x1 + ... + bpxp"],"correct_index":0,"explanation":"The commonly used formulation expresses the log-odds (not p, not ODDS itself, not log(p) alone) as a linear function of the explanatory variables."},{"id":"da-s6-q8","session":6,"topic":"Estimation","question":"How are the logit model's coefficients (b0, b1, ..., bp) estimated?","choices":["Maximum likelihood","Ordinary least squares on the 0/1 Y","Least squares on log(p/(1−p))","Generalized least squares"],"correct_index":0,"explanation":"The fiche states the parameters are estimated via Maximum Likelihood Estimation, provided by R; OLS is the linear regression method, not logit."},{"id":"da-s6-q9","session":6,"topic":"Odds ratio, quantitative variable","question":"For a quantitative variable xj with estimated coefficient bj, what does e^bj represent?","choices":["The odds ratio for +1 unit of xj, others fixed","The change in p for +1 unit of xj, others fixed","The ratio of probabilities for +1 unit of xj, others fixed","The change in log-odds for +1 unit of xj, others fixed"],"correct_index":0,"explanation":"bj itself is the change in log-odds. e^bj is the multiplicative factor on the odds (odds ratio), not on p."},{"id":"da-s6-q10","session":6,"topic":"Odds ratio, quantitative variable","question":"If bj = 0, what is the odds ratio e^bj and what does it imply?","choices":["1, so no change in the odds","0, so no change in the odds","1, so p doubles","0, so p is zero"],"correct_index":0,"explanation":"e^0 = 1; an odds ratio of 1 means the odds of Y=1 are unchanged when xj increases by one unit, other variables held constant."},{"id":"da-s6-q11","session":6,"topic":"Odds ratio, dichotomous variable","question":"For a dichotomous variable xj, what does e^bj compare?","choices":["Odds of Y=1 when xj=1 vs when xj=0, others fixed","P(Y=1) when xj=1 vs when xj=0, others fixed","Odds of Y=1 when xj=1 vs odds of Y=0 when xj=1","Odds of xj=1 when Y=1 vs when Y=0"],"correct_index":0,"explanation":"For a dichotomous xj, e^bj is the ratio between the odds of Y=1 when xj=1 and the odds of Y=1 when xj=0, other variables held constant."},{"id":"da-s6-q12","session":6,"topic":"Worked example (awareness)","question":"In the worked example (Y=1 if aware of a product, x1=age, x2=1 if female), b1=0.2 so e^0.2=1.2214. What is the correct interpretation, x2 held fixed?","choices":["Odds of awareness rise by 22.14% per extra year","Probability of awareness rises by 22.14% per extra year","Probability of awareness rises by 0.2 per extra year","Odds of awareness rise by 20% per extra year"],"correct_index":0,"explanation":"e^0.2 − 1 = 0.2214 → +22.14% on the ODDS. Nothing exact can be said about p from bj alone."},{"id":"da-s6-q13","session":6,"topic":"Worked example (awareness)","question":"In the same example, b2 = -0.8 so e^-0.8 = 0.4493 for x2 (female=1). What does this mean, x1 held fixed?","choices":["Female odds are 44.93% of male odds","Female odds are 44.93% lower than male odds","Female probability is 44.93% of male probability","Female odds are 80% lower than male odds"],"correct_index":0,"explanation":"e^−0.8 = 0.4493, so female odds = 0.4493 × male odds, i.e. 55.07% lower (not 44.93% lower)."},{"id":"da-s6-q14","session":6,"topic":"Odds ratio, sign rule","question":"If bj < 0, what happens to the estimated odds and probability of the event as xj increases (or moves from 0 to 1)?","choices":["Odds and probability both decrease","Odds decrease, probability can go either way","Odds decrease, probability is unchanged","Odds increase, probability decreases"],"correct_index":0,"explanation":"Odds and p move in the same direction (p = odds/(1+odds) is increasing), so the direction is known even if the size of the change in p is not."},{"id":"da-s6-q15","session":6,"topic":"Test on individual coefficient","question":"A logit output shows b3 = 0.42, SE = 0.25. At α = 0.05 (two-sided):","choices":["zoss = 1.68 < 1.96, do not reject H0: β3 = 0","zoss = 1.68 > 1.645, reject H0: β3 = 0","zoss = 0.595, do not reject H0: β3 = 0","zoss = 1.68, reject H0 since e^0.42 > 1"],"correct_index":0,"explanation":"zoss = 0.42/0.25 = 1.68. Two-sided 5% critical value is 1.96 (1.645 is the 10% two-sided value). Not significant at 5%, significant at 10%."},{"id":"da-s6-q16","session":6,"topic":"Test on individual coefficient","question":"How is the test statistic zoss for an individual coefficient computed, and what does it follow under H0?","choices":["bj/SE(bj), approx. N(0,1) under H0","bj/SE(bj), Student t with n−p−1 df under H0","e^bj/SE(bj), approx. N(0,1) under H0","bj²/SE(bj), chi-square with 1 df under H0"],"correct_index":0,"explanation":"The logit uses a Z statistic (normal approximation from ML), not the Student t of linear regression."},{"id":"da-s6-q17","session":6,"topic":"Common exam trap","question":"A student says 'e^bj = 1.22 means the probability of the event increases by exactly 22%.' What is wrong with this statement?","choices":["e^bj is an odds ratio: +22% on the odds, not on p","e^bj should be read as +1.22 percentage points of p","It is right only if the event is rare (p < 0.1)","It is right, since odds and p move by the same %"],"correct_index":0,"explanation":"e^bj multiplies the odds. The % change in p depends on the starting p. Only the direction of the change in p is known."},{"id":"da-s7-q1","session":7,"topic":"Why a new test","question":"Why is the individual Z-test from Session 6 not enough to test whether several variables are jointly significant?","choices":["It tests one coefficient at a time","It requires the errors to be normal","It only works for quantitative x's","It needs nested models"],"correct_index":0,"explanation":"The fiche states the Session 6 Z-test tests only one coefficient at a time; a chi-square/LRT test is needed for groups of variables or the whole model."},{"id":"da-s7-q2","session":7,"topic":"Partial vs global test","question":"What is the relationship between the partial chi-square test and the global chi-square test?","choices":["Global = partial test with the null model as reduced model","Global = partial test with the full model as reduced model","They use different statistics, F for global, χ² for partial","Global test = sum of the individual Z² statistics"],"correct_index":0,"explanation":"The fiche states question 2 (global significance) is a special case of question 1 (group significance), corresponding to q=0, where the reduced model is the null model."},{"id":"da-s7-q3","session":7,"topic":"Residual deviance","question":"How is residual deviance defined for an estimated model M?","choices":["−2 log L(M)","−log L(M)","2 log L(M) + 2(p+1)","Σ(yi − p̂i)²"],"correct_index":0,"explanation":"The third option is the AIC. Σ(yi − p̂i)² is a least-squares idea, not used here."},{"id":"da-s7-q4","session":7,"topic":"Chi-square test statistic","question":"For the test on a group of variables, how is the chi-square statistic computed and what are its degrees of freedom?","choices":["RES.DEV(red) − RES.DEV(compl), p − q df","RES.DEV(compl) − RES.DEV(red), p − q df","RES.DEV(red) − RES.DEV(compl), n − p − 1 df","RES.DEV(red) / RES.DEV(compl), p − q df"],"correct_index":0,"explanation":"The reduced model always has the larger residual deviance, so the difference is positive. df = number of parameters removed."},{"id":"da-s7-q5","session":7,"topic":"LRT naming","question":"Why are the chi-square tests on groups of variables also called LRT?","choices":["They compare maximized likelihoods of two models","They compare the residual variances of two models","They are ratios of two Z statistics","They are equivalent to F-tests on the log-odds"],"correct_index":0,"explanation":"The fiche states these tests are also called LRT (Likelihood Ratio Test) because they are based on the likelihood function."},{"id":"da-s7-q6","session":7,"topic":"Prediction steps","question":"Starting from an estimated logit equation and fixed x values, what is the correct order of steps to predict the probability?","choices":["log-odds → exp → odds → odds/(1+odds)","log-odds → exp → probability directly","odds → log → probability","log-odds → 1/(1+log-odds) → probability"],"correct_index":0,"explanation":"The fiche describes: substitute fixed x values into the estimated equation to get the predicted log-odds, take the exponential to get predicted odds, then use the odds-probability relationship to get predicted probability."},{"id":"da-s7-q7","session":7,"topic":"Prediction of Y","question":"Using the default threshold described in the fiche, when is the predicted value of Y set to 1?","choices":["When p̂0 ≥ 0.5 (default, other thresholds possible)","When p̂0 ≥ 0.5, a threshold fixed by the model","When the predicted log-odds ≥ 0.5","When the predicted odds ≥ 0.5"],"correct_index":0,"explanation":"p̂ ≥ 0.5 ⇔ odds ≥ 1 ⇔ log-odds ≥ 0. The slides say 0.5 is only the default."},{"id":"da-s7-q8","session":7,"topic":"AIC","question":"How is the AIC of a logit model M defined?","choices":["−2 log L(M) + 2(p+1)","−2 log L(M) + 2p","−2 log L(M) − 2(p+1)","RES.DEV(M) / (n − p − 1)"],"correct_index":0,"explanation":"Check with the insurance example: 159.84 + 2 × 4 = 167.84 (p = 3 slopes + intercept)."},{"id":"da-s7-q9","session":7,"topic":"AIC interpretation","question":"According to the AIC criterion, which of two competing models is considered better?","choices":["The lower AIC","The higher AIC","The one whose AIC is closer to its residual deviance","The one whose AIC difference with the null model is significant"],"correct_index":0,"explanation":"The fiche states a model is considered better, per this criterion, the lower its AIC value."},{"id":"da-s7-q10","session":7,"topic":"AIC vs chi-square test","question":"For comparing nested models, which tool does the fiche say is the most appropriate?","choices":["The partial chi-square test","The AIC","The rate of correct predictions","The individual Z-tests"],"correct_index":0,"explanation":"The fiche's watch box states that for comparing nested models, the partial chi-square test remains the most appropriate tool, AIC being more useful for models that are not necessarily nested."},{"id":"da-s7-q11","session":7,"topic":"Worked example, insurance","question":"In the insurance example, the coefficient of AGE is -0.0389 with e^-0.0389=0.9618. What is the correct interpretation, vehicle category held constant?","choices":["About −3.8% on the odds of a high claim per extra year","About −3.9% on the probability of a high claim per extra year","−0.0389 on the probability of a high claim per extra year","About −96% on the odds of a high claim per extra year"],"correct_index":0,"explanation":"e^−0.0389 = 0.9618, so (0.9618 − 1)×100% = −3.82% on the ODDS (the fiche writes 3.92%, a rounding slip). Nothing exact can be said about p, and 0.9618 is the multiplier, not the change."},{"id":"da-s7-q12","session":7,"topic":"Worked example, insurance","question":"In the same example, the global chi-square test (model vs null model) gave chi2=77.344, 3 df, p-value < 2.2e-16. What is the conclusion?","choices":["Model globally significant, H0 rejected","Every coefficient is significant","The model predicts 77% of cases correctly","H0 not rejected, the null model is preferred"],"correct_index":0,"explanation":"An extremely small p-value means H0 (all coefficients equal 0) is rejected, so the model as a whole is globally significant."},{"id":"da-s7-q13","session":7,"topic":"Worked example, insurance","question":"The partial chi-square test comparing the AGE-only model to the AGE+VC model gave chi2=69.202, 2 df, p-value close to 0. What does this test?","choices":["Whether VC (both dummies) matters given AGE","Whether AGE matters given VC","Whether VCB and VCC are equal","Whether the whole model beats the null model"],"correct_index":0,"explanation":"This partial test compares the reduced model (AGE only) to the complete model (AGE+VC), testing whether VC's two dummy coefficients are jointly significant; the near-zero p-value says VC significantly improves the model."},{"id":"da-s7-q14","session":7,"topic":"Worked example, insurance","question":"The confusion matrix showed 168 correct predictions out of 200 (128 correctly predicted 'no' plus 40 correctly predicted 'yes'). What percentage of correct predictions is this?","choices":["84%","64%","20%","16%"],"correct_index":0,"explanation":"(128 + 40)/200 = 0.84. 16% is the error rate. 64% = 128/200 only counts correct 'no'."},{"id":"da-s7-q15","session":7,"topic":"Common exam trap","question":"A student wants to compare a model with 3 explanatory variables to a completely different (non-nested) model with 2 unrelated variables. Which comparison tool from this session is most appropriate?","choices":["AIC","Partial chi-square test","Global chi-square test on each model","Z-tests on each coefficient"],"correct_index":0,"explanation":"The chi-square/LRT tests in this session require nested models (one model's variables are a subset of the other's); AIC does not require nesting and is more suitable here."},{"id":"da-s8-q1","session":8,"topic":"Multinomial setup","question":"When is a multinomial logit model used instead of a binary logit model?","choices":["Y qualitative with more than 2 categories","Y quantitative and bounded between 0 and 1","Y binary but with more than 2 explanatory variables","Y ordinal and treated as numeric"],"correct_index":0,"explanation":"The fiche defines the multinomial logit model as used for a qualitative dependent variable with k>2 categories; if k=2, it reduces to the binary logit model."},{"id":"da-s8-q2","session":8,"topic":"Number of equations","question":"For a dependent variable with k=4 categories, how many equations does the multinomial logit model use?","choices":["3","4","2","6"],"correct_index":0,"explanation":"The model uses k-1 equations, each expressing the conditional log-odds of one non-reference category relative to the reference category; the reference category itself gets no separate equation."},{"id":"da-s8-q3","session":8,"topic":"Reference category","question":"What do the k-1 equations of the multinomial logit model express?","choices":["log(pi/p1) for each non-reference category i","log(pi/(1−pi)) for each category i","log(pi/pj) for every pair of categories","pi as a linear function of the x's"],"correct_index":0,"explanation":"Each equation is log(pi/p1): conditional log-odds against the reference A1, not the usual odds pi/(1−pi)."},{"id":"da-s8-q4","session":8,"topic":"Coefficients across equations","question":"Are the coefficients of the same variable (e.g. x1) generally the same across the different equations of a multinomial logit model?","choices":["No, generally different across equations","Yes, the model imposes the same slope","Yes, only the intercepts change","Only for dummy variables"],"correct_index":0,"explanation":"The fiche explicitly notes coefficients of the same variable are in general different across equations, e.g. beta12 is not equal to beta13 in general."},{"id":"da-s8-q5","session":8,"topic":"Interpreting a coefficient, quantitative","question":"For a quantitative x1 with b12=0.03 in the equation for A2 vs reference A1, what is the correct interpretation?","choices":["(e^0.03 − 1)×100% on the odds of A2 vs A1","3% on the probability of choosing A2","(e^0.03 − 1)×100% on the probability of A2","3% on the odds of A2 vs all other brands"],"correct_index":0,"explanation":"For a quantitative variable, the percentage change in the conditional odds of Ai vs the reference for a one-unit increase in xj is (e^bji - 1) x 100%, other variables held constant."},{"id":"da-s8-q6","session":8,"topic":"Interpreting a coefficient, dichotomous","question":"For a dichotomous x2 with b22=-0.6 in the equation for A2 vs reference A1, what is (e^-0.6 - 1) x 100% approximately, and what does it mean?","choices":["−45.12%: odds of A2 vs A1 lower when x2 = 1","−45.12%: probability of A2 lower when x2 = 1","−60%: odds of A2 vs A1 lower when x2 = 1","+54.88%: odds of A2 vs A1 when x2 = 1"],"correct_index":0,"explanation":"e^−0.6 = 0.5488, (0.5488 − 1)×100% = −45.12% on the conditional odds of A2 vs A1."},{"id":"da-s8-q7","session":8,"topic":"Test on individual coefficient","question":"What is tested by H0: betaji = 0 vs H1: betaji not equal to 0 in the multinomial model?","choices":["Whether xj affects the odds of Ai vs the reference","Whether xj affects the probability of Ai","Whether xj affects Y in every equation at once","Whether category Ai differs from the reference"],"correct_index":0,"explanation":"This is the individual coefficient test for the multinomial model, analogous to the binary case, testing one specific coefficient betaji in one specific equation."},{"id":"da-s8-q8","session":8,"topic":"Tests not covered","question":"According to the fiche, which tests for the multinomial logit model are explicitly NOT covered in this course?","choices":["Chi-square tests on groups or on all coefficients","Z-tests on individual coefficients","Predictions of the k probabilities","Interpretation of e^bji"],"correct_index":0,"explanation":"The fiche's watch box states group/global chi-square tests for the multinomial model exist conceptually but are explicitly not covered ('we will not cover them here'); only the individual test is examinable."},{"id":"da-s8-q9","session":8,"topic":"Prediction method","question":"What is the correct general method to predict probabilities p1, ..., pk in a multinomial logit model?","choices":["Solve the k−1 odds equations with Σpi = 1","Exponentiate each equation and read pi directly","Apply p = odds/(1+odds) to each equation","Average the k−1 predicted log-odds"],"correct_index":0,"explanation":"Applying odds/(1+odds) to each equation separately is the trap: pi/p1 is not pi/(1−pi)."},{"id":"da-s8-q10","session":8,"topic":"Worked example, brands","question":"In the brand-choice worked example (A1 reference), for a 30-year-old female consumer (x1=30, x2=0), log(p2/p1)=2.1 and log(p3/p1)=1.4 were computed. What is the next correct step?","choices":["p2/p1 = e^2.1, p3/p1 = e^1.4, then use p1+p2+p3 = 1","p2 = e^2.1/(1+e^2.1), p3 = e^1.4/(1+e^1.4)","p2 = 2.1/(1+2.1+1.4), p3 = 1.4/(1+2.1+1.4)","p1 = 1 − 2.1 − 1.4, then solve"],"correct_index":0,"explanation":"Resolving: p1 = 1/(1 + 8.1662 + 4.0552) = 0.0757, p2 = 0.6175, p3 = 0.3068."},{"id":"da-s8-q11","session":8,"topic":"Worked example, students","question":"In the student program-choice example using R's multinom(), which category did R automatically select as the reference for the 'program' variable?","choices":["general","academic","vocation","The most frequent category"],"correct_index":0,"explanation":"R takes the FIRST LEVEL of the factor as reference. In this dataset the levels are stored as general, academic, vocation, so general (alphabetical order would have given academic). Always check with levels() or the output labels."},{"id":"da-s8-q12","session":8,"topic":"Worked example, students","question":"In the student example, the coefficient of seshigh in the vocation vs general equation was 0.1802 (e^0.1802=1.1975). At the 0.05 significance level, was this coefficient significant per the fiche?","choices":["No, only seshigh in academic vs general was","Yes, both seshigh coefficients were","Yes, since e^0.1802 > 1","No, and neither was seshigh in academic vs general"],"correct_index":0,"explanation":"The fiche states that at the 0.05 level, only seshigh in the academic vs general equation was significant; seshigh in the vocation equation was not flagged as significant."},{"id":"da-s8-q13","session":8,"topic":"Common exam trap","question":"A student interprets b13=0.01 as 'the effect of x1 on the overall probability of choosing A3'. What is wrong with this interpretation?","choices":["It acts on the odds of A3 vs A1, not on p3","It should be read as +0.01 on p3","It should be read as the effect on p3/(1−p3)","It is correct only if A3 is the most chosen brand"],"correct_index":0,"explanation":"The fiche's common-trap section flags exactly this confusion, every multinomial coefficient is always relative to the chosen reference category, never a statement about the raw probability."},{"id":"da-s8-q14","session":8,"topic":"Common exam trap","question":"Why can't you directly compare b12 and b13 (coefficients of the same variable in two different equations) as if they measured the same contrast?","choices":["Each compares a different category with A1","They are on different scales, one is in logs","They are estimated on different subsamples","They can be compared only if x1 is a dummy"],"correct_index":0,"explanation":"The fiche's exam-trap section explains each coefficient describes a different category-vs-reference contrast, so comparing them directly as if for the same contrast is a common mistake."},{"id":"da-s6-q18","session":6,"topic":"Odds and log-odds","question":"If p = 0.2, what is log(ODDS)?","choices":["−1.386","−1.609","1.386","−0.223"],"correct_index":0,"explanation":"ODDS = 0.2/0.8 = 0.25, log(0.25) = −1.386. −1.609 is log(0.2), −0.223 is log(0.8)."},{"id":"da-s6-q19","session":6,"topic":"Odds ratio over several units","question":"Awareness example, b1 = 0.2 (age). By how much do the odds change for a consumer 5 years older, x2 fixed?","choices":["+171.8%","+110.7%","+100%","+22.14%"],"correct_index":0,"explanation":"e^(5×0.2) = e^1 = 2.718, so +171.8%. Adding 5 × 22.14% = 110.7% is the trap: odds ratios multiply, they do not add."},{"id":"da-s6-q20","session":6,"topic":"Prediction","question":"With log(p̂/(1−p̂)) = 1.5 + 0.2x1 − 0.8x2, what is p̂ for a 20-year-old woman (x2 = 1)?","choices":["0.991","0.996","0.824","4.7"],"correct_index":0,"explanation":"Log-odds = 1.5 + 4 − 0.8 = 4.7, p̂ = 1/(1 + e^−4.7) = 0.991. 0.996 forgets the −0.8, 4.7 is the log-odds itself."},{"id":"da-s6-q21","session":6,"topic":"Z-test","question":"b2 = −0.8 with SE = 0.35. Two-sided test of β2 = 0:","choices":["Reject at 5%, not at 1%","Reject at 1% and at 5%","Do not reject at 5%, reject at 10%","Do not reject, since b2 < 0"],"correct_index":0,"explanation":"zoss = −0.8/0.35 = −2.29. |z| > 1.96 (5%) but < 2.576 (1%)."},{"id":"da-s7-q16","session":7,"topic":"Partial chi-square test","question":"Reduced model RES.DEV = 250, complete model RES.DEV = 238, with 2 extra variables. Conclusion?","choices":["χ² = 12 > 9.21, reject H0 even at 1%","χ² = 12 > 5.99, reject at 5% but not at 1%","χ² = 12 < 13.28, do not reject at 1%","χ² = 1.05 (250/238), do not reject"],"correct_index":0,"explanation":"χ² = 250 − 238 = 12 on 2 df. Critical values 5.99 (5%) and 9.21 (1%). 13.28 is the 1% value for 4 df."},{"id":"da-s7-q17","session":7,"topic":"AIC","question":"Model A: RES.DEV = 200, p = 3. Model B: RES.DEV = 205, p = 1. Which has the better AIC?","choices":["A (208 vs 209)","B (207 vs 206)","A, since its residual deviance is lower","B, since it has fewer variables"],"correct_index":0,"explanation":"AIC = RES.DEV + 2(p+1): A = 200 + 8 = 208, B = 205 + 4 = 209. Lower is better, A wins by one point."},{"id":"da-s7-q18","session":7,"topic":"Prediction","question":"A logit model gives a predicted log-odds of −0.5. Predicted probability?","choices":["0.378","0.607","0.622","0.500"],"correct_index":0,"explanation":"Odds = e^−0.5 = 0.607, p = 0.607/1.607 = 0.378. 0.607 is the odds, 0.622 is 1/(1+e^−0.5)."},{"id":"da-s7-q19","session":7,"topic":"Global chi-square test","question":"Null deviance 300 (249 df), residual deviance 280 (246 df). Global test at 5%?","choices":["χ² = 20 on 3 df > 7.81, reject H0","χ² = 20 on 246 df, do not reject","χ² = 580 on 3 df, reject H0","χ² = 20 on 3 df < 21.03, do not reject"],"correct_index":0,"explanation":"χ² = 300 − 280 = 20, df = 249 − 246 = 3, critical 7.81. The model beats the null model."},{"id":"da-s8-q15","session":8,"topic":"Multinomial prediction","question":"Brand example, 40-year-old man (x1 = 40, x2 = 1). Which brand is predicted?","choices":["A3 (p̂3 ≈ 0.49)","A2 (p̂2 ≈ 0.44)","A1 (reference, highest p̂)","A2, since b12 > b13"],"correct_index":0,"explanation":"log(p2/p1) = 1.2 + 1.2 − 0.6 = 1.8, log(p3/p1) = 1.1 + 0.4 + 0.4 = 1.9. p1 = 1/(1 + e^1.8 + e^1.9) = 0.073, p2 = 0.440, p3 = 0.487."},{"id":"da-s8-q16","session":8,"topic":"Contrast between two non-reference categories","question":"Brand example. For men vs women (x1 fixed), how do the odds of A3 vs A2 change?","choices":["×e^1 = 2.718","×e^−0.2 = 0.819","×e^0.4 = 1.492","Cannot be derived from the two equations"],"correct_index":0,"explanation":"log(p3/p2) = log(p3/p1) − log(p2/p1), so the x2 coefficient is 0.4 − (−0.6) = 1.0 and the odds ratio is e^1. Subtracting equations is the correct way to compare them."}],"cr":[{"id":"cr-s1-q1","session":1,"topic":"Agency problem","question":"The agency problem arises because:","choices":["Managers (agents) may hold interests that diverge from those of owners (principals) once ownership is separated from control","Shareholders always know more about the firm than managers","GAAP differs between countries","The IASB has only 14 members"],"correct_index":0,"explanation":"Separation of ownership from control creates divergent interests between principal (owner) and agent (manager) — the textbook agency problem."},{"id":"cr-s1-q2","session":1,"topic":"Information asymmetry","question":"Information asymmetry in financial reporting describes:","choices":["Managers possessing superior information about the firm relative to shareholders and other external users","Auditors knowing more than regulators","IFRS being harder to read than US GAAP","Shareholders having bett
