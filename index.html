irment if NBV <= recoverable amount."},{"id":"cr-s12-f2","session":12,"front":"Recoverable amount","back":"The GREATER of (a) fair value less costs to sell and (b) value in use (PV of expected future cash flows)."},{"id":"cr-s12-f3","session":12,"front":"Mandatory annual impairment testing","back":"Indefinite-life intangibles, goodwill, and assets not yet ready for use — tested annually regardless of indicators. All other assets: tested only when an indicator exists."},{"id":"cr-s12-f4","session":12,"front":"External impairment indicators","back":"Unexpected decline in market value; adverse legal/technological/market/economic changes; rising interest rates (affecting discount rate); book value of net assets exceeding market capitalisation."},{"id":"cr-s12-f5","session":12,"front":"Internal impairment indicators","back":"Obsolescence/physical damage; changes in asset use (restructuring, planned disposal); internal reporting showing worse-than-expected economic performance."},{"id":"cr-s12-f6","session":12,"front":"Impairment loss for revalued assets (exception)","back":"Debited first against any revaluation reserve balance for that asset (as negative OCI); only the excess beyond the reserve is a P&L expense."},{"id":"cr-s12-f7","session":12,"front":"Cash-generating unit (CGU)","back":"The smallest identifiable group of assets generating cash inflows largely independent of other assets/groups — used when an individual asset's own recoverable amount can't be estimated."},{"id":"cr-s12-f8","session":12,"front":"Goodwill impairment testing approach","back":"Allocated to each CGU (or group) expected to benefit from combination synergies; each such CGU must be at or below the level of an IFRS8 operating segment; CGU's own assets tested before goodwill."},{"id":"cr-s12-f9","session":12,"front":"Impairment loss allocation order within a CGU","back":"1) Goodwill first, down to zero. 2) Remaining loss pro rata to other assets by carrying amount. 3) Floor: no asset below its own fair-value-less-costs-to-sell or value-in-use."},{"id":"cr-s12-f10","session":12,"front":"Reversal rules","back":"Goodwill: NEVER reversed. Other assets: reversal capped at pre-impairment carrying amount net of notional depreciation; recognised in P&L normally, or via OCI/reserve if the asset is carried at a revalued amount."},{"id":"cr-s12-f11","session":12,"front":"Corporate assets","back":"Assets like HQ buildings/IT systems serving shared activities with no independent cash inflows; allocated to CGUs where reasonably possible, else tested at the smallest group level they can be allocated to."},{"id":"cr-s13-f1","session":13,"front":"BIG/JWMS deal","back":"Biosensors International Group acquired the remaining 50% of JW Medical Systems for US$478m in October 2011 (having held 50% since 2003), ~25x JWMS's FY2011 profit after tax."},{"id":"cr-s13-f2","session":13,"front":"Balance sheet shift","back":"Intangibles + goodwill moved from 4% to 62% of BIG's total assets between 2011 and 2012, driven almost entirely by the JWMS acquisition."},{"id":"cr-s13-f3","session":13,"front":"Intangibles acquired (US$'000)","back":"Patents 18,825; customer relationships 135,128 (net 131,236, the dominant component); land use rights 1,841 — total 155,794 of 162,008 total intangibles."},{"id":"cr-s13-f4","session":13,"front":"Why customer relationships were recognisable here","back":"Acquired via a business combination — Session 11's rule that internally generated customer lists/relationships can never be recognised does not apply to items acquired externally."},{"id":"cr-s13-f5","session":13,"front":"Land use rights amortisation delay","back":"Not amortised at 31 March 2012 because the lease period only began 1 April 2012 — consistent with the 'capable of operating as intended' recognition cutoff."},{"id":"cr-s13-f6","session":13,"front":"Goodwill recognition and subsequent measurement","back":"Initially at cost = consideration transferred (+ NCI) minus net identifiable assets/liabilities acquired; subsequently at cost less accumulated impairment only, never amortised."},{"id":"cr-s13-f7","session":13,"front":"Where BIG's FY2012 goodwill impairment actually hit","back":"Three smaller CGUs (BSI, Bio Japan, Bifurcation stents) totalling US$12,232k — NOT the much larger JWMS goodwill balance, illustrating CGU-specific (not company-wide) testing."},{"id":"cr-s13-f8","session":13,"front":"JWMS value-in-use assumptions","back":"Five-year DCF, 18% average growth rate, 2% terminal growth rate, 12% pre-tax discount rate — all management-set and not independently verifiable."},{"id":"cr-s13-f9","session":13,"front":"Market capitalisation as an impairment cross-check","back":"Session 12's external indicator (book value exceeding market cap) applied concretely: BIG's market-value range (~US$1.48bn-2.31bn) vs net book value (~US$1.12bn) as an independent sanity check on the DCF conclusion."},{"id":"cr-s13-f10","session":13,"front":"The case's own caution","back":"Deliberately does not conclude whether BIG's 'no impairment' determination was appropriate — hands the reader the raw inputs for classroom judgement, not a verified answer."},{"id":"cr-s14-f1","session":14,"front":"Provision (IAS37, par 10)","back":"A liability of uncertain timing or amount, recognised when: (a) present obligation from a past event; (b) probable outflow of resources; (c) reliable estimate possible — ALL THREE required."},{"id":"cr-s14-f2","session":14,"front":"Obligating event","back":"A past event creating a legal obligation (contract, legislation, operation of law) OR a constructive obligation (entity's own conduct creates a valid expectation), leaving no realistic alternative to settling it."},{"id":"cr-s14-f3","session":14,"front":"Uncertainty spectrum","back":"Accrued liabilities (least uncertain) -> provisions (uncertain timing/amount, still probable/estimable) -> contingent liabilities (most uncertain: not probable, or not reliably estimable, or outside entity control)."},{"id":"cr-s14-f4","session":14,"front":"Balance sheet treatment by category","back":"Accrued liabilities & provisions -> on balance sheet (provisions shown separately). Contingent liabilities with probable-but-unreliable estimate -> notes only. Remote contingent liabilities -> nothing recognised or disclosed."},{"id":"cr-s14-f5","session":14,"front":"Recognition decision tree","back":"Present/possible obligation? -> No -> nothing. Yes -> probable outflow? -> No & remote -> nothing; No & not remote -> disclose. Yes -> reliable estimate? -> No -> disclose; Yes -> RECOGNISE a provision (and disclose)."},{"id":"cr-s14-f6","session":14,"front":"Measurement by population type","back":"One-off events (lawsuit, restructuring) -> most likely amount. Large-population events (warranties) -> probability-weighted expected value."},{"id":"cr-s14-f7","session":14,"front":"Expected value formula","back":"Sum of (Probability of each outcome x Cost of that outcome), probabilities summing to 100%."},{"id":"cr-s14-f8","session":14,"front":"Present value / unwinding of discount","back":"When material, provisions are measured at PV of expected settlement expenditure; the provision grows each period toward the undiscounted amount, with the increase recognised as a finance cost in P&L."},{"id":"cr-s14-f9","session":14,"front":"Netting rule","back":"Expected gains from an anticipated asset disposal must NEVER be netted against a related provision, however closely linked."},{"id":"cr-s14-f10","session":14,"front":"Future operating losses vs onerous contracts","back":"Future operating losses -> NEVER a provision (triggers an IAS36 impairment test on related assets instead). Onerous contracts -> ALWAYS recognised and measured as a provision."},{"id":"cr-s14-f11","session":14,"front":"Restructuring provision recognition conditions (both required)","back":"1) A detailed formal plan (business/part concerned, locations, employees affected, expenditures, timing). 2) A valid expectation raised in those affected (implementation started, or main features announced)."},{"id":"cr-s14-f12","session":14,"front":"Restructuring provision scope","back":"Only direct expenditures necessarily entailed by the restructuring and unrelated to ongoing activities — excludes ordinary retraining, marketing, and new distribution network investment."},{"id":"cr-s14-f13","session":14,"front":"Contingent asset (IAS37)","back":"A possible asset from past events, confirmed only by uncertain future events outside the entity's control; never recognised on the balance sheet."},{"id":"cr-s14-f14","session":14,"front":"Contingent asset disclosure by probability","back":"Not probable -> nothing. Probable but not virtually certain -> disclose only. Virtually certain -> no longer contingent, recognise as an ordinary asset."},{"id":"cr-s16-f1","session":16,"front":"Define a lease under IFRS16.","back":"A contract that gives the lessee the right to control the use of an identified asset for a period of time, typically in exchange for periodic rent payments."},{"id":"cr-s16-f2","session":16,"front":"What two conditions together define the right to control an asset?","back":"The lessee must obtain substantially all the economic benefits from using the asset, and have the right to direct how and for what purpose the asset is used. Both are required."},{"id":"cr-s16-f3","session":16,"front":"Name the three commercial reasons firms lease.","back":"100% financing at fixed rates (no down payment, fixed schedule), protection against obsolescence (can return the asset), and flexibility (looser covenants than other debt)."},{"id":"cr-s16-f4","session":16,"front":"IAS17's dual model, what were the two tests for a finance lease?","back":"Are the risks and rewards of ownership transferred to the lessee, and is the lease economically similar to purchasing the asset. A yes to either meant finance lease treatment."},{"id":"cr-s16-f5","session":16,"front":"IFRS16's single model in one line.","back":"There is no lease classification test for lessees, a lessee recognises a right of use asset and a lease liability for essentially every lease."},{"id":"cr-s16-f6","session":16,"front":"Did IFRS16 change lessor accounting substantially?","back":"No. Lessor accounting is largely unchanged, IFRS16 mainly adds disclosure about how lessors manage residual value risk."},{"id":"cr-s16-f7","session":16,"front":"What rough rule of thumb did investors use pre-IFRS16 to informally capitalise operating leases?","back":"Lease liability is roughly 8 times annual lease expense, and interest expense is roughly one third of lease expense."},{"id":"cr-s16-f8","session":16,"front":"What did Altamuro et al. (2014) find about bank loan spreads?","back":"Loan spreads were better explained by financial ratios adjusted for operating lease capitalisation than by unadjusted ratios."},{"id":"cr-s16-f9","session":16,"front":"What are the three stated goals of the IFRS16 reform?","back":"Facilitate faithful representation, enhance comparability, and mitigate opportunities for accounting manipulation."},{"id":"cr-s16-f10","session":16,"front":"What does the recognition versus disclosure literature consistently find?","back":"Investors treat recognised amounts as more value relevant than merely disclosed amounts, across settings like stock options, post retirement benefits, derivatives and investment property fair value."},{"id":"cr-s16-f11","session":16,"front":"What did Ma and Thomas (2023) find firms did after IFRS16/Topic 842?","back":"Decreased long term operating leases, increased short term operating leases, and increased capital expenditure instead of leasing."},{"id":"cr-s16-f12","session":16,"front":"Why would a firm shift toward variable, non-index lease payments after IFRS16?","back":"Because the lease liability is built from fixed and index or rate linked payments, so purely variable non-index payments can be kept out of the measured liability."},{"id":"cr-s16-f13","session":16,"front":"What real economic costs did Chen et al. (2023) associate with lease capitalisation rules?","back":"Decreases in firm level investment, profitability and employment, concentrated in lease intensive and financially distressed firms."},{"id":"cr-s16-f14","session":16,"front":"How did firms respond the first time finance leases were required on balance sheet (SFAS13)?","back":"They substituted finance leases with operating leases and other non-lease financing, restructuring to stay off balance sheet, per Imhoff and Thomas (1988)."},{"id":"cr-s16-f15","session":16,"front":"Exam trap, does IFRS16 remove the finance versus operating distinction for lessors too?","back":"No. That distinction was removed for lessees only. Lessors still classify every lease as finance or operating under the same dual model logic as before."},{"id":"cr-s17-f1","session":17,"front":"What are the two, and only two, IFRS16 recognition exemptions for lessees?","back":"Short term leases (term of 12 months or less) and low value leases (example threshold given as around 5000 euros). Both are simply expensed straight line, no balance sheet recognition."},{"id":"cr-s17-f2","session":17,"front":"Why does the lease term include reasonably certain renewal options?","back":"IFRS16's anti-avoidance rule looks through to what the lessee actually expects to do, closing the loophole of negotiating artificially short terms to dodge capitalisation."},{"id":"cr-s17-f3","session":17,"front":"List the four components of the ROU asset's initial cost.","back":"The initial lease liability amount, lease payments made at or before commencement, initial direct costs, and estimated dismantling or restoration costs."},{"id":"cr-s17-f4","session":17,"front":"List the components of the lease liability's initial measurement.","back":"Fixed payments, index or rate linked variable payments, expected residual value guarantee payments, purchase option price if reasonably certain to exercise, and termination penalties if applicable."},{"id":"cr-s17-f5","session":17,"front":"How is the ROU asset depreciated and tested subsequently?","back":"Depreciated under IAS16 rules, typically straight line over the shorter of useful life and lease term, and subject to IAS36 impairment testing."},{"id":"cr-s17-f6","session":17,"front":"What interest method applies to the lease liability after initial recognition?","back":"A constant periodic rate of interest on the remaining balance, the same effective interest method already used for financial liabilities, using the original discount rate throughout."},{"id":"cr-s17-f7","session":17,"front":"Can depreciation and interest on a lease be combined on the income statement?","back":"No, IFRS16 requires them to stay separately identifiable line items."},{"id":"cr-s17-f8","session":17,"front":"How is the principal portion of a lease payment classified in the cash flow statement, and the interest portion?","back":"Principal is always financing activities. Interest follows the entity's general accounting policy for interest presentation, operating or financing."},{"id":"cr-s17-f9","session":17,"front":"Operating lease, lessor side, what happens to the asset and income?","back":"The lessor keeps the asset on its own balance sheet and recognises lease income on a straight line basis."},{"id":"cr-s17-f10","session":17,"front":"Finance lease, lessor side, what does the lessor recognise?","back":"It derecognises the underlying asset and recognises a lease receivable (net investment in the lease), then earns interest income and reduces the receivable as payments are collected."},{"id":"cr-s17-f11","session":17,"front":"Why does EBITDA typically rise after lease capitalisation?","back":"Rent expense, previously above the EBITDA line, is replaced by depreciation and interest, both of which sit below EBITDA, a presentation effect not a change in economics."},{"id":"cr-s17-f12","session":17,"front":"Why is total lease expense typically front loaded under IFRS16?","back":"Interest is calculated on a larger outstanding liability balance in early years, so total depreciation plus interest exceeds straight line rent early on, then the pattern reverses."},{"id":"cr-s17-f13","session":17,"front":"General direction of ratio effects from lease capitalisation (unverified per the fiche, but as taught).","back":"Leverage typically rises, asset turnover typically falls, current ratio typically falls, interest coverage typically falls, since new debt and interest appear that were not there before."},{"id":"cr-s18-f1","session":18,"front":"What did Sir David Tweedie's remark about flying in an aircraft on the balance sheet highlight?","back":"How thoroughly IAS17's off balance sheet operating leases let airlines hide enormous financing commitments from the face of the balance sheet."},{"id":"cr-s18-f2","session":18,"front":"Name the two criticisms of IAS17's dual model raised by the case.","back":"It hurt comparability across time and firms, and it created opportunities for manipulative structuring of leases to land on the operating (off balance sheet) side of the classification line."},{"id":"cr-s18-f3","session":18,"front":"How did airlines rank in the PwC study of IFRS16 industry impact?","back":"Second most affected of eight industries studied, with a 47% median debt increase and 33% median EBITDA increase, behind only retailers."},{"id":"cr-s18-f4","session":18,"front":"Cathay Pacific 2019, balance sheet effect in one line.","back":"PP&E/ROU assets rose about HKD 19,937 million, lease liabilities rose about HKD 19,967 million (split between current and non-current portions)."},{"id":"cr-s18-f5","session":18,"front":"Cathay Pacific 2019, net profit effect and why.","back":"Profit worsened by about HKD 86 million, because depreciation plus finance charges (4,593) exceeded the eliminated rental expense (4,507)."},{"id":"cr-s18-f6","session":18,"front":"Cathay Pacific 2019, cash flow effect.","back":"Total net cash flow was unchanged, operating cash flow rose (rent left operating activities), financing cash outflows rose (principal repayments), classification shifted but the total did not."},{"id":"cr-s18-f7","session":18,"front":"Cathay Pacific 2019, gearing, EBITDA and EPS changes.","back":"Gearing rose about 36.5% (0.96 to 1.31), EBITDA rose about 31.1%, EPS fell about 1.6% (43.7 cents to 43.0 cents)."},{"id":"cr-s18-f8","session":18,"front":"Define residual value risk.","back":"The possibility that an asset's actual residual value at the end of the lease term falls below the value originally estimated at lease inception."},{"id":"cr-s18-f9","session":18,"front":"Who bore residual value risk under IAS17's true operating leases, and how does IFRS16 change this practically?","back":"Under IAS17, the lessor bore it entirely. Under IFRS16, the lessee's balance sheet now carries an ROU asset subject to impairment testing, so residual value volatility can hit the lessee too, even without any contractual change."},{"id":"cr-s18-f10","session":18,"front":"Name three possible lessee responses to IFRS16 discussed in the case.","back":"Renegotiate or restructure existing and new leases, shift toward variable non-index-linked payments, and reassess whether leasing remains the right way to access assets at all."},{"id":"cr-s18-f11","session":18,"front":"Exam trap, does IFRS16 adoption always reduce reported profit?","back":"No, the direction depends on the specific mix of new versus maturing leases in a given year, and the front loading effect can reverse in later years of a lease's life."},{"id":"cr-s19-f1","session":19,"front":"Formula, total tax expense.","back":"Tax expense = current tax + deferred tax, both governed by IAS12."},{"id":"cr-s19-f2","session":19,"front":"Define permanent differences and give two examples.","back":"Items that enter accounting profit but never taxable profit, or vice versa, and never reverse. Examples, tax exempt bond interest, fines and penalties, dividends from consolidated subsidiaries."},{"id":"cr-s19-f3","session":19,"front":"Define temporary differences.","back":"Differences between accounting and taxable profit arising because an item is recognised in a different period for accounting versus tax purposes, they reverse over time and generate deferred tax."},{"id":"cr-s19-f4","session":19,"front":"When does a deferred tax asset arise?","back":"When taxable profit is currently higher than accounting profit (paying more tax now), so less tax will be paid in the future when the difference reverses."},{"id":"cr-s19-f5","session":19,"front":"When does a deferred tax liability arise?","back":"When taxable profit is currently lower than accounting profit (paying less tax now), so more tax will be paid in the future when the difference reverses."},{"id":"cr-s19-f6","session":19,"front":"Balance sheet approach formula for a temporary difference.","back":"Temporary difference = carrying amount minus tax base. Then deferred tax asset or liability = temporary difference times the statutory tax rate."},{"id":"cr-s19-f7","session":19,"front":"Balance sheet approach, asset with carrying amount greater than tax base, what results?","back":"A taxable temporary difference, giving a deferred tax liability."},{"id":"cr-s19-f8","session":19,"front":"Balance sheet approach, liability with carrying amount less than tax base, what results?","back":"A deductible temporary difference, giving a deferred tax asset."},{"id":"cr-s19-f9","session":19,"front":"Name five common sources of temporary differences.","back":"Depreciation rate differences, bad debt expense timing, warranty expense timing, pension expense timing (actuarial vs actual), and investment income (unrealised vs realised gains)."},{"id":"cr-s19-f10","session":19,"front":"What is the tax base of an asset or liability?","back":"The amount attributed to that asset or liability for tax purposes, which can differ from its accounting carrying amount."},{"id":"cr-s19-f11","session":19,"front":"Must deferred tax balances be discounted to present value?","back":"No, IAS12 requires them to be reported undiscounted regardless of when reversal is expected."},{"id":"cr-s19-f12","session":19,"front":"Where is the deferred tax balance presented on the balance sheet?","back":"Always as a non-current asset or liability, regardless of the actual expected timing of reversal."},{"id":"cr-s20-f1","session":20,"front":"Define a valuation allowance.","back":"A contra account against deferred tax assets, reviewed each period and reduced if it is no longer probable that sufficient future taxable profit will be available to use the asset."},{"id":"cr-s20-f2","session":20,"front":"How does a valuation allowance affect profit or loss?","back":"It flows through as a loss when established or increased, and as a gain if it is later reversed as the profitability outlook improves."},{"id":"cr-s20-f3","session":20,"front":"Over the full life of a temporary difference, what happens to total tax paid under accelerated versus straight line depreciation?","back":"It converges to the same total amount, only the timing of when it is paid differs, confirmed by the deferred tax balance unwinding to exactly zero by the end of the asset's tax life."},{"id":"cr-s20-f4","session":20,"front":"In which countries are deferred taxes comparatively more material, and why?","back":"In countries like the UK where accounting rules are independent of tax rules, producing many temporary differences. In Germany and France, where the two are closely aligned, deferred taxes matter less."},{"id":"cr-s20-f5","session":20,"front":"Why can a growing firm's depreciation related deferred tax liability persist indefinitely rather than reverse?","back":"Rising capital expenditure can generate new temporary differences faster than old ones reverse, effectively rolling the liability forward, described as similar to an interest free government loan."},{"id":"cr-s20-f6","session":20,"front":"What did Hanlon (2005) find about large positive book-tax differences?","back":"Investors treat them as a red flag, reducing their expectation of future earnings persistence, and larger gaps associate with less persistent earnings generally."},{"id":"cr-s20-f7","session":20,"front":"What did Hanlon et al. (2008) find about forcing book-tax conformity higher?","back":"It reduced the informativeness of reported accounting earnings, showing the book-tax gap is not purely a sign of manipulation, sometimes it reflects informative independent judgement."},{"id":"cr-s20-f8","session":20,"front":"Can a valuation allowance apply to a deferred tax liability?","back":"No. Valuation allowances apply only to deferred tax assets, there is no equivalent discretionary write-down mechanism for liabilities."},{"id":"cr-s20-f9","session":20,"front":"What three factors should an analyst weigh when judging whether a deferred tax balance will actually reverse?","back":"Future tax rates, laws and standards that could change; the firm's growth rate (capex driven DTLs may keep rolling forward); and whether the temporary difference is recurring or a one-off."},{"id":"cr-s21-f1","session":21,"front":"Define a sale and leaseback transaction.","back":"The seller-lessee sells an asset to the buyer-lessor and immediately leases that same asset back from them."},{"id":"cr-s21-f2","session":21,"front":"What determines the accounting treatment of a sale and leaseback?","back":"Whether the transfer of the asset qualifies as a sale under IFRS15, i.e. whether control has actually transferred to the buyer-lessor."},{"id":"cr-s21-f3","session":21,"front":"If the transfer is not a sale, how do both parties treat the cash exchanged?","back":"As a loan, a financial liability under IFRS9 for the seller-lessee and a financial asset under IFRS9 for the buyer-lessor."},{"id":"cr-s21-f4","session":21,"front":"If the transfer is a sale, how is the seller-lessee's ROU asset measured?","back":"At the proportion of the asset's previous carrying amount relating to the rights of use retained, not at fair value."},{"id":"cr-s21-f5","session":21,"front":"If the transfer is a sale, how much gain does the seller-lessee recognise?","back":"Only the portion of the total potential gain relating to the rights actually transferred to the buyer-lessor, proportional to rights given up."},{"id":"cr-s21-f6","session":21,"front":"Formula, tax rate change adjustment.","back":"Beginning balance of accumulated timing differences times (former tax rate minus new tax rate), applied once as an immediate catch up."},{"id":"cr-s21-f7","session":21,"front":"Direction rule, DTA and DTL when the tax rate rises.","back":"Both increase when the rate rises (DTA more valuable, DTL more costly), and both decrease when the rate falls, they always move in the same direction as the rate."},{"id":"cr-s21-f8","session":21,"front":"Is a tax rate change adjustment spread over future periods?","back":"No, it is recognised immediately as a one time catch up on the existing balance, in the period the rate change is enacted."},{"id":"cr-s21-f9","session":21,"front":"Self-check for any tax rate change calculation.","back":"The new DTA/DTL balance after the adjustment must equal the cumulative timing difference revalued at the new rate."},{"id":"cr-s22-f1","session":22,"front":"State IFRS15's core principle.","back":"Recognise revenue when (not necessarily when cash is paid) promised goods or services transfer to the customer, in the amount of the transaction price."},{"id":"cr-s22-f2","session":22,"front":"List the five conditions for a contract to exist under IFRS15.","back":"Parties committed to the contract, each party's rights identifiable, payment terms identifiable, commercial substance, and it is probable the entity will collect the consideration."},{"id":"cr-s22-f3","session":22,"front":"Define a distinct good or service.","back":"One the customer can benefit from on its own, and whose promise of transfer is separately identifiable within the contract. Both conditions are required."},{"id":"cr-s22-f4","session":22,"front":"Name the two methods for estimating variable consideration and when each applies.","back":"Expected value method (probability weighted sum) for a range of outcomes, most likely amount method for an essentially binary (all or nothing) outcome."},{"id":"cr-s22-f5","session":22,"front":"List IFRS15's five steps.","back":"1. Identify the contract, 2. Identify performance obligations, 3. Determine the transaction price, 4. Allocate the transaction price, 5. Recognise revenue as obligations are satisfied."},{"id":"cr-s22-f6","session":22,"front":"How is the transaction price allocated across performance obligations?","back":"Proportionally, based on each obligation's stand-alone selling price, with exceptions when observable evidence points a bundle discount at only some obligations."},{"id":"cr-s22-f7","session":22,"front":"Name the two methods for measuring progress on an over time performance obligation.","back":"Output methods (direct measurement of transferred goods/services, e.g. units delivered) and input methods (entity's inputs to date relative to total required, e.g. costs incurred)."},{"id":"cr-s22-f8","session":22,"front":"When are contract costs capitalised as a contract asset?","back":"When they relate directly to the specific contract, generate resources expected to be used to satisfy obligations, and are expected to be recovered."},{"id":"cr-s22-f9","session":22,"front":"Distinguish a contract asset from a receivable.","back":"A contract asset's right to consideration is still conditional on something beyond the passage of time (more performance needed). A receivable is unconditional except for time."},{"id":"cr-s22-f10","session":22,"front":"Define a contract liability.","back":"Recognised when the customer has paid before the entity has transferred the related goods or services."},{"id":"cr-s22-f11","session":22,"front":"Why did IFRS15 replace IAS11 and IAS18?","back":"To create a single principles based revenue standard consistent across industries and with US GAAP, fixing US GAAP's overly detailed inconsistent rules and IAS11/18's vagueness, and to better handle evolving bundled business models."},{"id":"cr-s22-f12","session":22,"front":"What items are explicitly excluded from revenue?","back":"Borrowings, amounts contributed by shareholders (e.g. equity issues), and gains such as gains on disposal of non-current assets."},{"id":"cr-s23-f1","session":23,"front":"Why do customer loyalty award miles get their own performance obligation?","back":"Because they grant the customer a material right they would not receive without entering the contract, so part of the transaction price must be allocated to them and deferred until redemption or expiry."},{"id":"cr-s23-f2","session":23,"front":"Right of return, formula for the transaction price.","back":"Expected consideration for the units expected to be kept (not returned), using the most likely amount method when returns are estimable from historical experience."},{"id":"cr-s23-f3","session":23,"front":"Right of return, name the two items recognised alongside reduced revenue.","back":"A refund liability (for expected returns at selling price) and a right to recover returned goods asset (at cost), recognised together, not replacing each other."},{"id":"cr-s23-f4","session":23,"front":"Why is a non-refundable joining fee not its own performance obligation?","back":"Because the act of registering the customer is not itself a good or service the customer benefits from on its own, so the fee is deferred as an advance payment for future services instead."},{"id":"cr-s23-f5","session":23,"front":"Over what period is a non-refundable joining fee typically recognised, if renewal carries no further fee?","back":"Over the expected period of the overall customer relationship, not just the first stated contract term."},{"id":"cr-s23-f6","session":23,"front":"Percentage of completion example, why use one third complete rather than the cost-to-cost ratio?","back":"Because the facts state progress was directly assessed as one third complete (an output measure), and the entity may use whichever method (output or input) faithfully depicts actual progress."},{"id":"cr-s23-f7","session":23,"front":"Can an over time contract show a reported loss even though it will ultimately be profitable?","back":"Yes, if progress is measured by an output method that does not track cost incurrence one for one, costs expensed as incurred can exceed revenue recognised in a given period."},{"id":"cr-s24-f1","session":24,"front":"Define the full retrospective transition method.","back":"The company fully restates prior comparative period financial statements as if the new standard had always applied, so every period presented is on a like for like basis."},{"id":"cr-s24-f2","session":24,"front":"Define the modified retrospective transition method.","back":"No restatement of prior periods, instead a single one-time cumulative effect adjustment hits the opening balance of retained earnings in the adoption year, plus required disclosure of what results would have been under the old rules."},{"id":"cr-s24-f3","session":24,"front":"General Dynamics 2017, method and driver of its negative 684 million dollar adjustment.","back":"Full retrospective method. Driver, business jet contracts moved from two milestone revenue recognition to single point in time recognition at delivery, deferring previously recognised profit."},{"id":"cr-s24-f4","session":24,"front":"Ford 2017, method and driver of its positive 36 million dollar adjustment.","back":"Modified retrospective method. Driver, certain previously deferred vehicle sales (guaranteed resale value, Ford owned entity deliveries) moved to recognition at shipment, accelerating previously deferred revenue."},{"id":"cr-s24-f5","session":24,"front":"Does the sign of a cumulative effect adjustment indicate good or bad news about the company?","back":"No, it simply reflects whether the new standard defers revenue that was recognised earlier under the old rules (negative) or accelerates revenue that was deferred (positive), not earnings quality."},{"id":"cr-s24-f6","session":24,"front":"Why must an analyst take care comparing companies that used different transition methods?","back":"One restated its historical financials (full retrospective), the other did not (modified retrospective), so a shared year label like 2016 can mean two different accounting bases across the two companies."},{"id":"cr-s24-f7","session":24,"front":"What share of General Dynamics 2017 revenue was recognised over time versus at a point in time?","back":"71% over time (mostly defense contracts, cost to cost progress method), 29% at a point in time (mostly business jet aircraft, delivery and acceptance)."},{"id":"cr-s25-f1","session":25,"front":"What does IFRS2 apply to, and what is explicitly excluded?","back":"Applies to share based payments for goods or services received. Excludes dividends and a general issue of shares for cash (e.g. a rights issue)."},{"id":"cr-s25-f2","session":25,"front":"Key difference between equity-settled and cash-settled accounting.","back":"Cash-settled liabilities are remeasured to fair value at every reporting date until settlement. Equity-settled cost is fixed once, at grant date, and never remeasured for later share price movements."},{"id":"cr-s25-f3","session":25,"front":"Measurement hierarchy for share based payments to non-employees.","back":"Measured at the fair value of the goods or services received (at date of receipt) unless that cannot be measured reliably, in which case use the fair value of the equity instruments granted (at grant date)."},{"id":"cr-s25-f4","session":25,"front":"Define the three key dates in a stock option scheme.","back":"Grant date (option awarded), vesting/service date (end of the service period), maturity date (end of the period during which a vested option can still be exercised)."},{"id":"cr-s25-f5","session":25,"front":"Distinguish a market condition from a non-market performance condition.","back":"Market condition, defined by reference to the price or value of the entity's own equity instruments. Non-market condition, defined by reference to the entity's own operational performance."},{"id":"cr-s25-f6","session":25,"front":"Recognition timing, no vesting condition vs a vesting condition.","back":"No vesting condition, full expense recognised immediately at grant date. Vesting condition present, expense spread over the vesting period."},{"id":"cr-s25-f7","session":25,"front":"At what date is the cost of an equity-settled award measured, and is it ever revisited?","back":"At grant date fair value, fixed once, never revisited for later market condition changes like share price movements."},{"id":"cr-s25-f8","session":25,"front":"What happens to cumulative expense on failure of a service or non-market performance condition (forfeiture)?","back":"It is revised to the best estimate of instruments actually expected to vest, backing out the forfeited award's share of the expense."},{"id":"cr-s25-f9","session":25,"front":"What happens to cumulative expense on failure of a market condition?","back":"Nothing, no accounting adjustment at all, the expense continues exactly as originally planned since the probability was already built into grant date fair value."},{"id":"cr-s25-f10","session":25,"front":"What happens when a vested option expires unexercised?","back":"A pure equity reclassification (from stock options equity to expired stock options equity), zero effect on P&L, assets, liabilities or total equity."},{"id":"cr-s25-f11","session":25,"front":"In the exercise date journal entry, which figure is always the balancing plug?","back":"Share premium. Cash received and nominal-value share capital are both directly computable from the facts."},{"id":"cr-s26-f1","session":26,"front":"eBay 2000, as reported profit versus pro forma fair value result.","back":"As reported (APB25) net income of about 48.3 million dollars, versus a pro forma (SFAS123 fair value) net loss of about 90.7 million dollars, same company, same year."},{"id":"cr-s26-f2","session":26,"front":"Define APB25's intrinsic value method.","back":"Compensation expense = fair value of stock minus exercise price, both measured at grant date, zero for an at-the-money grant."},{"id":"cr-s26-f3","session":26,"front":"Define SFAS123's fair value method.","back":"Compensation cost measured using an option pricing model (Black-Scholes), capturing the option's full fair value including time value and expected volatility, used by eBay only for pro forma disclosure, not recognition."},{"id":"cr-s26-f4","session":26,"front":"Why did most of eBay's options generate zero APB25 expense?","back":"Because they were granted at the money (exercise price equal to grant date stock price), making the intrinsic value spread exactly zero."},{"id":"cr-s26-f5","session":26,"front":"What does IFRS2 require that neither APB25 nor SFAS123's disclosure-only regime required?","back":"Mandatory recognition of the full grant date fair value in the primary financial statements, not merely pro forma footnote disclosure."},{"id":"cr-s26-f6","session":26,"front":"eBay 2000 grants, exercise price versus grant date fair value, and why the gap.","back":"Weighted average exercise price 62.69, weighted average grant date fair value 103.79. The gap is time value, driven mainly by a 115% expected volatility assumption and multi year expected life."},{"id":"cr-s26-f7","session":26,"front":"How does the eBay case connect to the Session 16 recognition versus disclosure literature?","back":"It is a concrete illustration that investors treat recognised values as more relevant than merely disclosed pro forma values, the same pattern found generally for stock option expense (Aboody 1996)."},{"id":"cr-s26-f8","session":26,"front":"Does the pro forma loss mean eBay's underlying business was failing in 2000?","back":"No, eBay was profitable and cash generative, the pro forma loss reflects an accounting reclassification of stock compensation cost, not the underlying business economics."},{"id":"cr-s27-f1","session":27,"front":"List IAS19's four categories of employee benefits.","back":"Short-term benefits, post-employment benefits, other long-term benefits, and termination benefits."},{"id":"cr-s27-f2","session":27,"front":"Defined contribution versus defined benefit, who bears the risk?","back":"Defined contribution, risk (actuarial and investment) sits with the employee. Defined benefit, risk sits with the entity."},{"id":"cr-s27-f3","session":27,"front":"What actuarial method estimates the defined benefit obligation?","back":"The projected unit credit method, incorporating demographic assumptions (turnover, mortality) and financial assumptions (salary growth, inflation), discounted to present value."},{"id":"cr-s27-f4","session":27,"front":"How is the IAS19 discount rate determined?","back":"By reference to market yields at the reporting date on high quality corporate bonds (or, absent a deep market, government bonds), matching the obligation's currency and estimated term."},{"id":"cr-s27-f5","session":27,"front":"List the five components of defined benefit accounting and where each is recognised.","back":"Service cost (P&L), net interest (P&L), remeasurements (OCI, never recycled), employer contributions (balance sheet only), benefits paid (balance sheet only)."},{"id":"cr-s27-f6","session":27,"front":"How is interest income on plan assets computed?","back":"The same discount rate used for the obligation, applied to the plan assets' opening fair value. Any gap between this and the actual return is a remeasurement in OCI."},{"id":"cr-s27-f7","session":27,"front":"Are defined benefit remeasurements ever recycled from OCI to P&L?","back":"No, they are permanently excluded from profit or loss once recognised in OCI."},{"id":"cr-s27-f8","session":27,"front":"How does other long-term benefits' OCI treatment differ from post-employment defined benefit?","back":"All remeasurement changes for other long-term benefits go through P&L, there is no OCI split at all, unlike the defined benefit P&L/OCI split."},{"id":"cr-s27-f9","session":27,"front":"When is past service cost recognised?","back":"Immediately in P&L, at the earlier of the date of the plan amendment/curtailment or when related restructuring costs are recognised, not spread over future service."},{"id":"cr-s27-f10","session":27,"front":"Are employer contributions and benefits paid P&L items?","back":"No, both are pure balance sheet movements. Contributions increase plan assets, benefits paid reduce both the obligation and plan assets, neither is an income statement expense."},{"id":"cr-s28-f1","session":28,"front":"Name the five standards governing investments in other entities and what each covers.","back":"IFRS10 (consolidation requirements), IAS27 (parent's separate financial statements), IAS28 (equity method for associates/JVs), IFRS11 (joint arrangements), IFRS12 (disclosure)."},{"id":"cr-s28-f2","session":28,"front":"How are investments in associates treated in consolidated and separate financial statements?","back":"The equity method (IAS28), in both consolidated and the parent's own separate financial statements."},{"id":"cr-s28-f3","session":28,"front":"State IFRS10's three-part test for control.","back":"1. Power over the investee, 2. Exposure or rights to variable returns from involvement with it, 3. The ability to use that power to affect those returns. All three are required."},{"id":"cr-s28-f4","session":28,"front":"Define protective rights and their effect on control.","back":"Rights designed only to protect the holder's own interest without conferring the ability to direct relevant activities, they never give power however extensive they appear."},{"id":"cr-s28-f5","session":28,"front":"What makes a right substantive?","back":"The holder has the practical ability to exercise it, with no barriers to doing so, non-substantive rights cannot confer power."},{"id":"cr-s28-f6","session":28,"front":"Formula, fair value of net assets acquired.","back":"Book equity of the acquiree at acquisition plus step-ups (net of deferred tax) minus step-downs (net of deferred tax)."},{"id":"cr-s28-f7","session":28,"front":"A step-up produces what deferred tax item, and why?","back":"A deferred tax liability, because the asset is now carried above its tax base, a taxable temporary difference exactly like the Session 19 rule."},{"id":"cr-s28-f8","session":28,"front":"Compare NCI measurement and resulting goodwill, partial versus full goodwill method.","back":"Partial method, NCI at proportionate share of net assets, smaller total goodwill. Full method, NCI at its own fair value, larger total goodwill (includes NCI's implied share of goodwill)."},{"id":"cr-s28-f9","session":28,"front":"How is negative goodwill (a bargain purchase) treated?","back":"Recognised immediately as income, increasing group reserves at the acquisition date, the opposite of ordinary goodwill's asset treatment."},{"id":"cr-s28-f10","session":28,"front":"Does control require a majority of voting shares?","back":"No, power can exist without a voting majority via substantive contractual rights, and a bare voting majority can also fail to give power if the related rights are not substantive."},{"id":"cr-s29-f1","session":29,"front":"How are intra-group balances (loans, receivables, payables) treated on consolidation?","back":"Cancelled out entirely, since a group cannot owe money to or earn interest from itself."},{"id":"cr-s29-f2","session":29,"front":"Downstream versus upstream unrealised profit elimination.","back":"Downstream (parent to subsidiary), entirely against group retained earnings, none to NCI. Upstream (subsidiary to parent), split proportionately between group retained earnings and NCI."},{"id":"cr-s29-f3","session":29,"front":"What happens to a fair value step-up on a depreciable asset after acquisition?","back":"It must be depreciated or amortised over the asset's remaining useful life, with a matching partial reversal of the deferred tax liability originally recognised on it each period."},{"id":"cr-s29-f4","session":29,"front":"Inventory unrealised profit example, why does a deferred tax asset arise on elimination?","back":"Because the selling group company already paid tax on the profit, but the profit is not yet realised from the group's perspective (goods still unsold within the group), creating a deferred tax asset."},{"id":"cr-s29-f5","session":29,"front":"When is no further unrealised profit elimination needed on inventory?","back":"When the buying company's own write-down of the inventory already equals or exceeds the intra-group profit embedded in it."},{"id":"cr-s29-f6","session":29,"front":"Are genuine fair value losses on intra-group sales reversed in consolidation?","back":"No, only artificial losses created by internal pricing are reinstated, a loss reflecting a real fair value decline stands as is."},{"id":"cr-s29-f7","session":29,"front":"List the three adjustments needed to eliminate unrealised profit on an intra-group fixed asset sale.","back":"Eliminate the gain on disposal, reduce depreciation back to what it would have been on the seller's original cost basis, and restate the carrying amount to the group-level net book value."},{"id":"cr-s29-f8","session":29,"front":"Intra-group dividend elimination, what happens to group retained earnings and NCI equity?","back":"Group retained earnings falls by the full amount distributed (the parent's own dividend income is cancelled against it). NCI equity falls only by the portion actually paid out to minority shareholders."},{"id":"cr-s29-f9","session":29,"front":"State the golden rule of consolidation regarding ownership percentage.","back":"Every subsidiary's assets, liabilities, revenues, expenses and consolidation adjustments are consolidated at 100% first, regardless of actual ownership percentage, NCI's share is carved out only afterward."},{"id":"cr-s29-f10","session":29,"front":"Formula, NCI's share of net income.","back":"% NCI times (the subsidiary's net income plus or minus consolidation adjustments originating with that specific subsidiary, e.g. its own step-up depreciation or upstream unrealised profit)."},{"id":"cr-s30-f1","session":30,"front":"Define a business under IFRS3.","back":"An integrated set of activities and assets capable of being managed to provide goods/services, investment income, or other ordinary income, consisting of inputs, processes and the capability to produce outputs, even without outputs yet existing."},{"id":"cr-s30-f2","session":30,"front":"List the four steps of the IFRS3 acquisition method.","back":"1. Identify the acquirer, 2. Determine the acquisition date, 3. Recognise and measure identifiable net assets/NCI/consideration, 4. Recognise goodwill or a bargain purchase gain."},{"id":"cr-s30-f3","session":30,"front":"In a reverse acquisition, who is the accounting acquirer?","back":"Not necessarily the legal acquirer, IFRS3 looks through legal form to which party's shareholders and management actually end up controlling the combined entity."},{"id":"cr-s30-f4","session":30,"front":"How are acquisition-related costs (legal, consulting, valuation fees) treated?","back":"Expensed as incurred, never part of consideration transferred or goodwill, except debt/equity issuance costs which follow IFRS9's own rules instead."},{"id":"cr-s30-f5","session":30,"front":"Define the acquisition date.","back":"The date control actually passes to the acquirer, which drives when fair value measurements are taken, not necessarily the same as the legal transfer date."},{"id":"cr-s30-f6","session":30,"front":"Can previously unrecognised intangibles (like customer relationships) be recognised on acquisition?","back":"Yes, because acquisition accounting applies a fair value recognition threshold that differs from the acquiree's own historical recognition criteria (e.g. IAS38's ban on capitalising internally generated intangibles)."},{"id":"cr-s30-f7","session":30,"front":"Formula, goodwill under IFRS3.","back":"Consideration transferred plus NCI plus fair value of any previously held interest, minus the net fair value of identifiable assets acquired. Negative result = bargain purchase gain to P&L."},{"id":"cr-s30-f8","session":30,"front":"Step acquisition, what happens to the previously held interest when control is obtained?","back":"It is remeasured to fair value at the acquisition date, with the resulting gain or loss recognised in profit or loss, regardless of how the prior stake was previously classified."},{"id":"cr-s30-f9","session":30,"front":"How is a disposal of shares that does NOT cause loss of control treated?","back":"As a pure equity transaction, no P&L impact, the difference is reallocated directly between the parent's equity and NCI."},{"id":"cr-s30-f10","session":30,"front":"Can a contingent liability be recognised in a business combination even if it fails IAS37's normal threshold?","back":"Yes, IFRS3 recognises an acquiree's contingent liability at fair value if reliably measurable, a lower recognition bar than IAS37's standalone probable test."},{"id":"cr-s31-f1","session":31,"front":"What combination of facts establishes Lyradon's control over Velquanta despite only 65% ownership?","back":"65% equity stake giving variable returns, combined with a 4-of-6 board majority and simple majority voting, giving Lyradon the structurally guaranteed power to win ordinary board decisions."},{"id":"cr-s31-f2","session":31,"front":"Why are Alpine Ventures' veto rights classified as protective, not substantive?","back":"They are confined to capital structure and distribution decisions (dividends, buybacks, capital reduction, large financing) and preserving Alpine's own contractual rights, not extending into Velquanta's ordinary operating or strategic decisions."},{"id":"cr-s31-f3","session":31,"front":"What would make Alpine's rights substantive instead of protective?","back":"If they extended into ordinary-course operating or strategic decisions (like approving annual budgets or R&D programmes), or if the financing threshold were lowered enough to routinely capture ordinary financing activity."},{"id":"cr-s31-f4","session":31,"front":"What is Velquanta's acquisition date, and why?","back":"1 July 2024, the stated completion date, since the acquisition date is strictly when control actually transfers, not the earlier signing date (3 June 2024)."},{"id":"cr-s31-f5","session":31,"front":"Formula and result, fair value of net identifiable assets in this case (EUR'000).","back":"Book equity 13,000 plus net fair value adjustments 17,000 (PPE +3,000, developed tech +8,000, customer relationships +5,000, IPR&D +2,000, contingent liability -1,000) = 30,000."},{"id":"cr-s31-f6","session":31,"front":"Goodwill and NCI under the partial method in this case (EUR'000).","back":"Goodwill = 48,000 - 65%x30,000 = 28,500. NCI = 35%x30,000 = 10,500."},{"id":"cr-s31-f7","session":31,"front":"Is the 28,500 goodwill figure final?","back":"No, it is a cash-only floor. The contingent consideration (earn-out)'s fair value, once estimated, must still be added to consideration transferred and therefore to goodwill."},{"id":"cr-s31-f8","session":31,"front":"Why can Velquanta's developed technology and customer relationships be recognised now even though never capitalised by Velquanta itself?","back":"Business combination accounting uses a fair value recognition threshold that overrides the acquiree's own historical IAS38-based recognition restrictions on internally generated intangibles."},{"id":"cr-s31-f9","session":31,"front":"How are Lyradon's EUR 1.2 million transaction costs treated?","back":"Expensed in the period incurred, explicitly kept separate from and excluded from the consideration transferred and from goodwill."}],"fm":[{"id":"fm-s1-f1","session":"1","front":"What is the central lesson of the Toys \"R\" Us case?","back":"Profitability on paper is not sufficient if the company cannot generate and access enough cash to service debt and reinvest. Financial planning exists to catch this gap before it becomes a solvency crisis."},{"id":"fm-s1-f2","session":"1","front":"Define value creation per this session.","back":"The outcome of three simultaneous equilibria a firm must maintain: income statement equilibrium, balance sheet equilibrium, and cash flow statement equilibrium. A firm profitable on the IS but insolvent on the BS or cash-starved on the CF is not creating sustainable value."},{"id":"fm-s1-f3","session":"1","front":"Name the four reasons given for targeting value creation over market share or revenue growth.","back":"It is rational (reflects ability to grow long term), broadly accepted (aligns with stakeholder interests), sector- and lifecycle-agnostic (applies regardless of industry or life stage), and measurable (valuation techniques exist to quantify it)."},{"id":"fm-s1-f4","session":"1","front":"What is the World Uncertainty Index (WUI)?","back":"An index built from the frequency of the term \"uncertainty\" in EIU quarterly country reports, trending upward since 1990 with spikes at events like the Gulf War, 9/11, the 2008 credit crunch, Brexit, COVID-19, the war in Ukraine, and the 2023 banking turmoil."},{"id":"fm-s1-f5","session":"1","front":"List McKinsey's six practices to improve FP&A accuracy under uncertainty.","back":"Use explicit probability values for assumptions, build a momentum case, make the bear case explicit, ensure clarity and consistency in macro assumptions, disaggregate inflation rates, back-test regularly."},{"id":"fm-s1-f6","session":"1","front":"What is a bear case in FP&A, and why include one?","back":"An explicit, plausible downside scenario, included so the firm can adjust assumptions as warning signals emerge and avoid decision paralysis."},{"id":"fm-s1-f7","session":"1","front":"Compare the frequency of the cash budget, financial budget, and financial plan.","back":"Cash budget is monthly or weekly; financial budget is annual or quarterly; financial plan is annual."},{"id":"fm-s1-f8","session":"1","front":"Compare the horizon of the cash budget, financial budget, and financial plan.","back":"Cash budget is short term (6 months to 1 year); financial budget is medium term (1 year); financial plan is medium-long term (3, 5 or 7 years)."},{"id":"fm-s1-f9","session":"1","front":"What is the purpose of a cash budget versus a financial plan?","back":"Cash budget ensures solvency and manages cash (treasury and liquidity management); financial plan supports long-term vision and assesses funding needs (strategic and financial planning)."},{"id":"fm-s1-f10","session":"1","front":"Define a cash budget.","back":"A forecast of periodic cash balances (typically monthly or weekly) used to plan for funding needs or the deployment of a potential cash surplus."},{"id":"fm-s1-f11","session":"1","front":"State the cash budget identity and what each term means.","back":"Cash(EOP) = Cash(BOP) + (Sources of cash − Uses of cash) + Financial income (charges) on the cash balance. BOP and EOP are beginning/end of period cash balances; financial income or charges is interest earned or paid on the balance."},{"id":"fm-s1-f12","session":"1","front":"Name the three reasons cost/revenue differ from cash outflow/inflow.","back":"Timing mismatch between accrual and cash accounting, non-monetary events like depreciation, and events entirely outside the income statement like loan repayments."},{"id":"fm-s1-f13","session":"1","front":"List the four categories of sources and uses of cash.","back":"Operating activities, investing activities, financing activities, and other activities (interest, dividends, royalties, rental income)."},{"id":"fm-s1-f14","session":"1","front":"What is the largest typical source of cash for a firm?","back":"Payments from the firm's own customers (cash sales and collections of receivables), not financing activity."},{"id":"fm-s1-f15","session":"1","front":"In the Clank case, why is a large cash outflow (CRM platform capex) not matched by an equally large accounting cost?","back":"Because €150,000 of expansion capex is paid in cash on an uneven schedule (10% May, 50% September, 20% October, 20% November), but only €22,500 of annual depreciation hits the income statement, a large cash outflow with a much smaller accounting footprint."},{"id":"fm-s1-f16","session":"1","front":"How is Clank's monthly revenue actually collected, per the case?","back":"Revenue is recognized (invoiced) monthly, but only 70% is collected 90 days later and 30% after 120 days, a textbook timing mismatch between accrual and cash."},{"id":"fm-s1-f17","session":"1","front":"What creates the overdraft cost risk in the Clank case?","back":"If the cash balance goes negative, an overdraft facility (limit €90,000) charges 1% monthly interest, billed quarterly, with no interest earned on positive balances."},{"id":"fm-s1-f18","session":"1","front":"Name the three-step process for building a cash budget.","back":"Forecast the sources of cash, forecast the uses of cash, then calculate whether the firm faces a cash shortage or surplus and plan accordingly."},{"id":"fm-s2-f1","session":"2","front":"What is the central thesis of Kaiser & Young's HBR 2009 article?","back":"Most companies have a lot of capital needlessly tied up in receivables and inventory, and correcting six recurring, incentive-driven mistakes can free enough cash to matter for survival."},{"id":"fm-s2-f2","session":"2","front":"Name all six working-capital mistakes from the article.","back":"1) Managing to the income statement, 2) rewarding the sales force for growth alone, 3) overemphasizing quality in production, 4) tying receivables to payables, 5) applying current and quick ratios, 6) benchmarking competitors."},{"id":"fm-s2-f3","session":"2","front":"Why does a purchasing manager judged on reported profit alone have no incentive to decline a bulk discount that requires excess inventory?","back":"Inventory holding costs never appear on the income statement, so even if those costs exceed the price gain, accepting the discount doesn't hurt the manager's own compensation."},{"id":"fm-s2-f4","session":"2","front":"State the receivables trade-off break-even rule (Mistake 1).","back":"Accept a change in payment terms if the expected profit loss is smaller than the return you could earn on the capital freed up; reject it otherwise."},{"id":"fm-s2-f5","session":"2","front":"What incidental benefit came from increased customer contact under the new receivables policy (metals refining case)?","back":"It surfaced early warning signs of customers' financial distress, letting at-risk customers be shifted to pay-on-delivery terms before defaulting, cutting bad receivables from 12% to under 0.5%."},{"id":"fm-s2-f6","session":"2","front":"Why does sales compensation tied only to volume inflate both receivables and inventory?","back":"Salespeople are pushed to book sales at any cost: granting long payment delays, avoiding pressure on late payers, and demanding oversized finished-goods inventory to avoid stock-outs."},{"id":"fm-s2-f7","session":"2","front":"What did the European drive-systems producer's case reveal about quality bonuses?","back":"Bonuses for defect reduction produced a manufacturing cycle nearly three times longer than competitors' while customers lacked the sophistication to value the extra quality; cutting WIP inventory (not defending the price premium) freed €20 million."},{"id":"fm-s2-f8","session":"2","front":"Why are receivables and payables relationships independent (Mistake 4)?","back":"Relative bargaining power, competition, industry structure, and switching costs differ across the customer and supplier relationships, so tightening customer terms whenever a supplier tightens theirs is usually the wrong move."},{"id":"fm-s2-f9","session":"2","front":"Give the McDonald's example used to illustrate Mistake 4.","back":"McDonald's takes 30 to 45 days to pay its suppliers, but this does not mean it gives restaurant customers 45 days to pay for a meal, the two relationships operate under entirely different economics."},{"id":"fm-s2-f10","session":"2","front":"Define the current ratio and the quick ratio.","back":"Current ratio = short-term assets (cash + inventory + debtors) ÷ short-term liabilities (creditors + taxes + deferred dividends). Quick ratio = (short-term assets − inventory) ÷ short-term liabilities."},{"id":"fm-s2-f11","session":"2","front":"Why does optimizing the current or quick ratio tend to destroy value?","back":"A higher ratio is typically achieved by carrying higher receivables and inventory and lower payables, exactly the opposite of sound working-capital practice; the more closely a company chases the ratio, the more likely it is to face a liquidity crisis."},{"id":"fm-s2-f12","session":"2","front":"What is the French appliance manufacturer example used to illustrate Mistake 4's resolution?","back":"The firm applied identical terms to every counterparty despite being strong versus suppliers and weak versus giant retail customers (Wal-Mart, Carrefour, Metro); renegotiating terms per segment put €35 million back in the bank."},{"id":"fm-s2-f13","session":"2","front":"Why does benchmarking only within your own industry (Mistake 6) breed complacency?","back":"A company's numbers can look good relative to industry norms even when the whole industry is inefficient; the best companies benchmark radically, often outside their own industry."},{"id":"fm-s2-f14","session":"2","front":"What allowed the metals refining VP to push receivables from 185 to 45 days despite being told 185 days was \"industry norm\"?","back":"He realized the firm's product quality and reputation meant it did not need to follow the norm, convincing customers to accept one month of inventory cover backed by late-delivery penalties and early-payment discounts."},{"id":"fm-s2-f15","session":"2","front":"What is the unifying diagnostic question the fiche recommends asking on any working-capital case question?","back":"\"What is this person's bonus tied to?\", since nearly every mistake traces back to a performance metric that rewards an action that destroys enterprise value."},{"id":"fm-s2-f16","session":"2","front":"What does \"building a culture of value\" mean as opposed to managing by numbers alone?","back":"A culture where managers across functions engage in ongoing dialogue about value creation with each other, suppliers, and customers, while leadership stays alert to managers gaming metrics, illustrated by Toyota's participative production culture."},{"id":"fm-s2-f17","session":"2","front":"Why is it a mistake to treat a \"better than industry average\" current ratio as evidence of health?","back":"Dell shows a company can already be best-in-class within its industry (computer makers) and still leave huge cash on the table once benchmarked outside it (against retailers)."},{"id":"fm-s3-f1","session":"3","front":"Define the cash cycle in one sentence.","back":"The net delay between paying cash out for inputs and collecting cash in from customers, once the delay the firm itself gets from its own suppliers is netted out."},{"id":"fm-s3-f2","session":"3","front":"What three periods make up the operating cycle plus payable period, and how do they combine into the cash cycle?","back":"Inventory period + receivable period = operating cycle. Cash cycle = operating cycle − accounts payable period = DI + DSO − DPO."},{"id":"fm-s3-f3","session":"3","front":"Write the formulas for DSO, DPO, and DI.","back":"DSO = Accounts Receivable ÷ (Sales ÷ 365). DPO = Accounts Payable ÷ (COGS ÷ 365). DI = Inventory ÷ (COGS ÷ 365)."},{"id":"fm-s3-f4","session":"3","front":"Why is it a common calculation error to scale DI and DPO by daily sales?","back":"DI and DPO are both properly scaled by daily COGS, not sales, only DSO uses daily sales as its denominator."},{"id":"fm-s3-f5","session":"3","front":"Walk through computing the cash cycle with Sales $6,133m, COGS $5,464m, Inventory $879m, AR $764m, AP $682m.","back":"DSO = 764/(6133/365) = 45 days. DPO = 682/(5464/365) = 46 days. DI = 879/(5464/365) = 59 days. Cash Cycle = 59 + 45 − 46 = 58 days."},{"id":"fm-s3-f6","session":"3","front":"Why does Walmart have a cash cycle near zero while Boeing's is close to 179 days?","back":"Walmart is a fast-turnover retailer (low DI, low DSO); Boeing is a long-manufacturing-cycle industrial firm with very high days inventory (~196 days), illustrating how business model shapes the cash cycle."},{"id":"fm-s3-f7","session":"3","front":"What is the carrying-cost vs order-cost trade-off in inventory management?","back":"Carrying cost (storage plus opportunity cost of capital tied up) rises with order size; order cost (handling and delivery of placing/receiving an order) falls with order size. The optimal order size balances the two to minimize total cost."},{"id":"fm-s3-f8","session":"3","front":"What is the reorder point?","back":"The inventory management approach of waiting until stock reaches a minimum threshold, then replenishing with a predetermined order quantity."},{"id":"fm-s3-f9","session":"3","front":"Does optimal inventory scale proportionally with sales?","back":"No, as sales grow the optimal inventory level rises but less than proportionately, an economy of scale in inventory management."},{"id":"fm-s3-f10","session":"3","front":"What condition must hold for just-in-time (JIT) inventory to work?","back":"The flow of production must be steady and predictable, so that no significant safety buffer is needed."},{"id":"fm-s3-f11","session":"3","front":"List the four questions that structure receivables management.","back":"Terms of sale, credit analysis, the credit decision, and collection policy."},{"id":"fm-s3-f12","session":"3","front":"What is \"terms of sale\"?","back":"How long a firm gives customers to pay their bills, and whether it offers a cash discount for prompt payment. Not all sales involve credit: some are cash on delivery or cash before delivery."},{"id":"fm-s3-f13","session":"3","front":"What is credit analysis, and where should analytical effort concentrate?","back":"The process of determining which customers are likely to pay on time, using financial statements or specialist agencies (Dun & Bradstreet, Cerved, Moody's, S&P). Effort should concentrate on the largest clients, not be spread evenly."},{"id":"fm-s3-f14","session":"3","front":"State the expected-gain formula for the credit decision.","back":"E[gain | grant credit] = p × PV(Revenue − Cost) − (1−p) × PV(Cost), where p is the probability the customer pays and PV is present value; grant credit only if this exceeds $0."},{"id":"fm-s3-f15","session":"3","front":"List the three basic principles for exercising judgment in credit allocation.","back":"1) Maximize profit (present value), not minimize the number of bad accounts. 2) Concentrate effort on the dangerous (large or doubtful) accounts. 3) Look beyond the immediate order, a poor risk today can be worth accepting if the customer becomes a regular buyer."},{"id":"fm-s3-f16","session":"3","front":"What is collection policy, and what tool tracks it?","back":"The process for collecting money once due and responding to reluctant payers or defaulters; firms typically keep an aging schedule showing what proportion of accounts are mildly or badly overdue."},{"id":"fm-s3-f17","session":"3","front":"When can it make sense for a firm to extend credit to a customer just cut off by its own bank?","back":"When the firm has more information than the bank about the customer's business, or needs to look beyond the immediate transaction to protect future profitable sales."},{"id":"fm-s3-f18","session":"3","front":"Why is minimizing bad debts the wrong objective for a credit manager?","back":"The goal is to maximize present value by weighing the best case (on-time payment) against the worst case (default); a high profit margin justifies a more liberal credit policy even if it means more bad debts."},{"id":"fm-s45-f1","session":"4-5","front":"List the main types of financial risk a firm faces, per the A2A example categories.","back":"Market risk, credit risk, liquidity risk, operational risk, foreign exchange risk, interest rate risk, business risk, reputational risk, and commodity risk, all interconnected."},{"id":"fm-s45-f2","session":"4-5","front":"Define transaction exposure.","back":"The change in value of outstanding financial obligations that are already contractually fixed, caused by exchange-rate moves before those obligations are settled. It deals with actual cash flow changes on existing contracts."},{"id":"fm-s45-f3","session":"4-5","front":"Define operating/economic exposure.","back":"The change in a firm's expected future cash flows (not yet contracted) caused by an exchange-rate move that affects the firm's international competitiveness, e.g. a stronger home currency makes exports pricier abroad."},{"id":"fm-s45-f4","session":"4-5","front":"Define translation/accounting exposure.","back":"The impact of FX volatility on the consolidation of foreign subsidiaries' accounts into the group's financial statements. It changes reported consolidated numbers but not actual cash flow."},{"id":"fm-s45-f5","session":"4-5","front":"What does hedging transaction exposure actually reduce?","back":"The variability of expected cash flows around their mean, it narrows the range of possible outcomes; it does not necessarily increase the expected cash flow itself."},{"id":"fm-s45-f6","session":"4-5","front":"What are the three basic choices when facing a transaction exposure?","back":"Remain unhedged (accept the FX rate on the settlement date), hedge in the forward market (lock in a rate today), hedge in the options market (pay a premium for the right, not the obligation, to transact at a set rate)."},{"id":"fm-s45-f7","session":"4-5","front":"Which forward position do you take if you have a payable (owe FX)? Which if you have a receivable (will receive FX)?","back":"Payable: long forward (agree to buy the FX at maturity at the forward price). Receivable: short forward (agree to sell the FX at maturity)."},{"id":"fm-s45-f8","session":"4-5","front":"State the importer/exporter options rule.","back":"Importers who owe foreign currency should buy call options (locks an upper limit on the dollar cost); exporters with a foreign-currency receivable should buy put options (locks a lower limit on the dollar value)."},{"id":"fm-s45-f9","session":"4-5","front":"Why is an option's premium always relevant even if the option is never exercised?","back":"The premium is paid regardless of outcome, so it must be netted against the payoff either way, not treated as a cost that only applies when the option is exercised."},{"id":"fm-s45-f10","session":"4-5","front":"Give the break-even spot rate formula for a receivable hedged with a put, and explain what it means.","back":"S*T = F + premium. Above this spot rate, the un-exercised put's payoff (spot minus premium) overtakes the forward's fixed payoff; below it, the forward wins."},{"id":"fm-s45-f11","session":"4-5","front":"Give the break-even spot rate formula for a payable hedged with a call, and explain what it means.","back":"S*T = F − premium. Below this spot rate, the un-exercised call's cost (spot plus premium) falls under the forward's fixed cost, making the option the cheaper choice."},{"id":"fm-s45-f12","session":"4-5","front":"Walk through the woolens importer forward-hedge example.","back":"A US importer owes £100 million in one year, 1-year forward = $1.50/£. Unhedged outcome swings ±$30m with the spot rate. Hedged at $1.50/£, the forward's gain/loss exactly mirrors the unhedged payable's gain/loss, so the hedged total cost is flat at $1.50/£ regardless of the spot rate, that flat line is the entire point of hedging."},{"id":"fm-s45-f13","session":"4-5","front":"In Aidan's case (receivable of £1,000,000, forward €1.0760/£), what does the forward hedge guarantee?","back":"A fixed €1,076,000 in June, whatever the spot rate turns out to be, versus an entirely uncertain euro amount if left unhedged."},{"id":"fm-s45-f14","session":"4-5","front":"In the Boeing landing-gear example (forward $1.46/£, put premium $0.02/£), compute the break-even spot rate.","back":"S*T = F + premium = $1.46 + $0.02 = $1.48/£."},{"id":"fm-s45-f15","session":"4-5","front":"What is over-hedging?","back":"Hedging a larger foreign-currency amount than what actually materializes, turning a risk-reducing hedge into a speculative position on the un-realized portion, since the firm becomes contractually obligated to deliver currency it doesn't actually have."},{"id":"fm-s45-f16","session":"4-5","front":"Walk through why over-hedging created a loss in the worked example (CFO sold 100% of expected $100 forward at T0, actual revenue only $50 at T1).","back":"At collection, the CFO gets $50 from the real sale but must deliver $100 under the forward, so must buy the missing $50 on the spot market and hand it over at the worse forward rate, a loss of €11.5 purely from over-hedging, on top of the ordinary budgeted margin."},{"id":"fm-s45-f17","session":"4-5","front":"What two design questions must every hedging policy answer?","back":"When should hedging start (at budget stage or only once the sale is invoiced/exposure certain), and how much should be hedged (100% of the expected amount or a smaller, more conservative share)."},{"id":"fm-s45-f18","session":"4-5","front":"In the final recap table, why does \"do nothing\" produce both the best-case and the worst-case outcome?","back":"Because remaining unhedged has the widest range of outcomes across the two spot scenarios, exactly the risk hedging is meant to remove; the forward is most stable but gives up upside; the option sits in between, protecting the downside while keeping most of the upside."},{"id":"fm-s45-f19","session":"4-5","front":"Define the forward premium/discount and its formula.","back":"fN,j = [FN($/j) − S($/j)] ÷ S($/j) × (360÷N). A positive result means currency j trades at a forward premium (expected to strengthen); a negative result means a forward discount (expected to weaken)."},{"id":"fm-s45-f20","session":"4-5","front":"What does \"direct quotation\" mean from a European investor's point of view?","back":"How many units of home currency (€) buy one unit of foreign currency ($), e.g. €/$; the indirect quotation is the reciprocal, $/€."},{"id":"fm-s45-f21","session":"4-5","front":"Why does a \"stronger dollar\" mean a lower $/€ number, and why does that matter for a euro-receiving exporter?","back":"A lower $/€ number means fewer dollars are needed to buy one euro, i.e. the dollar is stronger. Since the exporter earns dollars and converts to euros, a stronger dollar converts into more euros, so the lower numeric spot rate is actually the \"good\" scenario for them."},{"id":"fm-s45-f22","session":"4-5","front":"Contrast a forward hedge and an options hedge on cost and payoff shape.","back":"A forward has no premium and gives a symmetric, mirror-image gain/loss that exactly offsets the underlying exposure. An option costs a premium paid regardless of outcome but keeps the favorable-side upside, since it is a right, not an obligation."}],"cg":[{"id":"cg-s1-f1","session":"1","front":"What are the four competing definitions of corporate governance covered in Session 1?","back":"Shleifer & Vishny (1996), narrow/finance view, investor returns. Sheridan & Kendall (1992), broader view, owners plus employees, environment, customers/suppliers, legal compliance. Cadbury Committee (1992), board-centred, 'directed and controlled'. Blair (1995), systemic view, the entire legal/cultural/institutional arrangement."},{"id":"cg-s1-f2","session":"1","front":"What does 'public company' (PC) mean in this course's specific sense?","back":"A listed company whose ownership is so fragmented that no single shareholder holds a stake large enough to make it convenient to take an active part in governing the company."},{"id":"cg-s1-f3","session":"1","front":"What do public-company shareholders typically do instead of fighting to change governance decisions?","back":"They 'vote with their feet', selling their shares when they disagree, rather than exercising real nomination power over directors."},{"id":"cg-s1-f4","session":"1","front":"Define an agency relationship.","back":"A contract under which a principal delegates to an agent the power to take decisions on the principal's behalf, in order to accomplish some task."},{"id":"cg-s1-f5","session":"1","front":"What are the three components of agency costs?","back":"Monitoring costs (what the principal spends to observe/constrain the agent), guarantee/bonding costs (what the agent spends to credibly commit not to act against the principal), and residual losses (the welfare loss remaining even after monitoring and bonding)."},{"id":"cg-s1-f6","session":"1","front":"List the three ownership/board configurations of the agency relationship.","back":"1) Dispersed ownership with an independent board. 2) Dispersed ownership with a management-dominated board. 3) Concentrated ownership with overlap between ownership, governance and management (adds a majority-vs-minority shareholder conflict)."},{"id":"cg-s1-f7","session":"1","front":"List the six managerial misbehaviour patterns.","back":"Empire building, shirking, wealth extraction, entrenchment, short-termism/window dressing, favouritism/nepotism and insider trading."},{"id":"cg-s1-f8","session":"1","front":"What is 'entrenchment' as a managerial misbehaviour, and what context favours it?","back":"Defensive tools that insulate incumbent management/directors from being removed (golden parachutes, poison pills, pyramidal groups, shareholder agreements). Favoured by underdeveloped financi
