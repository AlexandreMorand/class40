 a gap between voting power and cash-flow rights. Worked example, 51% times 51% equals 26% cash-flow rights but still 51% voting control.\n- Ownership, governance and strategy move together, driven by past performance (only extreme results trigger change), owner values, competition, institutional context.\n- Cash-rich controlling shareholders invest long-term and accept lower dividends, debt-constrained ones need high dividends and avoid risk, know this contrast cold.\n- Activism drivers, underperformance, weak managerial ownership, pay-performance misalignment, institutional ownership. Aberdeen equals broad portfolio stewardship, Elliott/TIM equals a targeted single-company campaign, don't mix the two models up.\n- MSCI ESG rating, AAA to CCC across E, S, G indicators. Seven ESG strategies, exclusions, engagement/voting, integration, norms-based screening, best in class, thematic, impact investing, each is a distinct mechanism.\n- Italy's NFD (mandatory since 2017, Legislative Decree 254/2016) is transitioning to the CSRD, not the final regime, and most firms disclose ESG risk without truly integrating it into risk management (96% disclose, only 13% integrate).\n"};

/* ============ HELPERS ============ */
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function fmtDate(iso){
  if(!iso) return 'date a confirmer';
  const d = new Date(iso);
  const days=['dim','lun','mar','mer','jeu','ven','sam'];
  const months=['jan','fev','mar','avr','mai','juin','juil','aout','sep','oct','nov','dec'];
  return days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()]+' · '+String(d.getHours()).padStart(2,'0')+'h'+String(d.getMinutes()).padStart(2,'0');
}
function untilLabel(iso){
  const h = (new Date(iso) - new Date())/3600000;
  if(h < 48) return {v: Math.max(0, Math.round(h))+' h', u:'restantes'};
  return {v: 'J-'+Math.ceil(h/24), u: Math.ceil(h/24)+' jours'};
}
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast._t); toast._t=setTimeout(()=>t.hidden=true, 1800); }
function copyText(txt){
  try{ navigator.clipboard.writeText(txt).then(()=>toast('Copie'), ()=>toast('Copie impossible, selectionne le texte')); }
  catch(e){ toast('Copie impossible, selectionne le texte'); }
}
function ficheKey(course, n){ return course+'-'+n; }
function sessionsOf(course){
  if(course==='cr') return CR_SESSIONS;
  if(course==='da') return [...DA_SESSIONS, ...DA_EXTRA];
  if(course==='cg') return CG_SESSIONS;
  return [...FM_SESSIONS.partI, ...FM_SESSIONS.partII.map(s=>Object.assign({}, s, {n:'II-'+s.n}))];
}
function progressSessions(course){
  if(course==='da') return DA_SESSIONS.map(s=>s.n);
  return sessionsOf(course).map(s=>s.n);
}
function sessionQcmStats(course, n){
  const rel = attempts.filter(a=>a.course===course && String(a.session)===String(n));
  return {attempts: rel.length, correct: rel.filter(a=>a.correct).length};
}
function courseProgress(course){
  const ss = progressSessions(course); if(!ss.length) return 0;
  let m = 0;
  ss.forEach(n=>{ const st = sessionQcmStats(course,n); if(ficheLog[ficheKey(course,n)] && st.attempts>=3 && st.correct/st.attempts>=0.7) m++; });
  return Math.round(100*m/ss.length);
}
function sessionLabel(course, key){
  const row = sessionsOf(course).find(s=>String(s.n)===String(key));
  const short = row ? row.topic.split(',')[0].slice(0,26) : '';
  return 'S'+key+(short ? ' · '+short : '');
}

function dlId(x){ return x.course+'-'+x.label.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,60); }
function allDeadlines(){
  const base = DEADLINES.map(x=>{ const id=dlId(x); return Object.assign({id, custom:false}, x, dlEdits[id]||{}); });
  const cus = Object.entries(dlCustom).map(([id,x])=>Object.assign({id, custom:true}, x));
  return [...base, ...cus].filter(x=>!x.deleted);
}
function dlBuckets(list){
  const now = new Date();
  const open = list.filter(x=>!x.done);
  const dated = open.filter(x=>x.date).sort((a,b)=>new Date(a.date)-new Date(b.date));
  return {
    upcoming: dated.filter(x=>new Date(x.date)>=now),
    late: dated.filter(x=>new Date(x.date)<now && x.kind!=='exam'),
    past: dated.filter(x=>new Date(x.date)<now && x.kind==='exam'),
    tbd: open.filter(x=>!x.date),
    done: list.filter(x=>x.done),
  };
}
const PEN = '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M11 2.5l2.5 2.5L6 12.5H3.5V10L11 2.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>';
function renderNext(){

      +'<div class="txt"><span class="eyebrow">Prochaine echeance · '+hero.course.toUpperCase()+'</span><span class="lbl">'+esc(hero.label)+'</span>'
      +'<span class="meta">'+fmtDate(hero.date)+(hero.note? ' · '+esc(hero.note):'')+'</span></div><button class="iconbtn" data-edit-dl="'+hero.id+'" title="Modifier" aria-label="Modifier cette echeance">'+PEN+'</button></div>';

  const rows = showAllDeadlines
    ? [...B.upcoming.slice(1).map(x=>[x,'']), ...B.tbd.map(x=>[x,'tbd']), ...B.past.map(x=>[x,'past']), ...B.done.map(x=>[x,'past'])]
    : [...B.upcoming.slice(1,6).map(x=>[x,''])];
  const total = B.upcoming.length + B.tbd.length + B.past.length + B.done.length;

    + rows.map(([x,cls])=>dlRow(x,cls)).join('')
    + '<button class="linkbtn" id="dlToggle">'+(showAllDeadlines?'Reduire':'Toutes les echeances ('+total+'), dont '+B.tbd.length+' sans date')+'</button></div>';
  el.innerHTML = html;
  document.getElementById('dlToggle').onclick = ()=>{ showAllDeadlines=!showAllDeadlines; renderNext(); };
}
function dlRow(x, cls){
  return '<button class="uprow '+cls+'" style="--cc:'+COURSE_UI[x.course].color+'" data-edit-dl="'+x.id+'" title="Modifier"><span class="dot"></span><span class="l">'+x.course.toUpperCase()+' · '+esc(x.label)+(x.done?' · fait':'')+'</span><span class="w">'+(x.date? fmtDate(x.date).split(' · ')[0] : 'a confirmer')+'</span></button>';
}
function renderCourseDeadlines(){
  const list = allDeadlines().filter(x=>x.course===activeCourse);

  return '<div class="cdl"><div class="flabel"><span>Echeances '+activeCourse.toUpperCase()+'</span><button class="pill mini" data-add-dl="'+activeCourse+'">+ Ajouter</button></div><div class="cdlrow">'
    + (ordered.length ? ordered.map(([x,cls])=>'<button class="dlc '+cls+'" data-edit-dl="'+x.id+'"><span class="d">'+(cls==='late'?'En retard':cls==='done'?'Fait':x.date?fmtDate(x.date).split(' · ')[0]:'Date a confirmer')+'</span><span class="t">'+esc(x.label)+'</span>'+(x.note?'<span class="nt">'+esc(x.note)+'</span>':'')+'</button>').join('') : '<span class="dm">Aucune echeance pour ce cours.</span>')
    + '</div></div>';

/* deadline editor */
function openDlEditor(id, course){
  const x = id ? allDeadlines().find(d=>d.id===id) : {course, kind:'assignment', label:'', date:null, note:'', done:false};
  if(!x) return;
  dlEditing = {id, course:x.course, custom: id ? x.custom : true, confirmDel:false};
  const m = document.getElementById('dlModal');
  document.getElementById('dlTitle').textContent = id ? 'Modifier l\'echeance' : 'Nouvelle echeance';
  document.getElementById('dlCourse').innerHTML = COURSE_ORDER.map(k=>'<option value="'+k+'" '+(k===x.course?'selected':'')+'>'+COURSE_UI[k].short+'</option>').join('');
  document.getElementById('dlCourse').disabled = !!id && !x.custom;
  document.getElementById('dlKind').value = x.kind||'assignment';
  document.getElementById('dlLabel').value = x.label||'';
  document.getElementById('dlDate').value = x.date ? x.date.slice(0,16) : '';
  document.getElementById('dlNote').value = x.note||'';
  document.getElementById('dlDone').checked = !!x.done;
  const del = document.getElementById('dlDelete'); del.hidden = !id; del.textContent = 'Supprimer';
  m.hidden = false; document.getElementById('dlLabel').focus();
}
function closeDlEditor(){ document.getElementById('dlModal').hidden = true; dlEditing = null; }
async function saveDl(patch){
  const e = dlEditing; if(!e) return;
  if(e.custom){
    const id = e.id || ('c-'+Date.now().toString(36));
    const cur = dlCustom[id] || {};
    dlCustom[id] = Object.assign({}, cur, patch);
    if(db){ try{ await db.doc('customDeadlines/'+id).set(dlCustom[id]); }catch(err){ toast('Enregistrement impossible, reessaie'); } }
  } else {
    dlEdits[e.id] = Object.assign({}, dlEdits[e.id]||{}, patch);
    if(db){ try{ await db.doc('deadlineEdits/'+e.id).set(dlEdits[e.id]); }catch(err){ toast('Enregistrement impossible, reessaie'); } }
  }
}
async function quickDone(id){
  const x = allDeadlines().find(d=>d.id===id); if(!x) return;
  dlEditing = {id, custom:x.custom};
  await saveDl({done:true}); dlEditing = null;
  toast('Marque comme rendu'); renderNext(); if(document.querySelector('.cdl')) renderPane();
}
function bindDlEditor(){
  document.getElementById('dlForm').addEventListener('submit', async ev=>{
    ev.preventDefault();
    const label = document.getElementById('dlLabel').value.trim();
    if(!label){ document.getElementById('dlLabel').focus(); toast('Donne un intitule'); return; }
    const date = document.getElementById('dlDate').value || null;
    const patch = {label, date, note:document.getElementById('dlNote').value.trim(), done:document.getElementById('dlDone').checked, kind:document.getElementById('dlKind').value};
    if(dlEditing.custom) patch.course = document.getElementById('dlCourse').value;
    await saveDl(patch); closeDlEditor(); toast('Echeance enregistree'); renderNext(); renderPane();
  });
  document.getElementById('dlCancel').onclick = closeDlEditor;
  document.getElementById('dlDelete').onclick = async ()=>{
    const e = dlEditing, btn = document.getElementById('dlDelete');
    if(!e.confirmDel){ e.confirmDel = true; btn.textContent = 'Confirmer la suppression'; return; }
    if(e.custom){ delete dlCustom[e.id]; if(db){ try{ await db.doc('customDeadlines/'+e.id).delete(); }catch(err){} } }
    else { await saveDl({deleted:true}); }
    closeDlEditor(); toast('Echeance supprimee'); renderNext(); renderPane();
  };
  document.getElementById('dlModal').addEventListener('click', ev=>{ if(ev.target.id==='dlModal') closeDlEditor(); });
}

function sessionRow(course, s){
  const st = sessionQcmStats(course, s.n);
  const seen = ficheLog[ficheKey(course, s.n)];
  const url = FICHE_URLS[course] && FICHE_URLS[course][s.n];
  const ratio = st.attempts ? st.correct/st.attempts : 0;
  let sub = [];
  if(course==='cr' && s.date) sub.push(fmtDate(s.date));
  if(st.attempts) sub.push('<span class="chip '+(st.attempts>=3 && ratio>=.7 ? 'ok' : ratio<.5 ? 'ko' : '')+'">QCM '+st.correct+'/'+st.attempts+'</span>');
  if(s.caseStudy) sub.push('<span class="chip case">case study</span>');
  let acts = '';
  if(!s.hasFiche) acts = '<span class="chip">pas de fiche</span>';
  else {
    acts += url ? '<button class="btn" data-open-fiche="'+url+'" data-title="'+esc(course.toUpperCase()+' · S'+(s.label||s.n)+' · '+s.topic)+'">Fiche</button>' : '<span class="chip">fiche a lier</span>';
    acts += '<button class="seen '+(seen?'on':'')+'" data-toggle-fiche="'+course+'|'+s.n+'" title="'+(seen?'Fiche vue':'Marquer la fiche comme vue')+'" aria-label="Marquer la fiche comme vue">'
      + '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3 3 7-7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>';
  }
  return '<div class="srow"><span class="n">'+(s.label||s.n)+'</span><div class="t">'+esc(s.topic)+(sub.length?'<div class="sub">'+sub.join('')+'</div>':'')+'</div><div class="acts">'+acts+'</div></div>';
}
async function toggleFiche(course, n){

/* ============ QCM ============ */
function bank(course, mode){ return mode==='data' ? (QCM_DATA[course]||[]) : (QCM[course]||[]); }
function keyOf(q, mode){ return mode==='data' ? q.dataset : String(q.session); }
function qs(course){
  if(!Q[course]){
    const hasData = (QCM_DATA[course]||[]).length>0;
    Q[course] = {mode:'cours', hasData, correction:'now', phase:'config', cfg:{}};
  }
  const st = Q[course];
  ['cours','data'].forEach(m=>{
    if(!st.cfg[m]){ const keys = [...new Set(bank(course,m).map(q=>keyOf(q,m)))]; st.cfg[m] = {n:20, keys:new Set(keys)}; }
  });
  return st;
}
function optionKeys(course, mode){
  const keys = [...new Set(bank(course,mode).map(q=>keyOf(q,mode)))];
  if(mode==='data'){ const order = Object.keys(DATASETS); return keys.sort((a,b)=>order.indexOf(a)-order.indexOf(b)); }
  return keys.sort((a,b)=>{ const na=parseFloat(a), nb=parseFloat(b); if(!isNaN(na)&&!isNaN(nb)&&na!==nb) return na-nb; return a.localeCompare(b); });
}
function outstandingMistakes(course, mode){
  const ids = new Set(bank(course,mode).map(q=>q.id));
  const last = new Map();
  attempts.filter(a=>a.course===course && ids.has(a.questionId)).forEach(a=>{ const p=last.get(a.questionId); if(!p || a.ts>p.ts) last.set(a.questionId,a); });
  return [...last.values()].filter(a=>!a.correct).map(a=>a.questionId);
}
function startQuiz(course, questions){
  const st = qs(course);
  st.run = {order: questions.map(q=>q.id), idx:0, answered:{}, shuffles:Object.fromEntries(questions.map(q=>[q.id, shuffleArr(q.choices.map((_,i)=>i))])), mode:st.mode, correction:st.correction, sel:null, times:{}, t0:Date.now(), start:Date.now()};
  st.phase = 'quiz';
  renderSub();
}
function renderQcm(t){
  const course = activeCourse, st = qs(course);
  if(!(QCM[course]||[]).length){ t.innerHTML = '<div class="empty">Pas encore de QCM pour ce cours.</div>'; return; }
  if(st.phase==='quiz') return renderQuiz(t);
  if(st.phase==='done') return renderDone(t);
  renderConfig(t);
}

  if(presets.length) h += '<div class="field"><div class="flabel"><span>Raccourcis</span></div><div class="pills">'+presets.map((p,i)=>'<button class="pill" data-preset="'+i+'">'+p.label+'</button>').join('')+'</div></div>';

  const go = t.querySelector('#go'); if(go) go.onclick=()=>{ let pool = shuffleArr(b.filter(q=>cfg.keys.has(keyOf(q,mode)))); if(cfg.n!=='Tout') pool = pool.slice(0,cfg.n); startQuiz(course, pool); };

function runBank(course){ const r = qs(course).run; return new Map(bank(course, r.mode).map(q=>[q.id,q])); }
function renderQuiz(t){
  const course = activeCourse, st = qs(course), r = st.run, byId = runBank(course);
  const total = r.order.length, q = byId.get(r.order[r.idx]), ans = r.answered[q.id];
  const reveal = ans!==undefined && r.correction==='now';
  const isLast = r.idx===total-1, allAnswered = Object.keys(r.answered).length===total;
  const perm = r.shuffles[q.id];
  const bar = r.order.map(id=>{ const a=r.answered[id]; if(a===undefined) return 'n'; if(r.correction==='end') return 'a'; return a.correct?'g':'b'; });
  let h = '<div class="qhead"><button class="btn ghost" id="qBack" title="Retour aux reglages">&larr; Terminer plus tard</button><span class="qn">Question '+(r.idx+1)+' sur '+total+'</span><span class="timer">Question <b id="tQ">00:00</b> · Total <b id="tT">00:00</b></span></div>';
  h += '<div class="qtop"><div class="qprog">'+bar.map(c=>'<i class="'+c+'" style="flex:1"></i>').join('')+'</div></div>';
  h += '<div class="qcard" id="qcard"><div class="qmeta">'
    + (r.mode==='data' ? '<span class="chip case">'+esc(DATASETS[q.dataset].name)+'</span>' : '<span class="chip">Session '+esc(q.session)+'</span>')
    + '<span class="chip">'+esc(q.topic)+'</span></div>';
  h += '<div class="qtext">'+esc(q.question)+'</div><div class="choices">';
  perm.forEach((orig, i)=>{
    let cls = '';
    if(ans!==undefined){
      if(reveal){ if(orig===q.correct_index) cls='correct'; else if(orig===ans.choice) cls='wrong'; else cls='dim'; }
      else if(orig===ans.choice) cls='picked';
    } else if(r.sel===orig) cls='picked';
    h += '<button class="choice '+cls+'" data-choice="'+orig+'" '+(ans!==undefined?'disabled':'')+'><span class="k">'+'ABCD'[i]+'</span><span>'+esc(q.choices[orig])+'</span></button>';
  });
  h += '</div>';
  if(reveal) h += '<div class="explain '+(ans.correct?'':'bad')+'"><b>'+(ans.correct?'Juste.':'Faux.')+'</b> '+esc(q.explanation)+'</div>';
  h += '<div class="qnav"><button class="btn" id="qPrev" '+(r.idx===0?'disabled':'')+'>Precedente</button>'
    + '<span class="hint"><span class="kbd">A</span>-<span class="kbd">D</span> choisir <span class="kbd">Entree</span> valider puis suivante</span>'
    + (ans===undefined ? '<button class="btn primary" id="qSubmit" '+(r.sel===null?'disabled':'')+'>Valider</button>'
      : ((isLast || (allAnswered && r.correction==='end')) ? '<button class="btn primary" id="qFinish">Voir le resultat</button>' : '<button class="btn primary" id="qNext">Suivante</button>'))
    + '</div></div>';
  t.innerHTML = h;
  t.querySelectorAll('.choice').forEach(b=>b.onclick=()=>{ r.sel = +b.dataset.choice; t.querySelectorAll('.choice').forEach(x=>x.classList.toggle('picked', x===b)); const s=t.querySelector('#qSubmit'); if(s) s.disabled=false; });
  const sb=t.querySelector('#qSubmit'); if(sb) sb.onclick=()=>{ if(r.sel!==null) answer(course, q, r.sel); };
  if(ans===undefined && r.qid!==q.id){ r.qid=q.id; r.t0=Date.now(); }
  startTimer();
  t.querySelector('#qBack').onclick=()=>{ st.phase='config'; renderSub(); };
  const p=t.querySelector('#qPrev'); if(p) p.onclick=()=>{ r.idx=Math.max(0,r.idx-1); r.sel=null; renderQuiz(t); };
  const n=t.querySelector('#qNext'); if(n) n.onclick=()=>{ r.idx=Math.min(total-1,r.idx+1); r.sel=null; renderQuiz(t); };
  const f=t.querySelector('#qFinish'); if(f) f.onclick=()=>{ st.phase='done'; renderSub(); };
}
async function answer(course, q, choice){
  const r = qs(course).run; if(r.answered[q.id]!==undefined) return;
  const correct = choice===q.correct_index;
  r.answered[q.id] = {choice, correct};
  r.times[q.id] = Math.round((Date.now()-r.t0)/1000); r.sel = null;
  const rec = {course, session:String(q.session), questionId:q.id, topic:q.topic, correct, ts:Date.now(), source:r.mode, secs:r.times[q.id]};
  attempts.push(rec);
  const t = document.getElementById('sub');
  if(r.correction==='end' && r.idx < r.order.length-1){ r.idx++; r.qid=null; }
  renderQuiz(t);
  if(r.correction==='now' && !correct){ const c=document.getElementById('qcard'); if(c) c.classList.add('shake'); }
  refreshProgress();
  if(db){ try{ await db.collection('qcmAttempts').add(rec); }catch(e){} }
}
let timerId = null;
const mmss = s => String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function startTimer(){
  clearInterval(timerId);
  const tick = ()=>{
    const st = Q[activeCourse], a = document.getElementById('tQ'), b = document.getElementById('tT');
    if(!st || st.phase!=='quiz' || !a){ clearInterval(timerId); return; }
    const r = st.run, q = r.order[r.idx];
    a.textContent = mmss(r.answered[q]!==undefined ? (r.times[q]||0) : Math.round((Date.now()-r.t0)/1000));
    b.textContent = mmss(Math.round((Date.now()-r.start)/1000));
  };
  tick(); timerId = setInterval(tick, 1000);
}
function renderDone(t){
  clearInterval(timerId);
  const course = activeCourse, st = qs(course), r = st.run, byId = runBank(course);
  const total = r.order.length, answered = Object.keys(r.answered).length;
  const correct = Object.values(r.answered).filter(a=>a.correct).length;
  const wrong = r.order.filter(id=>r.answered[id] && !r.answered[id].correct);
  const byTopic = {}; wrong.forEach(id=>{ const q=byId.get(id); byTopic[q.topic]=(byTopic[q.topic]||0)+1; });
  const pct = answered ? Math.round(100*correct/answered) : 0;
  let h = '<div class="done"><span class="eyebrow">'+(r.mode==='data'?'Quiz data sous R':'Quiz cours')+'</span><div class="score" style="color:'+(pct>=70?'var(--good)':pct>=50?'var(--warn)':'var(--bad)')+'">'+correct+'<span style="color:var(--ink-3);font-size:28px"> / '+total+'</span></div><div class="lbl">'+(answered<total?(total-answered)+' sans reponse':'Quiz complet')+'</div>';
  const tArr = Object.values(r.times), avg = tArr.length ? Math.round(tArr.reduce((x,y)=>x+y,0)/tArr.length) : 0;
  h += '<div class="perf"><div><span>Precision</span><b>'+pct+'%</b></div><div><span>Temps moyen</span><b>'+mmss(avg)+'</b></div><div><span>Temps total</span><b>'+mmss(tArr.reduce((x,y)=>x+y,0))+'</b></div></div>';
  if(Object.keys(byTopic).length){
    h += '<div class="weak"><span class="eyebrow">Themes a retravailler</span>'+Object.entries(byTopic).sort((a,b)=>b[1]-a[1]).map(([k,n])=>'<div class="weakrow"><span>'+esc(k)+'</span><b class="mono">'+n+'</b></div>').join('')+'</div>';
  }
  h += '<div class="acts"><button class="btn primary" id="dNew">Nouveau quiz</button>'+(wrong.length?'<button class="btn" id="dRedo">Refaire les '+wrong.length+' erreurs</button>':'')+'</div></div>';
  h += '<div class="field"><div class="flabel"><span>Detail par question</span></div><div class="tablewrap"><table class="qtable"><thead><tr><th>#</th><th>Resultat</th><th>Temps</th><th>Theme</th></tr></thead><tbody>'
    + r.order.map((id,i)=>{ const a=r.answered[id], q=byId.get(id); return '<tr><td class="mono">'+(i+1)+'</td><td><span class="res '+(a===undefined?'n':a.correct?'g':'b')+'">'+(a===undefined?'–':a.correct?'✓':'✕')+'</span></td><td class="mono">'+(r.times[id]!==undefined?mmss(r.times[id]):'–')+'</td><td>'+esc(q.topic)+'</td></tr>'; }).join('')
    + '</tbody></table></div></div>';
  if(wrong.length){
    h += '<div class="field"><div class="flabel"><span>Corrections</span></div>' + wrong.map(id=>{ const q=byId.get(id), a=r.answered[id];
      return '<div class="callout"><b style="font-size:14px">'+esc(q.question)+'</b><span style="font-size:13px;color:var(--bad)">Ta reponse · '+esc(q.choices[a.choice])+'</span><span style="font-size:13px;color:var(--good)">Bonne reponse · '+esc(q.choices[q.correct_index])+'</span><span style="font-size:13px;color:var(--ink-2)">'+esc(q.explanation)+'</span></div>'; }).join('') + '</div>';
  }
  t.innerHTML = h;
  t.querySelector('#dNew').onclick=()=>{ st.phase='config'; renderSub(); };
  const d=t.querySelector('#dRedo'); if(d) d.onclick=()=>{ st.mode=r.mode; startQuiz(course, shuffleArr(wrong.map(id=>byId.get(id)))); };
}

/* ============ FLASHCARDS ============ */
function fc(course){
  if(!FC[course]){
    const deck = FLASHCARDS[course]||[];
    FC[course] = {theme:null, onlyAgain:false, shuffle:true, run:null};
  }
  return FC[course];
}
function fcBuild(course){
  const st = fc(course), deck = FLASHCARDS[course]||[];
  let pool = deck.filter(c=>(st.theme==='*' || String(c.session)===st.theme) && (!st.onlyAgain || fcStatus[c.id]==='again'));
  if(st.shuffle) pool = shuffleArr(pool.slice());
  st.run = {queue: pool.map(c=>c.id), pos:0, flipped:false, res:{}, requeued:{}};
}
function renderFlashcards(t){
  const course = activeCourse, deck = FLASHCARDS[course]||[];
  if(!deck.length){ t.innerHTML='<div class="empty">Pas encore de flashcards pour ce cours.</div>'; return; }

  const r = st.run, byId = new Map(deck.map(c=>[c.id,c]));

  const known = cards.filter(c=>fcStatus[c.id]==='known').length, again = cards.filter(c=>fcStatus[c.id]==='again').length;

    + '<div class="pills"><button class="pill mini '+(st.shuffle?'active':'')+'" id="fShuf">melanger</button><button class="pill mini '+(st.onlyAgain?'active':'')+'" id="fAgain">seulement a revoir</button></div></div>';

    + '<div class="flip enter '+(r.flipped?'flipped':'')+'" id="flip">'
    + '<div class="face front"><div class="top"><span>Session '+esc(card.session)+'</span><span>'+(status==='known'?'acquise':status==='again'?'a revoir':'nouvelle')+'</span></div><div class="content">'+esc(card.front)+'</div><div class="tap">Toucher ou <span class="kbd">espace</span> pour retourner</div></div>'
    + '<div class="face back"><div class="top"><span>Reponse</span><span>Session '+esc(card.session)+'</span></div><div class="content">'+esc(card.back)+'</div><div class="tap">Glisse a gauche pour revoir, a droite si tu savais</div></div>'
    + '</div></div>';
  h += '<div class="fcacts"><button class="btn again" id="fBad">&larr; A revoir</button><button class="btn ghost" id="fFlip">Retourner</button><button class="btn know" id="fGood">Je sais &rarr;</button></div>';

  }).join('') + '</div>';
  t.innerHTML = h;
  t.querySelectorAll('[data-theme]').forEach(x=>x.onclick=()=>{ st.theme = x.dataset.theme; st.onlyAgain = false; fcBuild(course); renderFlashcards(t); });
}
function sizeFlip(flip){
  const faces = flip.querySelectorAll('.face'); let h = 260;
  faces.forEach(f=>{ f.style.position='relative'; h=Math.max(h, f.scrollHeight); f.style.position=''; });
  flip.style.minHeight = Math.min(h, 520)+'px';
}
function bindFcTop(t, course){
  const st = fc(course);
  t.querySelector('#fShuf').onclick=()=>{ st.shuffle=!st.shuffle; fcBuild(course); renderFlashcards(t); };
  t.querySelector('#fAgain').onclick=()=>{ st.onlyAgain=!st.onlyAgain; fcBuild(course); renderFlashcards(t); };
  t.querySelector('#fBack').onclick=()=>{ st.theme=null; st.run=null; st.onlyAgain=false; renderFlashcards(t); };
}
function fcFlip(course){ const r = fc(course).run; r.flipped=!r.flipped; const f=document.getElementById('flip'); if(f) f.classList.toggle('flipped', r.flipped); }
let fcBusy = false;
async function fcRate(course, status){
  if(fcBusy) return; fcBusy = true;
  const st = fc(course), r = st.run, id = r.queue[r.pos];
  r.res[id] = status==='known' ? 'g' : 'r';
  if(status==='again' && !r.requeued[id]){ r.requeued[id]=true; const at = Math.min(r.queue.length, r.pos+4+Math.floor(Math.random()*3)); r.queue.splice(at, 0, id); }
  fcStatus[id] = status;
  const f = document.getElementById('flip');
  if(f){ f.classList.remove('enter'); f.style.transform=''; f.classList.add(status==='known'?'fly-right':'fly-left'); }
  if(db){ db.doc('fcStatus/'+id).set({course, status, ts:Date.now()}).catch(()=>{}); }
  setTimeout(()=>{ r.pos++; r.flipped=false; fcBusy=false; if(activeSub[activeCourse]==='flashcards' && activeCourse===course) renderFlashcards(document.getElementById('sub')); }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 300);
}
function bindSwipe(stage, flip, course){
  let x0=null, y0=0, dx=0, moved=false;
  const tagL = stage.querySelector('#tagL'), tagR = stage.querySelector('#tagR');
  stage.onpointerdown = e=>{ if(e.button!==undefined && e.button!==0) return; x0=e.clientX; y0=e.clientY; dx=0; moved=false; flip.style.transition='none'; };
  stage.onpointermove = e=>{
    if(x0===null) return; dx = e.clientX-x0; const dy = e.clientY-y0;
    if(!moved && Math.abs(dx)>8 && Math.abs(dx)>Math.abs(dy)){ moved=true; try{ stage.setPointerCapture(e.pointerId); }catch(_){} }
    if(!moved) return;
    const rot = fc(course).run.flipped ? ' rotateY(180deg)' : '';
    flip.style.transform = 'translateX('+dx+'px) rotate('+(dx/22)+'deg)'+rot;
    tagL.style.opacity = Math.max(0, Math.min(1, -dx/100)); tagR.style.opacity = Math.max(0, Math.min(1, dx/100));
  };
  const end = e=>{
    if(x0===null) return; flip.style.transition=''; tagL.style.opacity=0; tagR.style.opacity=0;
    const wasMoved = moved; x0=null;
    if(wasMoved && Math.abs(dx)>90){ fcRate(course, dx>0?'known':'again'); return; }
    flip.style.transform='';
    if(!wasMoved) fcFlip(course);
  };
  stage.onpointerup = end; stage.onpointercancel = ()=>{ x0=null; flip.style.transition=''; flip.style.transform=''; tagL.style.opacity=0; tagR.style.opacity=0; };
}

/* ============ CHEAT SHEET ============ */
function renderCheat(t){
  const txt = CHEATSHEET[activeCourse];
  if(!txt){ t.innerHTML='<div class="empty">Pas encore de cheat sheet pour ce cours.</div>'; return; }
  const heads = txt.split('\n').filter(l=>/^##\s+/.test(l)).map(l=>l.replace(/^##\s+/,''));
  t.innerHTML = '<div class="cheatwrap"><nav class="toc">'+heads.map((h,i)=>'<a href="#cheat-'+i+'" data-jump="'+i+'">'+esc(h.split(',')[0])+'</a>').join('')+'</nav><div class="cheat">'+mdToHtml(txt)+'</div></div>';
  t.querySelectorAll('[data-jump]').forEach(a=>a.onclick=e=>{ e.preventDefault(); const el=document.getElementById('cheat-'+a.dataset.jump); if(el) el.scrollIntoView({behavior:'smooth'}); });
}
function mdToHtml(md){
  let html='', inList=false, i=0;
  md.split('\n').forEach(line=>{
    if(/^##\s+/.test(line)){ if(inList){html+='</ul>';inList=false;} html+='<h3 id="cheat-'+(i++)+'">'+esc(line.replace(/^##\s+/,''))+'</h3>'; }
    else if(/^-\s+/.test(line)){ if(!inList){html+='<ul>';inList=true;} html+='<li>'+esc(line.replace(/^-\s+/,''))+'</li>'; }
    else if(!line.trim()){ if(inList){html+='</ul>';inList=false;} }
    else { if(inList){html+='</ul>';inList=false;} html+='<p>'+esc(line)+'</p>'; }
  });
  if(inList) html+='</ul>';
  return html;
}

/* ============ FICHE VIEWER ============ */
let ficheToken = 0;
if(window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'vendor/pdf.worker.min.js';
async function openFiche(url, title){
  const body = document.getElementById('ficheBody'), modal = document.getElementById('ficheModal');
  document.getElementById('ficheTitle').textContent = title || 'Fiche';
  const tok = ++ficheToken; modal.hidden=false; body.innerHTML='<div class="fichemodal-msg">Chargement de la fiche...</div>';
  try{
    if(!window.pdfjsLib) throw new Error('lecteur PDF indisponible');
    const resp = await fetch(url); if(!resp.ok) throw new Error('http '+resp.status);
    const pdf = await pdfjsLib.getDocument({data: await resp.arrayBuffer()}).promise;
    if(tok!==ficheToken) return; body.innerHTML='';
    const W = Math.min(body.clientWidth-32 || 800, 900), dpr = Math.min(window.devicePixelRatio||1, 3);
    for(let p=1;p<=pdf.numPages;p++){
      if(tok!==ficheToken) return;
      const page = await pdf.getPage(p), s = W/page.getViewport({scale:1}).width, vp = page.getViewport({scale:s*dpr});
      const cv = document.createElement('canvas'); cv.width=Math.ceil(vp.width); cv.height=Math.ceil(vp.height); cv.style.width=Math.ceil(vp.width/dpr)+'px';
      body.appendChild(cv); await page.render({canvasContext:cv.getContext('2d'), viewport:vp}).promise;
    }
  }catch(e){ if(tok===ficheToken) body.innerHTML='<div class="fichemodal-msg">Impossible de charger la fiche ('+esc(e.message)+'). Ferme et reessaie.</div>'; }
}
function closeFiche(){ ficheToken++; document.getElementById('ficheModal').hidden=true; document.getElementById('ficheBody').innerHTML=''; }

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-toggle-fiche]');
  if(t){ const [c,n]=t.dataset.toggleFiche.split('|'); toggleFiche(c, isNaN(n)?n:parseInt(n)); return; }
  const o = e.target.closest('[data-open-fiche]');
  if(o){ openFiche(o.dataset.openFiche, o.dataset.title); return; }
  if(e.target.closest('#ficheModalClose')) closeFiche();
  const ed = e.target.closest('[data-edit-dl]'); if(ed){ openDlEditor(ed.dataset.editDl); return; }
  const dn = e.target.closest('[data-done-dl]'); if(dn){ quickDone(dn.dataset.doneDl); return; }
  const ad = e.target.closest('[data-add-dl]'); if(ad){ openDlEditor(null, ad.dataset.addDl); return; }
});
document.addEventListener('keydown', e=>{
  if(e.target.closest && e.target.closest('input,textarea,select,summary')) return;
  if(!document.getElementById('dlModal').hidden){ if(e.key==='Escape') closeDlEditor(); return; }
  if(!document.getElementById('ficheModal').hidden){ if(e.key==='Escape') closeFiche(); return; }
  const sub = activeSub[activeCourse];
  if(sub==='qcm'){
    const st = Q[activeCourse]; if(!st || st.phase!=='quiz') return;
    const i = 'abcd'.indexOf(e.key.toLowerCase()), j = '1234'.indexOf(e.key);
    const k = i>=0 ? i : j;
    if(k>=0){ const b = document.querySelectorAll('.choice')[k]; if(b && !b.disabled){ b.click(); e.preventDefault(); } return; }
    if(e.key==='ArrowRight' || e.key==='Enter'){ const n=document.getElementById('qSubmit')||document.getElementById('qNext')||document.getElementById('qFinish'); if(n && !n.disabled){ n.click(); e.preventDefault(); } }
    if(e.key==='ArrowLeft'){ const p=document.getElementById('qPrev'); if(p && !p.disabled){ p.click(); e.preventDefault(); } }
  } else if(sub==='flashcards'){
    if(!document.getElementById('flip')) return;
    if(e.key===' '){ fcFlip(activeCourse); e.preventDefault(); }
    else if(e.key==='ArrowRight'){ fcRate(activeCourse,'known'); e.preventDefault(); }
    else if(e.key==='ArrowLeft'){ fcRate(activeCourse,'again'); e.preventDefault(); }
  }
});

function render(){ renderRail(); renderNext(); renderPane(); }
bindDlEditor();
initDb();
