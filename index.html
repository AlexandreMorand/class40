er information than managers"],"correct_index":0,"explanation":"Managers run the business day to day and therefore hold better information than outside users; financial reporting aims to bridge this gap."},{"id":"cr-s1-q3","session":1,"topic":"Motives for regulation","question":"The fiche distinguishes two motives for financial reporting regulation. What are they?","choices":["Market imperfections (efficiency) and protection of unsophisticated investors (wealth redistribution)","Tax collection and export promotion","Auditor independence and board diversity","IFRS convergence and US GAAP convergence"],"correct_index":0,"explanation":"Regulation is motivated by improving economic efficiency (market imperfections) and by redistributing wealth to protect unsophisticated investors."},{"id":"cr-s1-q4","session":1,"topic":"Sources of regulation","question":"Which of the following is NOT listed as a source of accounting regulation?","choices":["Stock exchange regulations","Legislation","Accounting standards","International trade agreements"],"correct_index":3,"explanation":"The three sources given are legislation, accounting standards, and stock exchange regulations — trade agreements are not one of them."},{"id":"cr-s1-q5","session":1,"topic":"GAAP vs IFRS","question":"GAAP, as defined in this session, refers to:","choices":["The complete local set of accounting regulations and conventions of a given jurisdiction","Only the standards issued by the IASB","A single global accounting standard","US accounting rules exclusively"],"correct_index":0,"explanation":"GAAP is jurisdiction-specific (UK GAAP, Italian GAAP, US GAAP); IFRS is the IASB's attempt at a global standard operating alongside or instead of local GAAPs."},{"id":"cr-s1-q6","session":1,"topic":"IFRS Foundation vs IASB","question":"Which statement correctly describes the relationship between the IFRS Foundation and the IASB?","choices":["The IFRS Foundation appoints and funds the IASB and governs its operations","The IASB appoints and funds the IFRS Foundation","They are the same body under two names","The IASB is monitored directly by IFRIC"],"correct_index":0,"explanation":"This is an explicitly flagged exam trap: the Foundation appoints the IASB, not the other way round."},{"id":"cr-s1-q7","session":1,"topic":"IASB composition","question":"The IASB is:","choices":["An independent board of 14 members that develops and amends IFRS","A 25-member committee of national regulators","A subsidiary of the SEC","The enforcement body for EU-listed companies"],"correct_index":0,"explanation":"The fiche states the IASB is an independent board of 14 members developing and amending IFRS."},{"id":"cr-s1-q8","session":1,"topic":"IFRIC vs Advisory Council","question":"What is the key difference between the IFRS Advisory Council and IFRIC?","choices":["The Advisory Council sets agenda priorities; IFRIC interprets existing standards and fills gaps","The Advisory Council interprets standards; IFRIC sets agenda priorities","They are the same body","IFRIC writes new standards; the Advisory Council enforces them"],"correct_index":0,"explanation":"A flagged exam trap: don't mix these up. Advisory Council = agenda/priorities; IFRIC = interpretation/practical guidance."},{"id":"cr-s1-q9","session":1,"topic":"IASB due process","question":"Which of the following correctly orders the IASB's standard-setting due process?","choices":["Topic identification -> Conceptual Framework -> consultation -> discussion document -> exposure draft -> final standard","Exposure draft -> topic identification -> final standard -> consultation","Final standard -> exposure draft -> discussion document -> consultation","Consultation -> final standard -> topic identification -> exposure draft"],"correct_index":0,"explanation":"This is the six-step due process listed in the fiche's Must Know section."},{"id":"cr-s1-q10","session":1,"topic":"EU endorsement","question":"Under the EU endorsement mechanism:","choices":["Each individual IFRS must be separately endorsed by the Accounting Regulatory Committee (ARC) before it is mandatory in the EU","Any IFRS issued by the IASB is automatically mandatory in the EU","The IASB itself enforces standards within the EU","EFRAG has final authority to reject standards without ARC involvement"],"correct_index":0,"explanation":"A flagged exam trap: EU-endorsement is not automatic — each IFRS needs individual endorsement by the ARC, advised by EFRAG/SARG."},{"id":"cr-s1-q11","session":1,"topic":"Global adoption","question":"According to the session, which statement about worldwide IFRS adoption is accurate?","choices":["IFRS is required in 100+ countries, permitted in 14 more, and not mandatory in the US","IFRS is mandatory in every country in the world","The US requires IFRS for all domestic issuers","IFRS was rejected by the EU in 2005"],"correct_index":0,"explanation":"The fiche is explicit: required in 100+, permitted in a further 14, not mandatory in the US (though the SEC allows IFRS filings by foreign private issuers without reconciliation since Nov 2007)."},{"id":"cr-s1-q12","session":1,"topic":"Principles vs rules","question":"Regarding the principles-based vs rules-based debate, the session states that:","choices":["The distinction is explicitly framed as a false one, and a combination of both approaches is generally necessary","Rules-based standards always eliminate creative accounting","IFRS is purely rules-based and US GAAP is purely principles-based","Principles-based standards require no professional judgement"],"correct_index":0,"explanation":"The lecture explicitly calls principles vs rules a false distinction and notes rules-based standards can instead foster creative accounting by diverting focus to technical detail."},{"id":"cr-s1-q13","session":1,"topic":"IFRS1","question":"IFRS1 (First-time Adoption) primarily addresses:","choices":["The requirements for an entity's first IFRS financial statements, including reconciliation between local GAAP and IFRS for the transition period","The permanent measurement of financial instruments","Consolidation procedures for new subsidiaries","Revenue recognition timing"],"correct_index":0,"explanation":"IFRS1 governs first-time adoption and requires reconciliation between local GAAP and IFRS during the transition period."},{"id":"cr-s1-q14","session":1,"topic":"Academic findings","question":"Which finding on the economic consequences of IFRS adoption is reported in the session?","choices":["Institutional ownership increases significantly after IFRS adoption, but only in countries with strong enforcement","IFRS adoption has no measurable effect on market liquidity anywhere","Audit fees always decrease after mandatory IFRS adoption","Analyst forecast accuracy worsens after IFRS adoption"],"correct_index":0,"explanation":"Florou and Pope (2012), as cited in the fiche: institutional ownership increases, restricted to strong-enforcement countries."},{"id":"cr-s1-q15","session":1,"topic":"Stewardship","question":"Under the Revised Conceptual Framework referenced in this session, stewardship assessment is:","choices":["Folded into the single decision-usefulness objective, not a separate objective","A completely separate, second objective of financial reporting","No longer relevant to financial reporting","Only relevant for private companies"],"correct_index":0,"explanation":"Flagged exam trap carried through the course: stewardship is included within decision-usefulness, not standalone."},{"id":"cr-s2-q1","session":2,"topic":"Status of the Conceptual Framework","question":"The Conceptual Framework:","choices":["Is not itself an IFRS, and a specific IFRS prevails over it in case of conflict","Is itself an accounting standard that overrides individual IFRS","Only applies to non-listed companies","Was first issued in 2018 with no prior version"],"correct_index":0,"explanation":"Explicitly stated: the Conceptual Framework is not an IFRS; specific standards prevail in case of conflict. The first version dates to 1989."},{"id":"cr-s2-q2","session":2,"topic":"Purposes of the Conceptual Framework","question":"Which is NOT one of the Conceptual Framework's stated purposes?","choices":["Setting corporate tax rates","Assisting regulators in developing consistent standards","Assisting preparers when no Standard applies","Assisting users in interpreting Standards"],"correct_index":0,"explanation":"Tax rate setting is not among its three stated purposes (regulators, preparers, users)."},{"id":"cr-s2-q3","session":2,"topic":"Sole objective","question":"According to the Revised Conceptual Framework, the objective of general purpose financial reporting is:","choices":["Decision-usefulness for existing/potential investors, lenders and other creditors — the sole objective","Tax compliance and decision-usefulness as two equal objectives","Stewardship assessment as a standalone second objective","Maximising reported profit"],"correct_index":0,"explanation":"Decision-usefulness is explicitly the sole objective; stewardship is included within it."},{"id":"cr-s2-q4","session":2,"topic":"Fundamental characteristics","question":"The two fundamental qualitative characteristics of useful financial information are:","choices":["Relevance and faithful representation","Comparability and verifiability","Timeliness and understandability","Reliability and materiality"],"correct_index":0,"explanation":"Fundamental = necessary for usefulness: relevance and faithful representation. 'Reliability' is a flagged exam trap — the current term is faithful representation, not reliability."},{"id":"cr-s2-q5","session":2,"topic":"Predictive vs confirmatory value","question":"Information has confirmatory value when it:","choices":["Confirms or changes past/present expectations based on previous evaluations","Is highly predictable year to year","Is used exclusively by regulators","Has no relation to past expectations"],"correct_index":0,"explanation":"Confirmatory value = confirms or changes prior expectations, distinct from predictive value (useful as an input to forming new expectations)."},{"id":"cr-s2-q6","session":2,"topic":"Faithful representation components","question":"A faithful representation of an economic phenomenon requires the depiction to be:","choices":["Complete, neutral, and free from material error","Perfectly free from any error","Biased toward conservative outcomes","Verified by an external auditor before recognition"],"correct_index":0,"explanation":"Faithful representation does NOT require total freedom from error, only freedom from material error, plus completeness and neutrality."},{"id":"cr-s2-q7","session":2,"topic":"Prudence","question":"Under the Revised Conceptual Framework, prudence:","choices":["Supports neutrality by preventing overstatement or understatement of elements","Is in direct conflict with neutrality","Was removed entirely from the framework","Only applies to liabilities, never assets"],"correct_index":0,"explanation":"A flagged exam trap: prudence was reintroduced and explicitly frames it as supporting neutrality, not conflicting with it."},{"id":"cr-s2-q8","session":2,"topic":"Enhancing characteristics","question":"Which four characteristics enhance (but are not on their own sufficient for) usefulness?","choices":["Comparability, verifiability, timeliness, understandability","Relevance, faithful representation, prudence, materiality","Completeness, neutrality, accuracy, precision","Going concern, accruals, consistency, comparability"],"correct_index":0,"explanation":"These are the four enhancing characteristics, distinct from the two fundamental ones."},{"id":"cr-s2-q9","session":2,"topic":"Elements of financial statements","question":"Which of the following is the correct definition of a liability under the Revised Conceptual Framework?","choices":["A present obligation of the entity to transfer an economic resource as a result of past events","A residual interest in the assets of the entity after deducting liabilities","A right that has the potential to produce economic benefits","An increase in assets that results in an increase in equity"],"correct_index":0,"explanation":"That is the liability definition; the other options describe equity, an economic resource, and income respectively."},{"id":"cr-s2-q10","session":2,"topic":"Asset definition","question":"An asset is defined as:","choices":["A present economic resource controlled by the entity as a result of past events","Any item with positive resale value","A resource the entity intends to acquire in the future","Cash and cash equivalents only"],"correct_index":0,"explanation":"Precise definition per the fiche: present economic resource controlled as a result of past events; an economic resource is a right with potential to produce economic benefits."},{"id":"cr-s2-q11","session":2,"topic":"Underlying assumptions","question":"The two underlying assumptions for preparing financial statements are:","choices":["Going concern and accruals basis","Materiality and comparability","Fair value and historical cost","Relevance and verifiability"],"correct_index":0,"explanation":"These are the two underlying assumptions distinguished from the qualitative characteristics."},{"id":"cr-s2-q12","session":2,"topic":"Recognition criteria","question":"An element is recognised in the financial statements only if recognition provides users with:","choices":["Relevant information, a faithful representation, and information whose benefits exceed the costs of providing it","A guarantee of zero measurement uncertainty","Comparability with all other entities in the sector","Legal certainty about the item's existence"],"correct_index":0,"explanation":"These are the three recognition criteria listed in the fiche; note recognition and definition are two separate tests (a flagged exam trap)."},{"id":"cr-s2-q13","session":2,"topic":"Measurement bases","question":"Which two broad measurement bases does the Conceptual Framework describe?","choices":["Historical cost and current value (fair value; value in use/fulfilment value)","Nominal value and replacement value","Book value and market capitalisation","Amortised cost and net realisable value only"],"correct_index":0,"explanation":"Historical cost is most common, sometimes combined with current value approaches such as fair value."},{"id":"cr-s2-q14","session":2,"topic":"Full disclosure constraints","question":"Full disclosure under the Conceptual Framework is limited by:","choices":["Materiality and the cost constraint","Only materiality","Only the cost constraint","Comparability and verifiability"],"correct_index":0,"explanation":"Two pervasive constraints on full disclosure: materiality and the cost-benefit (cost constraint)."},{"id":"cr-s2-q15","session":2,"topic":"Fundamental vs enhancing mix-up","question":"A student states: 'Comparability is a fundamental characteristic that financial information must possess to be useful at all.' This statement is:","choices":["Incorrect — comparability is an enhancing characteristic, not fundamental","Correct as stated","Correct only for listed companies","Correct only under IFRS18"],"correct_index":0,"explanation":"This is one of the explicitly flagged common mistakes: confusing fundamental (relevance, faithful representation) with enhancing (comparability, verifiability, timeliness, understandability) characteristics."},{"id":"cr-s3-q1","session":3,"topic":"IAS1 five components","question":"IAS1 identifies five components of a complete set of financial statements. Which of the following is NOT one of them?","choices":["A separate sustainability report","Statement of financial position","Statement of changes in equity","The notes"],"correct_index":0,"explanation":"The five are: statement of financial position; statement of profit or loss and OCI; statement of changes in equity; statement of cash flows; the notes. A sustainability report is not among them."},{"id":"cr-s3-q2","session":3,"topic":"Accruals basis exception","question":"Which financial statement is explicitly NOT prepared on the accruals basis?","choices":["The statement of cash flows","The statement of financial position","The statement of changes in equity","The statement of comprehensive income"],"correct_index":0,"explanation":"IAS1 carves out the cash flow statement, which is by nature prepared on a cash basis; all other statements are accruals-based."},{"id":"cr-s3-q3","session":3,"topic":"Current asset test","question":"An asset is classified as current if it satisfies:","choices":["Any one of the operating-cycle, held-for-trading, 12-month, or cash/cash-equivalent tests","All four tests simultaneously","Only the 12-month test","Only the cash test"],"correct_index":0,"explanation":"Flagged exam trap: this is an 'or' test (any one condition), not a cumulative 'and' test."},{"id":"cr-s3-q4","session":3,"topic":"Offsetting","question":"Under IAS1's general features, offsetting of assets and liabilities is:","choices":["Prohibited unless another IFRS Standard specifically permits or requires it","Always prohibited with no exceptions","Always permitted","Only relevant to the cash flow statement"],"correct_index":0,"explanation":"Flagged exam trap: offsetting is prohibited by default, but the rule yields where another Standard specifically allows it."},{"id":"cr-s3-q5","session":3,"topic":"Statement of changes in equity formula","question":"The closing balance of an equity component equals:","choices":["Opening balance + total comprehensive income +/- policy-change effects + share issues - dividends paid","Opening balance - total comprehensive income + dividends paid","Only share issues minus dividends paid","Net profit for the period only"],"correct_index":0,"explanation":"This is the reconciliation formula given in the fiche for each component of equity."},{"id":"cr-s3-q6","session":3,"topic":"IFRS18 effective date","question":"IFRS18, which supersedes IAS1, is mandatory for accounting periods:","choices":["Beginning on or after 1 January 2027","Beginning immediately upon issuance in April 2024","Beginning on or after 1 January 2020","That are optional and never become mandatory"],"correct_index":0,"explanation":"Flagged exam trap: IFRS18 does not replace IAS1 immediately — mandatory only for periods beginning on or after 1 Jan 2027."},{"id":"cr-s3-q7","session":3,"topic":"IFRS18 five categories","question":"IFRS18 requires income and expenses in profit or loss to be classified into five categories. Which of these is one of them?","choices":["Investing","Extraordinary items","Discretionary","Non-recurring"],"correct_index":0,"explanation":"The five IFRS18 categories are: operating, investing, financing, income taxes, discontinued operations."},{"id":"cr-s3-q8","session":3,"topic":"IFRS18 subtotals","question":"Which of these is a mandatory subtotal under IFRS18?","choices":["Operating profit or loss","Gross revenue before returns","EBITDA","Net working capital"],"correct_index":0,"explanation":"IFRS18 mandates subtotals including operating profit or loss, profit or loss before financing and income taxes, and profit or loss."},{"id":"cr-s3-q9","session":3,"topic":"Selecting an accounting policy","question":"When no IFRS Standard applies to a transaction, the entity should refer, in descending order of relevance, first to:","choices":["IFRS Standards dealing with similar and related issues","Accepted industry practice directly","The pronouncements of other standard-setters","Whatever produces the lowest reported liability"],"correct_index":0,"explanation":"IAS8's hierarchy: similar/related IFRS first, then the Conceptual Framework, then other standard-setters' pronouncements, then accounting literature/industry practice."},{"id":"cr-s3-q10","session":3,"topic":"Change in accounting policy","question":"A voluntary change in accounting policy is accounted for:","choices":["Retrospectively — comparative figures are adjusted as if the new policy had always applied","Prospectively only","By restating only the current period","By ignoring comparatives entirely"],"correct_index":0,"explanation":"Unless the change stems from applying a new IFRS with its own transition rules, voluntary policy changes are retrospective."},{"id":"cr-s3-q11","session":3,"topic":"Change in accounting estimate","question":"A change in accounting estimate (e.g. revising a useful-life estimate) is accounted for:","choices":["Prospectively — comparative figures are not restated","Retrospectively, restating all prior periods","By treating it as a prior period error","Only at year-end, never mid-year"],"correct_index":0,"explanation":"Flagged exam trap: estimates are always prospective; only accounting policy changes and material prior-period errors are retrospective."},{"id":"cr-s3-q12","session":3,"topic":"Prior period errors","question":"A material prior period error is corrected:","choices":["Retrospectively, by restating comparatives or opening balances for the earliest period presented","Prospectively only","By footnote disclosure alone, with no restatement","Only if discovered within the same reporting period"],"correct_index":0,"explanation":"Material errors must be corrected retrospectively — restating comparative figures, or opening balances if the error predates the earliest period shown."},{"id":"cr-s3-q13","session":3,"topic":"Adjusting vs non-adjusting events","question":"An adjusting event under IAS10 is one that:","choices":["Provides evidence of conditions that existed at the end of the reporting period, requiring the financial statements to be adjusted","Arose entirely after the reporting period and is merely disclosed","Is always related to a change in accounting policy","Only concerns going concern status"],"correct_index":0,"explanation":"Adjusting events (para 8) evidence conditions existing at period-end; non-adjusting events (para 10) arise after period-end and are disclosed only if material."},{"id":"cr-s3-q14","session":3,"topic":"IAS1 vs IAS8","question":"A question asking 'what accounting policies must be disclosed in the notes' concerns:","choices":["IAS1 (general disclosure of policies used)","IAS8 exclusively","IAS10 exclusively","IFRS9"],"correct_index":0,"explanation":"Flagged exam trap: IAS1 requires disclosure of the policies used; IAS8 governs how they are selected/changed. A 'what must be disclosed' question about the policies themselves is IAS1."},{"id":"cr-s3-q15","session":3,"topic":"Materiality","question":"Materiality under IAS1 is judged with reference to:","choices":["Whether omitting, misstating or obscuring an item could reasonably influence users' economic decisions","A fixed percentage of total assets set by the IASB","Whether the item exceeds €1 million","The auditor's personal judgement alone, with no reference to users"],"correct_index":0,"explanation":"The fiche's definition is user-decision-based, not a bright-line numeric threshold."},{"id":"cr-s4-q1","session":4,"topic":"Purpose of IAS7","question":"The statement of cash flows exists because:","choices":["Profit is computed on an accruals basis and is not a reliable indicator of an entity's cash situation","Cash flow is always higher than profit","IFRS requires three balance sheets per year","It replaces the need for a balance sheet"],"correct_index":0,"explanation":"Central rationale: profit ≠ cash because profit is accruals-based; the cash flow statement draws attention to cash problems profit alone might obscure."},{"id":"cr-s4-q2","session":4,"topic":"Bank overdraft treatment","question":"A bank overdraft is treated, for cash flow statement purposes, as:","choices":["Negative cash, netted within cash and cash equivalents","A financing activity cash outflow","An investing activity","Excluded entirely from the statement"],"correct_index":0,"explanation":"Flagged exam trap: an overdraft is netted as negative cash, not shown separately as a financing item."},{"id":"cr-s4-q3","session":4,"topic":"Three activity classes","question":"IAS7 classifies cash flows into which three activities?","choices":["Operating, investing, financing","Trading, holding, disposing","Domestic, foreign, hedged","Current, non-current, contingent"],"correct_index":0,"explanation":"The three IAS7 classes are operating, investing, and financing activities."},{"id":"cr-s4-q4","session":4,"topic":"Classifying a cash flow","question":"Cash received from the sale of property, plant and equipment is classified under:","choices":["Investing activities","Operating activities","Financing activities","It is not shown in the cash flow statement"],"correct_index":0,"explanation":"PP&E disposal proceeds fall under investing activities (acquisition/disposal of long-term assets)."},{"id":"cr-s4-q5","session":4,"topic":"Financing activities example","question":"Which of the following is a financing activity?","choices":["Cash proceeds from issuing debentures","Cash receipts from customers","Cash payments to suppliers","Cash payments to acquire property, plant and equipment"],"correct_index":0,"explanation":"Issuing debt/equity instruments and related repayments are financing activities; the other options are operating or investing."},{"id":"cr-s4-q6","session":4,"topic":"Direct vs indirect method","question":"The direct and indirect methods of presenting operating cash flows:","choices":["Differ only in presentation; both give the same bottom-line change in cash","Give different total cash balances at year end","Are mutually exclusive — an entity must use both","Only the indirect method is permitted under IFRS"],"correct_index":0,"explanation":"Both methods produce the same bottom-line result; only how operating cash flows are presented differs."},{"id":"cr-s4-q7","session":4,"topic":"Indirect method starting point (pre-IFRS18)","question":"The indirect method, before IFRS18, begins with:","choices":["Profit or loss before tax","Profit or loss after tax","Total comprehensive income","Revenue"],"correct_index":0,"explanation":"Pre-IFRS18, the indirect method starts from profit or loss before tax and adjusts from there."},{"id":"cr-s4-q8","session":4,"topic":"Working capital adjustment","question":"In the indirect method, a decrease in trade receivables (a current asset) should be:","choices":["Added, as a source of cash","Subtracted, as a use of cash","Ignored entirely","Treated as a financing activity"],"correct_index":0,"explanation":"Flagged exam trap: a decrease in a current asset (other than cash) is a source of cash and should be added, not subtracted."},{"id":"cr-s4-q9","session":4,"topic":"Pre-IFRS18 treatment of dividends paid","question":"Before IFRS18, dividends paid could be classified under:","choices":["Either operating or financing activities, at the entity's choice","Only investing activities","Only operating activities, with no choice","Only financing activities, with no choice"],"correct_index":0,"explanation":"Pre-IFRS18 rules gave a choice between operating and financing for dividends paid; IFRS18 removes this choice."},{"id":"cr-s4-q10","session":4,"topic":"IFRS18 changes to IAS7","question":"Under IFRS18's amendments to IAS7, dividends paid must now be classified under:","choices":["Financing activities, with no further choice","Operating activities only","Investing activities","Whichever the auditor prefers"],"correct_index":0,"explanation":"IFRS18 removes the previous operating/financing choice, mandating financing activities for dividends paid."},{"id":"cr-s4-q11","session":4,"topic":"IFRS18 and interest paid","question":"Under IFRS18, interest paid must, in most cases, be classified under:","choices":["Financing activities","Operating activities always, with no exceptions","Investing activities","It is no longer disclosed at all"],"correct_index":0,"explanation":"IFRS18 moves interest paid to financing activities 'in most cases,' removing the prior operating/financing choice."},{"id":"cr-s4-q12","session":4,"topic":"IAS7 disclosure","question":"IAS7 requires entities to disclose:","choices":["The components of cash and cash equivalents, reconciled to the statement of financial position","A full forecast of next year's cash flows","Segment cash flow analysis, mandatorily","Undrawn borrowing facilities, mandatorily"],"correct_index":0,"explanation":"Reconciliation of cash/cash-equivalent components to the balance sheet is required; segment analysis and undrawn facilities are only encouraged, not required."},{"id":"cr-s4-q13","session":4,"topic":"Cash equivalents definition","question":"Cash equivalents are:","choices":["Short-term, highly liquid investments readily convertible to known amounts of cash, with insignificant risk of value change","Any investment held for more than one year","Equity investments in listed companies","Trade receivables due within 90 days"],"correct_index":0,"explanation":"The precise IAS7 definition given in the fiche."},{"id":"cr-s4-q14","session":4,"topic":"Common mistake: classification schemes","question":"IAS7's operating/investing/financing classification of cash flows is:","choices":["A separate classification scheme from IFRS18's five P&L categories, applied to a different statement","Identical to IFRS18's five P&L categories","Only relevant if IFRS18 has not yet been adopted","Replaced entirely by IFRS18"],"correct_index":0,"explanation":"Flagged exam trap: don't confuse IAS7's cash flow classes with IFRS18's profit-or-loss categories — separate schemes, separate statements."},{"id":"cr-s5-q1","session":5,"topic":"Three standards, three jobs","question":"Which standard governs the recognition and measurement (not just presentation) of financial instruments?","choices":["IFRS9","IAS32","IFRS7","IAS1"],"correct_index":0,"explanation":"IAS32 = presentation/classification; IFRS9 = recognition/measurement; IFRS7 = disclosure."},{"id":"cr-s5-q2","session":5,"topic":"IAS32 objective","question":"The objective of IAS32 is to:","choices":["Establish principles for presenting financial instruments as liabilities or as equity","Set out how to measure expected credit losses","Regulate segment reporting","Prescribe interest rate benchmarks"],"correct_index":0,"explanation":"IAS32's stated objective is about presentation/classification as liability vs equity."},{"id":"cr-s5-q3","session":5,"topic":"Substance over form","question":"IAS32 classifies an instrument as debt or equity based on:","choices":["The substance of the contractual arrangement, not its legal label","Its legal name alone (e.g. 'shares' = always equity)","Whichever classification minimises reported liabilities","The country of incorporation"],"correct_index":0,"explanation":"Flagged exam trap: legal labels like 'preference shares' do not determine classification; substance governs."},{"id":"cr-s5-q4","session":5,"topic":"Two-part equity test","question":"An instrument is classified as equity only if:","choices":["It clears BOTH Part A (no obligation to deliver cash/exchange unfavourably) AND Part B (settled in issuer's own equity instruments)","It clears EITHER Part A OR Part B","It is labelled as a share in its issuance documents","The issuer chooses to classify it as equity"],"correct_index":0,"explanation":"Flagged exam trap: Part A and Part B are cumulative ('and'), not alternative ('or') conditions."},{"id":"cr-s5-q5","session":5,"topic":"Redeemable preference shares","question":"Redeemable preference shares, which carry a contractual obligation to deliver cash on redemption, are classified as:","choices":["A financial liability, with dividends treated as an expense","Equity, with dividends treated as a distribution","Neither an asset nor a liability","A contingent liability"],"correct_index":0,"explanation":"They fail Part A (obligation to deliver cash), so they are a liability, and their 'dividends' are an expense, not equity distributions."},{"id":"cr-s5-q6","session":5,"topic":"Compound instrument","question":"A convertible bond is an example of:","choices":["A compound financial instrument, split into liability and equity components","A pure equity instrument","A pure derivative","An instrument outside the scope of IAS32"],"correct_index":0,"explanation":"Convertible loan stock contains both a liability component (the loan) and an equity component (the conversion option) — split accounting applies."},{"id":"cr-s5-q7","session":5,"topic":"Split accounting discount rate","question":"When splitting a compound instrument, the liability component is measured by discounting the contractual cash flows at:","choices":["The market rate for an equivalent instrument without the conversion option","The instrument's own coupon rate","Zero percent","The risk-free rate regardless of credit risk"],"correct_index":0,"explanation":"Flagged exam trap: use the market rate for an equivalent non-convertible instrument, not the coupon rate — the gap between the two is what creates the equity component."},{"id":"cr-s5-q8","session":5,"topic":"Equity component of a compound instrument","question":"The equity component of a compound instrument is calculated as:","choices":["Issue proceeds minus the liability component (the residual)","The coupon rate multiplied by face value","Always zero unless separately negotiated","The market value of the shares on issue date"],"correct_index":0,"explanation":"The equity component is the residual: total proceeds less the liability component's present value."},{"id":"cr-s5-q9","session":5,"topic":"Presenting interest and dividends","question":"Interest and dividends relating to a financial LIABILITY are normally:","choices":["Recognised as an expense in profit or loss","Debited directly to equity","Excluded from the financial statements","Presented only in the notes, never in the P&L"],"correct_index":0,"explanation":"Distributions on liability-classified instruments run through profit or loss; only equity distributions bypass P&L."},{"id":"cr-s5-q10","session":5,"topic":"Presenting equity distributions","question":"Distributions to holders of an equity instrument are:","choices":["Debited directly to equity, never passing through profit or loss","Recognised as an expense in profit or loss","Classified as a contingent liability","Recognised as other comprehensive income"],"correct_index":0,"explanation":"Equity distributions never touch profit or loss — they are debited directly to equity."},{"id":"cr-s5-q11","session":5,"topic":"Financial asset definition","question":"A financial asset includes:","choices":["Cash, an equity instrument of another entity, or a contractual right to receive cash/another financial asset","Only physical inventory","Only listed shares","Only government bonds"],"correct_index":0,"explanation":"The IAS32 definition is broad and contract-based, covering cash, equity instruments of others, and contractual rights to receive cash or other financial assets."},{"id":"cr-s5-q12","session":5,"topic":"Derivative","question":"A derivative, as described in this session, is an instrument that:","choices":["Transfers the financial risks of an underlying primary financial instrument","Always represents a direct ownership stake in a company","Cannot be used for hedging","Is always classified as equity"],"correct_index":0,"explanation":"Derivatives transfer risk on an underlying, letting parties effectively bet on future changes in that underlying."},{"id":"cr-s5-q13","session":5,"topic":"Recognition vs measurement","question":"A question asking 'when should this financial asset first appear on the balance sheet' is governed by:","choices":["IFRS9 (recognition)","IAS32 (presentation)","IFRS7 (disclosure)","IAS1"],"correct_index":0,"explanation":"Recognition (timing of first appearance) and measurement (amount) both fall under IFRS9, distinct from IAS32's presentation/classification role."},{"id":"cr-s5-q14","session":5,"topic":"Common mistake: dividend classification","question":"A student assumes that because an instrument pays 'dividends,' those payments must be an equity distribution. This assumption is:","choices":["Wrong when the underlying instrument is in substance a liability (e.g. redeemable preference shares)","Always correct","Only wrong for bonds","Only relevant under US GAAP"],"correct_index":0,"explanation":"The label 'dividend' does not override substance-over-form classification; if the instrument is a liability, the payment is an expense."},{"id":"cr-s6-q1","session":6,"topic":"IFRS9 recognition trigger","question":"A financial asset or liability is recognised under IFRS9 when:","choices":["The entity becomes party to the contractual provisions of the instrument","Cash actually changes hands","The instrument is registered with a regulator","The year-end audit is completed"],"correct_index":0,"explanation":"Recognition occurs when the contract becomes binding, not when cash moves — same trigger as compound instruments in Session 5."},{"id":"cr-s6-q2","session":6,"topic":"Initial measurement","question":"Financial assets and financial liabilities are initially measured at:","choices":["Fair value","Historical cost, always","Amortised cost","Nominal value"],"correct_index":0,"explanation":"Flagged exam trap: initial measurement is always fair value for BOTH assets and liabilities, even when subsequent measurement will be amortised cost."},{"id":"cr-s6-q3","session":6,"topic":"Four asset categories","question":"Which of the following is NOT one of IFRS9's four measurement categories for financial assets?","choices":["Historical cost through equity","Amortised cost","Debt at FVOCI","FVPL"],"correct_index":0,"explanation":"The four are: amortised cost, debt-FVOCI, equity-FVOCI (designated), and FVPL. 'Historical cost through equity' does not exist as a category."},{"id":"cr-s6-q4","session":6,"topic":"Debt-FVOCI vs equity-FVOCI","question":"The key difference between debt-FVOCI and equity-FVOCI is:","choices":["Debt-FVOCI gains/losses are eventually reclassified to P&L on derecognition; equity-FVOCI gains/losses never are","They are identical in every respect","Equity-FVOCI always recycles to P&L; debt-FVOCI never does","Only debt-FVOCI exists; equity-FVOCI is not a real category"],"correct_index":0,"explanation":"Flagged exam trap: the recycling rule differs by instrument type, not just by the FVOCI label — this is the single most tested distinction."},{"id":"cr-s6-q5","session":6,"topic":"Amortised cost test (two-part)","question":"A financial asset is measured at amortised cost only if:","choices":["Its cash flows are solely payments of principal and interest AND the entity's objective is to hold it to collect those cash flows","Either the SPPI test or the hold-to-collect test is met (not both)","It is listed on a stock exchange","The entity designates it as such at its discretion, with no further conditions"],"correct_index":0,"explanation":"Both the SPPI (solely payments of principal and interest) test and the business-model (hold-to-collect) test must hold — failing either forces fair value measurement."},{"id":"cr-s6-q6","session":6,"topic":"Amortised cost formula","question":"Amortised cost of a financial asset equals:","choices":["Initial carrying amount + interest earned at the effective rate - repayments received to date","Fair value at the reporting date","Historical cost, unadjusted","Face value minus accumulated depreciation"],"correct_index":0,"explanation":"This is the amortised cost formula, building up from the initial fair value using the effective interest method."},{"id":"cr-s6-q7","session":6,"topic":"Effective interest rate","question":"The effective interest rate is:","choices":["The rate that exactly discounts estimated future cash receipts to the initial carrying amount","Always equal to the coupon/stated rate","Set by the central bank","Irrelevant once an asset is measured at FVPL"],"correct_index":0,"explanation":"Flagged exam trap: don't confuse the effective rate (calibrated to actual price and cash flows) with the coupon/stated rate — a zero-coupon bond has 0% coupon but a positive effective rate."},{"id":"cr-s6-q8","session":6,"topic":"Zero-coupon bond example","question":"In the zero-coupon bond example (€1,000,000, 8 years, yield 10%), the liability's carrying amount:","choices":["Accretes each year toward €1,000,000 via accrued interest at the effective rate, with no cash interest paid","Stays constant at issue proceeds throughout the 8 years","Decreases each year","Equals €1,000,000 from day one"],"correct_index":0,"explanation":"No cash interest is paid on a zero-coupon bond; instead the carrying amount grows via the effective-rate accrual until it reaches face value at maturity."},{"id":"cr-s6-q9","session":6,"topic":"Subsequent measurement of liabilities","question":"Most financial liabilities are subsequently measured at:","choices":["Amortised cost using the effective interest method","Fair value through profit or loss by default","Historical cost with no adjustment","Net realisable value"],"correct_index":0,"explanation":"Amortised cost is the default for liabilities; fair value applies only to liabilities held for trading."},{"id":"cr-s6-q10","session":6,"topic":"Trade receivables practical expedient","question":"Trade receivables may be measured at:","choices":["The original invoice amount, when the effect of discounting is not material","Fair value through OCI, mandatorily","Amortised cost using a market rate, mandatorily, with no exceptions","Net present value regardless of materiality"],"correct_index":0,"explanation":"A practical expedient exists: invoice amount is acceptable when discounting effects are immaterial."},{"id":"cr-s6-q11","session":6,"topic":"FVPL as default","question":"The FVPL category for financial assets is best described as:","choices":["The default/residual category for whatever does not qualify for the other three categories","Reserved exclusively for government bonds","Never applicable to equity instruments","Only used for liabilities, never assets"],"correct_index":0,"explanation":"FVPL captures debt instruments, derivatives, and equity instruments that don't meet the criteria for the other categories."},{"id":"cr-s6-q12","session":6,"topic":"IFRS9 vs IAS39","question":"IFRS9 replaced IAS39:","choices":["From 1 January 2018, with earlier application permitted","Immediately upon issuance with no transition","Only for US-listed entities","Only for equity instruments, leaving debt instruments under IAS39"],"correct_index":0,"explanation":"IFRS9 replaced IAS39 from 1 Jan 2018 (earlier application was permitted) and applies to all entities and financial instrument types, subject to eleven scope exceptions."},{"id":"cr-s6-q13","session":6,"topic":"Held-to-collect test failure","question":"If a debt instrument fails the 'hold to collect' business model test (e.g. it is actively traded), it is measured at:","choices":["Fair value (FVPL or FVOCI, not amortised cost)","Amortised cost regardless","Historical cost","Cannot be measured at all under IFRS9"],"correct_index":0,"explanation":"Failing either leg of the two-part amortised-cost test forces fair-value measurement."},{"id":"cr-s7-q1","session":7,"topic":"IFRS9's five measurement areas","question":"IFRS9's measurement rules are framed as addressing which set of topics?","choices":["Initial measurement, subsequent measurement, reclassifications, gains/losses, and impairment/uncollectability","Only initial measurement and disclosure","Only impairment and derecognition","Presentation, classification, and disclosure"],"correct_index":0,"explanation":"Flagged exam trap: impairment/uncollectability is explicitly one of IFRS9's own measurement topics, not a separate standard."},{"id":"cr-s7-q2","session":7,"topic":"ECL model vs incurred loss model","question":"The expected credit loss (ECL) model under IFRS9, compared to the old incurred-loss model under IAS39:","choices":["Recognises a loss allowance from initial recognition onward, without waiting for a triggering loss event","Only recognises losses after a formal default occurs","Is identical to the IAS39 approach","Applies only to equity instruments"],"correct_index":0,"explanation":"IFRS9's ECL model is forward-looking; the old IAS39 model waited for objective evidence of a loss event."},{"id":"cr-s7-q3","session":7,"topic":"ECL Stage 1","question":"Under the three-stage ECL model, Stage 1 assets (no significant increase in credit risk) have their loss allowance measured at:","choices":["12-month expected credit losses","Lifetime expected credit losses","Zero, since no risk has increased","The full carrying amount"],"correct_index":0,"explanation":"Stage 1 uses 12-month ECL; Stages 2 and 3 use lifetime ECL."},{"id":"cr-s7-q4","session":7,"topic":"ECL Stage 3","question":"Stage 3 (credit-impaired) assets differ from Stage 2 in that:","choices":["Interest revenue is calculated on the net (impaired) carrying amount rather than the gross amount","They use 12-month ECL instead of lifetime ECL","No loss allowance is recognised at all","They automatically move back to Stage 1 after one year"],"correct_index":0,"explanation":"Both Stage 2 and Stage 3 use lifetime ECL, but Stage 3 additionally changes how interest revenue is calculated (net rather than gross carrying amount)."},{"id":"cr-s7-q5","session":7,"topic":"IFRS7 purpose","question":"The purpose of IFRS7 disclosures is to enable users to evaluate:","choices":["The significance of financial instruments for the entity, and the nature/extent of risks arising from them","Only the entity's tax position","Only historical share price performance","Only management compensation"],"correct_index":0,"explanation":"IFRS7's two-part purpose as stated in the fiche: significance for financial position/performance, and risk exposure/management."},{"id":"cr-s7-q6","session":7,"topic":"Three IFRS7 risk categories","question":"IFRS7 requires disclosure covering which three categories of risk?","choices":["Market risk, credit risk, liquidity risk","Political risk, currency risk, reputational risk","Operational risk, strategic risk, compliance risk","Interest rate risk, inflation risk, tax risk"],"correct_index":0,"explanation":"The three IFRS7 risk categories are market risk, credit risk, and liquidity risk."},{"id":"cr-s7-q7","session":7,"topic":"Market risk definition","question":"Market risk, under IFRS7, refers to:","choices":["Exposure to changes in market prices (interest rates, FX rates, equity prices) affecting financial instrument values","The risk that a counterparty defaults","The risk of running out of cash to meet obligations","The risk of a stock exchange closing"],"correct_index":0,"explanation":"Market risk is specifically about price-driven value changes; credit risk is counterparty default; liquidity risk is meeting obligations."},{"id":"cr-s7-q8","session":7,"topic":"Common mistake: choosing which risks to disclose","question":"IFRS7 expects an entity to disclose:","choices":["All three risk categories where relevant to its instruments, not a choice of just one","Only the single risk category management considers most important","Only market risk","Only credit risk, since it is the most common"],"correct_index":0,"explanation":"Flagged exam trap: market, credit and liquidity risk are not alternatives — all three should be covered where relevant."},{"id":"cr-s7-q9","session":7,"topic":"IFRS7 vs IFRS9","question":"A question asking 'what must be disclosed about the entity's exposure to interest-rate risk' concerns:","choices":["IFRS7","IFRS9","IAS32","IAS1"],"correct_index":0,"explanation":"Flagged exam trap: disclosure of risk exposures is an IFRS7 matter, even though it concerns instruments defined/measured under IAS32/IFRS9."},{"id":"cr-s7-q10","session":7,"topic":"Liquidity risk definition","question":"Liquidity risk is the risk that:","choices":["An entity will encounter difficulty meeting obligations associated with its financial liabilities","A financial instrument's market price will fall","A counterparty will default on a receivable","Interest rates will rise unexpectedly"],"correct_index":0,"explanation":"Liquidity risk specifically concerns the entity's own ability to meet its financial obligations as they fall due."},{"id":"cr-s8-q1","session":8,"topic":"Berkshire case background","question":"Berkshire Hathaway's Q1 2018 reported net loss was primarily driven by:","choices":["A US GAAP rule change requiring unrealised equity-security gains/losses to flow through earnings","An actual decline in Berkshire's core operating business","A change to IFRS9","A restatement of prior-year goodwill"],"correct_index":0,"explanation":"The rule change (ASU 2016-01) forced unrealised fair-value movements into earnings; operating earnings were actually strongly positive at $5.288bn."},{"id":"cr-s8-q2","session":8,"topic":"US GAAP vs IFRS in the case","question":"The Berkshire case's rule change (ASU 2016-01) is:","choices":["A US GAAP change, used as a real-world hook, not an IFRS rule","An IFRS9 amendment","An IAS32 amendment","An update to the Conceptual Framework"],"correct_index":0,"explanation":"Flagged exam trap: do not cite ASU 2016-01 as IFRS law — it's US GAAP, used only to frame the comparison to IFRS9."},{"id":"cr-s8-q3","session":8,"topic":"Default classification for equity investments","question":"Under IFRS9, equity investments default to:","choices":["FVTPL (fair value through profit or loss)","Amortised cost","FVOCI automatically, with no election needed","Historical cost"],"correct_index":0,"explanation":"FVTPL is the default; FVOCI is only available via an irrevocable election."},{"id":"cr-s8-q4","session":8,"topic":"FVOCI election scope","question":"The IFRS9 equity FVOCI election is available:","choices":["Only for equity instruments that are not held for trading","For any financial instrument, including debt held for trading","Only for government bonds","Only for instruments already publicly listed"],"correct_index":0,"explanation":"Flagged exam trap: FVOCI election for equity is explicitly restricted to non-trading holdings."},{"id":"cr-s8-q5","session":8,"topic":"FVOCI election mechanics","question":"The equity FVOCI election is:","choices":["Irrevocable, made instrument by instrument at initial recognition","Revocable at any time","Made once for the entire portfolio as a blanket policy","Automatic once an instrument is held for more than a year"],"correct_index":0,"explanation":"Flagged exam trap: it cannot be made as a blanket portfolio policy, and cannot be reversed later."},{"id":"cr-s8-q6","session":8,"topic":"Dividends under equity FVOCI","question":"Under the equity FVOCI election, dividends received are:","choices":["Still generally recognised in profit or loss","Always recognised in OCI along with fair-value changes","Never recognised at all","Deducted from the cost of the investment"],"correct_index":0,"explanation":"Flagged exam trap: only fair-value changes go to OCI under FVOCI — dividends still typically hit P&L."},{"id":"cr-s8-q7","session":8,"topic":"Recycling under equity FVOCI","question":"When an equity investment held under FVOCI is disposed of, the accumulated OCI balance:","choices":["Is never reclassified ('recycled') to profit or loss, even on disposal","Is automatically recycled to profit or loss on sale, same as debt-FVOCI","Is written off to expense immediately","Must be recycled to retained earnings via profit or loss"],"correct_index":0,"explanation":"Flagged exam trap, the single most tested FVOCI distinction: equity-FVOCI NEVER recycles, unlike debt-FVOCI."},{"id":"cr-s8-q8","session":8,"topic":"Worked example: FVTPL treatment","question":"In the worked example (cost 100, year-end fair value 75, dividend 4, later sold for 90), under FVTPL the year-end fair-value loss of 25 is recognised:","choices":["In profit or loss, alongside the dividend income of 4","In OCI only","As a reduction of share capital","Nowhere, since it is unrealised"],"correct_index":0,"explanation":"Under the FVTPL default, all fair-value changes (including unrealised ones) flow through profit or loss."},{"id":"cr-s8-q9","session":8,"topic":"Worked example: FVOCI treatment","question":"In the same example, under the FVOCI election, that year's profit or loss shows:","choices":["Only the dividend of 4; the fair-value loss of 25 goes to OCI","Both the dividend and the fair-value loss, total 29 in P&L","Only the fair-value loss, not the dividend","Zero, since both items go to OCI"],"correct_index":0,"explanation":"Under FVOCI, only the dividend touches P&L; the fair-value movement is diverted to OCI, never recycled even on later disposal."},{"id":"cr-s8-q10","session":8,"topic":"ECL impairment for equity FVOCI","question":"For equity instruments held under the FVOCI election:","choices":["There is no separate expected-credit-loss impairment model, unlike debt instruments","The same three-stage ECL model as debt applies in full","Impairment is tested only every 5 years","Impairment can never be recognised under any circumstances"],"correct_index":0,"explanation":"A specific feature flagged as exam-critical: unlike debt-FVOCI/amortised cost, equity-FVOCI has no separate ECL impairment model."},{"id":"cr-s8-q11","session":8,"topic":"The case's own framing","question":"The Berkshire case describes itself as:","choices":["A presentation case more than a valuation case","A pure valuation case with no presentation angle","An audit-failure case","A revenue recognition case"],"correct_index":0,"explanation":"The debate is about which financial statement line should show a correctly-measured fair-value change, not about what the fair value actually is."},{"id":"cr-s8-q12","session":8,"topic":"Applying the classification checklist","question":"The case's standard decision sequence for classifying a financial instrument begins with:","choices":["Classifying the instrument under IAS32 (asset/liability/equity)","Determining the disclosure requirements under IFRS7","Estimating expected credit losses","Deciding on the discount rate"],"correct_index":0,"explanation":"The sequence is: IAS32 classification -> IFRS9 initial measurement at fair value -> subsequent measurement -> presentation (P&L vs OCI)."},{"id":"cr-s9-q1","session":9,"topic":"IAS16 scope exclusions","question":"Which of the following is explicitly OUTSIDE the scope of IAS16?","choices":["Investment property (covered by IAS40)","Machinery used in production","Office buildings used for administration","Delivery vehicles"],"correct_index":0,"explanation":"IAS16 excludes PP&E held for sale (IFRS5), biological assets (IAS41), exploration/evaluation assets (IFRS6), mineral rights/reserves, and investment property (IAS40)."},{"id":"cr-s9-q2","session":9,"topic":"PP&E definition","question":"Property, plant and equipment is defined as tangible assets that are:","choices":["Held for use in production/supply, rental, or admin purposes AND expected to be used for more than one period","Held exclusively for resale within the normal operating cycle","Intangible resources controlled by the entity","Any asset with a cost exceeding €10,000"],"correct_index":0,"explanation":"The two-part IAS16 definition: use purpose (production/supply/rental/admin) plus expected use beyond one period."},{"id":"cr-s9-q3","session":9,"topic":"Recognition test","question":"The cost of a PP&E item is recognised as an asset only if:","choices":["The cost can be measured reliably AND it is probable future economic benefits will flow to the entity","It cost more than a materiality threshold set by the IASB","It was purchased with cash, not financed","The board formally approves the purchase"],"correct_index":0,"explanation":"Both conditions (reliable measurement and probable future benefits) must hold — an 'and' test."},{"id":"cr-s9-q4","session":9,"topic":"Three elements of initial cost","question":"Which three elements make up an asset's initial cost under IAS16?","choices":["Purchase price; directly attributable costs; estimated dismantling/restoration costs","Purchase price; staff training; feasibility studies","Purchase price; marketing costs; overheads","Purchase price only, with all other costs expensed"],"correct_index":0,"explanation":"The three cost elements listed in the fiche; note staff training and feasibility studies are explicitly EXCLUDED."},{"id":"cr-s9-q5","session":9,"topic":"Directly attributable costs","question":"Which of the following is a directly attributable cost that CAN be capitalised?","choices":["Installation and calibration costs","Administrative overheads","Staff training costs","Costs of abnormal waste in self-construction"],"correct_index":0,"explanation":"Directly attributable costs necessary to bring the asset into operation include professional fees, delivery/handling, site preparation, and installation/calibration."},{"id":"cr-s9-q6","session":9,"topic":"Capitalisation cutoff","question":"Capitalisation of costs into a PP&E item's carrying amount stops:","choices":["Once the asset is capable of operating as intended by management","Only once the asset is operating at full planned capacity","Only once the asset generates positive net income","After exactly 12 months of use"],"correct_index":0,"explanation":"Flagged exam trap: the cutoff is 'capable of operating,' not 'actually operating at full capacity.'"},{"id":"cr-s9-q7","session":9,"topic":"Excluded costs example","question":"In the supermarket renovation example, which cost CANNOT be capitalised?","choices":["Wages of staff preparing the shop before opening","Renovation costs necessary to bring the store into its intended condition","Structural repairs required before opening","Installation of new shelving required before opening"],"correct_index":0,"explanation":"Ordinary staffing/utility costs that would be incurred regardless of the renovation are operating costs, not costs of reaching the intended condition."},{"id":"cr-s9-q8","session":9,"topic":"Component approach","question":"The component approach to depreciation requires that:","choices":["Each significant part of a PP&E item with a materially different cost/life be depreciated separately","An entire asset always be depreciated as one single block","Only buildings use component depreciation, never machinery","Components are only relevant for intangible assets"],"correct_index":0,"explanation":"Example given: an aircraft's engine, seats and airframe have different useful lives and are depreciated on separate schedules."},{"id":"cr-s9-q9","session":9,"topic":"Borrowing costs, qualifying asset","question":"A qualifying asset under IAS23 is one that:","choices":["Necessarily takes a substantial period of time to get ready for its intended use or sale","Is financed entirely with equity","Costs more than €1 million","Is always a financial instrument"],"correct_index":0,"explanation":"The IAS23 definition given in the fiche."},{"id":"cr-s9-q10","session":9,"topic":"Borrowing costs, specific vs general","question":"For an asset funded by a pool of general borrowings, the capitalised borrowing cost uses:","choices":["The weighted average interest rate on general borrowings during the capitalisation period","The interest rate on the single largest general borrowing","The specific-borrowing rate method regardless of funding source","Zero, since general borrowings cannot be capitalised"],"correct_index":0,"explanation":"Flagged exam trap: mixing up specific-borrowing and general-borrowing methods overstates or understates the capitalised amount — general funding requires the weighted average rate."},{"id":"cr-s9-q11","session":9,"topic":"Machine cost worked example","question":"In the €100 machine example, which cost was EXCLUDED from the capitalised total of €133?","choices":["€5 storage cost, incurred because the plant was not yet ready","€10 transport to the plant","€11 consultancy fees related to calibration","€7 sales tax"],"correct_index":0,"explanation":"Storage costs incurred while waiting for the plant to be ready are not directly attributable to bringing THIS asset to its intended condition, so they are excluded."},{"id":"cr-s9-q12","session":9,"topic":"Service contract fee","question":"A separate servicing contract fee paid alongside an equipment purchase is:","choices":["Not part of the asset's cost — it is a period expense for a future service","Always capitalised as part of the asset's cost","Deducted from the purchase price","Treated as a provision under IAS37"],"correct_index":0,"explanation":"Flagged exam trap: a service contract fee (future period expense) is not a cost of bringing the asset into use, even if invoiced together with the purchase."},{"id":"cr-s10-q1","session":10,"topic":"Subsequent costs: capitalise or expense","question":"Which of the following subsequent PP&E expenditure should be CAPITALISED?","choices":["A major, legally mandated inspection that is non-routine","Ordinary repairs and maintenance","Costs of moving an asset from one location to another","Routine servicing"],"correct_index":0,"explanation":"Capitalise: additions/improvements/replacements that increase future service potential, and major non-routine inspections. Expense: ordinary repairs, re-arrangement/re-organisation costs."},{"id":"cr-s10-q2","session":10,"topic":"Component replacement","question":"When a significant component of an asset is replaced, the standard approach is to:","choices":["Derecognise the old component's remaining carrying amount and capitalise the new component's cost","Simply add the new cost on top of the old carrying amount with no derecognition","Expense the entire replacement immediately","Treat it as a prior period error"],"correct_index":0,"explanation":"This mirrors the component approach: derecognise what's being replaced (recognising any loss), then capitalise the new component."},{"id":"cr-s10-q3","session":10,"topic":"Wall lining worked example","question":"Furnace carrying amount €320,000 (of which €10,000 is the old lining), new lining costs €80,000. The new carrying amount is:","choices":["€390,000 (320,000 + 80,000 - 10,000)","€400,000 (320,000 + 80,000)","€310,000 (320,000 - 10,000)","€80,000, replacing the whole furnace value"],"correct_index":0,"explanation":"New carrying amount = old carrying amount + new component cost - derecognised old component carrying amount."},{"id":"cr-s10-q4","session":10,"topic":"Cost model","question":"Under the cost model, an item of PP&E is carried at:","choices":["Cost less accumulated depreciation less accumulated impairment losses","Fair value at each reporting date","Historical cost with no depreciation ever charged","Net realisable value"],"correct_index":0,"explanation":"The cost model formula per IAS16 par 30."},{"id":"cr-s10-q5","session":10,"topic":"Three depreciation methods","question":"Which depreciation method produces a charge based on the asset's actual output or usage?","choices":["Units-of-production","Straight-line","Diminishing-balance","Revaluation"],"correct_index":0,"explanation":"Units-of-production ties the charge to output/usage; straight-line is constant; diminishing-balance decreases over time."},{"id":"cr-s10-q6","session":10,"topic":"Land depreciation","question":"Land, when purchased jointly with a building:","choices":["Is not depreciated and must be accounted for separately from the building","Is depreciated over the same life as the building","Is expensed immediately on acquisition","Is always classified as investment property"],"correct_index":0,"explanation":"Land is explicitly not depreciated and must be separated from any building acquired with it."},{"id":"cr-s10-q7","session":10,"topic":"Revaluation model application","question":"The revaluation model, once adopted, must be applied:","choices":["To an entire class of PP&E, not selectively to individual assets within a class","To only the single most valuable asset in a class","Only to land, never to buildings","Retroactively to all prior years automatically"],"correct_index":0,"explanation":"Selective revaluation within a class is not permitted."},{"id":"cr-s10-q8","session":10,"topic":"First revaluation surplus","question":"The first-ever revaluation surplus on an asset (no prior deficit) is:","choices":["Credited to a revaluation reserve via OCI, not touching profit or loss","Recognised entirely in profit or loss","Split 50/50 between OCI and profit or loss automatically","Ignored until the asset is sold"],"correct_index":0,"explanation":"First surplus -> OCI/reserve. First deficit -> P&L. Subsequent moves reverse the prior one first."},{"id":"cr-s10-q9","session":10,"topic":"Subsequent deficit reversing a reserve","question":"A subsequent revaluation deficit that partly reverses a prior surplus sitting in the revaluation reserve is:","choices":["First debited against that reserve balance, with only the excess going to profit or loss","Entirely debited to profit or loss regardless of the reserve","Entirely absorbed by the reserve no matter how large","Never permitted under IAS16"],"correct_index":0,"explanation":"The reserve absorbs the deficit first; only the excess beyond the reserve balance hits P&L."},{"id":"cr-s10-q10","session":10,"topic":"Depreciation after revaluation","question":"Under the IAS16 revaluation model, an asset carried at a revalued amount:","choices":["Continues to be depreciated (only the rate/base may need adjusting)","Is never depreciated again once revalued","Is depreciated only if it is a building, not machinery","Has its depreciation charge fixed permanently at the original rate"],"correct_index":0,"explanation":"Assets under the revaluation model continue to be depreciated — an important contrast with investment property under IAS40's fair value model."},{"id":"cr-s10-q11","session":10,"topic":"IAS40 investment property definition","question":"Investment property, under IAS40, is property held to:","choices":["Earn rentals or for capital appreciation, or both","Be used in the production or supply of goods/services","Be used for administrative purposes","Be sold within the normal operating cycle as inventory"],"correct_index":0,"explanation":"Owner-occupied property (production/supply/admin use) stays within IAS16; investment property is for rental/appreciation."},{"id":"cr-s10-q12","session":10,"topic":"IAS40 fair value model, key contrasts with IAS16","question":"Under the IAS40 fair value model, unlike IAS16's revaluation model:","choices":["Fair value is remeasured every year, the property is not depreciated, and gains/losses go through profit or loss (not OCI)","Fair value is remeasured every 3-5 years, same as IAS16","The property continues to be depreciated, same as IAS16","Gains and losses go through a revaluation reserve via OCI, same as IAS16"],"correct_index":0,"explanation":"Three key contrasts flagged in the fiche: annual (not 3-5 yearly) remeasurement, no depreciation, and P&L (not OCI) treatment for both gains and losses."},{"id":"cr-s10-q13","session":10,"topic":"Diminishing balance worked example","question":"Machine cost €40,000, 60% diminishing-balance rate. What is the Year 1 depreciation charge?","choices":["€24,000 (60% x 40,000)","€9,744","€40,000","€16,000"],"correct_index":0,"explanation":"Year 1 charge = 60% x 40,000 = 24,000, leaving a net book value of 16,000 to depreciate in Year 2."},{"id":"cr-s10-q14","session":10,"topic":"Common mistake: investment property depreciation","question":"A student depreciates an investment property that is measured under the IAS40 fair value model. This is:","choices":["Incorrect — properties measured at fair value under IAS40 are not depreciated","Correct, since all property must be depreciated","Correct only if the property is a building, not land","Irrelevant since IAS40 does not address depreciation at all"],"correct_index":0,"explanation":"Flagged exam trap: this is the opposite of PP&E under the IAS16 revaluation model, where depreciation continues."},{"id":"cr-s11-q1","session":11,"topic":"Intangible asset three-part definition","question":"An intangible asset must be, simultaneously:","choices":["Non-monetary, identifiable, and without physical substance","Monetary, separable, and tangible","Identifiable, tangible, and monetary","Non-monetary and tangible only"],"correct_index":0,"explanation":"All three conditions must hold together per IAS38."},{"id":"cr-s11-q2","session":11,"topic":"Identifiability","question":"An intangible asset is identifiable if it is:","choices":["Separable from the entity, OR arises from contractual/legal rights","Always separable AND arises from legal rights simultaneously","Purchased for cash","Recorded in a public trademark registry"],"correct_index":0,"explanation":"Either condition suffices (an 'or' test) — this is what distinguishes a specific intangible from goodwill, which cannot be separated from the business."},{"id":"cr-s11-q3","session":11,"topic":"Goodwill and identifiability","question":"Goodwill cannot be recognised as a specific intangible asset because it:","choices":["Cannot be separated from the business as a whole (fails identifiability)","Has no future economic benefits","Is always negative in value","Is a monetary item"],"correct_index":0,"explanation":"Identifiability is exactly what goodwill lacks by definition."},{"id":"cr-s11-q4","session":11,"topic":"Four acquisition routes","question":"An intangible asset acquired as part of a business combination is initially measured at:","choices":["Fair value, per IFRS3","Cost, per separate-acquisition rules","Nominal amount, per IAS20","Zero, since it was not separately purchased"],"correct_index":0,"explanation":"The four routes: separate acquisition (cost), business combination (fair value/IFRS3), government grant (fair value or nominal + directly attributable costs/IAS20), internally generated (capitalised outlays subject to R&D split)."},{"id":"cr-s11-q5","session":11,"topic":"Items that always fail recognition","question":"Which of the following can NEVER be recognised as an intangible asset when internally generated?","choices":["An internally generated customer list","A patent purchased from a third party","A trademark acquired in a business combination","Software meeting all six development criteria"],"correct_index":0,"explanation":"Internally generated trademarks, mastheads, publishing titles and customer lists can never be recognised — but the SAME items CAN be recognised if acquired externally or via a business combination."},{"id":"cr-s11-q6","session":11,"topic":"Revaluation model for intangibles","question":"The revaluation model for intangible assets can be applied:","choices":["Only where fair value can be determined by reference to an active market (rare — e.g. taxi licences)","For any intangible asset at management's discretion","Only for goodwill","Only for internally generated intangibles"],"correct_index":0,"explanation":"Active markets for intangibles are rare — the fiche gives production quotas, fishing licences and taxi licences as the stated examples."},{"id":"cr-s11-q7","session":11,"topic":"Finite vs indefinite useful life","question":"An intangible asset with an INDEFINITE useful life is:","choices":["Not amortised, but tested for impairment at least annually","Amortised over 10 years by default","Never tested for impairment","Automatically reclassified as goodwill"],"correct_index":0,"explanation":"Indefinite-life intangibles (and goodwill) are never amortised but must be tested for impairment at least annually."},{"id":"cr-s11-q8","session":11,"topic":"Contractual/legal rights and useful life","question":"Where an intangible arises from contractual or legal rights, its useful life:","choices":["Cannot exceed the duration of those rights, though it may be shorter","Is always indefinite regardless of the rights' duration","Is fixed at exactly 20 years under IAS38","Is irrelevant to amortisation"],"correct_index":0,"explanation":"Useful life is capped by the legal/contractual duration, but can be shorter if the entity expects to use it for less time."},{"id":"cr-s11-q9","session":11,"topic":"Research vs development","question":"Research expenditure is:","choices":["Always expensed as incurred, with no exceptions","Capitalised if technical feasibility is demonstrated","Capitalised automatically once a patent is filed","Split 50/50 between expense and capitalisation"],"correct_index":0,"explanation":"Flagged exam trap: research is NEVER capitalised — only development expenditure is even potentially capitalisable."},{"id":"cr-s11-q10","session":11,"topic":"Development expenditure capitalisation","question":"Development expenditure may be capitalised only if the entity can demonstrate:","choices":["All six criteria simultaneously (technical feasibility, intention, ability to use/sell, probable future benefits, adequate resources, reliable measurement)","Just technical feasibility, nothing else","Any one of six possible criteria","That the total spend exceeds €100,000"],"correct_index":0,"explanation":"All six conditions must be met simultaneously — a partial match is not sufficient."},{"id":"cr-s11-q11","session":11,"topic":"Add-on module amortisation","question":"When a significant add-on module is built for an already-in-use intangible asset, its amortisation period is:","choices":["The REMAINING useful life of the original asset, not a fresh full term","Always a brand new 5-year term regardless of the original asset's age","Indefinite, since it is a new development","Equal to the original asset's total original useful life, restarted"],"correct_index":0,"explanation":"Flagged exam trap, illustrated by the timekeeping-software example: the add-on module rides on the asset's remaining life, not a fresh term."},{"id":"cr-s11-q12","session":11,"topic":"Purchased patent useful life","question":"A patent has 10 years of legal protection remaining but the entity expects to use it for only 6 years. Its useful life for amortisation purposes is:","choices":["6 years (the shorter of legal duration and expected use)","10 years (always the full legal duration)","16 years (summed)","Indefinite, since patents never expire in substance"],"correct_index":0,"explanation":"Useful life is the shorter of legal duration and expected use — 6 years here."},{"id":"cr-s11-q13","session":11,"topic":"Website development costs","question":"Under the fiche's worked exercise, which website-related cost CAN potentially be capitalised?","choices":["Development costs of the site, provided probable future economic benefits are demonstrated","Planning costs (the research-equivalent phase)","Costs of developing the site's content","Ongoing operating costs of running the live site"],"correct_index":0,"explanation":"Planning = expensed (research-equivalent). Development = potentially capitalised. Content development and operating costs = expensed."},{"id":"cr-s11-q14","session":11,"topic":"Goodwill amortisation","question":"Goodwill, compared to other intangibles, is:","choices":["Never amortised, tested for impairment at least annually — same treatment as indefinite-life intangibles","Amortised over a mandatory 20-year period","Amortised only if acquired via a business combination","Never tested for impairment at all"],"correct_index":0,"explanation":"Goodwill follows the same non-amortisation, annual-impairment-test treatment as indefinite-life intangibles."},{"id":"cr-s12-q1","session":12,"topic":"Impairment loss definition","question":"An impairment loss is:","choices":["The amount by which the carrying amount of an asset/CGU exceeds its recoverable amount","Any decrease in an asset's market value, however small","The difference between cost and accumulated depreciation","Always equal to the asset's original purchase price"],"correct_index":0,"explanation":"Impairment loss = carrying amount minus recoverable amount, ONLY when carrying amount is higher."},{"id":"cr-s12-q2","session":12,"topic":"Recoverable amount","question":"Recoverable amount is defined as:","choices":["The higher of fair value less costs to sell, and value in use","The lower of fair value and value in use","Always equal to value in use","The asset's original historical cost"],"correct_index":0,"explanation":"Recoverable amount takes the HIGHER of the two possible exit routes (sell vs continue using)."},{"id":"cr-s12-q3","session":12,"topic":"Mandatory annual testing","question":"Which assets must be tested for impairment annually REGARDLESS of whether any indicator exists?","choices":["Indefinite-life intangibles, goodwill, and assets not yet ready for use","All PP&E without exception","Only financial assets","Only assets measured under the cost model"],"correct_index":0,"explanation":"For all other assets, testing is triggered only by an indicator; these three categories require mandatory annual testing."},{"id":"cr-s12-q4","session":12,"topic":"External impairment indicator","question":"Which of the following is an external indicator of possible impairment?","choices":["The entity's book value of net assets exceeding its market capitalisation","Evidence of physical damage to the asset","Internal reporting showing worse-than-expected economic performance","A planned change in how the asset is used"],"correct_index":0,"explanation":"Book value exceeding market cap is an EXTERNAL indicator; the other three are INTERNAL indicators."},{"id":"cr-s12-q5","session":12,"topic":"Impairment loss for a revalued asset","question":"For an asset carried at a revalued amount, an impairment loss is:","choices":["First debited against any revaluation reserve balance for that asset, with only the excess as a P&L expense","Always recognised entirely in profit or loss, ignoring any reserve","Never recognised for revalued assets","Split 50/50 between reserve and P&L automatically"],"correct_index":0,"explanation":"This is the one exception carried over from the revaluation mechanics: reserve absorbs first, excess to P&L."},{"id":"cr-s12-q6","session":12,"topic":"Cash-generating unit (CGU)","question":"A CGU is:","choices":["The smallest identifiable group of assets generating cash inflows largely independent of other assets","Any single asset with a positive net book value","A legal entity within a corporate group","A geographic segment as defined by IFRS8, with no further judgement required"],"correct_index":0,"explanation":"CGU identification requires judgement about independence of cash inflows, not a fixed legal or geographic definition."},{"id":"cr-s12-q7","session":12,"topic":"When to use CGU-level testing","question":"The CGU approach is used when:","choices":["An individual asset's recoverable amount cannot be estimated on its own","An asset's recoverable amount can always be estimated individually, as a matter of default practice","Only for goodwill, never for tangible assets","Only when an entity has fewer than 3 CGUs"],"correct_index":0,"explanation":"Flagged exam trap: CGU testing is a fallback, not a universal default — use it only when an asset's own recoverable amount is not separable."},{"id":"cr-s12-q8","session":12,"topic":"Goodwill impairment testing","question":"Goodwill's recoverable amount is tested:","choices":["By allocating it to the CGUs expected to benefit from the combination's synergies","As a single stand-alone asset with its own independent cash flows","Only once, at the date of acquisition, and never again","By comparing it directly to the acquirer's total market capitalisation"],"correct_index":0,"explanation":"Goodwill does not generate independent cash flows, so it is allocated to benefiting CGUs for testing purposes."},{"id":"cr-s12-q9","session":12,"topic":"Order of testing within a CGU with goodwill","question":"Within a goodwill-allocated CGU, impairment testing order requires:","choices":["The CGU's own individual assets to be tested BEFORE goodwill","Goodwill to be tested before any individual asset","Simultaneous testing with no required order","Testing only the largest asset in the CGU"],"correct_i
