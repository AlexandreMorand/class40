9%","71%","50%","100%"],"correct_index":1,"explanation":"71% of 2017 revenue was recognised over time (mainly defense groups using cost-to-cost progress), with the remaining 29% recognised at a point in time (mainly business jet aircraft)."},{"id":"cr-s24-q9","session":24,"topic":"Comparing the two transition methods","question":"Do full retrospective and modified retrospective produce different TOTAL cumulative effects from adopting the new revenue standard?","choices":["Yes, full retrospective always produces a larger total effect","No, they measure the same underlying cumulative effect, differing only in how it is displayed across periods","Yes, modified retrospective always understates the effect","They cannot be compared, they apply to different standards"],"correct_index":1,"explanation":"Both methods are measuring the same underlying accounting change, they differ only in whether that effect is spread across restated prior periods or concentrated in one opening balance adjustment."},{"id":"cr-s24-q10","session":24,"topic":"Assignment framework","question":"Were General Dynamics and Ford early or mandatory adopters of ASC606/IFRS15 for 2017?","choices":["Mandatory adopters, since the standard required adoption for all 2017 filers","Early adopters, among a small group, since the standard was not mandatory until periods beginning after 15 December 2017","Late adopters, several years after the deadline","Neither company adopted the new standard in 2017"],"correct_index":1,"explanation":"Both were early adopters, choosing to apply the new standard for calendar year 2017 ahead of the later mandatory effective date."},{"id":"cr-s25-q1","session":25,"topic":"IFRS2 scope","question":"Does IFRS2 apply to a company's payment of ordinary cash dividends?","choices":["Yes, all payments to shareholders","No, IFRS2 applies only to share based payments for goods or services, not to dividends or a general issue of shares for cash","Yes, but only stock dividends","Only if the dividend is paid in shares"],"correct_index":1,"explanation":"IFRS2's scope is specifically share based payments received in exchange for goods or services, dividends and plain cash-raising share issues fall outside it entirely."},{"id":"cr-s25-q2","session":25,"topic":"Equity-settled vs cash-settled","question":"What is the key structural difference between equity-settled and cash-settled share based payment accounting?","choices":["Equity-settled always costs more","A cash-settled liability is remeasured to fair value at each reporting date until settlement, an equity-settled transaction's initial measurement is not remeasured for later share price moves","Cash-settled payments are never expensed","Equity-settled transactions require board approval, cash-settled do not"],"correct_index":1,"explanation":"This remeasurement difference is the central mechanical distinction, cash-settled liabilities keep moving with the share price, equity-settled cost is fixed once at measurement."},{"id":"cr-s25-q3","session":25,"topic":"Measurement hierarchy","question":"For a transaction with an employee measured at fair value of equity instruments, at what date is fair value estimated?","choices":["Date of receipt of services","Grant date","Vesting date","Exercise date"],"correct_index":1,"explanation":"For equity instrument fair value measurement, the estimate is fixed at grant date and not revisited, unlike goods/services fair value which uses the date of receipt."},{"id":"cr-s25-q4","session":25,"topic":"Vesting condition taxonomy","question":"A performance target defined by reference to the entity's own share price is a","choices":["Non-market condition","Market condition","Non-vesting condition","Service condition"],"correct_index":1,"explanation":"Market conditions are defined by reference to the price or value of the entity's own (or group entity's) equity instruments, as opposed to non-market conditions based on operational metrics."},{"id":"cr-s25-q5","session":25,"topic":"Recognition timing rule","question":"If there are no vesting conditions at all, when is the employee expense recognised?","choices":["Spread over an assumed 3 year period","Immediately, at grant date","Only at exercise","Never, if there are no conditions"],"correct_index":1,"explanation":"Absent any vesting condition, the employee has an unconditional right immediately, so the full cost is recognised at once, at grant date."},{"id":"cr-s25-q6","session":25,"topic":"Measurement rule","question":"If the share price rises significantly after grant date, does this change the P&L charge already being recognised over the vesting period?","choices":["Yes, the expense is remeasured upward each period","No, market conditions occurring after grant date are not taken into account, the grant date fair value is fixed","Only if the rise exceeds 50%","Yes, but only downward adjustments are made"],"correct_index":1,"explanation":"Cost is fixed at grant date fair value, which already builds in the probability distribution of future share prices, subsequent market conditions never change the P&L charge."},{"id":"cr-s25-q7","session":25,"topic":"Multi-year vesting example","question":"4 executives, 25,000 options each, fair value 0.75 per option at grant date, 3 year service condition, what is the annual expense?","choices":["75,000 per year","25,000 per year (75,000 total divided by 3 years)","18,750 per year","6,250 per year"],"correct_index":1,"explanation":"Total grant date fair value = 4 x 25,000 x 0.75 = 75,000, spread evenly over 3 years = 25,000 per year."},{"id":"cr-s25-q8","session":25,"topic":"Forfeiture, service condition failure","question":"One of four executives leaves during the vesting period, failing the service condition. What happens to the cumulative expense?","choices":["Nothing changes, the original estimate stands","It is revised to reflect the best estimate of the number of instruments actually expected to vest, backing out the forfeited award","The full remaining expense is accelerated immediately","A valuation allowance is created"],"correct_index":1,"explanation":"Service or non-market performance condition failures trigger a revision of the cumulative expense estimate to reflect what is now actually expected to vest."},{"id":"cr-s25-q9","session":25,"topic":"Forfeiture, market condition failure","question":"If a market condition (e.g. a share price target) is NOT met, what happens to the accounting?","choices":["The cumulative expense is revised down","No change at all, the expense continues to be recognised over the remainder of the vesting period exactly as originally planned","The expense is reversed entirely","A gain is recognised"],"correct_index":1,"explanation":"Market condition failures get no accounting adjustment, since the grant date fair value already priced in the probability of not meeting the market condition."},{"id":"cr-s25-q10","session":25,"topic":"Expiry after vesting","question":"If a vested option later expires unexercised, what happens to the previously recognised expense?","choices":["It is reversed through profit or loss","Nothing, it is a pure equity reclassification with no P&L or net asset effect","Cash is refunded to the company","The expense is transferred to a deferred tax asset"],"correct_index":1,"explanation":"Expiry after vesting is purely an equity reclassification, previously recognised cost stands, unlike forfeiture during vesting which does revise the expense."},{"id":"cr-s25-q11","session":25,"topic":"Exercise entry, balancing figure","question":"In the exercise date journal entry (cash received, equity stock options reversed, share capital at nominal value credited), what is always the balancing (plug) figure?","choices":["Cash","Share capital at nominal value","Share premium","Retained earnings"],"correct_index":2,"explanation":"Cash received and nominal value share capital are both directly computable, share premium is always the figure that makes the entry balance."},{"id":"cr-s25-q12","session":25,"topic":"Common mistake, remeasurement","question":"Should an equity-settled option's cost be remeasured for subsequent share price movements?","choices":["Yes, every reporting period","No, only cash-settled liabilities are remeasured to fair value each period, equity-settled cost is fixed at grant date","Only if the share price falls","Only for options held by executives"],"correct_index":1,"explanation":"This is an explicit exam trap distinguishing equity-settled (fixed at grant date) from cash-settled (remeasured every period) treatment."},{"id":"cr-s26-q1","session":26,"topic":"The case hook","question":"eBay reported net income of 48 million dollars for 2000 under APB25. What did it disclose under SFAS123 pro forma fair value?","choices":["A profit of 91 million dollars","A loss of almost 91 million dollars","The same 48 million dollar profit","A loss of 48 million dollars"],"correct_index":1,"explanation":"The pro forma fair value disclosure showed a loss of about 90.7 million dollars, a dramatic contrast to the 48 million dollar reported profit under APB25."},{"id":"cr-s26-q2","session":26,"topic":"APB25 intrinsic value method","question":"Under APB25, compensation expense is based on","choices":["The full Black-Scholes fair value of the option","The difference, at grant date, between the fair value of the stock and the option's exercise price","The option's time value only","The eventual exercise proceeds"],"correct_index":1,"explanation":"APB25's intrinsic value method looks only at the immediate spread between stock price and exercise price at grant date, ignoring time value entirely."},{"id":"cr-s26-q3","session":26,"topic":"At the money options under APB25","question":"Why did eBay recognise essentially zero compensation expense for most of its options under APB25?","choices":["Because options were illegal under APB25","Because most options were granted at the money (exercise price equal to grant date fair value), making the intrinsic value spread zero","Because eBay was not yet profitable","Because APB25 exempted internet companies"],"correct_index":1,"explanation":"At the money means exercise price equals stock price at grant date, so the intrinsic value spread (and hence the APB25 expense) is exactly zero, regardless of how valuable the option might become later."},{"id":"cr-s26-q4","session":26,"topic":"SFAS123 fair value method","question":"What does the SFAS123 fair value method capture that APB25 does not?","choices":["Only the exercise price","The option's full fair value via an option pricing model, including time value and expected volatility, not just the immediate intrinsic spread","Only dividends paid","The par value of the shares"],"correct_index":1,"explanation":"SFAS123 uses Black-Scholes to capture the complete economic value of the option, including its time value, which APB25's intrinsic value method entirely ignores."},{"id":"cr-s26-q5","session":26,"topic":"IFRS2 relationship to these two methods","question":"Which of the two historical US methods does IFRS2's mandatory recognition approach match?","choices":["APB25's intrinsic value method","SFAS123's fair value method, but IFRS2 requires it to be recognised, not just disclosed pro forma","Neither, IFRS2 uses a completely different approach","It matches APB25 exactly, but with mandatory recognition"],"correct_index":1,"explanation":"IFRS2 requires the full grant date fair value (the SFAS123-style approach) to be expensed over the vesting period, but unlike SFAS123's pro forma disclosure, IFRS2 makes this mandatory recognition."},{"id":"cr-s26-q6","session":26,"topic":"Grant-date fair value vs exercise price gap","question":"Why was eBay's 2000 weighted average grant date fair value (103.79) so much larger than its weighted average exercise price (62.69) for the same grants?","choices":["A calculation error by eBay","Time value, driven mainly by eBay's extremely high (115%) expected volatility assumption and multi year expected life, is economically sensible for an at the money option","Because exercise price is always understated by regulation","Because eBay used a different currency for each figure"],"correct_index":1,"explanation":"The gap is the mathematically expected consequence of applying Black-Scholes with high volatility to an at-the-money option, it reflects real time value, not any pricing error."},{"id":"cr-s26-q7","session":26,"topic":"Recognition vs disclosure theme","question":"How does the eBay case connect to the recognition versus disclosure literature from Session 16?","choices":["It is unrelated, a completely separate topic","It is a real world illustration that investors treat recognised values as more relevant than merely disclosed ones, exactly the pattern found for stock option expense (Aboody 1996)","It proves disclosure is always superior to recognition","It only applies to airlines, not tech companies"],"correct_index":1,"explanation":"This is explicitly flagged as a recurring pattern, the eBay case makes concrete the abstract Session 16 finding that recognised amounts matter more to investors than footnoted pro forma numbers."},{"id":"cr-s26-q8","session":26,"topic":"Common mistake, at the money assumption","question":"Does APB25's intrinsic value method always produce zero expense?","choices":["Yes, for every option grant","No, only for at the money grants, an option granted in the money (exercise price below current fair value) would generate a positive intrinsic value expense","Yes, but only after 2001","No, APB25 never produces zero expense"],"correct_index":1,"explanation":"The zero-expense outcome is specific to at-the-money grants, an in-the-money grant has a positive spread at grant date and would generate expense even under APB25."},{"id":"cr-s26-q9","session":26,"topic":"Common mistake, historical framework confusion","question":"Is APB25/SFAS123 the same framework as IFRS2?","choices":["Yes, they are identical standards under different names","No, APB25/SFAS123 predates and differs from IFRS2, which has always required mandatory fair value recognition rather than optional disclosure","Yes, IFRS2 is simply the European translation of SFAS123","No, IFRS2 has never required recognition either"],"correct_index":1,"explanation":"This is flagged as a common confusion, IFRS2 never coexisted as a recognition-optional standard the way APB25 and SFAS123 did, it has always mandated fair value recognition."},{"id":"cr-s26-q10","session":26,"topic":"Interpreting the pro forma loss","question":"Does eBay's 91 million dollar pro forma loss mean the underlying business was failing?","choices":["Yes, eBay was cash flow negative and unsuccessful in 2000","No, the case notes eBay was profitable and cash generative, the pro forma loss is an accounting reclassification of stock compensation cost, not a statement about business economics","Yes, this proves internet companies were all failing in 2000","It is impossible to know from the case"],"correct_index":1,"explanation":"This is explicitly flagged as a common mistake to avoid, conflating an accounting treatment choice with the underlying cash economics of the business."},{"id":"cr-s27-q1","session":27,"topic":"Four categories of employee benefits","question":"Which category includes wages, salaries, bonuses and paid leave expected to be settled within 12 months?","choices":["Post-employment benefits","Short-term benefits","Other long-term benefits","Termination benefits"],"correct_index":1,"explanation":"Short-term benefits are recognised as employees provide service, at the undiscounted amount expected to be paid, and are expected to be settled within 12 months."},{"id":"cr-s27-q2","session":27,"topic":"Defined contribution plans","question":"Under a defined contribution plan, who bears actuarial and investment risk?","choices":["The entity","The employee, since the eventual benefit depends entirely on contributions paid plus investment returns","The government","Both equally, always split 50/50"],"correct_index":1,"explanation":"Because the entity has no obligation beyond its fixed contributions, both actuarial and investment risk fall in substance on the employee."},{"id":"cr-s27-q3","session":27,"topic":"Defined benefit plans","question":"Under a defined benefit plan, who bears actuarial and investment risk?","choices":["The employee","The entity, if actuarial or investment experience is worse than expected, the entity's obligation increases","Neither party, risk is eliminated by discounting","The plan's trustee personally"],"correct_index":1,"explanation":"This is the mirror image of defined contribution, the employer absorbs the risk that the pension promise costs more than originally estimated."},{"id":"cr-s27-q4","session":27,"topic":"Projected unit credit method","question":"What actuarial technique is used to estimate the defined benefit obligation?","choices":["Straight-line amortisation","The projected unit credit method, an actuarial technique estimating the final cost of benefits accrued for current and prior years service, discounted to present value","The percentage of completion method","FIFO"],"correct_index":1,"explanation":"This is IAS19's required actuarial technique, incorporating demographic and financial assumptions and discounting the result to present value."},{"id":"cr-s27-q5","session":27,"topic":"Discount rate","question":"What is used to determine the discount rate for the defined benefit obligation?","choices":["The entity's own weighted average cost of capital","Market yields at the reporting date on high quality corporate bonds (or government bonds where no deep corporate bond market exists), matching currency and term","A flat rate of 5% set by IAS19","The rate the plan assets are expected to earn"],"correct_index":1,"explanation":"The discount rate is an external market-based rate, not the entity's own cost of capital or the plan assets' expected return."},{"id":"cr-s27-q6","session":27,"topic":"P&L cost components","question":"What two components make up the defined benefit P&L cost?","choices":["Service cost and remeasurements","Service cost and net interest (interest cost on the obligation net of interest income on plan assets, same discount rate)","Contributions and benefits paid","Current tax and deferred tax"],"correct_index":1,"explanation":"Service cost (current year's accrued benefit) plus net interest are the two P&L components. Remeasurements go to OCI, not P&L."},{"id":"cr-s27-q7","session":27,"topic":"Remeasurements","question":"Where are actuarial gains and losses (remeasurements) recognised, and can they later be recycled to P&L?","choices":["In profit or loss, and yes they can be recycled later","In OCI, and they are never recycled to profit or loss","In current tax expense","They are not recognised at all"],"correct_index":1,"explanation":"Remeasurements go immediately to OCI and are permanently excluded from P&L, never recycled, unlike some other OCI items."},{"id":"cr-s27-q8","session":27,"topic":"Plan assets, interest income","question":"How is interest income on plan assets computed?","choices":["Using the plan's actual realised investment return","By applying the same discount rate used for the obligation to the plan assets' opening fair value","Using a fixed 3% regardless of the discount rate","It is not computed separately, only net cash flows matter"],"correct_index":1,"explanation":"The same discount rate used for the obligation is applied to plan assets' opening fair value, and any gap versus the actual return is a remeasurement in OCI."},{"id":"cr-s27-q9","session":27,"topic":"Other long-term benefits vs defined benefit","question":"How does the OCI treatment of other long-term benefits (e.g. long-service leave) differ from post-employment defined benefit plans?","choices":["It is identical in every respect","All remeasurement changes for other long-term benefits go through profit or loss, with no OCI split at all, unlike defined benefit's P&L/OCI split","Other long-term benefits use no discounting at all","Other long-term benefits are never actuarially valued"],"correct_index":1,"explanation":"This is an explicit exam trap, other long-term benefits use similar actuarial mechanics but route ALL remeasurement through P&L, unlike defined benefit's P&L (service cost, net interest) / OCI (remeasurements) split."},{"id":"cr-s27-q10","session":27,"topic":"Past service cost","question":"When is past service cost (e.g. from a plan amendment) recognised?","choices":["Spread over the remaining service period of affected employees","Immediately in P&L, at the earlier of the plan change date or when related restructuring costs are recognised","Only when the amended benefits are actually paid out","In OCI, as a remeasurement"],"correct_index":1,"explanation":"Unlike ordinary service cost (which accrues as service is rendered), past service cost from a plan amendment or curtailment is recognised immediately, not spread over any future period."},{"id":"cr-s27-q11","session":27,"topic":"Comprehensive example","question":"In the two-year worked example, opening obligation 500,000, interest cost is computed as","choices":["A flat fee regardless of the opening balance","10% (the discount rate) times the opening obligation of 500,000, giving 50,000","10% times the closing obligation","The full service cost amount"],"correct_index":1,"explanation":"Interest cost = discount rate x opening obligation = 10% x 500,000 = 50,000, consistent with the net interest approach applying the same rate throughout the year to the opening balance."},{"id":"cr-s27-q12","session":27,"topic":"Common mistake, contributions and benefits paid","question":"Are employer contributions and benefits paid to employees treated as P&L expenses?","choices":["Yes, both are P&L expenses in the year they occur","No, both are pure balance sheet movements, contributions increase plan assets, benefits paid reduce both the obligation and plan assets","Only contributions are a P&L expense","Only benefits paid are a P&L expense"],"correct_index":1,"explanation":"Neither item touches the income statement directly, they are balance sheet flows between the obligation, plan assets and cash, distinct from the P&L service cost and net interest components."},{"id":"cr-s28-q1","session":28,"topic":"Five standards framework","question":"Which standard specifically prescribes the equity method for associates and joint ventures?","choices":["IFRS10","IAS28","IFRS11","IFRS12"],"correct_index":1,"explanation":"IAS28 governs Investments in Associates and Joint Ventures and prescribes the equity method. IFRS10 covers consolidation, IFRS11 joint arrangements, IFRS12 disclosure."},{"id":"cr-s28-q2","session":28,"topic":"Investment treatment by type","question":"How are investments in associates treated in BOTH consolidated and separate financial statements?","choices":["Full consolidation","The equity method (IAS28)","Fair value through profit or loss only","Historical cost only, never remeasured"],"correct_index":1,"explanation":"Associates use the equity method in both consolidated and the parent's own separate financial statements, unlike subsidiaries which are fully consolidated only at the group level."},{"id":"cr-s28-q3","session":28,"topic":"Three-part control test","question":"IFRS10 control requires ALL of which three elements?","choices":["Ownership, management, and profitability","Power, exposure or rights to variable returns, and the ability to use that power to affect those returns","Majority voting rights, board seats, and a written contract","Fair value, cost, and equity method eligibility"],"correct_index":1,"explanation":"All three elements together define control, power alone or returns alone are each insufficient without the third linking element."},{"id":"cr-s28-q4","session":28,"topic":"Protective rights","question":"Do protective rights, however extensive, give their holder power over an investee?","choices":["Yes, any veto right confers power","No, rights designed only to protect the holder's interest, without giving the ability to direct relevant activities, never confer power","Yes, but only if they cover more than 3 matters","It depends on the investee's industry"],"correct_index":1,"explanation":"Protective rights specifically shield the holder's own interest (e.g. against dilution or expropriation) without giving any control over the investee's operating or strategic decisions."},{"id":"cr-s28-q5","session":28,"topic":"Substantive rights","question":"For a right to confer power, what must be true of it?","choices":["It must be exercisable at least once a year","The holder must have the practical ability to exercise it, with no barriers, i.e. it must be substantive","It must be disclosed in the notes","It must relate to dividends only"],"correct_index":1,"explanation":"Only substantive rights, ones the holder can practically exercise without barriers, can confer power, non-substantive rights (however impressive on paper) do not."},{"id":"cr-s28-q6","session":28,"topic":"Consolidation exemption","question":"A parent need not prepare consolidated accounts if all of several conditions hold. Which is NOT one of them?","choices":["It is itself a wholly or partially owned subsidiary and other owners do not object","Its shares are not publicly traded","Its own ultimate parent presents IFRS compliant, publicly available group accounts","It has fewer than 50 employees"],"correct_index":3,"explanation":"Employee count is not one of the exemption conditions, the conditions relate to ownership structure, public trading status, securities filings, and the ultimate parent's own public group accounts."},{"id":"cr-s28-q7","session":28,"topic":"Simple elimination mechanics","question":"Alfa acquires a 90% interest in Beta for 900, Beta's equity at acquisition is 1,000. What NCI is recognised (ignoring goodwill/fair value adjustments)?","choices":["900","100 (10% of Beta's 1,000 equity)","1,000","0"],"correct_index":1,"explanation":"The 90% share of Beta's equity is eliminated against the investment, the remaining 10% (100) is recognised separately as non-controlling interest."},{"id":"cr-s28-q8","session":28,"topic":"Step-up direction","question":"A step-up (fair value greater than carrying amount at acquisition) generates what kind of deferred tax item?","choices":["A deferred tax asset","A deferred tax liability, since the asset is now carried above its tax base","No deferred tax effect","A permanent difference with no deferred tax"],"correct_index":1,"explanation":"A step-up means carrying amount now exceeds tax base, a taxable temporary difference, producing a deferred tax liability, per the balance sheet approach rule (Session 19) applied here."},{"id":"cr-s28-q9","session":28,"topic":"Goodwill formula, partial method","question":"Under the partial goodwill method, goodwill equals","choices":["Purchase price minus 100% of the fair value of net assets","Purchase price minus the parent's proportionate share of the fair value of net assets acquired","Purchase price plus NCI at fair value minus fair value of net assets","Always zero if NCI exists"],"correct_index":1,"explanation":"Partial goodwill recognises goodwill only for the parent's own share, purchase price minus the parent's percentage share of the fair value of net assets."},{"id":"cr-s28-q10","session":28,"topic":"Goodwill formula, full method","question":"Under the full goodwill method, how is NCI measured, and what effect does this have on total goodwill versus the partial method?","choices":["NCI at proportionate share of net assets, same goodwill as partial method","NCI at its own independently appraised fair value, resulting in LARGER total goodwill than the partial method, since NCI's own share of goodwill is now included","NCI is not recognised at all under the full method","NCI at par value, resulting in smaller goodwill"],"correct_index":1,"explanation":"Full goodwill measures NCI at its own fair value (which implicitly includes NCI's share of goodwill), producing a larger total goodwill figure than partial goodwill for the same transaction."},{"id":"cr-s28-q11","session":28,"topic":"Negative goodwill","question":"How is negative goodwill (a bargain purchase) treated?","choices":["Capitalised as an intangible asset and amortised","Recognised immediately as income, increasing group reserves at the acquisition date","Ignored entirely","Deducted from the seller's proceeds"],"correct_index":1,"explanation":"Unlike ordinary goodwill (an asset, never amortised), negative goodwill is recognised straight to income at acquisition, the opposite treatment."},{"id":"cr-s28-q12","session":28,"topic":"Common mistake, control and voting majority","question":"Does control under IFRS10 always require owning more than 50% of voting shares?","choices":["Yes, always","No, power can exist without a voting majority (e.g. via contractual rights), and a bare majority can also fail to give power if rights are not substantive","Yes, but only for private companies","No, control never depends on voting rights at all"],"correct_index":1,"explanation":"This is an explicit exam trap, majority ownership is neither necessary nor sufficient on its own, substantive rights and the full three-part test govern control."},{"id":"cr-s29-q1","session":29,"topic":"Intra-group balances","question":"How are intra-group loans, receivables and payables treated on consolidation?","choices":["Kept on the balance sheet at their gross amounts","Cancelled out entirely, since a group cannot owe money to or earn interest from itself","Reduced by 50%","Converted into NCI"],"correct_index":1,"explanation":"Both sides of an intra-group balance (asset for one entity, liability for the other) disappear entirely from the group accounts on consolidation."},{"id":"cr-s29-q2","session":29,"topic":"Downstream unrealised profit","question":"Where does unrealised profit from a DOWNSTREAM sale (parent to subsidiary) get eliminated?","choices":["Split proportionately between group retained earnings and NCI","Subtracted entirely from group retained earnings, none charged to NCI","Added to goodwill","Ignored, since the parent generated it"],"correct_index":1,"explanation":"Because the parent, not the partly owned subsidiary, generated the profit, none of the elimination is allocated to NCI, it all reduces group retained earnings."},{"id":"cr-s29-q3","session":29,"topic":"Upstream unrealised profit","question":"Where does unrealised profit from an UPSTREAM sale (subsidiary to parent) get eliminated?","choices":["Entirely from group retained earnings","Proportionately between group retained earnings and NCI, since the partly owned subsidiary generated it","Entirely from NCI","It is not eliminated at all"],"correct_index":1,"explanation":"Since the partly owned subsidiary generated the profit, the elimination is shared proportionately between group retained earnings and NCI, unlike a downstream sale."},{"id":"cr-s29-q4","session":29,"topic":"Step-up depreciation post-acquisition","question":"What must happen to a fair value step-up on a depreciable asset after acquisition?","choices":["Nothing, step-ups are frozen at acquisition value forever","The step-up itself must be depreciated/amortised over the asset's remaining useful life, with a matching deferred tax reversal","It is written off immediately in year 1","It converts to goodwill"],"correct_index":1,"explanation":"The step-up follows the same depreciation pattern as the underlying asset, and the deferred tax liability originally recognised on it partially reverses each period as the step-up is depreciated."},{"id":"cr-s29-q5","session":29,"topic":"Inventory unrealised profit example","question":"Beta sells goods to Alfa for 5,000 that cost Beta 4,000, all remain unsold at year end. What is the deferred tax effect at a 50% rate?","choices":["A deferred tax liability of 500","A deferred tax asset of 500, since Beta already paid tax on profit not yet realised from the group's perspective","No deferred tax effect","A deferred tax asset of 1,000"],"correct_index":1,"explanation":"The 1,000 unrealised profit was already taxed at Beta's level but is not yet realised for the group, generating a deferred tax asset of 50% x 1,000 = 500."},{"id":"cr-s29-q6","session":29,"topic":"Inventory write-down absorption","question":"If a buying company has already written inventory down by an amount equal to or greater than the intra-group profit embedded in it, what further consolidation adjustment is needed?","choices":["The full original profit must still be eliminated separately","No further adjustment is needed, the write-down has already absorbed the profit (or more)","The write-down must be reversed first","A deferred tax liability must be recognised"],"correct_index":1,"explanation":"As shown in scenarios B and C of the worked example, once the write-down equals or exceeds the intra-group profit, no further unrealised-profit elimination is required."},{"id":"cr-s29-q7","session":29,"topic":"Genuine losses","question":"If a parent sells to a subsidiary below cost because that price matches the goods' genuine fair value, should the loss be reversed in consolidation?","choices":["Yes, always reverse any intra-group loss","No, a genuine loss reflecting actual fair value decline is not an artefact of internal pricing and is not reversed","Yes, but only for downstream sales","It depends on the subsidiary's ownership percentage"],"correct_index":1,"explanation":"Only losses artificially created by intra-group pricing are reinstated, a loss that reflects real fair value decline would have occurred even without the internal sale."},{"id":"cr-s29-q8","session":29,"topic":"Fixed asset intra-group sale","question":"In the fixed asset example (sold for 500, NBV 200, group-level NBV should be 120), what THREE adjustments does the consolidation elimination require?","choices":["Only eliminate the gain on disposal","Eliminate the 300 gain, reduce depreciation to the group's original cost basis, and adjust the carrying amount back to group level NBV","Only adjust depreciation","Only write the asset back to its original cost"],"correct_index":1,"explanation":"All three adjustments are needed together, reversing the gain, correcting depreciation to what it would have been on the original cost basis, and restating the asset's carrying amount to the group-level figure."},{"id":"cr-s29-q9","session":29,"topic":"Intra-group dividends","question":"Beta (80% owned) distributes 1,000 in dividends. What is the net effect on group retained earnings and NCI equity?","choices":["Group retained earnings falls by 1,000 total, NCI equity unaffected","Group retained earnings falls by the full 1,000 distributed (offset by cancelling Alfa's 800 dividend income), NCI equity falls by its 200 actually paid to minority shareholders","Nothing changes, dividends have no consolidation effect","NCI equity increases by 800"],"correct_index":1,"explanation":"The parent's 800 dividend income is eliminated against Beta's retained earnings reduction, and only the 200 genuinely paid outside the group reduces NCI's equity stake."},{"id":"cr-s29-q10","session":29,"topic":"NCI's share of net income, golden rule","question":"At what percentage is a subsidiary's revenue, expenses and consolidation adjustments first consolidated, before NCI's share is separated out?","choices":["At the parent's exact ownership percentage from the start","At 100%, regardless of actual ownership percentage, with NCI's share separated out only afterward","At 50% as a simplification","NCI's share is computed before any consolidation adjustments are applied"],"correct_index":1,"explanation":"The golden rule, everything is consolidated at 100% first (assets, liabilities, revenues, expenses, and all consolidation adjustments), only then is NCI's share carved out."},{"id":"cr-s29-q11","session":29,"topic":"NCI net income formula","question":"NCI's share of net income equals","choices":["% NCI times the subsidiary's net income only, ignoring consolidation adjustments","% NCI times (subsidiary's net income plus or minus consolidation adjustments originating with that subsidiary)","% NCI times group consolidated net income","A fixed percentage regardless of the subsidiary's results"],"correct_index":1,"explanation":"Only adjustments originating with that specific subsidiary (e.g. its own step-up depreciation, its own upstream unrealised profit) affect NCI's share, not adjustments originating with the parent."},{"id":"cr-s29-q12","session":29,"topic":"Common mistake, downstream vs upstream","question":"Should unrealised profit on a downstream sale be allocated partly to NCI?","choices":["Yes, always split it proportionately","No, downstream unrealised profit is entirely a group retained earnings adjustment, since it was the parent (100% group owned) that generated it","Only if the subsidiary is less than 50% owned","Yes, but only for inventory, not fixed assets"],"correct_index":1,"explanation":"This is an explicit exam trap, downstream profit (parent generated) never touches NCI, only upstream profit (subsidiary generated) gets split proportionately."},{"id":"cr-s30-q1","session":30,"topic":"Definition of a business","question":"Under IFRS3, can an acquisition qualify as a business even with no current sales?","choices":["No, a business must already generate revenue","Yes, substantive inputs and processes (e.g. staff and IP with ongoing R&D) can qualify as a business even without outputs yet existing","No, IFRS3 never applies without revenue","Only if the target has over 50 employees"],"correct_index":1,"explanation":"A business consists of inputs, processes and the capability to produce outputs, even if outputs (like product sales) do not yet exist, as the research facility example illustrates."},{"id":"cr-s30-q2","session":30,"topic":"IFRS3 scope, exclusions","question":"Which of these is explicitly EXCLUDED from IFRS3's scope?","choices":["Acquisitions of subsidiaries","Business combinations under common control","Mergers","Acquisitions of entities meeting the definition of a business"],"correct_index":1,"explanation":"IFRS3 excludes joint arrangements, business combinations under common control, and the formation of joint ventures, while covering mergers and business acquisitions generally."},{"id":"cr-s30-q3","session":30,"topic":"Four steps of the acquisition method","question":"What is the FIRST step of the IFRS3 acquisition method?","choices":["Recognise goodwill","Identify the acquirer","Determine consideration transferred","Measure identifiable net assets"],"correct_index":1,"explanation":"The four steps in order are, identify the acquirer, determine the acquisition date, recognise and measure net assets/NCI/consideration, then recognise goodwill or a bargain purchase."},{"id":"cr-s30-q4","session":30,"topic":"Reverse acquisitions","question":"In a reverse acquisition, is the legal acquirer always the accounting acquirer?","choices":["Yes, always","No, IFRS3 looks through legal form to which party's shareholders/management actually end up controlling the combined entity","Yes, but only for listed companies","No, there is never an accounting acquirer in a reverse acquisition"],"correct_index":1,"explanation":"The classic reverse acquisition case has the legally acquiring entity's own shareholders end up controlled by the target's former shareholders, making the target the accounting acquirer."},{"id":"cr-s30-q5","session":30,"topic":"Consideration transferred","question":"How is consideration transferred measured?","choices":["At book value of what was given up","At fair value at the acquisition date, and can include cash, assets transferred, liabilities incurred, and equity instruments issued","Always at par value of any shares issued","At the target's own valuation, not the acquirer's"],"correct_index":1,"explanation":"Fair value at the acquisition date is the measurement basis, covering every component of what was actually given, cash, assets, liabilities incurred, or equity issued."},{"id":"cr-s30-q6","session":30,"topic":"Acquisition-related costs","question":"How are acquisition-related costs (legal, consulting, valuation fees) treated?","choices":["Capitalised as part of goodwill","Expensed as incurred, not part of consideration transferred or acquisition cost, with the sole exception of debt/equity issuance costs which follow IFRS9","Deducted from the target's net assets","Amortised over 5 years"],"correct_index":1,"explanation":"These costs are expensed as incurred under IFRS3, a notable exception from how transaction costs are sometimes treated elsewhere, with only debt/equity issuance costs following IFRS9's own netting rules."},{"id":"cr-s30-q7","session":30,"topic":"Acquisition date","question":"What defines the acquisition date?","choices":["The date the sale and purchase agreement is signed","The date control actually passes, which is not necessarily the same as any other contractual date","The date consideration is fully paid in cash","The date the target's fiscal year ends"],"correct_index":1,"explanation":"The acquisition date is strictly when control transfers, as the timing example shows (25 June control transfer versus 1 July legal ownership transfer, using 25 June as the acquisition date)."},{"id":"cr-s30-q8","session":30,"topic":"Previously unrecognised assets","question":"Can an acquirer recognise intangible assets (e.g. customer relationships) that the acquiree itself never recorded?","choices":["No, only assets already on the acquiree's books can be recognised","Yes, because acquisition accounting uses a fair value recognition threshold, different from the acquiree's own historical (e.g. IAS38) recognition criteria","Only if the acquiree agrees in writing","Only for tangible assets, never intangibles"],"correct_index":1,"explanation":"This is explicitly one of the key mechanics, items that failed the acquiree's own recognition criteria (like internally generated customer relationships under IAS38) must still be recognised at fair value on acquisition."},{"id":"cr-s30-q9","session":30,"topic":"Goodwill formula","question":"Goodwill under IFRS3 equals","choices":["Net fair value of identifiable assets minus consideration transferred","Consideration transferred plus NCI plus fair value of any previously held interest, minus net fair value of identifiable assets acquired","Consideration transferred only, ignoring NCI","Always zero unless a bargain purchase applies"],"correct_index":1,"explanation":"This is the full goodwill formula incorporating NCI and any previously held interest in a step acquisition, a negative result instead gives a bargain purchase gain."},{"id":"cr-s30-q10","session":30,"topic":"Step acquisitions","question":"In a step acquisition, what happens to the previously held (non-controlling) interest when control is obtained?","choices":["It is kept at its original cost","It is remeasured to fair value at the acquisition date, with any gain or loss recognised in profit or loss","It is written off entirely","It is excluded from the business combination accounting"],"correct_index":1,"explanation":"The moment control is achieved, the entire prior interest (not just the newly acquired incremental shares) is revalued to fair value through P&L, treating the event as if a wholly new combination is occurring."},{"id":"cr-s30-q11","session":30,"topic":"Disposals without losing control","question":"How is a disposal of some shares in a subsidiary treated, if the parent retains control?","choices":["As a gain or loss in profit or loss","As a pure equity transaction, no P&L impact, the difference is reallocated directly between parent equity and NCI","As a bargain purchase gain","As a remeasurement in OCI"],"correct_index":1,"explanation":"Control-preserving disposals are treated like treasury share movements, purely within equity, with zero income statement effect."},{"id":"cr-s30-q12","session":30,"topic":"Common mistake, contingent liabilities","question":"Under IFRS3, can a contingent liability of the acquiree be recognised even if it fails IAS37's normal probable threshold?","choices":["No, IAS37's threshold always applies unchanged","Yes, IFRS3 recognises an acquiree's contingent liability at fair value if reliably measurable, a lower bar than IAS37's own standalone probable test","Only if the acquirer is a public company","No, contingent liabilities are never recognised in a business combination"],"correct_index":1,"explanation":"This is an explicit exam trap, IFRS3 sets a different, lower recognition bar specifically for contingent liabilities acquired in a business combination."},{"id":"cr-s31-q1","session":31,"topic":"Control assessment","question":"What combination of facts is most decisive in establishing that Lyradon controls Velquanta despite only 65% ownership?","choices":["A shared 50/50 board","The combination of a 65% equity stake (variable returns) with a 4-of-6 board majority and simple majority voting (power and the ability to use it)","Alpine's veto rights","The size of Velquanta's balance sheet"],"correct_index":1,"explanation":"The case highlights that this specific combination, meaningful equity exposure plus a structurally guaranteed ability to win board votes, is what most clearly satisfies all three IFRS10 control elements together."},{"id":"cr-s31-q2","session":31,"topic":"Alpine's veto rights","question":"Why are Alpine Ventures' consent rights (over dividends, buybacks, capital reduction, large financing) classified as protective rather than substantive?","choices":["Because Alpine owns less than 10%","Because they are concentrated in capital structure and distribution decisions and preserving Alpine's own contractual rights, not in directing Velquanta's ordinary operating and strategic decisions","Because they were not written into the Articles of Association","Because protective rights are never valid contractually"],"correct_index":1,"explanation":"The rights block extraordinary capital-structure actions and protect Alpine's own interest, but do not extend to the ordinary board-reserved matters (budgets, R&D, commercial contracts) that actually drive Velquanta's returns."},{"id":"cr-s31-q3","session":31,"topic":"What would flip the conclusion","question":"According to the case's own reasoning, what change could make Alpine's rights substantive rather than protective?","choices":["If Alpine's board seat were removed entirely","If Alpine's consent rights extended into ordinary-course operating or strategic decisions (e.g. approving annual budgets or R&D programmes), or if the EUR 50m financing threshold were lowered enough to routinely capture ordinary financing","If Alpine sold its stake to a third party","Nothing could change this conclusion"],"correct_index":1,"explanation":"Extending Alpine's consent rights into the day-to-day/strategic matters normally reserved to the board (rather than just capital-structure extraordinary items) would start to look like genuine power sharing, potentially indicating joint control instead."},{"id":"cr-s31-q4","session":31,"topic":"Acquisition date","question":"What is Velquanta's acquisition date for IFRS3 purposes?","choices":["3 June 2024, the Share Purchase Agreement signing date","1 July 2024, the stated completion date when control actually transferred","31 December 2024, the next fiscal year end","The date Alpine Ventures approved the deal"],"correct_index":1,"explanation":"The acquisition date is strictly the date control passes, here the case states this is the completion date, 1 July 2024, not the earlier signing date."},{"id":"cr-s31-q5","session":31,"topic":"Fair value of net identifiable assets","question":"Book equity 13,000, PPE uplift +3,000, developed technology +8,000, customer relationships +5,000, in-process R&D +2,000, contingent liability -1,000 (EUR'000). What is the fair value of net identifiable assets?","choices":["13,000","30,000","47,000","17,000"],"correct_index":1,"explanation":"13,000 book equity + net fair value adjustments of 17,000 (3,000+8,000+5,000+2,000-1,000) = 30,000 thousand euros."},{"id":"cr-s31-q6","session":31,"topic":"Goodwill, partial method","question":"Using cash consideration of 48,000 (EUR'000) for the 65% stake and fair value of net assets of 30,000, what is goodwill under the partial method?","choices":["48,000","28,500 (48,000 minus 65% times 30,000)","18,000","10,500"],"correct_index":1,"explanation":"Goodwill = consideration (48,000) minus the parent's proportionate share of fair value of net assets (65% x 30,000 = 19,500) = 28,500."},{"id":"cr-s31-q7","session":31,"topic":"NCI, partial method","question":"What is NCI under the partial method in this case?","choices":["19,500","10,500 (35% times 30,000)","28,500","48,000"],"correct_index":1,"explanation":"NCI under the partial method is the minority's proportionate share of the fair value of net assets, 35% x 30,000 = 10,500."},{"id":"cr-s31-q8","session":31,"topic":"Contingent consideration","question":"Is the 28,500 (EUR'000) goodwill figure computed from cash consideration alone the final, complete answer for this case?","choices":["Yes, it is complete and final, the earn-out is irrelevant to goodwill","No, it is a cash-only floor, the contingent consideration (earn-out) fair value must still be added once estimated, since contingent consideration belongs in consideration transferred at the acquisition date","No, because the tax rate must first be applied to the 28,500 figure","Yes, since Velquanta's fair value adjustments already include the earn-out"],"correct_index":1,"explanation":"IFRS3 requires the earn-out's fair value at the acquisition date to be included in consideration transferred, so the true goodwill figure is higher once that estimate is added, 28,500 is only a cash-only floor."},{"id":"cr-s31-q9","session":31,"topic":"Previously unrecognised intangibles","question":"Why can Velquanta's developed technology, customer relationships and in-process R&D be recognised now even though Velquanta itself never capitalised them?","choices":["Because Lyradon is a listed company","Because the acquisition accounting fair value threshold (Session 30) overrides the acquiree's own historical IAS38-based recognition choices","Because they are all tangible assets","Because Velquanta's auditors made an error previously"],"correct_index":1,"explanation":"This connects directly to Session 30's rule, business combination accounting uses a fair value recognition threshold, which lets previously unrecognised intangibles (blocked by IAS38's rules on internally generated intangibles) be recognised now."},{"id":"cr-s31-q10","session":31,"topic":"Transaction and due diligence costs","question":"How are Lyradon's EUR 1.2 million legal and due diligence costs treated?","choices":["Added to consideration transferred","Capitalised into goodwill","Expensed in the period incurred, not included in the purchase price allocation or goodwill","Deducted from Velquanta's net assets"],"correct_index":2,"explanation":"Consistent with Session 30's rule, acquisition-related costs are expensed as incurred, and the case explicitly notes they were paid separately from, and not included in, the consideration transferred."},{"id":"cr-s31-q11","session":31,"topic":"Common mistake, veto rights and control","question":"Does a 30% minority shareholder's veto over any matter automatically mean the 65% majority shareholder lacks control?","choices":["Yes, any veto right defeats control","No, the substantive versus protective distinction is what matters, veto rights confined to capital structure/distribution decisions and rights-preservation remain protective, not power-conferring","Yes, but only if the veto covers dividends specifically","It depends on the minority shareholder's nationality"],"correct_index":1,"explanation":"This is explicitly flagged as a common mistake, the mere existence of veto rights does not defeat control, their substantive versus protective character is what actually matters."}],"fm":[{"id":"fm-s1-q1","session":"1","topic":"Toys R Us case","question":"What ultimately caused Toys \"R\" Us to file for bankruptcy, per the fiche?","choices":["Declining revenue alone","Being profitable on paper but unable to generate and access enough cash to service debt and reinvest","Accounting fraud","Loss of brand value"],"correct_index":1,"explanation":"The lesson is structural: profitability on paper is not sufficient if the company cannot generate and access enough cash to service debt and reinvest. High leverage plus a competitive shift (e-commerce) ate into operating cash flow while capex needs remained."},{"id":"fm-s1-q2","session":"1","topic":"Value creation","question":"Value creation is defined as the outcome of which three simultaneous equilibria?","choices":["Profit, market share, growth","Income statement, balance sheet, and cash flow statement equilibria","Liquidity, solvency, profitability","Revenue, cost, margin"],"correct_index":1,"explanation":"A firm that is profitable (IS) but insolvent (BS) or cash-starved (CF) is not creating sustainable value; all three equilibria must hold together."},{"id":"fm-s1-q3","session":"1","topic":"Value creation rationale","question":"Which of the following is NOT one of the four reasons given for targeting value creation over market share or revenue growth?","choices":["It is measurable","It is sector- and lifecycle-agnostic","It guarantees short-term profit growth","It is broadly accepted"],"correct_index":2,"explanation":"The four stated reasons are: rational, broadly accepted, sector/lifecycle-agnostic, and measurable. Guaranteeing short-term profit growth is not one of them, and market share/revenue growth do not necessarily correlate with sustainable success."},{"id":"fm-s1-q4","session":"1","topic":"Business plan vs financial plan","question":"What is the relationship between the business (industrial) plan and the financial plan?","choices":["They are the same document","The financial plan is the financial profile of the business plan and tests whether the underlying business model is sustainable","The financial plan replaces the business plan entirely","The business plan is only needed for startups"],"correct_index":1,"explanation":"The business plan simulates the company's overall future trajectory; the financial plan is its financial profile, testing sustainability and identifying financial goals aligned with business strategy."},{"id":"fm-s1-q5","session":"1","topic":"Planning under uncertainty","question":"Per McKinsey (2024), which is NOT one of the four consequences of the current uncertainty environment for corporate planning?","choices":["Greater volatility in results","Larger discrepancies between forecasts and actuals","Fewer revisions to estimates","Increased dispersion in indicators and scenarios"],"correct_index":2,"explanation":"McKinsey identifies MORE frequent revisions to estimates as a consequence, not fewer, along with greater volatility, larger forecast-actual gaps, and increased dispersion."},{"id":"fm-s1-q6","session":"1","topic":"Momentum case","question":"What is a \"momentum case\" in FP&A, per McKinsey's six practices?","choices":["An explicit downside scenario","A baseline \"do-nothing\" forecast with management initiatives layered on top as building blocks","A blended CPI-based inflation forecast","A back-tested model"],"correct_index":1,"explanation":"The momentum case starts from a baseline do-nothing scenario and layers initiatives on top, improving accountability and setting realistic targets. The bear case is the separate, explicit downside scenario."},{"id":"fm-s1-q7","session":"1","topic":"Disaggregating inflation","question":"Why does McKinsey recommend disaggregating inflation rates rather than using one blended CPI figure?","choices":["To model key cost components individually and align cost-side and revenue-side assumptions","Because CPI is illegal to use in forecasts","Because inflation is irrelevant to FP&A","To simplify the model by ignoring cost structure"],"correct_index":0,"explanation":"Disaggregating avoids a single blended CPI figure, modeling raw materials and services individually and aligning cost-side and revenue-side inflation assumptions to avoid internal inconsistencies."},{"id":"fm-s1-q8","session":"1","topic":"Planning toolkit","question":"Which financial planning tool has a monthly/weekly frequency and a short-term (6 months to 1 year) horizon?","choices":["The financial plan","The financial budget","The cash budget","The income statement"],"correct_index":2,"explanation":"The cash budget is the finest-grained, shortest-horizon tool (monthly/weekly, 6 months to 1 year), built for treasury and liquidity management."},{"id":"fm-s1-q9","session":"1","topic":"Planning toolkit","question":"What is the horizon of a financial plan per the fiche's comparison table?","choices":["6 months to 1 year","1 year","Medium-long term, 3, 5 or 7 years","10 years, fixed"],"correct_index":2,"explanation":"The financial plan is the coarsest-grained, longest-horizon tool (medium-long term, 3, 5 or 7 years), built to support strategic decisions and demonstrate funding needs."},{"id":"fm-s1-q10","session":"1","topic":"Why cost/revenue is not cash","question":"Why do costs and revenues differ from cash outflows and inflows?","choices":["Only because of currency risk","Timing mismatch, non-monetary events, and events entirely outside the income statement","Only because of taxes","They never actually differ"],"correct_index":1,"explanation":"The three reasons given are a timing mismatch between accrual and cash accounting, non-monetary events (e.g. depreciation), and events that sit entirely outside the income statement (e.g. loan repayments)."},{"id":"fm-s1-q11","session":"1","topic":"Cash budget identity","question":"In Cash(EOP) = Cash(BOP) + (Sources − Uses) + Financial income (charges), what does BOP of month t equal?","choices":["Always zero","EOP of month t minus 1","EOP of month t plus 1","The annual average cash balance"],"correct_index":1,"explanation":"The EOP of one month becomes the BOP of the next; forgetting this roll-forward is flagged as a common exam trap."},{"id":"fm-s1-q12","session":"1","topic":"Timing mismatch categories","question":"Depreciation is an example of which category affecting the cost/revenue vs cash gap?","choices":["A timing mismatch","A non-monetary event","An event entirely outside the income statement","A financing activity"],"correct_index":1,"explanation":"Depreciation reduces accounting profit without any cash movement, the textbook non-monetary event."},{"id":"fm-s1-q13","session":"1","topic":"Timing mismatch categories","question":"Loan repayments are an example of which category?","choices":["A timing mismatch","A non-monetary event","An event that sits entirely outside the income statement","An operating activity source of cash"],"correct_index":2,"explanation":"Loan repayments move cash but never appear as a cost on the income statement, the third category alongside timing mismatches and non-monetary events."},{"id":"fm-s1-q14","session":"1","topic":"Sources of cash","question":"Per the fiche, what is normally the largest source of cash for a firm?","choices":["Proceeds from loan issuance","Payments from the firm's own customers","Sale of property, plant and equipment","Dividend income"],"correct_index":1,"explanation":"Customer collections are typically the largest source; don't default to \"raise debt\" as the first lever in a cash-shortage scenario."},{"id":"fm-s1-q15","session":"1","topic":"Clank case","question":"In the Clank IPO case, why can't the exact month-by-month cash balance be computed from the fiche alone?","choices":["The case is entirely hypothetical with no real data","Numeric input tables (headcount, hourly fees, utilization rates) live in a companion Excel file not captured in the extracted text","Clank refused to disclose its financials","The case was never actually solved by anyone"],"correct_index":1,"explanation":"The fiche's Watch Out box flags that Tables 1 to 5 live in a companion Excel file; know the mechanics (timing mismatches, lumpy capex, seasonal tax payments, overdraft cost), not a specific numeric answer."},{"id":"fm-s1-q16","session":"1","topic":"Clank case, capex","question":"What exam trap does the fiche flag about the CRM platform capex in the Clank case?","choices":["It is maintenance capex with no cash impact","It is expansion capex that hits cash on its own uneven payment schedule well before showing up as depreciation on the income statement","It has no effect on cash at all","It is fully expensed immediately on the income statement"],"correct_index":1,"explanation":"The €150,000 CRM platform is expansion capex, paid 10% in May, 50% in September, 20% in October, 20% in November, while only €22,500 of annual depreciation hits the income statement, a large cash outflow with a much smaller accounting footprint."},{"id":"fm-s2-q1","session":"2","topic":"Root cause","question":"Per Kaiser & Young (HBR 2009), what is the common root cause behind all six working-capital mistakes?","choices":["Bad luck","Badly designed performance metrics and incentives","Macroeconomic conditions beyond management's control","Lack of technology"],"correct_index":1,"explanation":"The common thread across all six mistakes is that badly designed performance metrics and incentives, not bad luck, are what lock cash into the balance sheet."},{"id":"fm-s2-q2","session":"2","topic":"Mistake 1","question":"Mistake 1, \"Managing to the Income Statement,\" is best described as:","choices":["Managers rewarded on profit alone have no incentive to avoid decisions that lock cash in the balance sheet","Managers are rewarded only on cash flow","Managers ignore the income statement entirely","Managers over-invest in R&D"],"correct_index":0,"explanation":"Because balance-sheet costs like holding extra inventory never appear on the income statement, income-statement-only incentives create no pressure to avoid locking up cash."},{"id":"fm-s2-q3","session":"2","topic":"Metals refining case","question":"In the metals refining firm example (Japan), what specific action reduced receivables from 185 to 45 days?","choices":["A full compensation system redesign","Salespeople calling customers a week before payment was due, purely as a courtesy reminder","Suing late-paying customers","Offering larger bulk discounts to customers"],"correct_index":1,"explanation":"A simple courtesy reminder call, without redesigning compensation, drove the change, freeing €115 million in capital and cutting capital costs by €8 million a year, against only about €3 million in margin loss."},{"id":"fm-s2-q4","session":"2","topic":"Mistake 2","question":"Mistake 2, \"Rewarding the Sales Force for Growth Alone,\" pushes salespeople to do what?","choices":["Reduce inventory aggressively","Grant long payment delays, avoid pressure on late payers, and demand oversized finished-goods inventory","Refuse all credit to customers","Lower prices uniformly across the board"],"correct_index":1,"explanation":"When comp is tied only to unit or dollar sales, salespeople book sales at any cost, inflating both receivables and inventory."},{"id":"fm-s2-q5","session":"2","topic":"China receivables case","question":"In the global electrical component manufacturer case (selling into China), what turned out to be the real cause of long, low-quality receivables, instead of \"flexible\" local payment norms?","choices":["Currency risk","Incorrect price positioning (extended terms disguised as rebates) and wrong documentation delaying invoice collection","A legal ban on collections in China","An accounting error in the ledger"],"correct_index":1,"explanation":"A task force found the real causes were mispriced disguised rebates and documentation errors; fixing them freed over $10 million with no loss of market share."},{"id":"fm-s2-q6","session":"2","topic":"Mistake 3","question":"Mistake 3, \"Overemphasizing Quality in Production,\" traps managers because:","choices":["Quality control has no cost at all","Evaluating production managers mainly on defect counts slows the cycle and locks capital in WIP inventory customers may not pay for","Quality always increases sales","WIP inventory is never a cash cost"],"correct_index":1,"explanation":"Quality control that customers don't value or pay for still locks up capital in work-in-process inventory, a cost only worth incurring if customers actually pay for the extra quality."},{"id":"fm-s2-q7","session":"2","topic":"Drive-systems case","question":"What did the European drive-systems producer do to free €20 million in cash?","choices":["Increased quality bonuses further","Refocused on cutting WIP inventory rather than defending the price premium, shortening WIP by 20 days","Raised prices across the board","Reduced headcount in production"],"correct_index":1,"explanation":"Even though cycle times stayed above industry average, accepting that the quality edge was not fully defensible and cutting WIP freed €20 million."},{"id":"fm-s2-q8","session":"2","topic":"Mistake 4","question":"Mistake 4, \"Tying Receivables to Payables,\" is the trap of:","choices":["Offering the same terms to every supplier","Mechanically linking customer credit terms to supplier terms received, assuming the two relationships mirror each other","Never negotiating with suppliers at all","Ignoring supplier terms entirely"],"correct_index":1,"explanation":"Bargaining power, competition, industry structure and switching costs differ across the customer and supplier relationships and must be managed on their own terms."},{"id":"fm-s2-q9","session":"2","topic":"Machine tools example","question":"In the hypothetical machine tools company, what happened when the firm mirrored a 10-day supplier term cut onto its own customers?","choices":["No effect, since customers had no alternatives","Customers had real market power; business dropped 20%, costing far more in profit than the cash captured from tighter receivables","The firm gained new customers as a result","The supplier reversed its decision immediately"],"correct_index":1,"explanation":"The receivables tightening captured only $3.8 million while the resulting profit hit was $6 million, illustrating why receivables and payables must be managed independently."},{"id":"fm-s2-q10","session":"2","topic":"Mistake 5, ratios","question":"What two ratios does Mistake 5 warn against optimizing, and why?","choices":["ROE and ROA, because they ignore debt","Current ratio and quick ratio, because a \"better\" ratio is typically achieved by carrying higher receivables/inventory and lower payables","EBITDA margin and net margin, because they ignore cash","DSO and DPO, because they are irrelevant to bankers"],"correct_index":1,"explanation":"A higher current or quick ratio looks good to bankers but is usually achieved via exactly the opposite of sound working-capital practice, more receivables and inventory, thinner payables."},{"id":"fm-s2-q11","session":"2","topic":"French consumer goods case","question":"What happened to the French consumer goods company whose CEO proudly announced a rising current ratio (110% to 200%) and quick ratio (35% to 100%)?","choices":["It was acquired at a premium","It declared insolvency six months later","Its stock price tripled","Nothing changed materially"],"correct_index":1,"explanation":"The case is the fiche's sharpest illustration that chasing a higher current/quick ratio can be the opposite of financial health."},{"id":"fm-s2-q12","session":"2","topic":"Mistake 6","question":"Mistake 6, \"Benchmarking Competitors,\" warns that:","choices":["Benchmarking is always harmful and should never be done","Benchmarking only within your own industry breeds complacency, even when the whole industry is inefficient","Benchmarking should only ever be done against direct competitors","Competitors always share fully accurate benchmarking data"],"correct_index":1,"explanation":"The best companies benchmark radically, often outside their own industry, since a whole industry can be simultaneously inefficient."},{"id":"fm-s2-q13","session":"2","topic":"Dell case","question":"What did comparing Dell against retailers (instead of other computer makers) reveal in the early 1990s?","choices":["Dell was already the best possible performer with nothing left to learn","Dell's performance was not special after all, prompting a complete overhaul of its working-capital practices","Dell should raise prices significantly","Dell should exit the PC business entirely"],"correct_index":1,"explanation":"A consultants' report had confirmed Dell had little to learn from computer-maker peers; benchmarking against retailers showed otherwise and triggered a full overhaul."},{"id":"fm-s2-q14","session":"2","topic":"Watch Out, HBR case data","question":"Per the fiche's Watch Out box, how should the dollar and euro figures in the HBR case examples be read?","choices":["As exact, verifiable real-world benchmarks","As directional evidence of magnitude, illustrative and anonymized per standard HBR case practice, since the article dates from May 2009","As irrelevant to the exam and safe to ignore","As figures already adjusted to 2025 values"],"correct_index":1,"explanation":"The fiche explicitly flags this HBR article as dating from May 2009, with figures that are illustrative/anonymized per standard case-study practice."},{"id":"fm-s2-q15","session":"2","topic":"Diagnostic question","question":"What is the unifying diagnostic question the fiche recommends asking on any working-capital case question?","choices":["\"What is the industry average?\"","\"What is this person's bonus tied to?\"","\"What is the current stock price?\"","\"What did the CFO say publicly?\""],"correct_index":1,"explanation":"Nearly every mistake in the article traces back to a performance metric that rewards a manager for an action that destroys enterprise value."},{"id":"fm-s3-q1","session":"3","topic":"DSO/DPO/DI denominators","question":"Which denominators are correctly used for DSO, DPO, and DI?","choices":["All three scaled by daily sales","DSO scaled by daily sales; DI and DPO scaled by daily COGS","All three scaled by daily COGS","DSO scaled by COGS, DI and DPO scaled by sales"],"correct_index":1,"explanation":"DSO is scaled by daily sales; DI and DPO are both scaled by daily COGS, not sales, a frequent source of calculation errors."},{"id":"fm-s3-q2","session":"3","topic":"Cash cycle formula","question":"What is the cash conversion cycle formula?","choices":["DI + DSO + DPO","DI + DSO − DPO","DSO − DI + DPO","DPO − DI − DSO"],"correct_index":1,"explanation":"Cash Cycle = DI + DSO − DPO, the operating cycle (DI+DSO) minus the payable period, since payables finance part of the operating cycle."},{"id":"fm-s3-q3","session":"3","topic":"Worked calculation, DSO","question":"Using Sales $6,133m, COGS $5,464m, Inventory $879m, AR $764m, AP $682m, what is DSO?","choices":["45 days","59 days","46 days","58 days"],"correct_index":0,"explanation":"DSO = 764 ÷ (6,133 ÷ 365) = 45 days."},{"id":"fm-s3-q4","session":"3","topic":"Worked calculation, DI","question":"Using the same data (Sales $6,133m, COGS $5,464m, Inventory $879m), what is DI?","choices":["45 days","46 days","59 days","58 days"],"correct_index":2,"explanation":"DI = 879 ÷ (5,464 ÷ 365) = 59 days."},{"id":"fm-s3-q5","session":"3","topic":"Worked calculation, cash cycle","question":"Using DI=59, DSO=45, DPO=46, what is the cash cycle applying the formula correctly?","choices":["59 days","58 days","150 days","46 days"],"correct_index":1,"explanation":"Cash Cycle = DI + DSO − DPO = 59 + 45 − 46 = 58 days. The fiche flags the source's own solved example as showing \"59 days,\" likely a table/layout extraction artifact; use the formula result, 58 days."},{"id":"fm-s3-q6","session":"3","topic":"Walmart vs Boeing","question":"Which company in the fiche's contrast has a cash cycle near zero, and why?","choices":["Boeing, because of long manufacturing cycles","Walmart, because of fast inventory turnover as a retailer","Boeing, because of very high receivables","Walmart, because of very high payables only"],"correct_index":1,"explanation":"Walmart's fast turnover keeps DI and DSO low, giving a cash cycle near zero (about 2 days), versus Boeing's long manufacturing cycle producing a cash cycle near 179 days."},{"id":"fm-s3-q7","session":"3","topic":"Walmart vs Boeing","question":"What does Boeing's lengthy cash cycle (about 179 days) primarily reflect?","choices":["Very fast inventory turnover","A long-manufacturing-cycle industrial firm with very high days inventory (~196 days)","Very short payable terms","Zero receivables"],"correct_index":1,"explanation":"Boeing's DI of about 196 days, reflecting its long manufacturing cycle, is the dominant driver of its long cash cycle."},{"id":"fm-s3-q8","session":"3","topic":"Inventory trade-off","question":"In the carrying-cost vs order-cost trade-off, what happens to carrying cost as order size increases?","choices":["It falls","It rises, since larger orders mean more inventory sitting in storage","It stays constant","It becomes negative"],"correct_index":1,"explanation":"Carrying cost (storage plus opportunity cost of capital) rises with order size, the opposite of order cost."},{"id":"fm-s3-q9","session":"3","topic":"Inventory trade-off","question":"What happens to order cost as order size increases?","choices":["It rises","It falls, since fewer, larger orders mean fewer handling/delivery events","It stays constant","It becomes zero"],"correct_index":1,"explanation":"Order cost (handling and delivery cost of placing and receiving an order) falls as orders get larger and less frequent, the optimal order size balances the two curves."},{"id":"fm-s3-q10","session":"3","topic":"Reorder point","question":"What is the reorder point?","choices":["A random reordering schedule","Waiting until stock reaches a minimum threshold, then replenishing with a predetermined order quantity","An annual review of inventory only","A bank covenant on inventory levels"],"correct_index":1,"explanation":"The reorder point is the inventory-management mechanism that triggers replenishment once stock hits a minimum threshold."},{"id":"fm-s3-q11","session":"3","topic":"Inventory scaling","question":"Per the fiche, does inventory rise proportionally with sales?","choices":["Yes, always exactly proportional","No, optimal inventory rises but less than proportionately as sales grow, an economy of scale","Inventory falls as sales rise","Inventory is unrelated to sales"],"correct_index":1,"explanation":"As sales grow the optimal inventory level rises, but less than proportionately, an economy of scale in inventory management."},{"id":"fm-s3-q12","session":"3","topic":"JIT","question":"When does just-in-time (JIT) inventory strategy work, per the fiche?","choices":["Only when production flow is steady and predictable, so no significant safety buffer is needed","Only for perishable goods","Only in high-volatility markets","It always works regardless of context"],"correct_index":0,"explanation":"JIT requires steady, predictable production flow; without that, a safety buffer becomes necessary and JIT breaks down."},{"id":"fm-s3-q13","session":"3","topic":"Receivables management structure","question":"What are the four questions that structure receivables management?","choices":["Price, quality, delivery, service","Terms of sale, credit analysis, the credit decision, collection policy","Revenue, cost, margin, cash","Forecast, budget, actual, variance"],"correct_index":1,"explanation":"Managing trade credit requires answering these four sets of questions in sequence."},{"id":"fm-s3-q14","session":"3","topic":"Credit decision","question":"In the credit decision framework, what is E[gain | refuse credit]?","choices":["Always negative","$0","Equal to expected profit","Equal to the full cost of the sale"],"correct_index":1,"explanation":"If credit is refused, the firm makes neither a profit nor a loss, E[gain | refuse credit] = $0, the benchmark against which granting credit is compared."},{"id":"fm-s3-q15","session":"3","topic":"Credit decision formula","question":"What is the correct expected-gain formula when credit is granted?","choices":["p × Revenue − Cost","p × PV(Revenue − Cost) − (1−p) × PV(Cost)","PV(Revenue) only","(1−p) × PV(Revenue − Cost)"],"correct_index":1,"explanation":"E[gain | grant credit] weighs the probability-weighted profit if paid against the probability-weighted loss if the customer defaults, both in present value terms."},{"id":"fm-s3-q16","session":"3","topic":"Credit allocation principles","question":"What is the first of the three basic principles for exercising judgment in credit allocation?","choices":["Minimize the number of bad accounts","Maximize profit (present value), not minimize the number of bad accounts","Refuse all doubtful accounts outright","Treat every account with equal analytical effort"],"correct_index":1,"explanation":"The credit manager's job is to maximize present value by weighing the best case against the worst case, not to minimize the count of bad accounts."},{"id":"fm-s45-q1","session":"4-5","topic":"Types of financial risk","question":"Per the A2A example, name the four financial risks it tracks side by side.","choices":["Market, credit, liquidity, operational risk","Liquidity risk, de-rating risk, interest rate risk, sustainability covenant risk","FX, commodity, business, reputational risk","Equity, debt, hybrid, green risk"],"correct_index":1,"explanation":"A2A tracks these four risks, each with its own causes and management levers, illustrating that a firm's overall financial risk is a family of interconnected risks."},{"id":"fm-s45-q2","session":"4-5","topic":"FX exposure types","question":"Which FX exposure type deals with already contractually fixed obligations?","choices":["Operating exposure","Transaction exposure","Translation exposure","Commodity exposure"],"correct_index":1,"explanation":"Transaction exposure is the change in value of outstanding, already-fixed financial obligations caused by exchange-rate moves before settlement."},{"id":"fm-s45-q3","session":"4-5","topic":"FX exposure types","question":"Which FX exposure type affects only consolidated financial statement numbers, not actual cash flow?","choices":["Transaction exposure","Operating/economic exposure","Translation/accounting exposure","Credit exposure"],"correct_index":2,"explanation":"Translation exposure is the impact of FX volatility on consolidating foreign subsidiaries' accounts, it changes reported numbers but not actual cash flow."},{"id":"fm-s45-q4","session":"4-5","topic":"FX exposure types","question":"Which FX exposure type reflects changes in a firm's expected future, not-yet-contracted cash flows due to competitiveness effects?","choices":["Transaction exposure","Operating/economic exposure","Translation exposure","Liquidity exposure"],"correct_index":1,"explanation":"Operating/economic exposure covers future cash flows affected by competitiveness, e.g. a stronger home currency making exports pricier abroad."},{"id":"fm-s45-q5","session":"4-5","topic":"What hedging does","question":"What does hedging transaction exposure actually reduce?","choices":["The expected cash flow itself, always upward","The variability of expected cash flows around their mean","The firm's tax liability","Nothing measurable"],"correct_index":1,"explanation":"Hedging narrows the range of possible outcomes around the mean; it does not necessarily increase the expected cash flow itself."},{"id":"fm-s45-q6","session":"4-5","topic":"Forward positions","question":"If you owe foreign currency in the future (a payable), what forward position
