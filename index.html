 should you enter?","choices":["Short forward","Long forward, agreeing to buy the currency at maturity at the forward price","No forward is possible for payables","A put option only"],"correct_index":1,"explanation":"A payable calls for a long forward position, locking in the price at which you will buy the foreign currency you owe."},{"id":"fm-s45-q7","session":"4-5","topic":"Forward positions","question":"If you will receive foreign currency in the future (a receivable), what forward position should you enter?","choices":["Long forward","Short forward, agreeing to sell the currency at maturity","A call option only","No hedge is possible"],"correct_index":1,"explanation":"A receivable calls for a short forward position, locking in the price at which you will sell the foreign currency you will receive."},{"id":"fm-s45-q8","session":"4-5","topic":"Importer/exporter options rule","question":"Per the importer/exporter options rule, what should an importer who owes foreign currency buy?","choices":["A put option","A call option, to lock in an upper limit on the dollar cost","A forward and an option simultaneously, always","Nothing, importers cannot hedge with options"],"correct_index":1,"explanation":"Importers who owe FX buy calls; if the price rises the call caps the cost, if it falls they let the option lapse and buy cheaper on the spot market."},{"id":"fm-s45-q9","session":"4-5","topic":"Importer/exporter options rule","question":"What should an exporter with a foreign-currency receivable buy?","choices":["A call option","A put option, to lock in a lower limit on the dollar value of the export","A forward only, never an option","A swap"],"correct_index":1,"explanation":"Exporters who will receive FX buy puts; if the price falls the put floors the value, if it rises they let the option lapse and sell at the better spot rate."},{"id":"fm-s45-q10","session":"4-5","topic":"Woolens importer example","question":"In the woolens importer example (owes £100 million in one year at a $1.50/£ forward), what happens to the hedged position if the pound falls to $1.20/£?","choices":["The importer loses $30m overall","The forward loses $30m, exactly offsetting the unhedged saving, so the hedged total cost stays flat at $1.50/£","The hedge has no effect at all","The importer must pay an extra premium"],"correct_index":1,"explanation":"The forward position's gain/loss exactly mirrors the unhedged payable's gain/loss, so combining the two keeps the hedged cost flat at $1.50/£ regardless of the spot rate."},{"id":"fm-s45-q11","session":"4-5","topic":"Break-even spot rate, receivable","question":"What is the formula for the break-even spot rate of a receivable hedged with a put option?","choices":["S*T = F − premium","S*T = F + premium","S*T = F × premium","S*T = F ÷ premium"],"correct_index":1,"explanation":"S*T = F + premium. Above this spot rate, the un-exercised put's payoff overtakes the forward's fixed payoff."},{"id":"fm-s45-q12","session":"4-5","topic":"Break-even spot rate, payable","question":"What is the formula for the break-even spot rate of a payable hedged with a call option?","choices":["S*T = F + premium","S*T = F − premium","S*T = F × premium","S*T = premium − F"],"correct_index":1,"explanation":"S*T = F − premium. Below this spot rate, the un-exercised call's cost falls under the forward's fixed cost, making the option cheaper."},{"id":"fm-s45-q13","session":"4-5","topic":"Boeing receivable exercise","question":"In the Boeing landing-gear receivable example (forward $1.46/£, put premium $0.02/£), what is the break-even spot rate?","choices":["$1.44/£","$1.48/£","$1.46/£","$1.50/£"],"correct_index":1,"explanation":"S*T = F + premium = $1.46 + $0.02 = $1.48/£, matching the source's own graph."},{"id":"fm-s45-q14","session":"4-5","topic":"Over-hedging definition","question":"What is over-hedging?","choices":["Hedging exactly the amount of currency that will materialize","Hedging a larger foreign-currency amount than what actually materializes, turning the hedge into a speculative position on the un-realized portion","Using two different hedge instruments together","Refusing to hedge at all"],"correct_index":1,"explanation":"Over-hedging leaves the firm contractually obligated to deliver currency it doesn't have from the underlying business, forcing it to buy the shortfall in the market."},{"id":"fm-s45-q15","session":"4-5","topic":"Over-hedging worked example","question":"In the over-hedging worked example, why did the CFO end up with a loss purely from over-hedging?","choices":["The spot rate never moved from budget","The CFO sold 100% of the expected $100 forward at T0, but actual revenue at T1 was only $50, forcing the CFO to buy the missing $50 on the spot market to deliver against the forward","The option premium was too high to be worth using","The forward contract was cancelled by the counterparty"],"correct_index":1,"explanation":"Delivering the full $100 forward while only earning $50 forces the CFO to buy the missing $50 at the (worse) spot rate and hand it over at the forward rate, a loss purely attributable to the unrealized, over-hedged portion."},{"id":"fm-s45-q16","session":"4-5","topic":"Hedging policy design","question":"What are the two hedging-policy design questions raised by the over-hedging analysis?","choices":["Which bank to use and what currency to hedge","When to start hedging (budget vs invoicing stage) and how much to hedge (100% vs a smaller share)","Whether to use puts or calls only","How to compute the spot rate"],"correct_index":1,"explanation":"Every hedging policy must decide when exposure becomes certain enough to hedge, and what share of the expected amount to cover."},{"id":"fm-s45-q17","session":"4-5","topic":"Forward hedge and expected outcome","question":"What does a forward hedge do to the expected outcome of a transaction, per the Common Mistakes section?","choices":["It always improves the expected outcome","It does not improve the expected outcome, it removes variance around the mean, which can mean giving up upside","It guarantees a profit regardless of the spot rate","It eliminates the need to ever pay an option premium"],"correct_index":1,"explanation":"A forward narrows the range of outcomes but does not raise the expected value; removing downside risk can mean giving up upside as the price."},{"id":"fm-s45-q18","session":"4-5","topic":"Direct quotation","question":"In the direct vs indirect quotation convention (European investor), what is a direct quotation?","choices":["Units of foreign currency per unit of home currency","Units of home currency (€) that buy one unit of foreign currency ($)","Always expressed in US dollars regardless of investor","Irrelevant to hedging decisions"],"correct_index":1,"explanation":"A direct quotation (from a European investor's view) states how many euros buy one dollar, e.g. €/$; the indirect quotation is the reciprocal, $/€."},{"id":"fm-s45-q19","session":"4-5","topic":"Forward premium/discount","question":"What does a positive forward premium/discount result (fN,j > 0) mean?","choices":["Currency j trades at a forward discount and is expected to weaken","Currency j trades at a forward premium and is expected to strengthen","The spot and forward rates are always identical","The hedge has failed"],"correct_index":1,"explanation":"If the forward rate is above the spot rate, currency j trades at a forward premium, the market expects it to strengthen."},{"id":"fm-s45-q20","session":"4-5","topic":"Recap comparison","question":"In the final recap comparison, why is \"do nothing\" both the best case and the worst case across the two T2 spot scenarios?","choices":["Because doing nothing has no effect on the outcome at all","Because remaining unhedged has the widest range of outcomes, exactly the risk hedging is meant to remove, while the option sits between the forward and doing nothing","Because the forward is always inferior to doing nothing","Because option premiums are fully refundable"],"correct_index":1,"explanation":"Doing nothing swings between €71.42 (best) and €57.18 (worst); the forward is most stable at €64.93 either way; the option protects the downside (€62.19) while keeping most of the upside (€70.15)."}],"cg":[{"id":"cg-s1-q1","session":"1","topic":"Definitions of CG","question":"Which definition of corporate governance is board-centred, treating the board as the accountable body?","choices":["Shleifer & Vishny (1996)","Cadbury Committee (1992)","Sheridan & Kendall (1992)","Blair (1995)"],"correct_index":1,"explanation":"Cadbury defines CG as 'the system by which companies are directed and controlled', with boards of directors responsible for governance and shareholders appointing directors and auditors. Shleifer & Vishny is the narrow/finance view, Sheridan & Kendall is the broader stakeholder view, Blair is the systemic/institutional view."},{"id":"cg-s1-q2","session":"1","topic":"Definitions of CG","question":"Shleifer & Vishny's (1996) definition of corporate governance centres on:","choices":["The board of directors as the governing body","Suppliers of finance ensuring themselves a return on investment","The entire set of legal, cultural and institutional arrangements","Balancing shareholder, employee, environmental and community interests"],"correct_index":1,"explanation":"Shleifer & Vishny (1996): 'Corporate governance deals with the ways in which suppliers of finance to corporations ensure themselves a return on their investment.' This is the narrowest, finance-only view of the four definitions in the fiche."},{"id":"cg-s1-q3","session":"1","topic":"EssilorLuxottica case","question":"In the EssilorLuxottica case, what governance problem did Delfin's 88% approval requirement create?","choices":["It gave Del Vecchio's widow sole control","It allowed a hostile takeover","It could paralyse decision-making even though ownership itself was not in dispute","It automatically transferred control to the board"],"correct_index":2,"explanation":"Delfin's bylaws required 88% approval for any decision, meaning the family had to act unanimously to exercise control. This shows concentrated control can produce internal deadlock even without any single controller disputing ownership."},{"id":"cg-s1-q4","session":"1","topic":"Meta / Zuckerberg case","question":"How does Mark Zuckerberg control Meta despite holding a minority of total equity?","choices":["Through a shareholders' agreement with other founders","Through a dual-class share structure (Class B shares) giving disproportionate voting power","Through a pyramidal holding company structure","Through a golden parachute clause"],"correct_index":1,"explanation":"Zuckerberg owns 99.8% of Class B shares, giving him about 58% of voting rights while holding only about 13% of economic ownership, plus he holds both CEO and Chairman roles. This is a dual-class structure, not a pyramid or shareholders' agreement."},{"id":"cg-s1-q5","session":"1","topic":"Public company","question":"What defines a 'public company' (PC) in the sense used in this session?","choices":["Any company listed on a stock exchange","A listed company whose ownership is so fragmented that no single shareholder finds it worthwhile to actively govern it","A company majority-owned by the State","A company with a dual-class share structure"],"correct_index":1,"explanation":"Public company (PC): a listed company whose ownership is so fragmented that no single shareholder holds a stake large enough to make it convenient to take an active part in governing the company. Simply being listed is not sufficient for this specific definition."},{"id":"cg-s1-q6","session":"1","topic":"Shareholder behaviour in PCs","question":"In a public company with dispersed ownership, how do shareholders typically respond when they disagree with governance decisions?","choices":["They contest board elections directly","They 'vote with their feet', i.e. sell their shares","They file shareholder derivative lawsuits as a default response","They form a pyramidal group to gain control"],"correct_index":1,"explanation":"Because no shareholder has a large enough stake to bother monitoring management directly, dispersed shareholders typically don't vote to nominate directors in a meaningful contested way, they sell their shares instead ('voting with their feet')."},{"id":"cg-s1-q7","session":"1","topic":"Agency theory","question":"In the agency relationship between shareholders and managers, what does the principal do because it anticipates the agent may act in its own interest?","choices":["Nothing, the market handles it automatically","It sets up costly safeguard mechanisms (contracts, controls, incentives, guarantees)","It always replaces the agent immediately","It transfers residual control rights to the agent"],"correct_index":1,"explanation":"Because both principal and agent are utility maximisers and may diverge in interest, the principal is compelled to set up safeguard mechanisms, and these safeguards are often extremely costly to design and operate."},{"id":"cg-s1-q8","session":"1","topic":"Agency costs","question":"Which of the following correctly decomposes agency costs as presented in the fiche?","choices":["Monitoring costs + guarantee/bonding costs + residual losses","Audit fees + legal fees + lost profits","Executive compensation + board fees + shareholder losses","Transaction costs + information costs + opportunity costs"],"correct_index":0,"explanation":"Agency costs = monitoring costs (what the principal spends to observe/constrain the agent) + guarantee/bonding costs (what the agent spends to credibly commit not to act against the principal) + residual losses (the welfare loss remaining even after monitoring and bonding)."},{"id":"cg-s1-q9","session":"1","topic":"Three ownership/board configurations","question":"In the 'concentrated ownership with overlap between ownership, governance and management' configuration, what additional conflict arises on top of the classic shareholder-manager agency problem?","choices":["A conflict between auditors and regulators","A conflict between majority and minority shareholders","A conflict between creditors and the board","There is no additional conflict, this configuration removes agency costs entirely"],"correct_index":1,"explanation":"When a controlling family sits on both the board and in management, this raises the question of alignment of interests between majority and minority shareholders, a distinct conflict from the shareholder-vs-manager problem in the first two configurations."},{"id":"cg-s1-q10","session":"1","topic":"Managerial misbehaviour","question":"'Empire building' as a managerial misbehaviour pattern consists of:","choices":["Overly risk-averse strategies and minimal effort","Pursuing risky growth over profitability to expand personal power, perks and compensation","Transferring benefits to relatives or associates","Trading on private information"],"correct_index":1,"explanation":"Empire building is pursuing risky growth over profitability to expand personal power, networking opportunities, compensation and perks. Its opposite failure mode is shirking (overly risk-averse, minimal effort) - the two are easy to confuse but are opposites."},{"id":"cg-s1-q11","session":"1","topic":"Managerial misbehaviour","question":"Which pair correctly matches a misbehaviour with the context the fiche says favours it?","choices":["Shirking, favoured by highly competitive, efficient markets","Entrenchment, favoured by underdeveloped financial markets","Personal enrichment, favoured by small companies with no internal leadership","Wealth extraction, favoured by strong external auditing"],"correct_index":1,"explanation":"The fiche's table pairs entrenchment (statutory defences, poison pills, golden parachutes) with underdeveloped financial markets as the favouring context. Shirking is favoured by inefficient markets/low competition, not efficient ones."},{"id":"cg-s1-q12","session":"1","topic":"Historical failures","question":"Which governance failure involved off-balance-sheet entities and hidden debt, with auditor collusion?","choices":["Theranos","Satyam","Enron","WorldCom"],"correct_index":2,"explanation":"Enron (US, 2001) involved accounting fraud via off-balance-sheet entities and hidden debt, where the board failed to monitor and auditors colluded. WorldCom involved inflated earnings via weak internal controls, Satyam involved false reporting, Theranos involved misrepresented technology."},{"id":"cg-s1-q13","session":"1","topic":"Governance mechanisms","question":"The 'market for corporate control' disciplines managers primarily through:","choices":["Fiduciary duty lawsuits","Proxy fights, friendly takeovers and hostile takeovers reallocating ownership toward more efficient managers","Government regulation of executive pay","Mandatory board diversity quotas"],"correct_index":1,"explanation":"The market for corporate control reallocates ownership toward whoever believes they can manage the company more efficiently, through three channels: proxy fights, friendly takeovers, and hostile takeovers (a raider buying over 50% of voting shares)."},{"id":"cg-s1-q14","session":"1","topic":"Blockholders","question":"According to the fiche, are blockholders automatically good monitors of management?","choices":["Yes, by definition large shareholders always protect minority shareholders","No, they can also be tempted to pursue their own interests over minority shareholders' interests","Only if they are institutional investors like pension funds","Only in common law countries"],"correct_index":1,"explanation":"Not all blockholders are 'good' monitors, they can be tempted to pursue their own interests over minority shareholders' interests, expropriation/misallocation is as plausible as effective monitoring. Institutional investors like CalPERS/BlackRock are the typical example of blockholders considered good 'watchdogs', but this is not automatic for all blockholders."},{"id":"cg-s1-q15","session":"1","topic":"LLSV framework","question":"Per the LLSV logic in the fiche, what happens in a country with weak legal protection of shareholders and creditors?","choices":["Dispersed ownership becomes the dominant structure","Ownership concentration acts as a substitute mechanism for weak legal protection","Financial markets become more efficient to compensate","Boards automatically become more independent"],"correct_index":1,"explanation":"Where legal protection is weak, ownership concentration substitutes for law, blockholders protect their own interests directly because the law will not reliably do it for them. Where legal protection is strong, dispersed ownership becomes viable instead."},{"id":"cg-s2-q1","session":"2","topic":"Shareholder view core assumptions","question":"Under the shareholder view's core assumptions, how are stakeholders (employees, customers, suppliers) treated?","choices":["As co-owners of the firm","Only instrumentally, as means to the end of shareholder value","As the ultimate residual claimants","As agents of the board"],"correct_index":1,"explanation":"One of the four core assumptions is that stakeholders are considered only instrumentally, they matter mainly as means to the end of shareholder value, not as ends in themselves (e.g. Amazon investing in logistics mainly to improve profitability)."},{"id":"cg-s2-q2","session":"2","topic":"Shareholder view core assumptions","question":"Being a 'residual claimant' means a shareholder:","choices":["Has first priority over all other claims on the firm's cash flows","Receives whatever remains after all other obligations (debt, wages, taxes) are paid","Automatically controls the board","Cannot be diluted by new share issues"],"correct_index":1,"explanation":"Shareholders are residual claimants of profits, they receive whatever remains after all other obligations are paid, illustrated by Apple distributing dividends/buybacks out of residual income."},{"id":"cg-s2-q3","session":"2","topic":"Extended assumptions","question":"The shareholder view's 'extended assumptions' (efficient markets, disciplining stock price, stock-based incentives, market for corporate control) are best described as:","choices":["Empirically proven facts about how all firms behave","Conditions the whole shareholder-view argument depends on, not independent facts","Legal requirements imposed by securities regulators","A list of stakeholder rights"],"correct_index":1,"explanation":"The extended assumptions are not independent facts, they are conditions the whole shareholder-view argument depends on. If markets are not efficient, or incentive pay does not actually align interests, the argument that shareholder value maximization is good for everyone weakens accordingly."},{"id":"cg-s2-q4","session":"2","topic":"Residual rights","question":"What is the difference between residual income rights and residual control rights?","choices":["They are the same thing described in two ways","Residual income rights are the claim on leftover profit, residual control rights are the right to decide when a contract is silent or incomplete","Residual income rights belong to managers, residual control rights belong to shareholders","Residual control rights only apply to bondholders"],"correct_index":1,"explanation":"Residual income rights are the right to appropriate profits after all contractual obligations are met. Residual control rights are the right to control decisions when a contract is silent or incomplete. Both are allocated to shareholders, for related but different reasons."},{"id":"cg-s2-q5","session":"2","topic":"Nexus of contracts","question":"Why does the fiche say ownership rights become the key governance mechanism?","choices":["Because contracts can never cover every future situation, so someone must have the right to decide when a contract is silent","Because shareholders always want more legal protection than other stakeholders","Because managers cannot be trusted with any contracts","Because ownership rights replace the need for a board"],"correct_index":0,"explanation":"Given that contracts (a mix of explicit legal agreements and implicit informal expectations) can never cover every future situation, ownership rights become the key mechanism for handling what the contracts don't specify."},{"id":"cg-s2-q6","session":"2","topic":"General Electric case","question":"In the General Electric (2018) example, what did shareholders do using their residual control rights?","choices":["They sued the board for breach of fiduciary duty","They replaced board members, pushed for the CEO's dismissal, and approved a major restructuring plan","They sold all their shares and exited","They formed a pyramidal holding structure"],"correct_index":1,"explanation":"After years of poor performance, GE shareholders used their residual control rights (voting power) to replace board members, push for the CEO's dismissal, and approve a major restructuring plan."},{"id":"cg-s2-q7","session":"2","topic":"Limits of ownership rights","question":"According to the fiche's 'watch out', are ownership rights described as a full solution to governance conflicts?","choices":["Yes, allocating ownership rights to shareholders eliminates agency costs entirely","No, they are described as an important tool, not a guarantee, since controlling shareholders can themselves expropriate other stakeholders","Yes, but only in common law countries","No, ownership rights have no effect on governance conflicts"],"correct_index":1,"explanation":"Ownership rights are a powerful governance mechanism but 'not a full solution' - controlling shareholders can themselves expropriate other stakeholders by exploiting contract gaps, and both judicial systems and markets are imperfect."},{"id":"cg-s2-q8","session":"2","topic":"Property vs social entity","question":"Under the 'social entity' conception of the firm, what is the role of managers and boards?","choices":["Agents of shareholders","Trustees balancing diverse stakeholder interests","Employees of the State","Residual claimants"],"correct_index":1,"explanation":"Under the social entity conception, the corporation is a social institution, its assets are used for the benefit of multiple stakeholders, and managers/boards act as trustees balancing diverse interests, unlike the property conception where they are agents of shareholders alone."},{"id":"cg-s2-q9","session":"2","topic":"Property vs social entity","question":"Which company is used in the fiche as the example for the social entity conception?","choices":["ExxonMobil","Apple","Unilever, via its 'Sustainable Living Plan'","Microsoft"],"correct_index":2,"explanation":"Unilever's 'Sustainable Living Plan', balancing profits with social/environmental goals, is the fiche's example of the social entity conception. ExxonMobil is used as the property-conception example."},{"id":"cg-s2-q10","session":"2","topic":"Stakeholder map","question":"A local community defending its 'social license to operate' is exercising which type of stakeholder power?","choices":["Voting power","Political and regulatory power","Environmental and social power","Economic power"],"correct_index":2,"explanation":"Environmental and social power covers customers pushing sustainability demands, local communities defending their social license to operate, and public authorities setting environmental/emission standards."},{"id":"cg-s2-q11","session":"2","topic":"Stakeholder map","question":"Which type of stakeholder power is exercised specifically through equity stakes, including electing/removing board members?","choices":["Economic power","Voting power","Political and regulatory power","Environmental and social power"],"correct_index":1,"explanation":"Voting power is exercised through equity stakes, rights include electing/removing board members and approving dividends, M&A and by-law changes."},{"id":"cg-s2-q12","session":"2","topic":"Four definitions of CG's purpose","question":"The 'managerial definition' of what corporate governance is for focuses on:","choices":["Maximizing shareholder value","The interests of managers themselves, e.g. empire building, perks, job security","Balancing all stakeholder interests","The firm's own long-term survival"],"correct_index":1,"explanation":"The managerial definition focuses on the interests of managers themselves (empire building, perks, job security); the lecture cites Enron as showing managerial capture and self-interest."},{"id":"cg-s2-q13","session":"2","topic":"Business Roundtable 2019","question":"What did the 2019 Business Roundtable Statement represent, per the fiche?","choices":["A binding change to US corporate law","A voluntary statement signed by 181 CEOs redefining corporate purpose toward stakeholder capitalism","A shareholder lawsuit against ExxonMobil","A new SEC disclosure regulation"],"correct_index":1,"explanation":"181 CEOs of major US corporations signed a voluntary statement (not a legal change) redefining corporate purpose to include creating value for all stakeholders, not only shareholders, echoed by BlackRock's Larry Fink."},{"id":"cg-s2-q14","session":"2","topic":"Exam traps","question":"What is the key structural difference between the property conception and the social entity conception of the firm, beyond just 'being nicer to stakeholders'?","choices":["Only the social entity conception has a board of directors","They differ in who the firm's assets belong to and what managers' role is (agent versus trustee)","The property conception does not allow for profits","The social entity conception has no legal existence"],"correct_index":1,"explanation":"The fiche's exam trap warns against treating the two conceptions as differing only in 'how nice' they are, they differ structurally, assets belong to shareholders vs are used for multiple stakeholders, and managers are agents vs trustees."},{"id":"cg-s3-q1","session":"3","topic":"Enron business model","question":"What made Enron different from a normal energy company, per the fiche?","choices":["It was purely state-owned","It shifted from energy production to energy trading, becoming a financial engineering-focused 'trading house'","It never used derivatives","It had no board of directors"],"correct_index":1,"explanation":"Enron shifted from energy production to energy trading, focusing on financial engineering, derivatives and risk-taking rather than core operations, effectively becoming a trading house rather than a traditional utility."},{"id":"cg-s3-q2","session":"3","topic":"Mark-to-market accounting","question":"How did Enron's use of mark-to-market accounting inflate its reported profits?","choices":["By delaying revenue recognition until cash was received","By recognizing the entire estimated future profit of a long-term contract immediately, instead of spreading it over the contract's life","By recording expenses twice","By converting debt into equity"],"correct_index":1,"explanation":"Enron estimated the total future profit of a whole long-term contract (e.g. a 20-year gas supply deal) and booked it immediately as current income, disconnecting the accounting from actual cash flows."},{"id":"cg-s3-q3","session":"3","topic":"Mark-to-market accounting","question":"Per the fiche's exam trap, is mark-to-market accounting inherently fraudulent?","choices":["Yes, the technique itself is illegal","No, the fraud was in how Enron applied it (booking entire future profit immediately, disconnected from cash flow), not in the existence of the technique","Yes, it was banned worldwide after Enron","No, because Enron never actually used mark-to-market accounting"],"correct_index":1,"explanation":"The exam trap explicitly warns against assuming mark-to-market accounting is inherently fraudulent, the fraud was in Enron's specific application, not in the technique's existence."},{"id":"cg-s3-q4","session":"3","topic":"Special Purpose Entities","question":"How did Enron use Special Purpose Entities (SPEs) to mislead investors?","choices":["By using them to pay higher dividends","By transferring debt to SPEs (keeping it off Enron's own balance sheet) while reporting only the profits from these arrangements","By merging them back into Enron's balance sheet every quarter","By using them only for legitimate risk management with full disclosure"],"correct_index":1,"explanation":"Enron transferred debt to SPEs, keeping it off its own balance sheet, reported only profits from these arrangements while hiding losses/liabilities, and used complex opaque structures so banks and auditors wouldn't question them."},{"id":"cg-s3-q5","session":"3","topic":"Why banks failed to scrutinize Enron","question":"The fiche gives three reasons banks did not do adequate due diligence on Enron's SPEs. Which of these is NOT one of them?","choices":["Conflicts of interest, since banks earned fees from Enron","Underestimated reputational risk","The complexity and opacity of the structures involved","A legal requirement preventing banks from investigating"],"correct_index":3,"explanation":"The three reasons given are conflicts of interest (fee income), underestimated reputational risk, and sheer complexity/opacity of the structures. There is no legal requirement preventing investigation mentioned in the fiche."},{"id":"cg-s3-q6","session":"3","topic":"Enron governance failures","question":"Which auditor is named in the fiche as failing to challenge Enron's management?","choices":["Arthur Andersen","Deloitte","KPMG","PwC"],"correct_index":0,"explanation":"The board and the auditors (Arthur Andersen) failed to challenge management, one of Enron's key governance failures listed in the fiche."},{"id":"cg-s3-q7","session":"3","topic":"Theranos business model","question":"What did Theranos claim its technology could do?","choices":["Run hundreds of blood tests from a single finger-prick sample","Automate corporate governance audits","Predict stock market movements using AI","Replace traditional bank lending with peer-to-peer finance"],"correct_index":0,"explanation":"Theranos, founded in 2003 by Elizabeth Holmes, promised to revolutionize healthcare with technology able to run hundreds of blood tests from a single finger-prick sample."},{"id":"cg-s3-q8","session":"3","topic":"Theranos vs Enron","question":"According to the fiche, what is the key structural difference between the Theranos fraud and Enron's fraud?","choices":["Theranos's fraud was tied to scientific/technical claims about its technology, not accounting manipulation","Theranos had more public shareholders than Enron","Both frauds relied on Special Purpose Entities","Theranos's board had no relationship with the founder"],"correct_index":0,"explanation":"The lecture is explicit that Theranos's fraud was tied to scientific/technical claims about the technology, not accounting manipulation like mark-to-market or SPEs, and unlike Enron it was pre-IPO with no widespread public shareholders."},{"id":"cg-s3-q9","session":"3","topic":"Theranos vs Enron","question":"Which of these is one of the three differences the lecture draws between Theranos and cases like Enron/Satyam?","choices":["Theranos was heavily founder-driven, centred on one individual rather than a broader executive team","Theranos had a larger board than Enron","Theranos operated in the energy sector","Theranos was audited by Arthur Andersen"],"correct_index":0,"explanation":"The three differences: Theranos was early-stage/pre-IPO with no widespread public shareholders, the fraud was scientific/technical rather than accounting-based, and it was heavily founder-driven around Elizabeth Holmes."},{"id":"cg-s3-q10","session":"3","topic":"Theranos governance failures","question":"Why couldn't Theranos's board effectively challenge Elizabeth Holmes's claims, per the fiche's exam trap?","choices":["The board never met","The board was loyal to Holmes but lacked relevant biotech/medical expertise","The board was legally barred from asking questions","Theranos had no board at all"],"correct_index":1,"explanation":"The exam trap specifies a precise cause beyond 'not asking questions', the board was loyal to Holmes but inexperienced in biotechnology, so even a well-intentioned board could not effectively evaluate the technology's claims."},{"id":"cg-s3-q11","session":"3","topic":"Investor behaviour at Theranos","question":"What role did FOMO (fear of missing out) play in the Theranos case?","choices":["It caused investors to demand more scientific validation before investing","It led venture capital firms and wealthy individuals to invest with weak due diligence, eager to join 'the next big thing'","It had no effect on investor behaviour","It caused Theranos's valuation to collapse immediately"],"correct_index":1,"explanation":"Venture capital firms and wealthy individuals were eager to join 'the next big thing', and this fear of missing out led to weak due diligence before investing in Theranos."},{"id":"cg-s3-q12","session":"3","topic":"Common thread across both cases","question":"What common governance-failure thread does the fiche identify across Enron and Theranos, despite their very different fraud mechanisms?","choices":["Both had too many independent directors","Boards and oversight structures failed to challenge a dominant management figure or story","Both were state-owned enterprises","Both frauds were discovered by internal auditors"],"correct_index":1,"explanation":"Even though the mechanisms differed completely (accounting engineering vs false scientific claims), the common thread is boards and oversight structures that failed to challenge a dominant management figure or narrative."},{"id":"cg-s3-q13","session":"3","topic":"SPE mechanics","question":"In the fiche's simplified SPE example, Enron borrows $1 billion via an SPE. What does Enron's own balance sheet show?","choices":["The full $1 billion debt","Only the resulting cash inflow, not the debt itself","Neither the cash inflow nor the debt","A liability twice the size of the actual loan"],"correct_index":1,"explanation":"The SPE holds the debt, and Enron's own balance sheet shows only the resulting cash inflow. The balance sheet looks clean, but the underlying risk is still Enron's."},{"id":"cg-s3-q14","session":"3","topic":"Syllabus vs actual content","question":"The printed syllabus lists this session's topic as 'Global governance failure, Enron' only. What does the fiche note about the actual lecture content?","choices":["The lecture only covered Enron, matching the syllabus exactly","The actual lecture slides cover both Enron and Theranos as parallel case studies","The lecture covered Parmalat instead of Enron","The lecture covered WorldCom instead of Enron"],"correct_index":1,"explanation":"A 'watch out' in the fiche notes that although the syllabus lists this session's topic as Enron only, the actual lecture slides (the primary source the fiche follows) cover both Enron and Theranos as parallel case studies."},{"id":"cg-s47-q1","session":"4-7","topic":"Board roles","question":"What are the three roles boards balance, per the lecture?","choices":["Strategic, monitor, networking","Financial, legal, operational","Executive, non-executive, independent","Compliance, audit, remuneration"],"correct_index":0,"explanation":"The literature and governance codes describe boards as balancing a strategic task (mission/vision, strategic plans), a monitor task (overseeing management), and a networking task (reputation, stakeholder relationships)."},{"id":"cg-s47-q2","session":"4-7","topic":"Why boards aren't automatically effective","question":"According to the fiche, what structural limits complicate the board's theoretical central role?","choices":["Boards have too much legal power","Irregular/infrequent meetings, limited or biased information flow, uncertain real authority, and no clear consensus on priorities","Boards are always dominated by shareholders directly","Boards cannot legally meet more than once a year"],"correct_index":1,"explanation":"In practice, meetings are irregular and infrequent, information flow to directors is often limited or biased by management, directors' real impact and authority remain uncertain, and there is no clear consensus on what boards should prioritize."},{"id":"cg-s47-q3","session":"4-7","topic":"Director types","question":"Which type of director holds a management role inside the firm?","choices":["Independent director","Non-executive (outside) director","Executive (inside) director","Lead Independent Director"],"correct_index":2,"explanation":"Executive (inside) directors hold management roles inside the firm. Non-executive (outside) directors do not. Independent directors are a specific subset of non-executive directors free of compromising ties."},{"id":"cg-s47-q4","session":"4-7","topic":"Board size","question":"What does the fiche say about the relationship between board size and effectiveness?","choices":["Larger boards are always better","A board that is too small lacks expertise, a board that is too large loses efficiency, so an effective board balances size against the right skill mix","Board size has no effect on effectiveness","The ideal board size is fixed at exactly 20 members"],"correct_index":1,"explanation":"Board size is influenced by firm size, ownership structure and industry. Too small lacks expertise, too large loses efficiency, effective boards balance the right size against the right mix of skills (ideal composition described as 7 to 15 members)."},{"id":"cg-s47-q5","session":"4-7","topic":"CEO duality","question":"What is 'CEO duality', and what is its main risk?","choices":["One person holding both CEO and Chairman roles, risking excessive concentration of power","Having two CEOs simultaneously, risking indecision","A CEO who also chairs the Audit Committee, risking conflicts over financial reporting","A board with two chairmen, risking deadlock"],"correct_index":0,"explanation":"CEO duality is one person holding both the CEO and Chairman roles simultaneously. It can provide strong leadership but risks an excessive concentration of power. It is common in the US and rare in the UK."},{"id":"cg-s47-q6","session":"4-7","topic":"Lead Independent Director","question":"When is a Lead Independent Director role typically appointed?","choices":["When the board has fewer than 7 members","When CEO duality exists, to ensure checks and balances","When a company has no independent directors at all","When the Chairman is younger than the CEO"],"correct_index":1,"explanation":"A Lead Independent Director is appointed specifically when CEO duality exists, to ensure checks and balances. Its effectiveness depends on the individual's real independence and involvement."},{"id":"cg-s47-q7","session":"4-7","topic":"Board effectiveness framework","question":"The overall board effectiveness framework combines which three elements?","choices":["Input (structure/composition), processes (working style), and board roles","Revenue, cost, and profit","Shareholders, creditors, and regulators","Strategy, finance, and marketing"],"correct_index":0,"explanation":"Effectiveness emerges from the interaction of INPUT (structure and composition) with PROCESSES (working style, e.g. meetings, information flow, decision-making) and BOARD ROLES (control, service/advice, networking), shaped by contingent variables and stakeholder pressures."},{"id":"cg-s47-q8","session":"4-7","topic":"Independence vs process","question":"What does the fiche's 'watch out' say about board independence and effectiveness at Enron, Theranos and WorldCom?","choices":["All three had boards with a majority of insiders","All three had a majority of outside/independent directors on their boards, yet still failed","None of the three had a formal board","Independence guaranteed their success until 2008"],"correct_index":1,"explanation":"Independence alone is not enough, the lecture explicitly notes that many failed firms (Enron, Theranos, WorldCom) had a majority of outside/independent directors. What really drives effectiveness is people and how the board works, not the formal independence ratio."},{"id":"cg-s47-q9","session":"4-7","topic":"Effective board behaviour","question":"Which of the following describes an effective board's approach to conflict, per the lecture?","choices":["Avoiding all conflict to maintain harmony","Practicing constructive (not destructive) conflict, especially with the CEO","Deferring entirely to the CEO's judgment on all matters","Voting unanimously on every decision by default"],"correct_index":1,"explanation":"An effective board practices constructive (not destructive) conflict especially with the CEO, functions as a cohesive team, balances involvement, and makes decisions using comprehensive information and perspectives."},{"id":"cg-s47-q10","session":"4-7","topic":"Board information","question":"What must the information flow to directors satisfy, per the process dimension of board effectiveness?","choices":["It only needs to cover financial results","It must be timely, complete and reliable, covering financial results, budgets, strategy and competition","It is entirely optional since directors set their own agenda","It must come exclusively from the CEO"],"correct_index":1,"explanation":"Information must cover financial results, budgets, strategy and competition, and be timely, complete and reliable, part of the 'processes' dimension of board effectiveness alongside meetings and decision-making style."},{"id":"cg-s47-q11","session":"4-7","topic":"Board evaluation","question":"In the 2018 Italian sample of 202 companies, what share conducted a board review, and what share reported specific governance improvements as a result?","choices":["84% conducted a review, only 24% reported specific improvements","24% conducted a review, 84% reported improvements","100% conducted a review, 100% reported improvements","50% conducted a review, 50% reported improvements"],"correct_index":0,"explanation":"84% of companies conducted a board review (27% with an external advisor), but only 24% signalled specific improvements in corporate governance as a result."},{"id":"cg-s47-q12","session":"4-7","topic":"Board evaluation with advisors","question":"How did having an external advisor affect reported improvement rates in the Italian board review sample?","choices":["It made no difference","Improvement rates were substantially higher across the board with an external advisor (e.g. informal meetings/induction jumped to 35.6% versus 4.1% without one)","It decreased reported improvements","External advisors were legally required and had no measurable effect"],"correct_index":1,"explanation":"When an external advisor was involved, improvement rates were substantially higher, e.g. informal meetings and induction programs improved in 35.6% of cases with an advisor versus only 4.1% without one."},{"id":"cg-s47-q13","session":"4-7","topic":"Board evaluation exam trap","question":"What challenge does the fiche flag regarding self-assessment in board evaluations?","choices":["Self-assessments are always more rigorous than external ones","The risk of self-serving assessments and a frequent lack of true independence (missing 'super partes' attitude)","Self-assessments are illegal in Italy","Self-assessments always improve board diversity"],"correct_index":1,"explanation":"Challenges include the risk of self-serving assessments and a frequent lack of true independence, a 'super partes' (impartial) attitude is often missing in self-conducted reviews."},{"id":"cg-s47-q14","session":"4-7","topic":"Hard law vs soft law","question":"What distinguishes 'hard law' from 'soft law' in board regulation?","choices":["Hard law is binding legal rules (e.g. Civil Code), soft law is self-regulatory Corporate Governance Codes voluntarily adopted","Hard law only applies to private companies, soft law only to listed ones","Hard law is enforced by shareholders, soft law by regulators","There is no meaningful difference between the two"],"correct_index":0,"explanation":"Hard law refers to binding legal rules such as the Civil Code and the Consolidated Law on Finance. Soft law refers to self-regulatory Corporate Governance Codes voluntarily adopted by listed companies."},{"id":"cg-s47-q15","session":"4-7","topic":"Comply or explain","question":"What does the 'comply or explain' principle mean for Corporate Governance Codes?","choices":["Firms are legally forced to comply with every recommendation","Listed firms must disclose reasons for any non-compliance, rather than being legally forced to comply","Firms can ignore the codes with no disclosure obligation at all","Only financial companies must comply, all others may explain instead"],"correct_index":1,"explanation":"Corporate Governance Codes are non-binding, voluntary reference models. Compliance works on a comply-or-explain principle, firms must disclose reasons for any non-compliance rather than being legally forced to comply."},{"id":"cg-s47-q16","session":"4-7","topic":"Board vs TMT","question":"How does the fiche distinguish the Board of Directors from the Top Management Team (TMT)?","choices":["They are the same body under two different names","The board provides guidelines and oversight, while the TMT (led by the CEO) develops strategies and business plans submitted to the board for approval","The TMT approves the board's own remuneration","The board only exists in Anglo-Saxon countries"],"correct_index":1,"explanation":"The board is distinct from the TMT, the board approves strategic plans and provides oversight, while the TMT, led by the CEO, develops strategies and business plans that are then submitted to the board for approval and critical review."},{"id":"cg-s47-q17","session":"4-7","topic":"Independent director definition","question":"What defines an independent director, per the lecture?","choices":["Any non-executive director","A non-executive director without financial, professional or personal ties that may compromise their independent judgment","A director appointed directly by the CEO","A director who owns more than 50% of shares"],"correct_index":1,"explanation":"Independent director, a non-executive director without financial, professional or personal ties that may compromise their independent judgment. Independence is assessed at appointment and re-assessed annually."},{"id":"cg-s47-q18","session":"4-7","topic":"Independence thresholds","question":"Per the Italian Corporate Governance Code examples cited, after how many years of board service (within the last 12) is a director's independence considered compromised?","choices":["3 years","5 years","More than 9 years (even non-consecutive)","15 years"],"correct_index":2,"explanation":"A director's independence is compromised if they have served on the board for more than 9 years (even non-consecutive, within the last 12). This is a distinct threshold from the '3 years' rule that applies to recent executive roles or significant relations/remuneration."},{"id":"cg-s47-q19","session":"4-7","topic":"Independence-compromising ties","question":"Which of these, per the lecture, compromises a director's independence?","choices":["Having attended the same university as the CEO","Having received significant additional remuneration beyond the director's fee in the last 3 years","Living in the same city as company headquarters","Having previously worked for a competitor more than 10 years ago"],"correct_index":1,"explanation":"Independence is compromised by receiving significant additional remuneration beyond the director's fee in the last 3 years, among other listed circumstances (being a significant shareholder, recent executive role, significant commercial/financial relations, long tenure, cross-directorships, auditor network ties, family ties to controllers)."},{"id":"cg-s47-q20","session":"4-7","topic":"Chairman vs CEO roles","question":"What is the Chairman's role, as distinguished from the CEO's, per the lecture?","choices":["The Chairman manages daily operations, the CEO organizes board meetings","The Chairman organizes and manages the board's work, sets the agenda, and chairs meetings, holding no executive powers except information rights; the CEO manages within delegated powers","The Chairman and CEO have identical legal powers","The Chairman is always also the largest shareholder"],"correct_index":1,"explanation":"The Chairman organizes and manages the work of the board, sets the agenda, chairs meetings, ensures open discussion, and holds no executive powers except information rights. The Managing Director/CEO is in charge of management within delegated powers."},{"id":"cg-s47-q21","session":"4-7","topic":"Board committees","question":"Which board committee is responsible for oversight of internal controls, risk management and financial reporting?","choices":["Remuneration Committee","Appointments Committee","Audit & Risk Committee","Sustainability Committee"],"correct_index":2,"explanation":"The Audit & Risk Committee oversees internal controls, risk management and financial reporting. The Appointments Committee handles nominations/succession, the Remuneration Committee handles pay policies, and the (optional) Sustainability Committee handles ESG."},{"id":"cg-s47-q22","session":"4-7","topic":"Board activities","question":"How often do boards typically meet, per the lecture, and how much advance study time is expected of directors?","choices":["1 to 2 times per year, no advance preparation needed","6 to 8 times per year, with 0.5 to 1 day of study expected in advance","20 times per year, with no set expectation","Boards do not meet on a regular schedule"],"correct_index":1,"explanation":"Boards typically meet 6 to 8 times per year (2 to 4 hours each), and directors must receive documentation in advance, with 0.5 to 1 day of study expected."},{"id":"cg-s47-q23","session":"4-7","topic":"Gender gap timeline","question":"Which Italian law first introduced mandatory gender quotas in boards and control bodies?","choices":["The 2018 Corporate Governance Code","The 2011 Golfo-Mosca Law","The 2020 Budget Law","The 2020 Code update"],"correct_index":1,"explanation":"The 2011 Golfo-Mosca Law introduced mandatory gender quotas in boards and control bodies. The 2020 Budget Law later extended quotas to six mandates and raised the requirement to at least 40%."},{"id":"cg-s47-q24","session":"4-7","topic":"Gender gap 2020 changes","question":"What did the 2020 Budget Law change about Italian board gender quotas?","choices":["It abolished the quotas entirely","It extended quotas to six mandates (instead of three) and raised the requirement to at least 40%","It reduced the requirement to 10%","It applied quotas only to state-owned companies"],"correct_index":1,"explanation":"The 2020 Budget Law extended quotas to six mandates (instead of three) and raised the requirement to at least 40% (two-fifths) of board seats for the least represented gender."},{"id":"cg-s47-q25","session":"4-7","topic":"Gender pay gap trend","question":"What happened to the director gender pay gap in Italy between 2012 and 2017, per the lecture's data?","choices":["It closed completely as female representation rose","It actually increased, since female executive directors grew in number but saw reduced average compensation, while independent women directors' pay rose only slightly","It stayed exactly flat","It reversed, with men earning less than women on average"],"correct_index":1,"explanation":"The gender pay gap among directors actually increased over 2012-2017, for two reasons, female executive directors grew in number but saw a reduction in average compensation, while independent women directors grew steadily but their compensation only slightly increased."},{"id":"cg-s47-q26","session":"4-7","topic":"Board tasks vs TMT","question":"Approving strategic plans and setting organizational/control systems is a task of:","choices":["The Top Management Team only","The Board of Directors","External auditors","The Remuneration Committee only"],"correct_index":1,"explanation":"The Board of Directors approves strategic plans and key decisions, sets organizational and control systems, and defines directors' remuneration, distinct from the TMT which develops the strategies/business plans submitted for board approval."},{"id":"cg-s47-q27","session":"4-7","topic":"Diversity","question":"How does the fiche frame board diversity, beyond just gender?","choices":["Only as a legal quota requirement","As a mix of competences and knowledge, gender and nationality balance, varied professional backgrounds, and different leadership styles","As irrelevant to board effectiveness","As solely about age balance"],"correct_index":1,"explanation":"Diversity is framed as a mix of competences and knowledge, gender and nationality balance, varied professional backgrounds, and different leadership styles and personal influence."},{"id":"cg-s47-q28","session":"4-7","topic":"Committee composition","question":"Who determines the tasks and composition of a board committee?","choices":["Shareholders directly, by vote","The board itself, giving priority to competence and experience of committee members","External regulators exclusively","The CEO alone"],"correct_index":1,"explanation":"The board itself defines the tasks of each committee and determines its composition, giving priority to the competence and experience of committee members."},{"id":"cg-s47-q29","session":"4-7","topic":"Board's market relations responsibility","question":"Which of the following is a board responsibility related to 'relations with the market', per the lecture?","choices":["Setting the company's advertising budget","Transparent, timely communication with investors and equal access to information for all stakeholders","Negotiating supplier contracts directly","Hiring middle management"],"correct_index":1,"explanation":"Boards are responsible for relations with the market, transparent, timely communication with investors, equal access to information for all stakeholders, alongside integrity safeguards around confidential/price-sensitive information."},{"id":"cg-s47-q30","session":"4-7","topic":"Independence re-assessment","question":"How often is a director's independence status reassessed, per the lecture?","choices":["Only once, at appointment","At appointment and then re-assessed annually, with ongoing monitoring if relevant circumstances arise","Every 10 years","Never, once granted it is permanent"],"correct_index":1,"explanation":"Independence is assessed at appointment and re-assessed annually, with ongoing monitoring if relevant circumstances arise (e.g. a new commercial relationship forming)."},{"id":"cg-s47-q31","session":"4-7","topic":"CEO duality prevalence","question":"Where is CEO duality described as common, and where as rare?","choices":["Common in the UK, rare in the US","Common in the US, rare in the UK","Common everywhere equally","Rare everywhere in developed markets"],"correct_index":1,"explanation":"CEO duality (one person as both CEO and Chairman) is common in the US and rare in the UK, per the lecture."},{"id":"cg-s47-q32","session":"4-7","topic":"Networking task","question":"The board's 'networking task' primarily involves:","choices":["Setting IT infrastructure policy","Enhancing corporate reputation/legitimacy and managing relationships with shareholders and key stakeholders","Approving individual employee promotions","Auditing the company's tax filings"],"correct_index":1,"explanation":"The networking task is about enhancing corporate reputation and legitimacy, and managing relationships with shareholders and key stakeholders, one of the three board roles alongside strategic and monitor tasks."},{"id":"cg-s47-q33","session":"4-7","topic":"Monitor task","question":"The board's 'monitor task' involves:","choices":["Defining the company's mission and vision","Monitoring performance and management behavior, overseeing operational and strategic objectives","Managing public relations campaigns","Setting supplier prices"],"correct_index":1,"explanation":"The monitor task is to monitor performance and management behavior, overseeing both operational and strategic objectives, distinct from the strategic task (mission/vision/strategic plans) and networking task (reputation/relationships)."},{"id":"cg-s47-q34","session":"4-7","topic":"Board evaluation scope","question":"What does the scope of a board evaluation typically cover, per the lecture?","choices":["Only the CEO's personal performance","Board size and composition, functioning of the board and committees, the board's role in strategy/monitoring, and adequacy of internal control/risk systems","Only shareholder satisfaction surveys","Only the company's stock price performance"],"correct_index":1,"explanation":"Scope of assessment includes board size and composition, functioning of the board and its committees, the board's role in defining strategy and monitoring management, and the adequacy of internal control and risk management systems."},{"id":"cg-s47-q35","session":"4-7","topic":"Hard law examples","question":"Which of these is an example of 'hard law' governing boards, per the fiche?","choices":["A voluntary Corporate Governance Code","The Civil Code and the Consolidated Law on Finance","An industry best-practice guideline","An ESG rating agency's methodology"],"correct_index":1,"explanation":"Hard law refers to binding legal rules, examples given are the Civil Code and the Consolidated Law on Finance, as opposed to soft law (voluntary Corporate Governance Codes)."},{"id":"cg-s47-q36","session":"4-7","topic":"Independence exam trap","question":"What common mistake does the fiche flag about the 'last 3 years' and '9 years' independence thresholds?","choices":["They are the same threshold applying to the same circumstance","They apply to different circumstances, the '3 years' threshold applies to executive roles/significant relations/remuneration, the board-tenure threshold is a separate 'more than 9 years within the last 12' rule","Both thresholds were abolished in 2020","Neither threshold actually appears in the Italian Corporate Governance Code"],"correct_index":1,"explanation":"The exam trap warns against mixing up the specific independence-compromising circumstances, the 3-year threshold applies to executive/managerial roles and significant relations/remuneration, while the tenure threshold is a separate 'more than 9 years within the last 12' rule."},{"id":"cg-s9-q1","session":"9","topic":"Models of capitalism","question":"Which governance system is described as market-oriented, an 'outsider system' with dispersed ownership and easy hostile takeovers?","choices":["German/Japanese model","Anglo-Saxon model","Latin model","None of the three, this describes a fourth model"],"correct_index":1,"explanation":"The Anglo-Saxon model (USA, UK, Canada, Australia) is market-oriented, an outsider system with competitive transparent markets, dispersed ownership, a rising role for institutional investors, and relatively easy hostile takeovers."},{"id":"cg-s9-q2","session":"9","topic":"Models of capitalism","question":"In the German/Japanese model, what role do banks typically play?","choices":["They are barred from holding equity","They play a central role, often acting as controlling shareholders themselves","They have no involvement in corporate governance","They only provide short-term trade credit"],"correct_index":1,"explanation":"The German/Japanese model is network-oriented, an insider system with weak market transparency, dominance of industrial groups and cross-shareholdings, with banks playing a central role, often as controlling shareholders themselves."},{"id":"cg-s9-q3","session":"9","topic":"Models of capitalism","question":"Which of these is characteristic of the Latin model (Italy, France, Spain, Greece)?","choices":["Financial markets play the dominant role in ownership","A strong role for the State as shareholder/regulator/financer, family-dominated control, and frequent pyramidal groups","Employees play the dominant governance role via co-determination","Hostile takeovers are the primary discipline mechanism"],"correct_index":1,"explanation":"The Latin model features a strong State role, banks central to debt financing (not equity), family-dominated control, frequent shareholder agreements/coalitions, and pyramidal groups enabling family capitalism."},{"id":"cg-s9-q4","session":"9","topic":"Control-Enhancing Mechanisms","question":"What is a Control-Enhancing Mechanism (CEM)?","choices":["A legal ban on takeovers","A legal or contractual tool allowing shareholders (typically controlling ones) to exercise voting power disproportionate to their cash-flow rights","A tax incentive for dividend payments","An accounting method for consolidating subsidiaries"],"correct_index":1,"explanation":"CEMs are legal or contractual tools that let controlling shareholders exercise voting power disproportionate to their actual cash-flow rights, examples include dual-class shares, shareholders' agreements, and pyramidal groups."},{"id":"cg-s9-q5","session":"9","topic":"Pyramidal groups math","question":"In the fiche's worked example, shareholder A owns 51% of Company B, which owns 51% of Company C. What are A's cash-flow rights in C?","choices":["51%","26% (51% x 51%)","100%","0%, since A does not directly own C"],"correct_index":1,"explanation":"A's cash-flow rights in C are 51% x 51% = 26%, yet A still exercises 51% of the voting rights in C, since A formally controls B which controls C. This gap between voting power (51%) and cash-flow rights (26%) is what defines the CEM."},{"id":"cg-s9-q6","session":"9","topic":"CEM legality","question":"Are Control-Enhancing Mechanisms inherently illegal, per the lecture?","choices":["Yes, they are a form of securities fraud","No, they are legal or contractual tools, a governance design choice creating a cash-flow/control gap, not fraud","Yes, but only in the Anglo-Saxon model","No, but they were banned globally in 2020"],"correct_index":1,"explanation":"The exam trap explicitly warns against treating CEMs as inherently illegal, they are legal or contractual tools, framed as a governance design choice, not fraud."},{"id":"cg-s9-q7","session":"9","topic":"Ownership-governance-strategy interdependence","question":"What does the lecture say drives changes in a firm's ownership/governance/strategy system?","choices":["Only random chance","Past performance (especially extreme results), owners' values/resources, competitive environment, institutional context, and other contextual conditions","Only regulatory mandates","Nothing, these systems never change once set"],"correct_index":1,"explanation":"Drivers include past performance (only extreme results tend to trigger change), owners' values and resources, the competitive environment, institutional context, and other contextual conditions like financial markets and technology."},{"id":"cg-s9-q8","session":"9","topic":"Ownership dichotomies","question":"Which dichotomy distinguishes a controlling shareholder who is 'free of political pressures' from one that is 'politically driven'?","choices":["Strong vs weak controlling shareholder","Private vs public controlling shareholder","Unique vs coalition controlling shareholder","Financial vs industrial controlling shareholder"],"correct_index":1,"explanation":"A private controlling shareholder is free of political pressures, while a public controlling shareholder is politically driven, one of several ownership dichotomies the lecture uses for governance analysis."},{"id":"cg-s9-q9","session":"9","topic":"Financially-constrained controlling shareholders","question":"How does a controlling shareholder under debt pressure typically behave, per the lecture's contrast?","choices":["Willing to invest heavily long term and accept lower dividends","Requires high dividends to service its own debt, reluctant to invest/expand/take risks, opposes capital increases","Indifferent to dividend policy","Always sells the company immediately"],"correct_index":1,"explanation":"A controlling shareholder under debt pressure requires high dividends to service its own debt, is reluctant to invest, expand or take risks, opposes capital increases, and favors short-term cash-generating activities, contrasted with a cash-rich unconstrained shareholder."},{"id":"cg-s9-q10","session":"9","topic":"Shareholder activism drivers","question":"Which of these is NOT listed as a trait making companies more exposed to shareholder activism?","choices":["Large firms with underperforming results","Weak managerial ownership","Pay-performance misalignment","A dividend policy that exceeds industry average"],"correct_index":3,"explanation":"Traits listed are large underperforming firms, weak managerial ownership, pay-performance misalignment, boards with many independent directors (mixed evidence), and significant institutional ownership. Above-average dividend policy is not listed as a driver."},{"id":"cg-s9-q11","session":"9","topic":"Aberdeen case","question":"What kind of activism does the Aberdeen Standard Investments case illustrate?","choices":["A single hedge fund's targeted campaign against one company","Broad portfolio-wide stewardship across many companies via a dedicated Governance & Stewardship team","A government takeover of a private company","An employee-led unionization campaign"],"correct_index":1,"explanation":"Aberdeen, the largest UK asset manager with stakes in 385 listed UK companies, uses a dedicated G&S team monitoring governance risks across its whole portfolio, illustrating broad portfolio-wide stewardship, contrasted with Elliott's targeted single-company campaign at TIM."},{"id":"cg-s9-q12","session":"9","topic":"Elliott vs Vivendi at TIM","question":"In the Elliott versus Vivendi contest at TIM (2018), what was the outcome for board independence?","choices":["The board became fully management-controlled","A new board was elected with 13 of 15 members independent, including the Chairman","TIM was delisted","Vivendi increased its stake to 50%"],"correct_index":1,"explanation":"The result was a board with 13 of 15 members independent, including the Chairman, in line with Elliott's governance objectives, following Elliott's campaign and the resignation of 8 directors including Vivendi's own CEO."},{"id":"cg-s9-q13","session":"9","topic":"Elliott vs Vivendi at TIM","question":"What distinct goal did CDP (Cassa Depositi e Prestiti) pursue as the third actor in the TIM contest?","choices":["Maximizing short-term financial returns like Elliott","Safeguarding TIM as a national strategic asset and rebalancing power between Vivendi and Elliott","Merging TIM with a media company","Delisting TIM from the stock exchange"],"correct_index":1,"explanation":"CDP, Italy's state-owned investor, sought to safeguard TIM as a national strategic asset and rebalance power between Vivendi (seeking industrial control) and Elliott (seeking independent, value-oriented governance)."},{"id":"cg-s9-q14","session":"9","topic":"ESG assessment","question":"What does the MSCI ESG rating framework produce?","choices":["A binary pass/fail score","An aggregated overall rating from AAA (leader) to CCC (laggard) across Environmental, Social and Governance indicators","A single carbon emissions number only","A legal compliance certificate"],"correct_index":1,"explanation":"Companies are scored across Environmental, Social and Governance indicators, each measuring exposure to a specific risk/opportunity and management quality, aggregated into an overall rating from AAA (leader) to CCC (laggard)."},{"id":"cg-s9-q15","session":"9","topic":"ESG investing strategies","question":"Which ESG investment strategy does Norway's Government Pension Fund Global (excluding tobacco, coal, controversial weapons) exemplify?","choices":["Impact investing","Exclusions (negative screening)","Best in class","Thematic investments"],"correct_index":1,"explanation":"Exclusions (negative screening) means avoiding companies/sectors linked to harmful products or practices, exemplified by Norway's fund excluding tobacco, coal and controversial weapons."},{"id":"cg-s9-q16","session":"9","topic":"ESG investing strategies","question":"What distinguishes 'impact investing' from other ESG strategies listed in the fiche?","choices":["It targets investments with measurable social/environmental outcomes (e.g. Triodos, Leapfrog in microfinance/healthcare/renewable energy)","It only screens out harmful sectors","It is identical to negative screening","It focuses exclusively on publicly listed large-cap companies"],"correct_index":0,"explanation":"Impact investing targets investments with measurable social/environmental outcomes, exemplified by Triodos and Leapfrog Investments in microfinance, healthcare and renewable energy, distinct from exclusions or thematic strategies."},{"id":"cg-s9-q17","session":"9","topic":"NFD Italy","question":"What is Italy's Non-Financial Declaration (NFD/DNF), and since when has it been mandatory?","choices":["A voluntary sustainability report with no legal basis","The Italian implementation of EU Directive 2014/95/EU (Legislative Decree 254/2016), mandatory since 2017 for large public-interest entities","A tax filing requirement unrelated to ESG","A requirement that applies only to companies with fewer than 50 employees"],"correct_index":1,"explanation":"The NFD is the Italian implementation of EU Directive 2014/95/EU under Legislative Decree 254/2016, mandatory since 2017 for large public-interest entities (more than 500 employees)."},{"id":"cg-s9-q18","session":"9","topic":"NFD evidence","question":"In the sample of 197 companies studied, what share described their main ESG risks in the NFD, versus the share that stated integrating ESG into risk management as an explicit objective?","choices":["96% described risks, only 13% stated integration as an explicit objective","13% described risks, 96% stated integration as an objective","50% for both figures","100% for both figures"],"correct_index":0,"explanation":"96% of companies described their main ESG risks in the NFD, 88% described mitigation methods, but only 13% stated integrating ESG factors further into risk management as an explicit objective."},{"id":"cg-s9-q19","session":"9","topic":"NFD to CSRD transition","question":"What does the lecture say about the relationship between the NFD and the CSRD?","choices":["The NFD is the final, permanent EU disclosure regime","There is a transition underway from the NFD to the CSRD (2024-2026 rollout), which broadens scope to SMEs and adds assurance requirements","The CSRD replaced the NFD in 2016","The NFD and CSRD apply to completely unrelated topics"],"correct_index":1,"explanation":"The lecture's concluding slides note a transition from the NFD to the CSRD, introducing ESRS standards, broadening scope to include SMEs, and adding assurance requirements, the NFD is the starting point of an ongoing transition, not the final regime."},{"id":"cg-s9-q20","session":"9","topic":"Exam traps","question":"What is the key distinction between the 'three models of capitalism' and the 'ownership-strategy archetypes/dichotomies' covered in this session?","choices":["They are the same framework with different names","The models of capitalism are country-level governance systems, while archetypes/dichotomies describe firm-level ownership situations that can appear within any system","Archetypes only apply to the Anglo-Saxon model","Models of capitalism only apply to private firms"],"correct_index":1,"explanation":"The exam trap warns against confusing the two, the three models of capitalism are country-level governance systems, while the ownership-strategy archetypes and dichotomies describe firm-level ownership situations that can appear within any of the three systems."}]};
const QCM_DATA = {"da":[{"id":"dd-sup-1","dataset":"SUP","session":2,"topic":"Prediction with dummies","question":"mod1 <- lm(CN ~ S + HD + AE, data = SUP). Predicted mean CN for S = 800, HD = \"no\", AE = \"high\"?","choices":["≈ 1187.6","≈ 1251.8","≈ 1164.8","≈ 1168.2"],"correct_index":0,"explanation":"78.5686 + 1.3578×800 + 22.8031 = 1187.6. 1251.8 wrongly adds HDyes, 1164.8 forgets AEhigh, 1168.2 uses AEaverage. Check with predict(mod1, data.frame(S=800, HD=\"no\", AE=\"high\"))."},{"id":"dd-sup-2","dataset":"SUP","session":1,"topic":"Reading summary()","question":"In summary(mod1), what is the t value on the HDyes row?","choices":["≈ 0.957","≈ 1.045","≈ 0.340","≈ 64.16"],"correct_index":0,"explanation":"t = 64.1552/67.0423 = 0.957. 1.045 is SE/estimate, 0.340 is the p-value, 64.16 the estimate."},{"id":"dd-sup-3","dataset":"SUP","session":2,"topic":"Contrast between two dummies","question":"Estimated gap in mean CN between AE = \"high\" and AE = \"average\" (S, HD fixed), and can summary(mod1) test it?","choices":["19.43, no: re-level AE or run a dedicated test","19.43, yes: the AEhigh t-test covers it","22.80, yes: read the AEhigh row","26.18, no: the two dummies must be added"],"correct_index":0,"explanation":"22.8031 − 3.3731 = 19.43. Both rows in summary() compare with \"low\". Use relevel(SUP$AE, ref=\"average\") and refit."},{"id":"dd-sup-4","dataset":"SUP","session":1,"topic":"Confidence interval","question":"Without running it: does confint(mod1, level = 0.90) for HDyes contain 0?","choices":["Yes, since p = 0.340 > 0.10","No, since a 90% CI is narrower than the 99% one","No, since the estimate is positive","Impossible to say without running confint"],"correct_index":0,"explanation":"A (1−α) CI excludes 0 exactly when p < α. p = 0.340 > 0.10, so 0 is inside. Narrower, yes, but still around 0."},{"id":"dd-sup-5","dataset":"SUP","session":1,"topic":"Reasonable prediction","question":"After summary(SUP), which prediction is reasonable?","choices":["S = 350, HD = \"no\", AE = \"average\"","S = 300, HD = \"yes\", AE = \"low\"","S = 1600, HD = \"no\", AE = \"high\"","S = 1000, HD = \"yes\", AE = \"medium\""],"correct_index":0,"explanation":"S ranges from 341.8 to 1500, and AE takes only low/average/high. 350 is inside the range (barely). \"medium\" is not a level of AE."},{"id":"dd-sup-6","dataset":"SUP","session":2,"topic":"Partial F-test","question":"mod3 <- lm(CN ~ S + HD, data = SUP); anova(mod3, mod1). Degrees of freedom of the F statistic?","choices":["(2, 145)","(2, 147)","(3, 145)","(1, 146)"],"correct_index":0,"explanation":"2 dummies removed; residual df of the complete model = 150 − 4 − 1 = 145. 147 is the residual df of mod3."},{"id":"dd-sup-7","dataset":"SUP","session":2,"topic":"Partial F-test decision","question":"anova(mod3, mod1) gives F = 0.0449, p = 0.9561. Decision?","choices":["Keep mod3, AE adds nothing given S and HD","Keep mod1, since it has more information","Keep mod3, AE has no effect on CN in general","Undecidable, since AEhigh and AEaverage disagree"],"correct_index":0,"explanation":"Not rejecting H0 means AE is not jointly significant once S and HD are in the model. It does not prove AE has no effect on its own."},{"id":"dd-sup-8","dataset":"SUP","session":1,"topic":"Marginal effect","question":"In mod1, what is the estimated effect of +100 m² of surface?","choices":["+135.8 clients on average, HD and AE fixed","+1.36 clients on average, HD and AE fixed","+135.8 clients for every supermarket","+14.1 clients on average (100 × SE)"],"correct_index":0,"explanation":"100 × 1.3578 = 135.78, an effect on the mean. 14.1 multiplies the standard error by mistake."},{"id":"dd-sup-9","dataset":"SUP","session":2,"topic":"Non-nested models","question":"mod2 <- lm(CN ~ S + HD + CA, data = SUP). mod1 vs mod2?","choices":["mod2, adjusted R² 0.404 > 0.383","mod2, raw R² 0.416 > 0.3996","mod1, since anova(mod1, mod2) is not significant","mod1, since it has more coefficients"],"correct_index":0,"explanation":"The models are not nested (AE vs CA), so no partial F-test. Raw R² gives the same winner here but is the wrong criterion."},{"id":"dd-sup-10","dataset":"SUP","session":1,"topic":"Confidence interval","question":"99% CI for the S coefficient (t quantile ≈ 2.61 with 145 df)?","choices":["[0.989 ; 1.727]","[1.078 ; 1.637]","[1.216 ; 1.499]","[1.358 ; 1.500]"],"correct_index":0,"explanation":"1.3578 ± 2.61 × 0.1414 = [0.989 ; 1.727]. [1.078 ; 1.637] is the 95% interval, [1.216 ; 1.499] is ± one SE."},{"id":"dd-sup-11","dataset":"SUP","session":2,"topic":"Global F-test","question":"The bottom of summary(mod1) shows F = 24.12 on 4 and 145 DF. What does it test?","choices":["All 4 slopes are zero at once","The intercept and 4 slopes are zero","AE is jointly zero","S is the only relevant variable"],"correct_index":0,"explanation":"H0: βS = βHDyes = βAEaverage = βAEhigh = 0. The intercept is never part of the global test. p = 2.6e−15, rejected."},{"id":"dd-pan-1","dataset":"PAN","session":5,"topic":"Fixed effects prediction","question":"mod <- plm(sales ~ adv, model = \"within\", data = S); fixef(mod). Predicted sales for firm 1 with adv = 10?","choices":["≈ 394.3","≈ 250.2","≈ 194.7","≈ 169.1"],"correct_index":0,"explanation":"144.048 + 25.0203 × 10 = 394.25. 250.2 omits the firm intercept, 194.7 uses firm 2's intercept (−55.524)."},{"id":"dd-pan-2","dataset":"PAN","session":5,"topic":"Fixed effects","question":"Same model. Predicted gap in sales between firm 1 and firm 2 at the same adv?","choices":["≈ 199.6, whatever adv","≈ 88.5, whatever adv","It depends on adv","≈ 25.0, the adv slope"],"correct_index":0,"explanation":"Same slope for every firm, so the gap is 144.048 − (−55.524) = 199.572 at any adv."},{"id":"dd-pan-3","dataset":"PAN","session":5,"topic":"Hausman test","question":"phtest(modEF, modEA) returns p = 0.0774. Which model?","choices":["REM at 5%, FEM at 10%","FEM at 5%, REM at 10%","FEM at both levels","REM at both levels"],"correct_index":0,"explanation":"H
