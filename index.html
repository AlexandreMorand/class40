ndex":0,"explanation":"Flagged exam trap: the CGU's own assets are tested first; goodwill absorbs any CGU-level shortfall afterward in the allocation step."},{"id":"cr-s12-q10","session":12,"topic":"Impairment loss allocation order within a CGU","question":"When a CGU's recoverable amount is below its carrying amount, the loss is allocated:","choices":["First to goodwill (down to zero), then pro rata to other assets by carrying amount","Pro rata across all assets including goodwill simultaneously","First to the asset with the lowest carrying amount","Entirely to goodwill even if goodwill is smaller than the total loss"],"correct_index":0,"explanation":"Goodwill absorbs the loss first; any excess beyond zeroing goodwill is then spread pro rata across the other assets."},{"id":"cr-s12-q11","session":12,"topic":"Floor test during allocation","question":"When allocating an impairment loss pro rata across a CGU's assets, an individual asset's carrying amount:","choices":["Cannot be reduced below the higher of its own fair value less costs of disposal and its own value in use","Can always be reduced to zero if the CGU's loss is large enough","Is never affected by CGU-level allocation","Is reduced by an equal absolute amount for every asset, regardless of carrying amount"],"correct_index":0,"explanation":"The floor test prevents over-allocating loss to any single asset below its own recoverable-amount floor; any shortfall is pushed to other assets instead."},{"id":"cr-s12-q12","session":12,"topic":"Reversing a goodwill impairment","question":"A previously recognised goodwill impairment loss:","choices":["Can never be reversed in a later period, under any circumstances","Can be reversed if the CGU's recoverable amount recovers fully","Can be reversed up to 50% of the original loss","Can be reversed only with auditor approval"],"correct_index":0,"explanation":"Flagged exam trap, absolute rule: goodwill impairment reversal is prohibited, period."},{"id":"cr-s12-q13","session":12,"topic":"Reversal ceiling for non-goodwill assets","question":"When reversing an impairment loss on a non-goodwill asset, the increased carrying amount:","choices":["Must not exceed what the carrying amount would have been (net of notional depreciation) had no impairment ever occurred","Can be increased to any amount up to the asset's original cost with no depreciation adjustment","Must always equal the asset's current fair value exactly","Is capped at the amount of the original impairment loss only"],"correct_index":0,"explanation":"The reversal ceiling is the pre-impairment carrying amount net of the depreciation/amortisation that would have been charged in the interim."},{"id":"cr-s12-q14","session":12,"topic":"Corporate assets","question":"Corporate assets (e.g. HQ buildings, IT systems) that cannot be reasonably allocated to a single CGU are:","choices":["Tested with that CGU first without them, then with the smallest group of CGUs to which they can be allocated","Ignored entirely in impairment testing","Always allocated equally across every CGU in the entity","Written off immediately regardless of any impairment indicator"],"correct_index":0,"explanation":"Two-step approach: test the CGU alone first, then test the smallest group of CGUs the corporate asset can reasonably be allocated to."},{"id":"cr-s13-q1","session":13,"topic":"BIG/JWMS deal structure","question":"Biosensors International Group's 2011 acquisition of JW Medical Systems involved:","choices":["Buying the remaining 50% it did not already own, for US$478 million","A 100% acquisition of a company it had no prior stake in","A minority 20% stake purchase","A merger of equals with no cash or stock consideration"],"correct_index":0,"explanation":"BIG already held 50% since 2003 and acquired the remaining 50% from Weigao in October 2011."},{"id":"cr-s13-q2","session":13,"topic":"Balance sheet impact","question":"Following the JWMS acquisition, intangible assets and goodwill together moved from:","choices":["4% to 62% of BIG's total assets","62% to 4% of BIG's total assets","10% to 20% of total assets","No material change occurred"],"correct_index":0,"explanation":"This dramatic composition shift is the case's opening hook, almost entirely explained by the acquisition."},{"id":"cr-s13-q3","session":13,"topic":"Intangibles recognised in the deal","question":"Which category dominated the fair value of intangible assets acquired via JWMS?","choices":["Customer relationships","Patents","Land use rights","Internally generated goodwill"],"correct_index":0,"explanation":"Customer relationships (135,128 gross / 131,236 net of US$'000) dwarfed patents (18,825) and land use rights (1,841)."},{"id":"cr-s13-q4","session":13,"topic":"Why customer relationships could be recognised","question":"The JWMS customer relationships intangible could be recognised because it was:","choices":["Acquired through a business combination, not internally generated","Developed internally over many years","A legally registered trademark","Below the materiality threshold, so estimation was not required"],"correct_index":0,"explanation":"Session 11's rule: internally generated customer lists/relationships can never be recognised, but the SAME item acquired via a business combination can be."},{"id":"cr-s13-q5","session":13,"topic":"Land use rights amortisation timing","question":"The land use rights acquired were NOT yet being amortised at 31 March 2012 because:","choices":["The lease period had not yet begun (started 1 April 2012)","IAS38 prohibits amortising land use rights ever","They were still under litigation","Management elected the revaluation model instead"],"correct_index":0,"explanation":"Consistent with the 'capable of operating as intended' cutoff logic — amortisation starts when the asset is ready for use, not before."},{"id":"cr-s13-q6","session":13,"topic":"Goodwill recognition (accounting policy)","question":"Goodwill on acquisition is measured at:","choices":["Cost, being the excess of consideration transferred over net identifiable assets acquired and liabilities assumed","Fair value, remeasured every reporting period","Zero, since goodwill is never separately recognised","The purchase price divided by the number of CGUs"],"correct_index":0,"explanation":"Goodwill = cost = consideration (+ any NCI) minus net identifiable assets/liabilities; subsequently held at cost less accumulated impairment, never amortised."},{"id":"cr-s13-q7","session":13,"topic":"Where the impairment actually hit","question":"BIG's FY2012 goodwill impairment loss was attributable to:","choices":["Three smaller CGUs (BSI, Bio Japan, Bifurcation stents) — NOT JWMS","JWMS exclusively, the largest goodwill balance","All five goodwill-bearing CGUs equally","No impairment was recognised anywhere"],"correct_index":0,"explanation":"Despite JWMS holding by far the largest goodwill balance, its goodwill required no impairment — illustrating that goodwill testing is CGU-specific, not company-wide."},{"id":"cr-s13-q8","session":13,"topic":"Value-in-use inputs for JWMS","question":"BIG's value-in-use calculation for the JWMS CGU used:","choices":["A five-year DCF forecast with a terminal growth rate, an 18% average growth rate and a 12% pre-tax discount rate","A single-year spot valuation with no forecast","Only the acquisition price as a proxy for value in use","A discount rate set by the external auditor, not management"],"correct_index":0,"explanation":"These are the specific disclosed assumptions for the JWMS CGU in the case."},{"id":"cr-s13-q9","session":13,"topic":"Reliability of the 'no impairment' conclusion","question":"The case frames the 'no impairment' conclusion for JWMS goodwill as:","choices":["Resting entirely on management's own, not independently verifiable, DCF assumptions","An objectively verifiable fact with no room for judgement","Guaranteed accurate because it was audited","Irrelevant to IAS36 since goodwill impairment is optional"],"correct_index":0,"explanation":"The case exists specifically to show how much of the 'no impairment' conclusion depends on management-controlled inputs (growth rate, terminal growth, discount rate)."},{"id":"cr-s13-q10","session":13,"topic":"Market capitalisation as a cross-check","question":"Comparing BIG's market capitalisation to its net book value is relevant because:","choices":["'Book value of net assets exceeding market capitalisation' is an explicit IAS36 external impairment indicator","Market capitalisation directly determines the amortisation period of intangibles","It replaces the need for a DCF calculation entirely","It is only relevant for companies listed in the United States"],"correct_index":0,"explanation":"This is Session 12's own external indicator, applied here as an independent sanity check on management's DCF-based conclusion."},{"id":"cr-s13-q11","session":13,"topic":"Common mistake: acquisition multiple as proof","question":"Citing the ~25x FY2011-profit acquisition multiple, on its own, as proof BIG overpaid is:","choices":["A mistake — the case frames it as one data point for discussion, not a conclusive IAS36/IFRS3 test","The correct and sufficient method for concluding overpayment under IFRS3","Irrelevant to any part of the case","The exact test IAS36 mandates for goodwill impairment"],"correct_index":0,"explanation":"Flagged exam trap: the multiple is context (alongside strategic rationale and market comparables), not a formal accounting test."},{"id":"cr-s14-q1","session":14,"topic":"Provision recognition test","question":"A provision is recognised only when:","choices":["There is a present obligation from a past event, an outflow is probable, and a reliable estimate can be made — all three","Any one of the three usual conditions is met","The entity's board merely intends to act in the future","The amount is precisely and certainly known"],"correct_index":0,"explanation":"All three conditions (present obligation, probable outflow, reliable estimate) are required together."},{"id":"cr-s14-q2","session":14,"topic":"Legal vs constructive obligation","question":"A constructive obligation arises when:","choices":["The entity's own conduct has created a valid expectation in those affected that it will discharge a responsibility, even without legal enforceability","A contract or legislation directly requires payment","The obligation is contingent on a future court ruling","Management merely discusses a possible future policy internally"],"correct_index":0,"explanation":"Constructive obligations arise from the entity's own conduct/track record (e.g. a published environmental policy), distinct from legal obligations arising from contract or law."},{"id":"cr-s14-q3","session":14,"topic":"Contaminated land example","question":"In the contaminated-land example, a provision must be recognised because:","choices":["The company's published policy and track record created a constructive obligation, and the clean-up cost is probable and reliably estimable","Local environmental legislation legally requires the clean-up","No obligation exists since there is no legislation","The cost cannot be reliably estimated, so only disclosure is required"],"correct_index":0,"explanation":"Despite no legislation, the constructive obligation (policy + track record) satisfies all three recognition conditions."},{"id":"cr-s14-q4","session":14,"topic":"Uncertainty spectrum","question":"Ranking from least to most uncertain: accrued liabilities, provisions, contingent liabilities. Which is the MOST uncertain?","choices":["Contingent liabilities","Accrued liabilities","Provisions","They are all equally uncertain"],"correct_index":0,"explanation":"Accrued liabilities are essentially certain; provisions have uncertain timing/amount but are still probable/estimable; contingent liabilities are the most uncertain (not probable, or not reliably estimable, or outside the entity's control)."},{"id":"cr-s14-q5","session":14,"topic":"Where each item is reported","question":"A contingent liability with a probable outflow but an UNRELIABLE estimate is:","choices":["Disclosed in the notes only, not recognised on the balance sheet","Recognised on the balance sheet as a provision","Recognised on the balance sheet as an accrued liability","Not mentioned anywhere, since the estimate is unreliable"],"correct_index":0,"explanation":"A contingent liability, by definition, is never recognised on the balance sheet — only disclosed (unless the outflow is remote, in which case even disclosure is not required)."},{"id":"cr-s14-q6","session":14,"topic":"Measuring one-off events","question":"A provision for a single, one-off lawsuit is measured at:","choices":["The most likely amount","The probability-weighted expected value across a large population of outcomes","The maximum possible payout, regardless of likelihood","The minimum possible payout"],"correct_index":0,"explanation":"One-off events use the most likely amount; large-population events (e.g. warranties) use probability-weighted expected value."},{"id":"cr-s14-q7","session":14,"topic":"Warranty expected value worked example","question":"75% no defects, 20% small defects (cost 1,000,000 if ALL had them), 5% major defects (cost 4,000,000 if ALL had them). Expected value is:","choices":["€400,000","€1,000,000","€4,000,000","€250,000"],"correct_index":0,"explanation":"(75% x 0) + (20% x 1,000,000) + (5% x 4,000,000) = 0 + 200,000 + 200,000 = €400,000."},{"id":"cr-s14-q8","session":14,"topic":"Present value of a provision","question":"When the time value of money is material, a provision is measured at:","choices":["Its present value, with the discount unwinding recognised as a finance cost each period","Its undiscounted future settlement amount only, with no adjustment over time","Zero until the year of actual settlement","The historical cost of the obligating event"],"correct_index":0,"explanation":"The provision grows toward its undiscounted settlement amount over time via the unwinding of the discount, recognised as a P&L finance cost."},{"id":"cr-s14-q9","session":14,"topic":"Netting disposal gains against a provision","question":"An anticipated gain on disposal of an asset, closely linked to the event creating a provision, must be:","choices":["Never netted against the provision — provisions measure obligations, not net economic outcomes","Always netted against the provision to reflect the net expected cost","Netted only if the disposal is certain to happen within 12 months","Ignored entirely, along with the provision itself"],"correct_index":0,"explanation":"Flagged exam trap: no netting, ever, regardless of how closely linked the disposal is to the obligating event."},{"id":"cr-s14-q10","session":14,"topic":"Future operating losses","question":"Expected future operating losses:","choices":["Shall not be recognised as a provision; instead, they may indicate that related assets need an IAS36 impairment test","Must always be provided for in full","Are provided for only if the loss exceeds 10% of revenue","Are treated identically to restructuring provisions"],"correct_index":0,"explanation":"Flagged exam trap: future operating losses are explicitly prohibited from provisioning; the correct response is an impairment test on the affected assets."},{"id":"cr-s14-q11","session":14,"topic":"Onerous contracts","question":"An onerous contract is one where:","choices":["The unavoidable costs of meeting its obligations exceed the economic benefits expected under it","The counterparty has already breached the contract","The contract has a below-market interest rate","The contract term exceeds five years"],"correct_index":0,"explanation":"This is the IAS37 definition; unlike future operating losses, the obligation under an onerous contract SHALL be recognised and measured as a provision."},{"id":"cr-s14-q12","session":14,"topic":"Restructuring provision recognition","question":"A restructuring provision can be recognised only if:","choices":["A detailed formal plan exists AND it has raised a valid expectation in those affected (implementation started or plan announced)","The board has merely approved a general restructuring intention","Management has announced restructuring is 'under consideration'","The company has booked the expected severance cost as a budget line, with nothing communicated externally"],"correct_index":0,"explanation":"Flagged exam trap: a board decision alone, without a detailed plan and a raised valid expectation, is not enough."},{"id":"cr-s14-q13","session":14,"topic":"Restructuring provision scope","question":"A restructuring provision may include:","choices":["Only direct expenditures necessarily entailed by the restructuring and not related to ongoing activities","Ordinary retraining costs for continuing staff","General marketing expenses","Investment in new distribution networks"],"correct_index":0,"explanation":"The latter three are explicitly excluded — they relate to future operations, not to winding down the restructured activity."},{"id":"cr-s14-q14","session":14,"topic":"Contingent asset disclosure","question":"A contingent asset where the inflow of economic benefits is PROBABLE but not virtually certain is:","choices":["Not recognised, but disclosed","Recognised as an asset on the balance sheet","Neither recognised nor disclosed","Recognised immediately as income"],"correct_index":0,"explanation":"Not probable -> nothing. Probable but not virtually certain -> disclose only. Virtually certain -> it's no longer a contingent asset; recognise it normally."},{"id":"cr-s16-q1","session":16,"topic":"Right to control test","question":"Under IFRS16, a contract conveys the right to control the use of an identified asset only when the lessee has","choices":["Economic benefits from the asset only","The right to direct how and for what purpose the asset is used only","Both substantially all the economic benefits and the right to direct how and for what purpose the asset is used","A purchase option on the asset"],"correct_index":2,"explanation":"Both conditions are required together. A contract granting only one of the two does not convey control in the IFRS16 sense."},{"id":"cr-s16-q2","session":16,"topic":"Why firms lease","question":"Which of these is NOT one of the three commercial motivations for leasing given in the fiche?","choices":["100% financing at fixed rates","Protection against obsolescence","Flexibility, e.g. looser debt covenants","Lower total lifetime cost than buying"],"correct_index":3,"explanation":"The fiche lists 100% fixed-rate financing, obsolescence protection and flexibility. Lower total lifetime cost is not one of the stated motivations."},{"id":"cr-s16-q3","session":16,"topic":"IAS17 dual model","question":"Under IAS17, a lease was classified as a finance lease when","choices":["The lessee had the option to renew","Substantially all risks and rewards of ownership were transferred to the lessee, or the lease was economically similar to a purchase","The lease term exceeded 12 months","The asset was low value"],"correct_index":1,"explanation":"IAS17 used two economic-substance tests, risk/reward transfer and purchase-similarity. A yes to either made it a finance lease."},{"id":"cr-s16-q4","session":16,"topic":"IFRS16 single model","question":"Under IFRS16, how many lease-classification tests does a lessee apply?","choices":["Two, exactly like IAS17","One, but only for leases longer than 5 years","None, a lessee recognises a ROU asset and lease liability for essentially every lease","It depends on the lessor's own classification"],"correct_index":2,"explanation":"IFRS16 removed the classification test for lessees entirely, moving to a single on balance sheet model."},{"id":"cr-s16-q5","session":16,"topic":"Lessor accounting","question":"How much did IFRS16 change lessor accounting?","choices":["It introduced a brand new single model for lessors too","Barely at all, lessors still use the IAS17 dual model, with added disclosure about residual value risk","It abolished finance lease accounting for lessors","It required lessors to recognise a ROU asset"],"correct_index":1,"explanation":"IFRS16 left lessor accounting essentially unchanged, the main addition is extra disclosure on residual value risk management."},{"id":"cr-s16-q6","session":16,"topic":"Motivation for the change","question":"Before IFRS16, how did investors and rating agencies typically treat off balance sheet operating leases?","choices":["They ignored them entirely","They informally capitalised them using rough rules of thumb, e.g. liability roughly 8 times annual lease expense","They demanded lessees stop leasing","They only adjusted for leases longer than 20 years"],"correct_index":1,"explanation":"The fiche cites survey and empirical evidence that investors, lenders and rating agencies already made rough informal adjustments to capitalise operating leases before IFRS16 existed."},{"id":"cr-s16-q7","session":16,"topic":"Three goals of the reform","question":"Which three goals does the fiche attribute to the IFRS16 reform?","choices":["Faithful representation, comparability, mitigating manipulation opportunities","Lower taxes, higher EBITDA, simpler bookkeeping","Faster audits, lower fees, less disclosure","Higher leverage ratios, higher goodwill, lower equity"],"correct_index":0,"explanation":"The must know box lists exactly these three stated goals of the reform."},{"id":"cr-s16-q8","session":16,"topic":"Recognition vs disclosure literature","question":"What does the recognition vs disclosure academic literature cited in this session generally find?","choices":["Disclosed amounts are just as value relevant as recognised amounts","Recognised amounts are treated by investors as more value relevant than merely disclosed amounts","Investors ignore both recognised and disclosed amounts","Disclosure is always preferred by regulators over recognition"],"correct_index":1,"explanation":"Across several settings (stock options, post retirement benefits, derivatives, investment property fair value), recognised values are consistently found to be more value relevant than disclosed ones."},{"id":"cr-s16-q9","session":16,"topic":"Real effects of capitalisation","question":"According to the real effects literature cited (Ma and Thomas 2023), how did firms respond to IFRS16 and Topic 842?","choices":["They stopped leasing entirely","They decreased long-term operating leases, increased short-term operating leases, and increased capital expenditure","They only leased real estate afterwards","They increased long-term operating leases to maximise the ROU asset"],"correct_index":1,"explanation":"Firms restructured their leasing mix toward shorter terms and substituted toward more capex, consistent with trying to reduce the measured lease liability."},{"id":"cr-s16-q10","session":16,"topic":"Real effects, fixed vs variable payments","question":"Why might a firm shift toward variable, non-index-linked lease payments after IFRS16?","choices":["Because variable payments are always cheaper overall","Because the IFRS16 lease liability is based on largely fixed or index linked payments, so non-index variable payments can be excluded from it","Because IFRS16 forbids fixed payments","Because variable payments are automatically capitalised as goodwill"],"correct_index":1,"explanation":"Since the lease liability calculation is built from fixed and index or rate linked payments, shifting to non-index variable payments keeps more of the obligation out of the measured liability."},{"id":"cr-s16-q11","session":16,"topic":"Costs of lease capitalisation","question":"What did Chen et al. (2023) find about the real effects of lease capitalisation rules, according to the fiche?","choices":["No measurable effect on firm behaviour","Association with decreases in firm level investment, profitability and employment, concentrated in lease intensive and financially distressed firms","A pure improvement in firm profitability","An increase in employment across all sectors"],"correct_index":1,"explanation":"The fiche describes costly, unintended consequences, decreases in investment, profitability and employment, concentrated in lease intensive and financially distressed firms."},{"id":"cr-s16-q12","session":16,"topic":"First response to capitalisation historically","question":"When SFAS13 first required finance leases onto the balance sheet, how did firms respond according to Imhoff and Thomas (1988)?","choices":["They stopped using leases of any kind","They substituted finance leases with operating leases and other non-lease financing to stay off balance sheet","They immediately adopted IFRS16 early","They increased finance lease usage"],"correct_index":1,"explanation":"This is an earlier real effects example, firms restructured around the new rule to keep leases off balance sheet, foreshadowing the later IFRS16 response."},{"id":"cr-s16-q13","session":16,"topic":"Common exam trap","question":"A student writes that IFRS16 replaced the finance versus operating lease distinction for lessors. Is this correct?","choices":["Yes, lessors now also use a single model","No, that distinction was replaced for lessees only, lessors still classify leases as finance or operating","Yes, but only for airlines","No, IFRS16 does not apply to lessors at all"],"correct_index":1,"explanation":"This is an explicitly flagged exam trap, the single model change applies to lessees, lessor accounting kept the dual classification."},{"id":"cr-s17-q1","session":17,"topic":"Recognition exemptions","question":"Under IFRS16, which two categories of leases are exempt from lessee capitalisation?","choices":["Leases of real estate and leases of equipment","Short term leases (12 months or less) and low value leases","Leases with a purchase option and leases without one","Leases from related parties and leases from third parties"],"correct_index":1,"explanation":"The only two recognition exemptions are short term (term of 12 months or less) and low value leases, for both the old operating lease treatment survives."},{"id":"cr-s17-q2","session":17,"topic":"Lease term anti-avoidance","question":"Why does IFRS16 require including reasonably certain renewal periods in the lease term?","choices":["To make leases look cheaper","To close a loophole where companies could negotiate artificially short terms with frequent renewals to dodge or minimise capitalisation","Because IAS17 required it too","Because renewal periods are always non-cancellable"],"correct_index":1,"explanation":"Without this anti-avoidance rule, firms could game the system with short nominal terms and near-certain renewals, understating the recognised liability."},{"id":"cr-s17-q3","session":17,"topic":"ROU asset initial cost","question":"Which of the following is NOT a component of the ROU asset's initial cost?","choices":["The amount of the initial lease liability","Lease payments made at or before commencement","Initial direct costs incurred by the lessee","The lessor's own cost of acquiring the underlying asset"],"correct_index":3,"explanation":"The ROU asset's cost is built from the lessee's own initial lease liability, payments at or before commencement, initial direct costs, and estimated dismantling or restoration costs, not the lessor's acquisition cost."},{"id":"cr-s17-q4","session":17,"topic":"Lease liability initial measurement","question":"The lease liability's initial measurement includes all of the following EXCEPT","choices":["Fixed lease payments","Variable payments depending on an index or rate","Residual value guarantee payments expected to be payable","Purely variable payments not linked to any index or rate"],"correct_index":3,"explanation":"Purely variable, non-index linked payments are excluded from the initial lease liability measurement, which is exactly why firms can use them to reduce the recognised liability (Session 16)."},{"id":"cr-s17-q5","session":17,"topic":"Subsequent measurement of the lease liability","question":"How is interest calculated on the lease liability in subsequent periods?","choices":["A different rate can be chosen each year","A constant periodic rate of interest on the remaining balance, using the same discount rate as at initial measurement","No interest is charged after year one","The rate is set by the lessor annually"],"correct_index":1,"explanation":"This mirrors the effective interest method already used for financial liabilities, a constant rate applied to a declining balance, using the original discount rate throughout."},{"id":"cr-s17-q6","session":17,"topic":"Income statement presentation","question":"Can depreciation and interest expense from a lease be combined into a single income statement line?","choices":["Yes, it simplifies presentation","No, IFRS16 requires them to remain separately identifiable","Only for short term leases","Only if the lessor agrees"],"correct_index":1,"explanation":"IFRS16 explicitly forbids combining depreciation (on the ROU asset) and interest (on the lease liability) into one line."},{"id":"cr-s17-q7","session":17,"topic":"Cash flow statement classification","question":"How is the principal portion of a lease payment classified in the cash flow statement?","choices":["Operating activities always","Financing activities","Investing activities","It depends on the lessor's classification"],"correct_index":1,"explanation":"The principal portion is always classified within financing activities. The interest portion follows the entity's general policy for presenting interest, operating or financing."},{"id":"cr-s17-q8","session":17,"topic":"Lessor accounting by lease type","question":"Under an operating lease from the lessor's perspective, what happens to the underlying asset?","choices":["It is derecognised and a receivable is recognised instead","It stays on the lessor's balance sheet, and lease income is recognised on a straight line basis","It is transferred to the lessee immediately","It is written off to expense"],"correct_index":1,"explanation":"Operating lease lessor accounting keeps the asset on the lessor's books with straight line income recognition, unlike finance lease lessor accounting."},{"id":"cr-s17-q9","session":17,"topic":"Lessor finance lease accounting","question":"Under a finance lease from the lessor's perspective, what does the lessor recognise instead of the underlying asset?","choices":["Nothing, the transaction is off balance sheet","A lease receivable equal to its net investment in the lease (lease payments receivable plus any unguaranteed residual value)","A ROU asset, exactly like a lessee","A deferred tax asset only"],"correct_index":1,"explanation":"The lessor derecognises the underlying asset and recognises a lease receivable, then earns interest income on it and reduces it as payments are collected, mirroring the lessee's liability mechanics."},{"id":"cr-s17-q10","session":17,"topic":"Financial statement effects, EBITDA","question":"Why does EBITDA typically increase when a former operating lease is capitalised under IFRS16?","choices":["Because rent expense, previously above the EBITDA line, is replaced by depreciation and interest, both below EBITDA","Because revenue increases","Because the lease liability is excluded from EBITDA","Because IFRS16 abolishes rent expense entirely for all leases"],"correct_index":0,"explanation":"The former single rent expense line sat above EBITDA. Now depreciation and interest sit below it, mechanically inflating EBITDA even though nothing about the underlying economics changed."},{"id":"cr-s17-q11","session":17,"topic":"Financial statement effects, profit pattern","question":"How does total expense from a capitalised lease typically compare to straight line rent expense over the lease's early years?","choices":["It is identical every year","It is typically front loaded, higher total expense in early years, since interest is calculated on a larger outstanding balance early on","It is always lower in early years","It depends only on the lessor's policy"],"correct_index":1,"explanation":"Because interest accrues on a larger remaining balance early in the lease, total depreciation plus interest tends to exceed straight line rent in early years, and the pattern reverses later."},{"id":"cr-s17-q12","session":17,"topic":"Common mistake, discount rate","question":"A student uses a different discount rate to compute interest expense in year 3 than the rate used at initial measurement. Is this correct?","choices":["Yes, rates should be updated to market rates each year","No, IFRS16 requires the same discount rate used at initial measurement throughout the effective interest calculation","Yes, but only if interest rates rose","It depends on whether the lease is short term"],"correct_index":1,"explanation":"The effective interest method requires the same discount rate used initially, applied consistently to the declining balance in every subsequent period."},{"id":"cr-s18-q1","session":18,"topic":"Tweedie quote","question":"What was Sir David Tweedie's famous remark about airlines and IAS17 pointing at?","choices":["That airlines never lease aircraft","That IAS17's off balance sheet operating leases let airlines keep huge financing commitments invisible on the balance sheet","That airlines should stop flying leased aircraft","That aircraft should never be depreciated"],"correct_index":1,"explanation":"His remark about wanting to fly in an aircraft that is actually on an airline's balance sheet highlighted how thoroughly operating leases hid financing commitments under IAS17."},{"id":"cr-s18-q2","session":18,"topic":"Two criticisms of IAS17","question":"According to the case, what were the two specific criticisms of IAS17's dual model?","choices":["It was too complex to apply and too expensive to audit","It made comparability harder across time and firms, and created opportunities for manipulative structuring around the bright line","It required too much disclosure and too little judgement","It only applied to airlines"],"correct_index":1,"explanation":"The case specifically flags weaker comparability and the potential for deliberately structuring leases to land on the operating side of the classification line."},{"id":"cr-s18-q3","session":18,"topic":"Industry impact","question":"Per the PwC study cited, how did airlines rank among industries studied for IFRS16 impact?","choices":["Least affected industry","Second most affected, after retailers, with a 47% median debt increase and 33% median EBITDA increase","Not studied at all","Most affected of all eight industries"],"correct_index":1,"explanation":"Airlines ranked second highest, only retailers were more affected, reflecting how heavily airlines relied on off balance sheet operating leases for aircraft."},{"id":"cr-s18-q4","session":18,"topic":"Balance sheet effect","question":"What happened to Cathay Pacific's property, plant and equipment and lease liabilities upon 2019 transition?","choices":["Both decreased by similar amounts","PP&E (new ROU assets) rose by about HKD 19,937 million and lease liabilities rose by about HKD 19,967 million","Only lease liabilities changed, PP&E stayed flat","PP&E fell as leases were derecognised"],"correct_index":1,"explanation":"Both sides of the balance sheet grew by roughly the same magnitude, new ROU assets on the asset side and new lease liabilities on the liability side."},{"id":"cr-s18-q5","session":18,"topic":"Income statement effect","question":"What was the net effect of IFRS16 adoption on Cathay Pacific's 2019 profit?","choices":["Profit improved by HKD 86 million","Profit worsened by HKD 86 million, since depreciation plus finance charges exceeded the eliminated rental expense","No effect at all","Profit improved because rent expense disappeared entirely with no offset"],"correct_index":1,"explanation":"Depreciation (3,849) plus finance charges (744) totalled 4,593, which exceeded the eliminated rental expense of 4,507 by 86, worsening reported profit by that amount."},{"id":"cr-s18-q6","session":18,"topic":"Cash flow effect","question":"What happened to Cathay Pacific's total net cash flow after IFRS16 adoption?","choices":["It increased significantly","It decreased significantly","It was unchanged, only the classification across the statement shifted (more into operating, more outflows in financing)","It became negative for the first time"],"correct_index":2,"explanation":"As Session 17 predicts generally, only the presentation across the cash flow statement categories changed, total cash flow itself is unaffected by a pure accounting reclassification."},{"id":"cr-s18-q7","session":18,"topic":"Ratio effects","question":"What happened to Cathay Pacific's gearing and EBITDA under IFRS16 versus the hypothetical continued IAS17 basis?","choices":["Gearing fell, EBITDA fell","Gearing rose about 36.5% (0.96 to 1.31), EBITDA rose about 31.1%","Both stayed flat","Gearing rose but EBITDA fell"],"correct_index":1,"explanation":"Both metrics rose, gearing because of the new recognised debt, EBITDA because rent expense was replaced by items below the EBITDA line."},{"id":"cr-s18-q8","session":18,"topic":"EPS effect","question":"What happened to Cathay Pacific's EPS under IFRS16 versus the hypothetical IAS17 basis?","choices":["EPS rose sharply","EPS fell slightly, from HKD 43.7 cents to HKD 43.0 cents, about 1.6%","EPS was unaffected","EPS became negative"],"correct_index":1,"explanation":"EPS fell modestly, consistent with the HKD 86 million net profit deterioration discussed for the income statement effect."},{"id":"cr-s18-q9","session":18,"topic":"Residual value risk","question":"Under IAS17, who bore residual value risk for a true operating lease?","choices":["The lessee","The lessor","Both parties equally by law","Neither party, the risk did not exist"],"correct_index":1,"explanation":"Under an operating lease, the lessee simply paid rent and walked away, the lessor bore the risk that the asset's actual residual value would be lower than expected."},{"id":"cr-s18-q10","session":18,"topic":"Residual value risk under IFRS16","question":"Why does the CFO Martin Murray object that IFRS16 does not reflect commercial reality of residual value risk?","choices":["Because IFRS16 abolished residual value risk entirely","Because capitalising former operating leases now exposes the lessee's balance sheet to impairment risk on the ROU asset, even though the contractual arrangement (who bears residual risk) hasn't changed","Because lessors no longer bear any risk under IFRS16","Because the objection concerns interest rate risk, not residual value"],"correct_index":1,"explanation":"The accounting now exposes the lessee to potential ROU asset impairment from residual value volatility, even though commercially the lessor may still contractually bear that risk, which is exactly Murray's objection."},{"id":"cr-s18-q11","session":18,"topic":"Common mistakes and exam traps","question":"Is it correct to conclude that IFRS16 adoption always hurts reported profit, based on the Cathay Pacific case?","choices":["Yes, this is a universal rule","No, the 86 million HKD effect was specific to that year's mix of new versus maturing leases, and the direction can reverse in later years as interest expense declines (front loading reverses over time)","Yes, but only for airlines","No, profit is never affected by IFRS16"],"correct_index":1,"explanation":"This is explicitly flagged as a common mistake, the direction of the profit effect depends on the specific mix of leases and can flip in later years of a lease's life."},{"id":"cr-s18-q12","session":18,"topic":"Commercial responses","question":"Which of these is NOT listed as a possible commercial response to IFRS16 by lease intensive companies?","choices":["Renegotiating lease terms and early termination clauses","Shifting toward variable, non-index linked lease payments","Reassessing whether leasing is still the right way to access assets given its new balance sheet treatment","Immediately selling all owned aircraft to increase leverage further"],"correct_index":3,"explanation":"The three genuine responses listed are lease renegotiation, shifting to variable non-index payments, and reconsidering lease versus buy decisions, not deliberately increasing leverage."},{"id":"cr-s19-q1","session":19,"topic":"Tax expense formula","question":"How is total tax expense in the income statement composed under IAS12?","choices":["Current tax only","Deferred tax only","Current tax plus deferred tax","Current tax minus deferred tax always"],"correct_index":2,"explanation":"Tax expense = current tax + deferred tax, where deferred tax is the movement in deferred tax balances for the period."},{"id":"cr-s19-q2","session":19,"topic":"Permanent differences","question":"Which of the following is a permanent difference, not a temporary one?","choices":["A warranty expense estimated this year but only tax deductible when actually paid","Interest received on tax exempt municipal bonds","Depreciation using different rates for accounting and tax","Prepaid rent deducted for tax immediately but expensed for accounting over time"],"correct_index":1,"explanation":"Tax exempt interest never enters taxable profit at all, in either period, so it never reverses and creates no deferred tax. The other options are all timing differences that eventually reverse."},{"id":"cr-s19-q3","session":19,"topic":"Current tax formula","question":"Current tax expense equals","choices":["Pre-tax accounting profit times the statutory rate, with no adjustments","Taxable profit times the statutory tax rate, where taxable profit adjusts accounting profit for permanent differences","Deferred tax times the statutory rate","Accounting profit divided by the statutory rate"],"correct_index":1,"explanation":"Current tax expense = taxable profit x statutory rate, and taxable profit is accounting profit adjusted for permanent differences (disallowed expenses added back, non-taxable income deducted)."},{"id":"cr-s19-q4","session":19,"topic":"Why temporary differences create deferred tax","question":"Why do temporary differences, unlike permanent ones, generate deferred tax?","choices":["Because they are always larger in size","Because a current period timing difference will produce an offsetting difference in a future period when it reverses","Because tax authorities require it for all differences","Because they always relate to depreciation only"],"correct_index":1,"explanation":"The reversal is the key mechanism, a temporary difference opens now and closes later, generating a future tax consequence, which is exactly what a deferred tax asset or liability represents."},{"id":"cr-s19-q5","session":19,"topic":"Deferred tax asset condition","question":"A deferred tax asset arises when","choices":["Taxable profit is currently lower than accounting profit","Taxable profit is currently higher than accounting profit, since less tax will be paid later when it reverses","The tax rate has just increased","Permanent differences exceed temporary differences"],"correct_index":1,"explanation":"If the entity pays more tax now than accounting profit would imply, it will pay less tax later when the difference reverses, and that future saving is the deferred tax asset."},{"id":"cr-s19-q6","session":19,"topic":"Deferred tax liability condition","question":"A deferred tax liability arises when","choices":["Revenue is taxed before it is recognised in accounting profit","Expenses are tax deductible before being recognised in accounting profit, or revenue is recognised in accounting profit before being taxed","Taxable profit exceeds accounting profit permanently","A valuation allowance is established"],"correct_index":1,"explanation":"Examples given are prepaid rent/insurance deducted immediately for tax, or accrual basis revenue recognised in accounting profit before being taxed. Both mean less tax now, more tax later, a liability."},{"id":"cr-s19-q7","session":19,"topic":"Balance sheet approach, asset","question":"For an asset, if its carrying amount exceeds its tax base, this is a","choices":["Deductible temporary difference, giving a deferred tax asset","Taxable temporary difference, giving a deferred tax liability","Permanent difference with no deferred tax","Always an error in the accounts"],"correct_index":1,"explanation":"Carrying greater than tax base for an asset is a taxable temporary difference, producing a deferred tax liability, per the balance sheet approach summary table."},{"id":"cr-s19-q8","session":19,"topic":"Balance sheet approach, liability","question":"For a liability, if its carrying amount is less than its tax base, this is a","choices":["Deductible temporary difference, giving a deferred tax asset","Taxable temporary difference, giving a deferred tax liability","No temporary difference at all","A permanent difference"],"correct_index":0,"explanation":"For a liability, carrying less than tax base is a deductible temporary difference, giving a deferred tax asset, per the balance sheet approach summary table, the mirror image of the asset rule."},{"id":"cr-s19-q9","session":19,"topic":"Tax base definition","question":"What is the tax base of an asset or liability?","choices":["Its historical cost","Its fair value","The amount attributed to it for tax purposes","Its carrying amount under IFRS"],"correct_index":2,"explanation":"The tax base is specifically the amount attributed to the asset or liability under tax rules, which can differ from its accounting carrying amount, that gap is the temporary difference."},{"id":"cr-s19-q10","session":19,"topic":"Mandrigo Ltd example","question":"Mandrigo Ltd has pre-tax accounting profit of 520,000, a 20,000 fine (disallowed) and 10,000 of tax exempt bond interest. At a 20% tax rate, what is current tax?","choices":["104,000","106,000","110,000","96,000"],"correct_index":1,"explanation":"Taxable profit = 520,000 + 20,000 - 10,000 = 530,000. Current tax = 530,000 x 20% = 106,000."},{"id":"cr-s19-q11","session":19,"topic":"Journal entries","question":"In the balance sheet approach, where does the resulting deferred tax balance get presented?","choices":["Always as a current asset or liability","As a non-current asset or liability","Netted directly against retained earnings","It is not presented on the balance sheet at all"],"correct_index":1,"explanation":"Deferred tax balances are always presented as non-current items in the financial statements, regardless of when the underlying difference is expected to reverse."},{"id":"cr-s19-q12","session":19,"topic":"Discounting deferred tax","question":"Should deferred tax balances be discounted to present value under IAS12?","choices":["Yes, always, since they relate to the future","No, IAS12 requires deferred tax to be reported undiscounted even if reversal is expected far in the future","Only if the reversal is more than 10 years away","Only for deferred tax liabilities, not assets"],"correct_index":1,"explanation":"This is an explicit exam trap, IAS12 prohibits discounting deferred tax, which can materially overstate its economic present value, a point developed further in Session 20."},{"id":"cr-s20-q1","session":20,"topic":"Bad debt example","question":"In the bad debt allowance example, Year 1 tax rate 30%, accounting profit 3,000, taxable profit 4,000 (bad debt not yet deductible), what is the deferred tax effect?","choices":["A deferred tax liability of 300","A deferred tax asset of 300, since more tax is paid now than accounting profit implies","No deferred tax effect","A deferred tax asset of 1,000"],"correct_index":1,"explanation":"Tax expense (900) minus current tax expense (1,200) = -300, meaning a deferred tax asset increases by 300, since the entity pays more tax now (on the higher taxable profit) than the accounting profit suggests."},{"id":"cr-s20-q2","session":20,"topic":"Accelerated depreciation example","question":"Over the full life of an asset with accelerated tax depreciation versus straight line accounting depreciation, what happens to total tax paid?","choices":["It differs permanently between the two approaches","It converges to the same total, only the timing differs","It is always higher under tax depreciation","It is impossible to compare"],"correct_index":1,"explanation":"The worked example shows the deferred tax liability builds then fully unwinds to zero by the end of the asset's tax life, confirming timing differences always fully reverse and total tax paid converges."},{"id":"cr-s20-q3","session":20,"topic":"Valuation allowance definition","question":"What is a valuation allowance?","choices":["A contra account against deferred tax liabilities","A contra account against deferred tax assets, reducing them when future taxable profit sufficient to use them is no longer probable","An increase to current tax payable","A permanent difference adjustment"],"correct_index":1,"explanation":"It specifically applies to deferred tax assets, reviewed each period based on the probability of having enough future taxable profit to use the asset."},{"id":"cr-s20-q4","session":20,"topic":"Valuation allowance mechanics","question":"How does establishing a valuation allowance affect the income statement?","choices":["It has no income statement effect","It flows through as a loss when established or increased, and a gain when reversed","It is always a permanent adjustment with no reversal possible","It only affects OCI, never P&L"],"correct_index":1,"explanation":"A valuation allowance flows through profit or loss, a loss to establish or increase it, a gain if the outlook improves and it is reversed."},{"id":"cr-s20-q5","session":20,"topic":"Country differences","question":"In which country are deferred taxes typically LESS material, according to the fiche?","choices":["The UK, because accounting and tax rules are independent","Germany and France, because accounting and tax rules are closely aligned","The US, because there is no corporate tax","It does not vary by country"],"correct_index":1,"explanation":"Where accounting and tax rules are closely aligned (Germany, France), fewer temporary differences arise, so deferred taxes matter comparatively less than in a country like the UK."},{"id":"cr-s20-q6","session":20,"topic":"Analytical use of deferred taxes","question":"Why might a growing firm's depreciation related deferred tax liability persist or even grow indefinitely rather than reverse?","choices":["Because tax law forbids reversal","Because rising capital expenditure can keep generating new temporary differences faster than old ones reverse, effectively rolling the liability forward","Because deferred tax liabilities always increase by law","Because depreciation is banned for tax purposes"],"correct_index":1,"explanation":"For a growing firm with rising capex, new temporary differences can keep arising faster than old ones unwind, so the liability can persist or grow rather than actually reverse, described as similar to an interest free loan."},{"id":"cr-s20-q7","session":20,"topic":"Academic evidence, earnings quality","question":"What did Hanlon (2005) find about large positive book-tax differences?","choices":["They have no relationship to earnings persistence","Investors treat them as a red flag, reducing their expectation of future earnings persistence","They always indicate fraud","They only matter for small companies"],"correct_index":1,"explanation":"Hanlon (2005) found larger book-tax differences associate with less persistent earnings, and investors treat large positive gaps as a red flag about future earnings persistence."},{"id":"cr-s20-q8","session":20,"topic":"Academic evidence, book-tax conformity","question":"What did Hanlon et al. (2008) find about firms forced to increase book-tax conformity?","choices":["Their earnings became more informative","Their earnings became less informative, showing a wider book-tax gap is not purely a red flag","There was no effect on earnings informativeness","They stopped filing tax returns"],"correct_index":1,"explanation":"Forcing the book-tax gap to narrow (via a switch from cash to accrual method for tax) reduced the informativeness of reported earnings, a two-sided finding on the book-tax gap literature."},{"id":"cr-s20-q9","session":20,"topic":"Berkshire Hathaway framing","question":"What does the fiche's Financial Times reference frame a growing deferred tax liability as?","choices":["A hidden fraud","An interest free loan from the government, for as long as the temporary differences keep rolling forward rather than reversing","An immediate cash outflow","A form of equity financing"],"correct_index":1,"explanation":"This framing captures the growth-rate point from Section 6, a persistently rolling-forward DTL behaves economically like free financing from the government."},{"id":"cr-s20-q10","session":20,"topic":"Balance sheet approach, Bulb Ltd","question":"In the Bulb Ltd example, accounts receivable carrying 150,000, tax base 175,000, what deferred tax item results?","choices":["A deferred tax liability of 25,000 times the rate","A deferred tax asset, since carrying is less than tax base, a deductible temporary difference","No deferred tax effect","A permanent difference"],"correct_index":1,"explanation":"Carrying less than tax base for an asset is a deductible temporary difference, giving a deferred tax asset, following the balance sheet approach rule."},{"id":"cr-s20-q11","session":20,"topic":"Balance sheet approach, development costs","question":"In Bulb Ltd, development costs carrying 90,000, tax base 0 (fully deducted immediately for tax), what results?","choices":["A deferred tax asset","A deferred tax liability, since carrying exceeds tax base, a taxable temporary difference","No deferred tax effect","A valuation allowance is required immediately"],"correct_index":1,"explanation":"Carrying greater than tax base for an asset is a taxable temporary difference, giving a deferred tax liability, exactly the mirror case of the receivable above."},{"id":"cr-s20-q12","session":20,"topic":"Common mistake, valuation allowance scope","question":"Can a valuation allowance be established against a deferred tax liability?","choices":["Yes, whenever profitability outlook worsens","No, valuation allowances apply only to deferred tax assets, a DTL always represents a real future obligation with no equivalent judgement call","Yes, but only for liabilities over 1 million","It depends on the jurisdiction"],"correct_index":1,"explanation":"This is an explicit exam trap, a valuation allowance is specific to deferred tax assets, there is no equivalent mechanism for liabilities."},{"id":"cr-s21-q1","session":21,"topic":"Sale and leaseback definition","question":"What is a sale and leaseback transaction?","choices":["The buyer-lessor sells the asset back to the original owner after one year","The seller-lessee sells an asset to the buyer-lessor and immediately leases that same asset back","A lease with no purchase option","A lease that automatically terminates upon sale"],"correct_index":1,"explanation":"It is a single coordinated transaction, sale followed immediately by leaseback of the same asset to the original owner, now the lessee."},{"id":"cr-s21-q2","session":21,"topic":"Seller-lessee benefit","question":"What is a key benefit for the seller-lessee in a sale and leaseback?","choices":["A tax free capital gain always","An immediate cash inflow that can be redeployed, with no interruption to operational use of the asset","Guaranteed higher asset value in future","Elimination of all future lease payments"],"correct_index":1,"explanation":"The seller-lessee gets immediate cash while continuing to use the asset without interruption, exactly what makes the structure attractive."},{"id":"cr-s21-q3","session":21,"topic":"Key question governing treatment","question":"What single question determines the seller-lessee's accounting treatment in a sale and leaseback?","choices":["Whether the buyer-lessor is a bank","Whether the transfer qualifies as a sale under IFRS15, i.e. whether control has transferred","Whether the leaseback term exceeds 12 months","Whether the asset is real estate or equipment"],"correct_index":1,"explanation":"Everything hinges on the IFRS15 control transfer test, if it is a sale, sale and lease accounting applies, if not, the whole thing is treated as a loan."},{"id":"cr-s21-q4","session":21,"topic":"If the transfer is NOT a sale","question":"If the transfer does not qualify as a sale under IFRS15, how does the seller-lessee account for the proceeds received?","choices":["As revenue","As a financial liability under IFRS9, i.e. treated as a loan","As a gain on disposal","As other comprehensive income"],"correct_index":1,"explanation":"Both parties treat the cash exchanged as a loan, a financial liability for the seller-lessee and a financial asset for the buyer-lessor, since control never actually transferred."},{"id":"cr-s21-q5","session":21,"topic":"ROU asset measurement in a qualifying sale and leaseback","question":"How is the seller-lessee's ROU asset measured when the transfer IS a sale?","choices":["At the full fair value of the asset","At the proportion of the asset's previous carrying amount that relates to the rights of use retained by the seller-lessee","At zero, since the asset was sold","At the buyer-lessor's purchase price"],"correct_index":1,"explanation":"The ROU asset uses the seller-lessee's own pre-transaction book value, scaled down by the proportion of rights retained, not a fresh fair value estimate."},{"id":"cr-s21-q6","session":21,"topic":"Gain recognition in a qualifying sale and leaseback","question":"How much of the potential gain on disposal does the seller-lessee recognise?","choices":["The full gain on the whole asset","Only the portion relating to the rights actually transferred to the buyer-lessor","No gain is ever recognised","The gain is deferred permanently"],"correct_index":1,"explanation":"Only the proportion of rights genuinely given up (transferred) generates a recognised gain, the rest is embedded in the ROU asset's initial measurement instead."},{"id":"cr-s21-q7","session":21,"topic":"Worked example figures","question":"In the building sale and leaseback example (fair value 500,000, carrying amount 400,000, leaseback PV 105,000), what proportion of rights is retained?","choices":["100,000 divided by 500,000","105,000 divided by 500,000, about 21%","400,000 divided by 500,000","500,000 divided by 105,000"],"correct_index":1,"explanation":"Proportion retained is approximated as the leaseback's present value divided by the asset's fair value, 105,000/500,000 = 21%."},{"id":"cr-s21-q8","session":21,"topic":"Tax rate change adjustment formula","question":"How is the tax rate change adjustment to an existing deferred tax balance computed?","choices":["Ending balance times the new rate only","Beginning balance of accumulated timing differences times (former rate minus new rate)","A flat percentage regardless of the balance","It is spread evenly over future years"],"correct_index":1,"explanation":"The adjustment is a one-time catch-up applied to the entire beginning cumulative balance, not something amortised forward over future periods."},{"id":"cr-s21-q9","session":21,"topic":"Direction of DTA adjustment on a rate increase","question":"If the tax rate increases, what happens to an existing deferred tax asset balance?","choices":["It decreases","It increases, since a future tax saving is worth more at a higher future rate","It is unaffected","It converts to a deferred tax liability"],"correct_index":1,"explanation":"A DTA represents a future saving, so a higher future rate makes that saving more valuable, increasing the DTA (a gain through tax expense)."},{"id":"cr-s21-q10","session":21,"topic":"Direction of DTL adjustment on a rate decrease","question":"If the tax rate decreases, what happens to an existing deferred tax liability balance?","choices":["It increases","It decreases, since a future tax cost is worth less at a lower future rate","It converts into a deferred tax asset","It is unaffected"],"correct_index":1,"explanation":"A DTL represents a future cost, a lower future rate makes that cost smaller, decreasing the DTL, which is a gain flowing through tax expense."},{"id":"cr-s21-q11","session":21,"topic":"Common mistake, ROU asset measurement","question":"Is the ROU asset in a sale and leaseback measured at the fair value of the retained right of use?","choices":["Yes, always","No, it uses the seller-lessee's own pre-transaction carrying amount, scaled by the proportion retained, not a fresh fair value estimate","Only if the asset is real estate","Only if the buyer-lessor requests it"],"correct_index":1,"explanation":"This is an explicit exam trap, using fair value instead of the scaled prior carrying amount is the classic mistake to avoid."},{"id":"cr-s21-q12","session":21,"topic":"Common mistake, tax rate change timing","question":"Should a tax rate change adjustment be spread prospectively over future periods?","choices":["Yes, always amortised forward","No, it is a one time catch up recognised immediately in the period the rate change is enacted or substantively enacted","Only for deferred tax assets","Only if the rate change exceeds 5 percentage points"],"correct_index":1,"explanation":"The adjustment hits the existing balance immediately as a one-off catch-up, not spread forward, this is explicitly flagged as a common mistake to avoid."},{"id":"cr-s22-q1","session":22,"topic":"Why IFRS15 replaced prior standards","question":"What problem did both IAS11/IAS18 and prior US GAAP revenue rules share, according to the fiche?","choices":["Both were identical and equally detailed","Neither coped well with evolving business models such as bundled contracts","Both required revenue recognition only at contract signing","Neither applied to services"],"correct_index":1,"explanation":"US GAAP was overly detailed and inconsistent across industries, IAS11/18 were vague, but both struggled with evolving business models like bundled phone and software contracts."},{"id":"cr-s22-q2","session":22,"topic":"Core principle","question":"What is the core principle of IFRS15?","choices":["Recognise revenue when cash is received","Recognise revenue when promised goods or services transfer to the customer, at the transaction price","Recognise revenue at contract signing regardless of delivery","Recognise revenue evenly over the contract's calendar life"],"correct_index":1,"explanation":"The core principle explicitly rejects cash receipt as the trigger, revenue is recognised when control of goods or services actually transfers."},{"id":"cr-s22-q3","session":22,"topic":"Step 1 conditions","question":"Which of these is NOT one of the five conditions for a contract to exist under IFRS15?","choices":["The parties are committed to the contract","The contract has commercial substance","The contract must be in writing and notarised","It is probable the entity will collect the consideration due"],"correct_index":2,"explanation":"IFRS15's five conditions are commitment, identifiable rights, identifiable payment terms, commercial substance, and probable collectability, a formal written and notarised contract is not required."},{"id":"cr-s22-q4","session":22,"topic":"Distinct good or service test","question":"A good or service is distinct if","choices":["It is itemised as a separate line on the invoice","The customer can benefit from it on its own AND the promise to transfer it is separately identifiable within the contract","It costs more than 10% of the total contract price","It is delivered in a different calendar year"],"correct_index":1,"explanation":"Distinctness requires both conditions together, standalone benefit to the customer and separate identifiability within the contract, not merely how the invoice is itemised."},{"id":"cr-s22-q5","session":22,"topic":"Variable consideration, expected value vs most likely amount","question":"When should the expected value method be used instead of the most likely amount method?","choices":["When there is a range of possible outcomes, rather than an essentially binary outcome","Always, regardless of the outcome structure","Only for contracts under 12 months","Only when the customer requests it"],"correct_index":0,"explanation":"Expected value (probability weighted sum) suits a graduated range of outcomes, most likely amount suits an effectively binary, all or nothing outcome."},{"id":"cr-s22-q6","session":22,"topic":"Late delivery penalty example","question":"Agreed price 500,000, penalty 20,000 per week late, probabilities 80% on time, 10% one week late, 10% two weeks late, what is the transaction price?","choices":["500,000","494,000","480,000","506,000"],"correct_index":1,"explanation":"Expected penalty = 10%x20,000 + 10%x40,000 = 6,000. Transaction price = 500,000 - 6,000 = 494,000."},{"id":"cr-s22-q7","session":22,"topic":"Allocation of a bundle discount","question":"How is a bundle discount generally allocated across performance obligations?","choices":["Always to the most expensive obligation only","Proportionately across the obligations, unless there is observable evidence it relates to only some of them","Never allocated, discounts reduce cost of sales instead","Always to the first obligation delivered"],"correct_index":1,"explanation":"The general rule is proportional allocation, but observable standalone price evidence pointing to specific obligations (as in the A+B+C example) can override a purely proportional split."},{"id":"cr-s22-q8","session":22,"topic":"Point in time vs over time recognition","question":"Revenue for a performance obligation satisfied over time is recognised","choices":["Entirely at contract signing","According to progress toward complete satisfaction, using output or input methods","Only at the end of the contract","Only if cash has been collected"],"correct_index":1,"explanation":"Over time satisfaction uses a progress measure (output methods like units delivered, or input methods like costs incurred) rather than a single point in time recognition."},{"id":"cr-s22-q9","session":22,"topic":"Contract costs","question":"Costs of obtaining or fulfilling a contract are capitalised as a contract asset when","choices":["They relate directly to the contract, generate resources used to satisfy obligations, and are expected to be recovered","They are incurred at any time during the contract","The customer has already paid in full","The costs exceed 50,000 euros"],"correct_index":0,"explanation":"All three conditions (direct relation, resource-generating, expected recovery) must hold for capitalisation, otherwise the cost is expensed as incurred."},{"id":"cr-s22-q10","session":22,"topic":"Contract asset vs receivable","question":"What distinguishes a contract asset from a receivable?","choices":["A contract asset is always larger","A contract asset's right to consideration is still conditional on something other than the passage of time, a receivable is unconditional except for time","A receivable relates only to services, a contract asset only to goods","There is no meaningful difference"],"correct_index":1,"explanation":"This distinction is explicitly flagged as a common exam trap, conditionality beyond mere timing is what separates a contract asset from an unconditional receivable."},{"id":"cr-s22-q11","session":22,"topic":"Contract liability","question":"A contract liability is recognised when","choices":["The entity has fully performed","The customer has paid before the entity has transferred the related goods or services","The contract is cancelled","Revenue exceeds cost"],"correct_index":1,"explanation":"Cash received ahead of performance creates a contract liability, exactly opposite to a receivable which reflects performance already done."},{"id":"cr-s22-q12","session":22,"topic":"CRM software example","question":"Why are the software licence and consulting services treated as ONE performance obligation in the CRM example?","choices":["Because they are billed together","Because of significant integration and customisation, they are highly interrelated rather than separately identifiable","Because IFRS15 always bundles software with services","Because the customer requested it"],"correct_index":1,"explanation":"Significant integration and customisation means the individual promises are not separately identifiable, so they must be combined into a single performance obligation."},{"id":"cr-s23-q1","session":23,"topic":"Loyalty programme, material right","question":"In the BA miles example, why are the miles treated as a separate performance obligation?","choices":["Because miles always expire","Because they give the customer a material right they would not receive without entering the contract, i.e. future discounted or free travel","Because BA reports them as a marketing expense","Because the ticket price includes tax"],"correct_index":1,"explanation":"A material right conferred only because of this contract must be treated as its own performance obligation and receive an allocated share of the transaction price, not treated as a marketing cost."},{"id":"cr-s23-q2","session":23,"topic":"BA miles allocation","question":"Ticket stand-alone price 400, miles stand-alone price 50, actual transaction price 400. What revenue is allocated to the miles?","choices":["50","44.44 (50/450 times 400)","40","0, all revenue is allocated to the flight"],"correct_index":1,"explanation":"Total stand-alone prices = 450, allocating the actual 400 proportionally gives miles = 50/450 x 400 = 44.44."},{"id":"cr-s23-q3","session":23,"topic":"BA miles, when is the miles revenue recognised?","question":"In the BA miles example, when is the 44.44 of revenue allocated to the miles obligation actually recognised?","choices":["At ticket sale, together with the flight revenue","When the flight is flown, together with the flight revenue","Only when the miles are redeemed or expire, a separate later event from the flight","It is never recognised as revenue"],"correct_index":2,"explanation":"The miles obligation is satisfied only on redemption or expiry, so its allocated revenue is deferred as a contract liability until that separate later event, independent of when the flight itself is flown."},{"id":"cr-s23-q4","session":23,"topic":"Right of return, transaction price","question":"100 products at 100 each, 3 expected returns using the most likely amount method, what is the transaction price?","choices":["10,000","9,700 (97 units expected to be kept, times 100)","9,000","300"],"correct_index":1,"explanation":"Only the consideration expected for units NOT returned counts as transaction price, 97 x 100 = 9,700, the 3 expected returns are excluded."},{"id":"cr-s23-q5","session":23,"topic":"Right of return, refund liability","question":"In the same example, cost per unit 60, what two items are recognised alongside the reduced revenue?","choices":["A tax asset and a tax liability","A refund liability of 300 (3 x 100) and a right to recover returned goods asset of 180 (3 x 60)","Nothing further is recognised","Only a refund liability, no asset for returned goods"],"correct_index":1,"explanation":"Both items are recognised together, a refund liability for expected cash refunds, and an asset representing the entity's expected right to recover the returned goods at their cost."},{"id":"cr-s23-q6","session":23,"topic":"Non-refundable up-front fees","question":"Why is a health club's 100 euro non-refundable joining fee NOT its own performance obligation?","choices":["Because it is non-refundable","Because registering the customer is not itself a good or service transferred to the customer, the customer does not benefit from being registered on its own","Because it is less than 500 euros","Because IFRS15 exempts all joining fees"],"correct_index":1,"explanation":"The registration activity itself provides no standalone benefit to the customer, so the fee is treated as an advance payment for future services, not a separate performance obligation."},{"id":"cr-s23-q7","session":23,"topic":"Non-refundable up-front fees, recognition period","question":"Over what period is the 100 euro joining fee typically recognised as revenue?","choices":["Immediately at signing","Over the expected period of the overall customer relationship, since renewal carries no further fee","Never, it stays a permanent liability","Over exactly 12 months regardless of expected relationship length"],"correct_index":1,"explanation":"Since renewal does not trigger another fee, the fee is recognised over the expected customer relationship period, not confined to the first contract year."},{"id":"cr-s23-q8","session":23,"topic":"Percentage of completion, output method","question":"In the Company A example, the contract is assessed as one third complete, contract price 600,000, what revenue is recognised?","choices":["600,000","200,000 (one third of 600,000)","450,000","250,000, matching costs paid to date"],"correct_index":1,"explanation":"Because progress is stated directly via an output measure (one third complete), revenue = 1/3 x 600,000 = 200,000, not derived from the cost-to-cost input method."},{"id":"cr-s23-q9","session":23,"topic":"Percentage of completion, cost recognition","question":"In the same example, are the 250,000 of costs incurred to date deferred or expensed?","choices":["Deferred until the contract is fully complete","Expensed as incurred, matched against the recognised revenue in the period, which can produce a reported loss","Capitalised as inventory","Reversed against the contract liability"],"correct_index":1,"explanation":"Costs are expensed as incurred, producing here a reported loss for the period (200,000 revenue against 250,000 costs), a direct consequence of the output method not tracking the cost pattern one for one."},{"id":"cr-s23-q10","session":23,"topic":"Common mistake, loyalty programmes","question":"Is it correct to treat a loyalty or miles programme purely as a marketing expense?","choices":["Yes, always","No, if it grants a material right it must be a separate performance obligation with allocated transaction price","Only for airlines","Only if the programme has no expiry date"],"correct_index":1,"explanation":"This is explicitly flagged as a common mistake, a material right triggers separate performance obligation treatment, not a marketing cost characterisation."},{"id":"cr-s23-q11","session":23,"topic":"Common mistake, right of return","question":"Should the full invoiced amount be recognised as revenue when a right of return exists?","choices":["Yes, revenue is always the full invoice amount","No, the transaction price must already reflect expected returns, with the refund liability and returned-goods asset recognised alongside, not replacing, the reduced revenue figure","Yes, but only for retail companies","No, no revenue should be recognised until the return period lapses"],"correct_index":1,"explanation":"The transaction price itself is reduced for expected returns from the start, this is a distinct concept from simply waiting out the return period before recognising anything."},{"id":"cr-s24-q1","session":24,"topic":"Full retrospective method","question":"Under the full retrospective transition method, what happens to prior comparative periods?","choices":["They are left unchanged","They are fully restated as if the new standard had always applied","Only the most recent prior year is restated","They are deleted from the financial statements"],"correct_index":1,"explanation":"Full retrospective restates every comparative period presented, so a 2017 adopter restating would also restate 2016 and 2015 on a like for like new-standard basis."},{"id":"cr-s24-q2","session":24,"topic":"Modified retrospective method","question":"Under the modified retrospective method, how is the cumulative effect of the new standard recognised?","choices":["Spread evenly across all restated prior years","As a single one-time adjustment to the opening balance of retained earnings in the year of adoption, without restating prior periods","It is never recognised","As a reduction to revenue over the following 5 years"],"correct_index":1,"explanation":"Modified retrospective concentrates the entire cumulative effect into one opening balance adjustment in the adoption year, leaving prior years exactly as originally reported."},{"id":"cr-s24-q3","session":24,"topic":"General Dynamics driver","question":"What was the main driver of General Dynamics' negative 684 million dollar adjustment?","choices":["A change in tax rate","Business jet contracts moved from two-milestone revenue recognition to a single point-in-time recognition at final delivery, deferring previously recognised profit","A currency translation adjustment","An increase in warranty provisions"],"correct_index":1,"explanation":"Moving from recognising revenue at two milestones to recognising it all at delivery defers previously-recognised profit, which is exactly what produces a negative cumulative effect adjustment."},{"id":"cr-s24-q4","session":24,"topic":"Ford driver","question":"What was the main driver of Ford's positive 36 million dollar adjustment?","choices":["A decrease in warranty costs","Certain previously deferred vehicle sales (guaranteed resale value, Ford owned entity deliveries) moved to recognition at shipment, accelerating previously deferred revenue","A change in depreciation method","A tax rate increase"],"correct_index":1,"explanation":"Accelerating recognition of previously deferred revenue (recognising at shipment instead of later) pulls forward revenue into the cumulative effect adjustment, producing a positive effect."},{"id":"cr-s24-q5","session":24,"topic":"Sign of the adjustment","question":"Does a negative cumulative effect adjustment mean a company did something wrong?","choices":["Yes, it always indicates an accounting error","No, the sign simply reflects whether the new standard defers revenue that used to be recognised earlier (negative) or accelerates revenue that used to be deferred (positive)","Yes, but only for defense contractors","No, negative adjustments are always larger than positive ones"],"correct_index":1,"explanation":"This is an explicit exam trap, the direction of the adjustment says nothing about earnings quality or whether anything was done incorrectly."},{"id":"cr-s24-q6","session":24,"topic":"Comparing the two companies","question":"Why must an analyst be careful comparing General Dynamics' and Ford's trends around 2017?","choices":["Because they are in different industries","Because General Dynamics restated its historical statements (full retrospective) while Ford did not (modified retrospective), so 2016 means a different accounting basis for each","Because they report in different currencies only","Because one company is larger than the other"],"correct_index":1,"explanation":"Mixing a restated and a non-restated historical basis in the same year over year comparison risks drawing spurious conclusions about underlying trends."},{"id":"cr-s24-q7","session":24,"topic":"Ford's unrelated adjustment","question":"What was the 530 million dollar ASU2016-09 adjustment in Ford's reconciliation?","choices":["Part of the ASC606 revenue standard effect","A separate, unrelated stock compensation standard adopted on the same date, not part of the revenue standard's effect","An error later corrected","The full cumulative effect of ASC606"],"correct_index":1,"explanation":"Only the 36 million dollar line is attributable to ASC606, the 530 million is a distinct, unrelated stock-compensation standard bundled into the same adoption-date balance sheet reconciliation."},{"id":"cr-s24-q8","session":24,"topic":"Revenue recognition profile","question":"According to General Dynamics' own Note B, what share of 2017 revenue was recognised over time?","choices":["2
