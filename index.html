0: REM consistent. p > 0.05 → keep REM; p < 0.10 → reject, FEM."},{"id":"dd-gr-1","dataset":"GR","session":5,"topic":"Hausman test","question":"Grunfeld, value and capital: phtest(mod3, mod4) gives χ² = 2.3304, df = 2, p = 0.3119. Why 2 df, and which model?","choices":["Two regressors; REM","Two regressors; FEM","Two models compared; REM","Two models compared; FEM"],"correct_index":0,"explanation":"df = number of slope coefficients compared (value, capital). p > 0.05, H0 kept, REM (more efficient)."},{"id":"dd-gr-2","dataset":"GR","session":5,"topic":"REM output","question":"plm(inv ~ value, data = GR, model = \"random\"). Share of unexplained variance due to the individual component?","choices":["≈ 44.4%","≈ 55.6%","≈ 16.6%","Not shown, only FEM reports it"],"correct_index":0,"explanation":"Idiosyncratic ≈ 55.6%, individual ≈ 44.4%. Only the REM reports this decomposition."},{"id":"dd-gr-3","dataset":"GR","session":5,"topic":"FEM output","question":"plm(inv ~ value, data = GR, model = \"within\") shows no intercept. How do you get each firm's intercept?","choices":["fixef(mod)","coef(mod)[1]","summary(mod)$intercept","phtest(mod)"],"correct_index":0,"explanation":"The within transformation removes the αi. fixef() recovers one intercept per firm."},{"id":"dd-gr-4","dataset":"GR","session":5,"topic":"FEM vs REM estimate","question":"FEM gives β(value) ≈ 0.19, REM gives ≈ 0.166. Which statement is right?","choices":["Close estimates, the Hausman test decides which to keep","REM is always wrong since it differs from FEM","FEM is more efficient since its β is larger","The gap proves μi is correlated with value"],"correct_index":0,"explanation":"Estimates are often close. Only the Hausman test formally decides."},{"id":"dd-cl-1","dataset":"CL","session":7,"topic":"Odds ratio over 10 units","question":"model1 <- glm(HC ~ AGE + VC, data = CL, family = binomial). Effect of a driver 10 years older on the odds of a high claim, VC fixed?","choices":["≈ −32%","≈ −39%","≈ −3.8%","≈ −32% on the probability"],"correct_index":0,"explanation":"e^(10 × −0.0389) = e^−0.389 = 0.678, so −32.2% on the ODDS. −39% multiplies −3.89% by 10."},{"id":"dd-cl-2","dataset":"CL","session":7,"topic":"predict() output","question":"predict(model1, data.frame(AGE = 50, VC = \"B\")) without type=. What does R return?","choices":["≈ −1.474 (log-odds)","≈ 0.186 (probability)","≈ 0.229 (odds)","≈ 0.814 (1 − probability)"],"correct_index":0,"explanation":"Default glm predictions are on the link scale (log-odds). type = \"response\" gives 0.1863, exp() gives the odds 0.229."},{"id":"dd-cl-3","dataset":"CL","session":7,"topic":"Prediction","question":"Predicted probability of a high claim for a 30-year-old driver, VC = \"B\"?","choices":["≈ 0.33","≈ 0.19","≈ 0.50","≈ 0.67"],"correct_index":0,"explanation":"Log-odds = −1.474 + 20 × 0.0389 = −0.696, odds = 0.499, p = 0.499/1.499 = 0.333. 0.50 is the odds, not the probability."},{"id":"dd-cl-4","dataset":"CL","session":7,"topic":"Deviances","question":"summary(model1): residual deviance 159.84 on 196 df, global test χ² = 77.344. Null deviance?","choices":["≈ 237.2 on 199 df","≈ 159.8 on 199 df","≈ 82.5 on 199 df","≈ 229.0 on 198 df"],"correct_index":0,"explanation":"Null = 159.84 + 77.344 = 237.18, df = n − 1 = 199. 229.04 is the AGE-only model."},{"id":"dd-cl-5","dataset":"CL","session":7,"topic":"AIC","question":"model2 <- glm(HC ~ AGE, ...). Its residual deviance is 159.84 + 69.202. AIC of model2?","choices":["≈ 233.0","≈ 229.0","≈ 231.0","≈ 167.8"],"correct_index":0,"explanation":"RES.DEV = 229.04, AIC = 229.04 + 2 × (1 + 1) = 233.04. model1's AIC (167.84) is lower, model1 is better."},{"id":"dd-cl-6","dataset":"CL","session":7,"topic":"Global test, AGE alone","question":"anova(model0, model2, test = \"Chisq\") (null vs AGE only). Result?","choices":["χ² ≈ 8.14 on 1 df, significant at 1%","χ² ≈ 8.14 on 1 df, significant at 5% only","χ² ≈ 69.2 on 2 df, significant","χ² ≈ 77.3 on 1 df, significant"],"correct_index":0,"explanation":"237.18 − 229.04 = 8.14 > 6.63 (1% critical, 1 df). Alone, AGE is significant at 1%, while in model1 its Z-test is only significant at 5%."},{"id":"dd-cl-7","dataset":"CL","session":7,"topic":"Z-test","question":"In model1, AGE (−0.0389) is significant at 5% but not at 1%. Which SE is compatible?","choices":["≈ 0.017","≈ 0.010","≈ 0.025","≈ 0.039"],"correct_index":0,"explanation":"Need 1.96 < 0.0389/SE < 2.576, i.e. 0.0151 < SE < 0.0198. 0.010 gives z = 3.9, 0.025 gives z = 1.56."},{"id":"dd-cl-8","dataset":"CL","session":7,"topic":"Confusion matrix","question":"At threshold 0.5, 128 true 'no' and 40 true 'yes' out of 200. Error rate?","choices":["16%","84%","20%","36%"],"correct_index":0,"explanation":"168 correct, 32 wrong: 32/200 = 16%."},{"id":"dd-cl-9","dataset":"CL","session":7,"topic":"Threshold","question":"Same claim (AGE = 50, VC = \"B\", p̂ = 0.186). With a threshold of 0.15 instead of 0.5, ŷ = ?","choices":["1","0","0.186","Undefined, the threshold must be 0.5"],"correct_index":0,"explanation":"0.186 ≥ 0.15 so ŷ = 1. At 0.5, ŷ = 0. The slides allow other thresholds."},{"id":"dd-cl-10","dataset":"CL","session":7,"topic":"Dummy odds ratio","question":"VCB = 1.1268, e^1.1268 = 3.086. Interpretation?","choices":["Odds of a high claim ≈ 3.09 × those of VC = A, same age","Probability of a high claim ≈ 3.09 × that of VC = A","Odds ≈ 3.09 × those of VC = C, same age","Odds ≈ +3.09% compared with VC = A, same age"],"correct_index":0,"explanation":"Each VC dummy compares with the reference A, on the odds scale."},{"id":"dd-cl-11","dataset":"CL","session":7,"topic":"Joint test in R","question":"How do you test whether VC matters as a whole, given AGE?","choices":["anova(model2, model1, test = \"Chisq\"), 2 df","The two Z-tests on VCB and VCC","anova(model0, model1, test = \"Chisq\"), 3 df","Compare the AIC of model1 with model0"],"correct_index":0,"explanation":"Partial χ² test (LRT) between nested models: χ² = 69.2 on 2 df. model0 vs model1 is the global test."},{"id":"dd-st-1","dataset":"STUD","session":8,"topic":"Odds ratio","question":"mod1 <- multinom(program ~ score + ses, data = ...). Effect of +10 score points on the odds of academic vs general?","choices":["≈ +78%","≈ +58%","≈ +6%","≈ +78% on P(academic)"],"correct_index":0,"explanation":"e^(10 × 0.0579) = e^0.579 = 1.784. +57.9% adds 10 × 5.79%."},{"id":"dd-st-2","dataset":"STUD","session":8,"topic":"Contrast between two equations","question":"For +1 score point, how do the odds of vocation vs academic change?","choices":["≈ −10.7%","≈ −5.4%","≈ +0.2%","Needs a refit with academic as reference"],"correct_index":0,"explanation":"log(pv/pa) = log(pv/pg) − log(pa/pg): −0.0557 − 0.0579 = −0.1136, e^−0.1136 = 0.893. A refit with relevel() gives the same number."},{"id":"dd-st-3","dataset":"STUD","session":8,"topic":"Predicted probabilities","question":"predict(mod1, data.frame(score = 50, ses = \"middle\"), type = \"probs\") gives general 0.2334, academic 0.4159, vocation 0.3507. Odds of academic vs general?","choices":["≈ 1.78","≈ 0.71","≈ 0.56","≈ 1.19"],"correct_index":0,"explanation":"0.4159/0.2334 = 1.78. 0.71 is p/(1−p) for academic, 1.19 compares academic with vocation."},{"id":"dd-st-4","dataset":"STUD","session":8,"topic":"Model size","question":"How many slope and intercept estimates does summary(mod1) show in total?","choices":["8","12","4","6"],"correct_index":0,"explanation":"k − 1 = 2 equations, each with intercept, score, sesmiddle, seshigh: 2 × 4 = 8."},{"id":"dd-st-5","dataset":"STUD","session":8,"topic":"Dummy interpretation","question":"seshigh = 1.1628 in the academic equation. Interpretation?","choices":["Odds of academic vs general ≈ 3.2 × higher for high vs low ses","Odds of academic vs general ≈ 3.2 × higher for high vs middle ses","P(academic) ≈ 3.2 × higher for high vs low ses","Odds of academic ≈ +116% for high vs low ses"],"correct_index":0,"explanation":"e^1.1628 = 3.20. The reference for ses is low, the reference for program is general."},{"id":"dd-st-6","dataset":"STUD","session":8,"topic":"Dummy interpretation","question":"sesmiddle = 0.8246 in the vocation equation. % change in odds of vocation vs general, middle vs low?","choices":["≈ +128%","≈ +82%","≈ +228%","≈ −56%"],"correct_index":0,"explanation":"e^0.8246 = 2.281, so +128.1%. +228% confuses the multiplier with the change."},{"id":"dd-st-7","dataset":"STUD","session":8,"topic":"p-values in R","question":"multinom() prints no p-values. How do you get them?","choices":["z <- coef/SE, then 2*(1 - pnorm(abs(z)))","z <- coef/SE, then 1 - pnorm(z)","anova(mod1, test = \"Chisq\")","summary(mod1)$p.values"],"correct_index":0,"explanation":"Two-sided normal p-value. 1 − pnorm(z) is one-sided and wrong for negative z. Group tests are out of scope for multinomial."}]};

const FLASHCARDS = {"da":[{"id":"da-s1-f1","session":1,"front":"What are the three purposes a regression analysis can serve? (knowing / explaining / forecasting)","back":"Knowing: do x1,...,xp have an effect on Y, and what does it look like? Explaining: can Y's variability be (partly) explained by the x's? Forecasting: how do you predict/estimate Y for units with specific x values?"},{"id":"da-s1-f2","session":1,"front":"Theoretical equation of the linear regression model","back":"Y = β0 + β1x1 + ... + βpxp + ε. Y is random; the x's are treated as fixed/known; β0,...,βp are unknown parameters; ε is the random error absorbing everything else affecting Y."},{"id":"da-s1-f3","session":1,"front":"List the five assumptions of the linear regression model","back":"1) E(εi)=0 (zero-mean error) 2) Var(εi)=σ² constant (homoskedasticity) 3) Cov(εk,εi)=0 for k≠i (uncorrelated errors) 4) εi~N(0,σ²) (normal errors) 5) No perfect multicollinearity among the x's."},{"id":"da-s1-f4","session":1,"front":"What does assumption 1 (zero-mean error) imply about E(Yi)?","back":"E(Yi) = β0 + β1xi1 + ... + βpxip — on average, Y sits exactly on the hyperplane (or line if p=1) defined by the x's."},{"id":"da-s1-f5","session":1,"front":"Why is 'uncorrelated errors' (assumption 3) weaker than 'independent errors'?","back":"Uncorrelated only rules out linear association between any two errors; it does not require full statistical independence."},{"id":"da-s1-f6","session":1,"front":"What does 'linear' mean in 'linear regression model'?","back":"Linear with respect to the parameters βj, not necessarily with respect to the x's — the same theory covers models with x² or log(x) terms."},{"id":"da-s1-f7","session":1,"front":"Least squares objective (what is minimized, and over what)","back":"Minimize Σi=1..n [yi − (β0+β1xi1+...+βpxip)]² over β0,...,βp. The minimizing values b0,...,bp are the least squares estimates."},{"id":"da-s1-f8","session":1,"front":"What is y-hat (the estimated equation)?","back":"y-hat = b0 + b1x1 + ... + bpxp — the fitted/predicted value; since E(Y) is linear in the x's, y-hat estimates the mean of Y at given x values, not an individual Y."},{"id":"da-s1-f9","session":1,"front":"Marginal effect of xj (definition and formula)","back":"bj = the estimated average change in Y when xj increases by one unit, all other x's held constant. Derivation: y-hat_incr − y-hat = bj, since all other terms cancel in the subtraction."},{"id":"da-s1-f10","session":1,"front":"Define spurious effect (effet fallacieux)","back":"An apparent effect of xj on Y that is actually caused by one or more omitted variables correlated with both xj and Y — those hidden variables are what's really driving the observed relationship."},{"id":"da-s1-f11","session":1,"front":"Confidence interval formula for βj","back":"(bj − t^(n−p−1)_(α/2)·sbj, bj + t^(n−p−1)_(α/2)·sbj). Start from point estimate bj, add/subtract margin of error = Student's t quantile × standard error."},{"id":"da-s1-f12","session":1,"front":"Hypothesis test on βj: H0, test statistic, decision rule","back":"H0: βj=0, H1: βj≠0. toss = bj/sbj. Reject H0 at level α if |toss| ≥ t^(n−p−1)_(α/2), equivalently if p-value = 2P(T≥|toss|) < α."},{"id":"da-s1-f13","session":1,"front":"What does rejecting H0: βj=0 tell you?","back":"Evidence that xj really does affect the mean of Y, other variables held constant — xj is then called 'significant'."},{"id":"da-s1-f14","session":1,"front":"Two different prediction questions in regression, and how their point predictions compare","back":"1) Predict Y for one specific unit at given x. 2) Predict the mean of Y for all units sharing those x values. Both use the exact same point-prediction formula y-hat0, but the single-unit prediction has a wider interval (it also carries ε's uncertainty)."},{"id":"da-s1-f15","session":1,"front":"What is extrapolation and why is it risky?","back":"Predicting y-hat0 for x values outside the range observed in the sample. It silently assumes, with no evidence, that the fitted relationship continues to hold there — can produce absurd predictions."},{"id":"da-s1-f16","session":1,"front":"Deviance decomposition (Total = Residual + Explained)","back":"Σ(yi−mean(y))² = Σ(yi−y-hat_i)² + Σ(y-hat_i−mean(y))². Total Deviance depends only on observed y's; Residual Deviance = what the model fails to explain; Explained Deviance = what the x's actually explain."},{"id":"da-s1-f17","session":1,"front":"R² formula and range","back":"R² = Explained Deviance / Total Deviance, in [0,1]. R²=1 when the model explains 100% of variability; R²=0 when y-hat_i = mean(y) for everyone (x's add nothing)."},{"id":"da-s1-f18","session":1,"front":"Why does adjusted R² exist, and its formula","back":"Because raw R² never decreases when adding a variable (even a useless one), so it can't fairly compare models with different p. Adjusted R² = 1 − (1−R²)·(n−1)/(n−p−1), which penalizes model size p."},{"id":"da-s1-f19","session":1,"front":"When should you use the partial F-test vs adjusted R² to compare two models?","back":"Nested models → partial F-test (inferential, correct comparison). Non-nested models → adjusted R² only (descriptive comparison), since the partial F-test doesn't apply."},{"id":"da-s2-f1","session":2,"front":"Dummy variable coding convention","back":"1 = the characteristic is present, 0 = it is absent. A dummy simply splits the population into the group coded 0 and the group coded 1."},{"id":"da-s2-f2","session":2,"front":"What does a dummy variable's coefficient estimate?","back":"The difference in the average of Y between the group coded 1 and the group coded 0, all other explanatory variables held constant ('controlling for the other variables')."},{"id":"da-s2-f3","session":2,"front":"k−1 dummy rule","back":"A categorical variable with k>2 categories needs k−1 dummy variables, one per category except one. The excluded category becomes the reference category; every dummy coefficient is a comparison against it."},{"id":"da-s2-f4","session":2,"front":"Why can't you code a k>2 category variable as 0,1,2,...?","back":"It would impose an artificial numeric order and spacing between categories that has no real meaning (e.g. 'zone B minus zone A' isn't inherently worth more than 'zone C minus zone B')."},{"id":"da-s2-f5","session":2,"front":"With zones A (reference), B, C: what does bB estimate? What about bC?","back":"bB = estimated price gap between zone B and zone A, age held constant. bC = same idea, zone C vs zone A. Neither gives the B-vs-C comparison directly."},{"id":"da-s2-f6","session":2,"front":"How do you get the zone-C-vs-zone-B comparison if A is the reference?","back":"Compute y-hatC − y-hatB directly (this equals bC − bB); its significance needs its own test — it can't be read off a single t-test on bB or bC."},{"id":"da-s2-f7","session":2,"front":"How is a dummy variable's coefficient tested for significance?","back":"Exactly the same as any quantitative variable's coefficient — same confidence interval formula, same t-test (H0: βj=0)."},{"id":"da-s2-f8","session":2,"front":"Nested models definition (reduced vs complete)","back":"RED.M has q variables x1,...,xq. COMP.M has p>q variables — the same q plus p−q extra ones. 'Complete' and 'reduced' are relative labels for one specific comparison, not permanent model names."},{"id":"da-s2-f9","session":2,"front":"Partial F-test: hypotheses and formula","back":"H0: βq+1=...=βp=0. F = [(RES.DEV.RED−RES.DEV.COMP)/(p−q)] / [RES.DEV.COMP/(n−p−1)]. Under H0, F ~ Fisher(p−q, n−p−1)."},{"id":"da-s2-f10","session":2,"front":"When must you use the partial F-test instead of separate t-tests?","back":"When testing the joint significance of a group of variables together (e.g. all k−1 dummies of one categorical variable) — separate t-tests on each dummy don't answer this joint question."},{"id":"da-s2-f11","session":2,"front":"Global F-test: hypotheses and relation to the partial F-test","back":"H0: β1=...=βp=0 (the whole model has no effect). It's the partial F-test with the null model (only the intercept) as the reduced model: F = (EXP.DEV./p) / (RES.DEV./(n−p−1))."},{"id":"da-s2-f12","session":2,"front":"Why does the null model's residual deviance equal the total deviance?","back":"The null model has no explanatory variables, so its explained deviance is 0 — meaning all of its residual deviance is exactly the total deviance."},{"id":"da-s2-f13","session":2,"front":"What stays fixed across different models fit on the same sample/Y?","back":"Total deviance — it depends only on the observed yi values, never on which variables are included. Only residual and explained deviance change between models."},{"id":"da-s2-f14","session":2,"front":"What does 'not rejecting H0' mean in the global F-test?","back":"Insufficient evidence, at this α, that the variables are jointly significant — NOT proof that the model has zero effect."},{"id":"da-s2-f15","session":2,"front":"Partial F-test vs adjusted R² for model comparison","back":"Nested models → partial F-test is the correct inferential comparison. Non-nested models → the partial F-test is inapplicable; adjusted R² is the only (descriptive) option."},{"id":"da-s3-f1","session":3,"front":"Two hidden assumptions of the base linear-additive model","back":"Linearity: each xj's effect is constant regardless of its own starting value. Additivity: each variable's effect doesn't depend on the level of any other variable."},{"id":"da-s3-f2","session":3,"front":"Which tool fixes non-linearity, and which fixes non-additivity?","back":"Non-linearity → variable transformation (e.g. log(x), x²). Non-additivity → interaction term (a product of two variables)."},{"id":"da-s3-f3","session":3,"front":"Three practical rules for using variable transformations","back":"1) log(x) requires strictly positive x. 2) If you add x², keep the lower-order term x too. 3) Whether to transform is decided by context (does an accelerating/decelerating effect make sense?) plus the sample data (significance tests, adjusted R² for non-nested specs)."},{"id":"da-s3-f4","session":3,"front":"Derivative vs finite difference — when to use each","back":"Derivative (local rate) tells you the instantaneous marginal effect at one exact point of x — never read it as 'the change for one full extra unit.' Finite difference gives the real/total change in y-hat between two specific x values — use it for an actual comparison."},{"id":"da-s3-f5","session":3,"front":"Log(x) 1% shortcut formula and its limit","back":"y-hat_incr − y-hat ≈ 0.01·b1 for a 1% increase in x (model y-hat=b0+b1·log(x)). This is a first-order approximation only — not exact for large percentage jumps."},{"id":"da-s3-f6","session":3,"front":"Two equivalent readings of b1 in a model with log(x)","back":"1) A 1% rise in x → mean(Y) changes by about 0.01·b1. 2) b1 itself = the exact estimated change in mean(Y) for a one-unit increase in log(x)."},{"id":"da-s3-f7","session":3,"front":"Interaction term — definition and equation","back":"The product x1·x2 of two explanatory variables, added to a model that already has x1 and x2 as main effects, so the effect of one can depend on the level of the other. Y = β0+β1x1+β2x2+βint·x1x2+ε."},{"id":"da-s3-f8","session":3,"front":"Quantitative × dummy interaction: the two resulting lines","back":"x2=0: y-hat=b0+b1x1. x2=1: y-hat=(b0+b2)+(b1+bint)x1. Two lines with BOTH a different intercept AND a different slope — not just parallel shifts."},{"id":"da-s3-f9","session":3,"front":"What if the interaction coefficient bint is not significant?","back":"The model effectively collapses to two parallel lines (same slope, different intercepts) — always check bint's significance before concluding the effect genuinely differs by group."},{"id":"da-s3-f10","session":3,"front":"Interaction between a quantitative variable and a k-category variable","back":"Needs one product term per non-reference dummy (e.g. x1xB and x1xC for k=3). Produces k distinct lines, each with its own intercept AND its own slope on x1."},{"id":"da-s3-f11","session":3,"front":"Interaction between two quantitative variables — rewritten form","back":"y-hat = b0 + x1(b1+bint·x2) + b2x2. The effective slope on x1 is itself a function of x2 (and symmetrically, the effective slope on x2 depends on x1) — no single fixed slope exists anymore."},{"id":"da-s3-f12","session":3,"front":"Testing one interaction term vs several at once","back":"One interaction term → simple t-test on bint (H0: βint=0). Several interaction terms together (e.g. a whole categorical interaction, or a variable appearing in multiple forms) → partial F-test for joint significance."},{"id":"da-s3-f13","session":3,"front":"Why can't associative language ('increases/decreases') be read as causal in this session's examples?","back":"Finite-difference readings from a fitted regression model are statistical/associative statements, not causal claims — this warning applies throughout Session 3's worked examples."},{"id":"da-s3-f14","session":3,"front":"A variable appears as a main effect, in an interaction, and in a squared term — how do you judge if it matters overall?","back":"Test ALL its terms jointly with one partial F-test. A non-significant t-test on just one form (say the main effect alone) says nothing about the variable's overall relevance once its other forms are accounted for."},{"id":"da-s4-f1","session":4,"front":"Define multicollinearity","back":"The presence of a (linear) relationship among a model's explanatory variables — i.e. overlap in the informational content different x's carry about Y. Some degree of it is always present in real data."},{"id":"da-s4-f2","session":4,"front":"The real exam question about multicollinearity","back":"Not 'is there multicollinearity?' (there always is some) but 'is the level of multicollinearity high enough to cause a real problem?'"},{"id":"da-s4-f3","session":4,"front":"Main effect of high multicollinearity on hypothesis testing","back":"Standard errors of the involved coefficients inflate → |t| shrinks → p-values rise → higher chance of failing to reject H0: βj=0, i.e. wrongly concluding a variable isn't significant."},{"id":"da-s4-f4","session":4,"front":"Extreme multicollinearity signature","back":"None of the correlated variables is individually significant, yet the model overall is globally significant (high R², significant global F-test) — real total information, but no single variable's marginal contribution stands out."},{"id":"da-s4-f5","session":4,"front":"VIF formula and what it's computed from","back":"VIFj = 1/(1−Rj²), where Rj² comes from an auxiliary regression of xj on all the OTHER explanatory variables — this regression never uses Y at all."},{"id":"da-s4-f6","session":4,"front":"VIF threshold and dummy-variable equivalent","back":"VIF > 10 is the conventional (somewhat arbitrary) threshold for 'high' multicollinearity. For dummy variables, use the Generalized VIF (GVIF) instead — same interpretation, different technical definition."},{"id":"da-s4-f7","session":4,"front":"Three remedies for high multicollinearity","back":"1) Remove one of the correlated variables (risk: losing real information). 2) Increase sample size n (reduces standard errors generally). 3) Use factor analysis or PCA to combine the overlapping variables."},{"id":"da-s4-f8","session":4,"front":"What do the two 'residuals vs fitted values' plots check?","back":"Zero-mean/linearity (no systematic pattern expected) and homoskedasticity (constant spread expected — a funnel shape means heteroskedasticity)."},{"id":"da-s4-f9","session":4,"front":"Reading a residuals-vs-fitted plot: parabola shape vs funnel shape","back":"A systematic parabola-like curve → non-linearity. A widening/narrowing 'funnel' → heteroskedasticity. Different shapes, different violations, different fixes."},{"id":"da-s4-f10","session":4,"front":"What does a Q-Q plot check, and how do you read it?","back":"Checks normality of the (standardized) residuals. Points aligned on a straight line → normality plausible. Curvature/systematic deviation → non-normal errors."},{"id":"da-s4-f11","session":4,"front":"Log-lin vs log-log model — what's transformed","back":"Log-lin: log(Y) = β0+β1x1+ε (only Y is logged). Log-log: log(Y)=β0+β1log(x1)+ε (both Y and x1 are logged) — often used to restore linearity that log-lin alone would break."},{"id":"da-s4-f12","session":4,"front":"Once Y is log-transformed, how do you read a coefficient?","back":"As an approximate percentage effect on Y (b1% for a small % change in x1 in log-log; b1 in log(Y) per unit of x1 in log-lin) — no longer as raw units of Y."},{"id":"da-s4-f13","session":4,"front":"Outlier (regression outlier) — definition and rule of thumb","back":"An observation with a large residual — its predicted value is far from its actual observed Y. Rule of thumb: standardized residual > 3 in absolute value (sometimes 2)."},{"id":"da-s4-f14","session":4,"front":"Leverage point — definition and rule of thumb","back":"An observation with unusual values on the explanatory variables (not on Y). Rule of thumb: leverage exceeds (2p+1)/n or (3p+1)/n."},{"id":"da-s4-f15","session":4,"front":"Influential observation — definition, and the two measures used","back":"An observation whose removal would substantially change the regression results (typically the coefficients). dfbeta (per coefficient, threshold ≥2/√n) and Cook's distance (one combined value per observation, threshold ≥1, sometimes ≥0.5) formalize this."},{"id":"da-s4-f16","session":4,"front":"Is every outlier or leverage point automatically influential?","back":"No — influence must be checked directly with dfbeta or Cook's distance; an outlier or leverage point is not automatically influential."},{"id":"da-s5-f1","session":5,"front":"Define panel (longitudinal) data","back":"Data with both a cross-sectional dimension (n units) and a time dimension (T instants) at once — each unit observed repeatedly over time, giving n·T observations per variable."},{"id":"da-s5-f2","session":5,"front":"What does 'balanced panel' mean?","back":"Every unit is observed at every one of the T time instants, with no missing values — so a balanced panel with n units and T instants always has exactly n×T observations per variable."},{"id":"da-s5-f3","session":5,"front":"Why doesn't classic regression work well on panel data?","back":"Repeated observations of the same unit over time are generally not independent, violating the 'uncorrelated errors' assumption from Session 1."},{"id":"da-s5-f4","session":5,"front":"Pooling Model — definition and its core flaw","back":"Treats all n·T panel observations as if they were completely unrelated units, ignoring which observations belong to the same unit; estimated by plain OLS. Reintroduces the same omitted-variable/spurious-correlation risk as an ordinary cross-section."},{"id":"da-s5-f5","session":5,"front":"Fixed Effects Model (FEM) — error decomposition and interpretation of μi","back":"uit = μi + εit, where μi is a fixed/deterministic, unit-specific effect (unobserved heterogeneity, constant over time) and εit behaves like an ordinary regression error."},{"id":"da-s5-f6","session":5,"front":"FEM equivalent form with unit-specific intercepts","back":"Yit = αi + βxit + εit, with αi := α + μi — each unit gets its own intercept ('line of departure'), but all units share the same slope β."},{"id":"da-s5-f7","session":5,"front":"Random Effects Model (REM) — what's different from FEM","back":"Same error split uit=μi+εit, but μi is now random (not a fixed parameter) and must be uncorrelated with the x's. Only α and β are actually estimated — not n separate μi values."},{"id":"da-s5-f8","session":5,"front":"When is REM preferable to FEM, and why?","back":"When REM's validity assumption holds (μi uncorrelated with the x's) — REM then estimates far fewer parameters (only α, β vs α, β plus n μi's for FEM), making it more efficient."},{"id":"da-s5-f9","session":5,"front":"What happens to REM estimates if μi IS correlated with the x's?","back":"REM's estimates become inconsistent (unreliable) — this is exactly the condition the Hausman test checks."},{"id":"da-s5-f10","session":5,"front":"Individual-specific error μi vs idiosyncratic error εit","back":"μi: time-constant, persistent characteristics unique to each unit (e.g. innate worker skill, firm culture). εit: random fluctuations varying by both unit and time (short-term shocks, measurement noise)."},{"id":"da-s5-f11","session":5,"front":"How to read a large individual-error variance share vs a large idiosyncratic-error variance share","back":"Individual variance dominates → most unexplained variability comes from persistent between-unit differences (may hint at a missing time-constant variable, but coefficients stay reliable). Idiosyncratic variance dominates → most variability comes from within-unit fluctuations over time."},{"id":"da-s5-f12","session":5,"front":"Hausman test — hypotheses and decision rule","back":"H0: REM's assumptions hold (consistent and more efficient). H1: REM's assumptions fail (inconsistent). Reject H0 (p-value ≤ α) → use FEM. Don't reject H0 (p-value > α) → use REM."},{"id":"da-s5-f13","session":5,"front":"Common Hausman-test mistake to avoid","back":"Rejecting H0 means REM's hypotheses FAIL — you should switch to FEM, not 'keep REM.' Easy to invert by mistake."},{"id":"da-s5-f14","session":5,"front":"R syntax: FEM, REM, and the Hausman test","back":"FEM: plm(Y ~ X, data=..., model='within'). REM: plm(Y ~ X, data=..., model='random'). Hausman test: phtest(mod_fem, mod_rem) — order of the two models doesn't matter."},{"id":"da-s5-f15","session":5,"front":"Predicting for a specific unit in a FEM — which intercept to use","back":"Always use that unit's own fixef() intercept — never a generic or averaged intercept across units. fixef() gives one intercept per unit; the slope β stays common to all."},{"id":"da-s5-f16","session":5,"front":"Extending FEM/REM to multiple explanatory variables","back":"Works exactly like moving from simple to multiple regression — just add more xjit terms, each with its own βj. μi/εit play the same roles; transformations and interactions can be added the same way as in ordinary multiple regression."},{"id":"da-s6-f1","session":6,"front":"Define the odds of an event E with probability p.","back":"ODDS = p / (1-p), the ratio between the probability the event occurs and the probability it does not."},{"id":"da-s6-f2","session":6,"front":"What range does p cover, and what range does ODDS cover?","back":"p ranges between 0 and 1. ODDS ranges between 0 and +infinity. There is a one-to-one increasing correspondence between them: p = ODDS/(1+ODDS)."},{"id":"da-s6-f3","session":6,"front":"What is the quick rule linking ODDS to whether p is above or below 0.5?","back":"ODDS > 1 means p > 0.5. ODDS < 1 means p < 0.5. ODDS = 1 means p = 0.5."},{"id":"da-s6-f4","session":6,"front":"What happens to log(ODDS) as p approaches 0, and as p approaches 1?","back":"As p -> 0, log(ODDS) -> minus infinity. As p -> 1, log(ODDS) -> plus infinity. log(ODDS) is a strictly increasing function of p."},{"id":"da-s6-f5","session":6,"front":"In the logistic regression model, what type of variable is Y, and what does p represent for it?","back":"Y is a dichotomous (Bernoulli/dummy) variable: Y=1 with probability p, Y=0 with probability 1-p. p also equals the mean E(Y)."},{"id":"da-s6-f6","session":6,"front":"Write the standard (log-odds) formulation of the logit model equation.","back":"log(p/(1-p)) = beta0 + beta1x1 + ... + betapxp, i.e. the log-odds of Y=1 as a linear function of the explanatory variables."},{"id":"da-s6-f7","session":6,"front":"How are the logit model's coefficients estimated?","back":"By Maximum Likelihood Estimation (MLE), computed by R; the estimates are denoted b0, b1, ..., bp."},{"id":"da-s6-f8","session":6,"front":"For a quantitative xj with estimated coefficient bj, what does e^bj represent?","back":"The estimated odds ratio: the ratio of the odds of Y=1 for xj increased by one unit versus xj not increased, other variables held constant."},{"id":"da-s6-f9","session":6,"front":"For a dichotomous xj with estimated coefficient bj, what does e^bj represent?","back":"The estimated odds ratio between the odds of Y=1 when xj=1 and the odds of Y=1 when xj=0, other variables held constant."},{"id":"da-s6-f10","session":6,"front":"If bj > 0, what happens to the estimated odds and probability of Y=1?","back":"e^bj > 1, so the estimated odds increase, and therefore the estimated probability of the event also increases."},{"id":"da-s6-f11","session":6,"front":"If bj < 0, what happens to the estimated odds and probability of Y=1?","back":"e^bj < 1, so the estimated odds decrease, and therefore the estimated probability of the event also decreases."},{"id":"da-s6-f12","session":6,"front":"In the awareness example, b1(age)=0.2 so e^0.2=1.2214. State the interpretation.","back":"Holding x2 (gender) fixed, the estimated odds of awareness increase by 22.14% for each additional year of age (multiplied by 1.2214)."},{"id":"da-s6-f13","session":6,"front":"In the awareness example, b2(female)=-0.8 so e^-0.8=0.4493. State the interpretation.","back":"Holding age fixed, the estimated odds of awareness for females are 44.93% of the odds for males (i.e. lower)."},{"id":"da-s6-f14","session":6,"front":"What is H0 and H1 for the test on an individual logit coefficient betaj?","back":"H0: betaj = 0 (no effect in the population). H1: betaj is not equal to 0."},{"id":"da-s6-f15","session":6,"front":"How is the test statistic zoss computed for an individual coefficient, and what does it follow under H0?","back":"zoss = bj / SE(bj). Under H0 it follows approximately a standard normal distribution."},{"id":"da-s6-f16","session":6,"front":"What is the decision rule for rejecting H0: betaj=0 at significance level alpha?","back":"Reject H0 if |zoss| > z(alpha/2), or equivalently if p-value = 2*P(Z > |zoss|) < alpha."},{"id":"da-s6-f17","session":6,"front":"Why is it wrong to say e^bj tells you exactly how much the probability changes?","back":"e^bj is a multiplicative factor on the ODDS, not the probability. It tells you the direction of the probability change, but generally not its exact magnitude."},{"id":"da-s6-f18","session":6,"front":"What must you always state when interpreting a logit coefficient bj?","back":"That the interpretation holds with all other explanatory variables held constant (ceteris paribus), exactly as in linear regression."},{"id":"da-s7-f1","session":7,"front":"Why is a chi-square (LRT) test needed beyond the Session 6 individual Z-test?","back":"The Z-test only tests one coefficient at a time. To test whether a group of variables, or the whole model, is jointly significant, a chi-square based test is needed instead."},{"id":"da-s7-f2","session":7,"front":"What is the reduced model M_red and complete model M_compl in the partial chi-square test?","back":"M_red contains only x1,...,xq. M_compl contains all variables x1,...,xq,xq+1,...,xp. The test asks whether the extra variables xq+1,...,xp are jointly significant."},{"id":"da-s7-f3","session":7,"front":"How is the global chi-square test related to the partial chi-square test?","back":"The global test is a special case of the partial test where q=0, i.e. the reduced model is the null model (no explanatory variables)."},{"id":"da-s7-f4","session":7,"front":"Define residual deviance for a model M.","back":"RES.DEV = -2 log L(M), where L(M) is the maximum likelihood of the estimated model M. Lower residual deviance means a better fit."},{"id":"da-s7-f5","session":7,"front":"Write the chi-square test statistic for a group of variables, and its degrees of freedom under H0.","back":"chi2 = RES.DEV(M_red) - RES.DEV(M_compl), following approximately a chi-square distribution with p-q degrees of freedom under H0."},{"id":"da-s7-f6","session":7,"front":"Write the chi-square test statistic for the whole model (global test), and its degrees of freedom.","back":"chi2 = RES.DEV(M_null) - RES.DEV(M_compl), following approximately a chi-square distribution with p degrees of freedom (since q=0)."},{"id":"da-s7-f7","session":7,"front":"Why are these chi-square tests also called LRT?","back":"LRT stands for Likelihood Ratio Test, because the tests are based on the likelihood function (via the residual deviance, which is -2 log likelihood)."},{"id":"da-s7-f8","session":7,"front":"List, in order, what can be predicted from an estimated logit model for fixed explanatory variable values.","back":"The log-odds of Y=1, then the odds of Y=1 (exponentiate the log-odds), then the probability of Y=1 (via the odds-probability relationship), then the predicted value of Y itself (0 or 1)."},{"id":"da-s7-f9","session":7,"front":"What is the default rule (per the fiche) for predicting Y=1 versus Y=0 from a predicted probability p-hat0?","back":"y-hat0 = 1 if p-hat0 >= 0.5, y-hat0 = 0 if p-hat0 < 0.5 (a different threshold is also possible depending on context)."},{"id":"da-s7-f10","session":7,"front":"Define AIC for a logit model M.","back":"AIC = -2 log L(M) + 2(p+1), combining the residual deviance (fit) with a penalty of 2(p+1) for model complexity (p = number of explanatory variables)."},{"id":"da-s7-f11","session":7,"front":"According to AIC, is a lower or higher value considered a better model?","back":"Lower AIC indicates a better model, per this criterion."},{"id":"da-s7-f12","session":7,"front":"For comparing nested models, which tool is more appropriate, AIC or the partial chi-square test?","back":"The partial chi-square test remains the most appropriate tool for nested models; AIC is more useful for comparing models that are not necessarily nested."},{"id":"da-s7-f13","session":7,"front":"In the insurance example, AGE has coefficient -0.0389 (e^-0.0389=0.9618). State the interpretation.","back":"Holding vehicle category (VC) constant, a one-year increase in driver age is associated with an estimated 3.92% decrease in the odds of a high claim."},{"id":"da-s7-f14","session":7,"front":"In the insurance example, the global chi-square test gave chi2=77.344, 3 df, p-value < 2.2e-16. What is the conclusion?","back":"The model (AGE + VC) is globally significant compared to the null model; H0 (all coefficients = 0) is rejected."},{"id":"da-s7-f15","session":7,"front":"In the insurance example, what did the partial chi-square test on VC (comparing AGE-only to AGE+VC) conclude?","back":"chi2=69.202, 2 df, p-value close to 0: VC is jointly significant, it meaningfully improves the model beyond AGE alone."},{"id":"da-s7-f16","session":7,"front":"In the insurance example's confusion matrix, 168 of 200 predictions were correct. What percentage is this?","back":"84% correct predictions (168/200), combining 128 correctly predicted 'no' and 40 correctly predicted 'yes'."},{"id":"da-s7-f17","session":7,"front":"What does the 'response' option do in R's predict() function for a logit model?","back":"It returns the predicted probability directly. Without it, predict() returns the predicted log-odds, which must be exponentiated to get the predicted odds."},{"id":"da-s8-f1","session":8,"front":"When is a multinomial logit model used instead of a binary logit model?","back":"When the dependent variable is qualitative with k > 2 categories. If k=2, the model reduces to the binary logit model."},{"id":"da-s8-f2","session":8,"front":"How many equations does a multinomial logit model with k categories use?","back":"k-1 equations, one for each non-reference category, expressing its conditional log-odds relative to the chosen reference category."},{"id":"da-s8-f3","session":8,"front":"What do the k-1 equations of the multinomial logit model express?","back":"The conditional log-odds of each non-reference category Ai relative to the reference category A1, as a linear function of the explanatory variables."},{"id":"da-s8-f4","session":8,"front":"Are the coefficients of the same explanatory variable identical across the different equations of a multinomial logit model?","back":"No, they are generally different from one equation to another (e.g. beta12 is not equal to beta13 in general)."},{"id":"da-s8-f5","session":8,"front":"For a quantitative x1 with coefficient b12 in the equation for A2 vs reference A1, what is the percentage change formula for the odds?","back":"(e^b12 - 1) x 100%, the percentage change in the odds of A2 vs A1 for a one-unit increase in x1, other variables held constant."},{"id":"da-s8-f6","session":8,"front":"For a dichotomous x2 with coefficient b22 in the equation for A2 vs reference A1, what does (e^b22 - 1) x 100% represent?","back":"The percentage change in the odds of A2 vs A1 when x2=1 compared to x2=0, other variables held constant."},{"id":"da-s8-f7","session":8,"front":"What is H0 and H1 for the individual coefficient test betaji in the multinomial model?","back":"H0: betaji = 0 (xj has no effect on the conditional odds of Ai vs the reference). H1: betaji is not equal to 0."},{"id":"da-s8-f8","session":8,"front":"Which tests for the multinomial logit model are explicitly NOT covered in this course?","back":"Tests on groups of coefficients, or on the entire set of coefficients (chi-square based); only the individual coefficient test is examinable."},{"id":"da-s8-f9","session":8,"front":"Describe the general method to predict p1, ..., pk in a multinomial logit model.","back":"Substitute the fixed x values into the k-1 log-odds equations, exponentiate to get k-1 ratios pi/p1, then solve the linear system formed by those ratios plus the constraint sum(pi)=1."},{"id":"da-s8-f10","session":8,"front":"In the brand example, for a 30-year-old female (x1=30, x2=0), log(p2/p1)=2.1 and log(p3/p1)=1.4. What are the resulting probabilities?","back":"p1=0.0757, p2=0.6175, p3=0.3068, obtained by exponentiating (p2/p1=8.1662, p3/p1=4.0552) then solving with p1+p2+p3=1."},{"id":"da-s8-f11","session":8,"front":"In the student program-choice R example, which categories did R automatically choose as reference for 'program' and for 'ses'?","back":"'general' for program, and 'low' for ses. Always verify which reference category R selected rather than assuming it."},{"id":"da-s8-f12","session":8,"front":"In the student example, the coefficient of score in the academic-vs-general equation was 0.0579 (e^0.0579=1.0596). State the interpretation.","back":"Holding ses constant, a one-point increase in score is associated with an estimated 5.96% increase in the odds of choosing academic over general."},{"id":"da-s8-f13","session":8,"front":"In the student example, what were the predicted probabilities for a student with score=50, ses=middle?","back":"General approximately 0.2334, academic approximately 0.4159, vocation approximately 0.3507 (from predict(mod1, ..., type='probs'))."},{"id":"da-s8-f14","session":8,"front":"Why is it wrong to interpret b13 as 'the effect of x1 on the overall probability of A3'?","back":"b13 measures the effect of x1 on the conditional odds of A3 relative to the reference category A1 only, never a direct statement about the raw probability p3."},{"id":"da-s8-f15","session":8,"front":"Why can't b12 and b13 be directly compared as if they measured the same contrast?","back":"Each coefficient describes a different category-vs-reference contrast (A2 vs A1, and A3 vs A1 respectively); they are not the same comparison, so comparing them naively is a common mistake."},{"id":"da-s8-f16","session":8,"front":"In R's multinom() output for the student example, what package and function are used?","back":"The multinom() function from the nnet package (which must be installed and loaded) is used to fit the multinomial logistic regression."}],"cr":[{"id":"cr-s1-f1","session":1,"front":"Agency problem","back":"Conflict of interest between a principal (owner) and an agent (manager), arising because their interests may diverge once ownership is separated from control."},{"id":"cr-s1-f2","session":1,"front":"Information asymmetry","back":"The condition where managers possess superior information about the firm relative to shareholders and other external users."},{"id":"cr-s1-f3","session":1,"front":"Two motives for regulation","back":"Market imperfections (objective: improve economic efficiency) and protection of unsophisticated investors (objective: redistribute wealth)."},{"id":"cr-s1-f4","session":1,"front":"Three sources of regulation","back":"Legislation, accounting standards, and stock exchange regulations."},{"id":"cr-s1-f5","session":1,"front":"GAAP","back":"The complete set of accounting regulations and conventions applicable in a given jurisdiction (e.g. UK GAAP, US GAAP), as opposed to IFRS which is the IASB's global standard set."},{"id":"cr-s1-f6","session":1,"front":"IFRS Foundation","back":"The oversight body that appoints and funds the IASB and governs its operations; monitored by the Monitoring Board."},{"id":"cr-s1-f7","session":1,"front":"IASB","back":"Independent board of 14 members that develops and amends IFRS Accounting Standards."},{"id":"cr-s1-f8","session":1,"front":"IFRS Advisory Council","back":"The body that advises the IASB on its agenda and priorities."},{"id":"cr-s1-f9","session":1,"front":"IFRS Interpretations Committee (IFRIC)","back":"The committee that interprets IFRS and provides practical guidance on matters not covered by the standards."},{"id":"cr-s1-f10","session":1,"front":"IASB's three formal objectives","back":"1) Develop a single set of high-quality, understandable, enforceable global standards; 2) promote their use and rigorous application; 3) work with national standard-setters to converge national standards with IFRS."},{"id":"cr-s1-f11","session":1,"front":"IASB due process (6 steps)","back":"Topic identification -> apply Conceptual Framework -> consultation with national standard-setters/Foundation/Advisory Council -> discussion document + comments -> exposure draft + comments -> final standard."},{"id":"cr-s1-f12","session":1,"front":"Structure of an IFRS standard","back":"Introduction; objectives and scope; definitions; body of the standard; effective date and transitional provisions; formal IASB approval (+ dissenting opinions); basis for conclusions; application guidance/illustrative examples."},{"id":"cr-s1-f13","session":1,"front":"Global IFRS adoption status","back":"Required for listed companies in 100+ countries (all EU from 2005), permitted in 14 more; not mandatory in the US, though the SEC has allowed IFRS filings by foreign private issuers without reconciliation since Nov 2007."},{"id":"cr-s1-f14","session":1,"front":"EU endorsement mechanism","back":"The European Commission oversees the framework; the IASB creates IFRS; the ARC (advised by EFRAG/SARG) must individually endorse each standard before it is mandatory in the EU; enforcement is national (e.g. Consob, FRRP), coordinated by ESMA (via EECS)."},{"id":"cr-s1-f15","session":1,"front":"Principle (definition)","back":"A general statement intended to support the true and fair presentation of the economic consequences of transactions — a guide to action, not a precise rule."},{"id":"cr-s1-f16","session":1,"front":"Rule (definition)","back":"A means of establishing an unambiguous decision-making method; whether following the rules actually achieves conformity to the underlying principle is a matter of judgement."},{"id":"cr-s1-f17","session":1,"front":"Principles vs rules, the exam-safe framing","back":"Officially a false distinction — the difference is not clear-cut, and a combination of both is generally necessary and appropriate; don't overstate the US GAAP (rules) vs IFRS (principles) framing."},{"id":"cr-s1-f18","session":1,"front":"IFRS1","back":"Governs an entity's first IFRS financial statements; requires certain reconciliations between local GAAP and IFRS for the transition period."},{"id":"cr-s1-f19","session":1,"front":"Stewardship under the Revised Conceptual Framework","back":"Folded into the single decision-usefulness objective, not treated as a second, separate objective."},{"id":"cr-s2-f1","session":2,"front":"Conceptual Framework status","back":"Not itself an IFRS; if it conflicts with a specific IFRS Standard, the IFRS prevails."},{"id":"cr-s2-f2","session":2,"front":"Conceptual Framework's three stated purposes","back":"Assist regulators (consistent standards), assist preparers (when no Standard applies or a choice is allowed), assist users (interpreting Standards)."},{"id":"cr-s2-f3","session":2,"front":"Eight chapters of the Conceptual Framework","back":"Objective of financial reporting; qualitative characteristics; financial statements and the reporting entity; elements; recognition/de-recognition; measurement; presentation and disclosure; concepts of capital and capital maintenance."},{"id":"cr-s2-f4","session":2,"front":"Sole objective of general purpose financial reporting","back":"Provide information useful to existing/potential investors, lenders and other creditors for decisions about providing resources to the entity; stewardship is included, not separate."},{"id":"cr-s2-f5","session":2,"front":"Relevance","back":"Information is relevant if capable of making a difference to users' decisions, via predictive value, confirmatory value, or both."},{"id":"cr-s2-f6","session":2,"front":"Predictive value vs confirmatory value","back":"Predictive value = useful as an input to users' own predictions about the future. Confirmatory value = confirms or changes past/present expectations. Highly predictable info (e.g. straight-line depreciation) may still lack predictive value for a given purpose."},{"id":"cr-s2-f7","session":2,"front":"Faithful representation","back":"Financial statements present fairly when information is reliable, unbiased and represents what it purports to represent; requires completeness, neutrality, and freedom from MATERIAL (not all) error."},{"id":"cr-s2-f8","session":2,"front":"Completeness","back":"The depiction includes all information necessary for faithful representation of the phenomenon; an omission can make information false or misleading."},{"id":"cr-s2-f9","session":2,"front":"Neutrality","back":"Absence of bias intended to attain a predetermined result or induce particular behaviour."},{"id":"cr-s2-f10","session":2,"front":"Prudence (Revised Framework)","back":"The exercise of caution under uncertainty; supports neutrality by preventing overstatement/understatement of assets, liabilities, income or expenses."},{"id":"cr-s2-f11","session":2,"front":"Four enhancing characteristics","back":"Comparability (consistent treatments across entities/time), verifiability (direct/indirect corroboration), timeliness (available in time to influence decisions), understandability (clear, concise presentation)."},{"id":"cr-s2-f12","session":2,"front":"Five elements of financial statements","back":"Asset, liability, equity (elements of financial position); income and expenses (elements of financial performance)."},{"id":"cr-s2-f13","session":2,"front":"Equity (definition)","back":"The residual interest in the assets of the entity after deducting all its liabilities."},{"id":"cr-s2-f14","session":2,"front":"Income (definition)","back":"Increases in assets or decreases in liabilities that result in increases in equity, other than contributions from equity holders."},{"id":"cr-s2-f15","session":2,"front":"Expenses (definition)","back":"Decreases in assets or increases in liabilities that result in decreases in equity, other than distributions to equity holders."},{"id":"cr-s2-f16","session":2,"front":"Going concern vs accruals basis","back":"Going concern: entity assumed to continue operating for the foreseeable future. Accruals: transactions recognised when they occur, not when cash is paid/received."},{"id":"cr-s2-f17","session":2,"front":"Three recognition criteria","back":"Relevant information about the element; a faithful representation of the element; benefits of the information exceed the costs of providing it."},{"id":"cr-s2-f18","session":2,"front":"Two measurement bases","back":"Historical cost (amount paid/received at acquisition/incurrence) vs current value (fair value; or value in use for assets / fulfilment value for liabilities)."},{"id":"cr-s2-f19","session":2,"front":"Full disclosure constraints","back":"Materiality (omission/misstatement could influence user decisions) and the cost constraint (benefits must justify costs of providing information)."},{"id":"cr-s2-f20","session":2,"front":"Common exam trap: reliability","back":"The current framework's term is 'faithful representation,' not 'reliability' — don't use the old term as if it were the fundamental characteristic."},{"id":"cr-s3-f1","session":3,"front":"IAS1 objective","back":"Provide information about financial position, performance and cash flows useful to a wide range of users for economic decisions, via 4 primary statements plus notes."},{"id":"cr-s3-f2","session":3,"front":"IAS1 five components","back":"Statement of financial position; statement of profit or loss and OCI; statement of changes in equity; statement of cash flows (IAS7); the notes."},{"id":"cr-s3-f3","session":3,"front":"Going concern basis","back":"Financial statements are generally prepared assuming the entity will continue operating, unless it intends to cease trading or has no realistic alternative."},{"id":"cr-s3-f4","session":3,"front":"Accruals basis exception","back":"All statements are accruals-based except the statement of cash flows, which is cash-based by nature."},{"id":"cr-s3-f5","session":3,"front":"Current asset test (4 conditions, any one)","back":"Expected to be realised in the normal operating cycle; held for trading; expected to be realised within 12 months; or is cash/cash equivalent (IAS7). Satisfying ANY ONE makes it current."},{"id":"cr-s3-f6","session":3,"front":"Current liability test (4 conditions, any one)","back":"Due to be settled in the normal operating cycle; held for trading; due within 12 months; or the entity lacks the right to defer settlement 12+ months. ANY ONE condition suffices."},{"id":"cr-s3-f7","session":3,"front":"Offsetting rule","back":"Assets/liabilities and income/expenses must not be offset against each other, UNLESS another IFRS Standard specifically permits or requires it."},{"id":"cr-s3-f8","session":3,"front":"Statement of changes in equity formula","back":"Closing balance = Opening balance + total comprehensive income +/- accounting-policy-change effects + share issues - dividends paid, tracked per component of equity."},{"id":"cr-s3-f9","session":3,"front":"IFRS18","back":"Issued April 2024, supersedes IAS1, mandatory for periods beginning on or after 1 Jan 2027; introduces 5 P&L categories and new mandatory subtotals plus note disclosures for management-defined performance measures."},{"id":"cr-s3-f10","session":3,"front":"IFRS18's five P&L categories","back":"Operating, investing, financing, income taxes, discontinued operations."},{"id":"cr-s3-f11","session":3,"front":"IFRS18 mandatory subtotals","back":"Operating profit or loss; profit or loss before financing and income taxes; profit or loss."},{"id":"cr-s3-f12","session":3,"front":"Accounting policy hierarchy (no IFRS applies)","back":"1) IFRS dealing with similar/related issues; 2) the Conceptual Framework; 3) other standard-setters' pronouncements; 4) accounting literature and industry practice."},{"id":"cr-s3-f13","session":3,"front":"Change in accounting policy","back":"Permitted only if required by an IFRS, or if it gives more reliable/relevant information. IFRS-driven changes follow that standard's own transition rules; otherwise, retrospective (restate comparatives)."},{"id":"cr-s3-f14","session":3,"front":"Accounting estimate change","back":"Always accounted for PROSPECTIVELY — no restatement of prior comparatives (contrast with policy changes and material errors, which are retrospective)."},{"id":"cr-s3-f15","session":3,"front":"Prior period errors","back":"Omissions/misstatements from failing to use reliable information that was available and reasonably obtainable when the prior statements were authorised. Material errors are corrected retrospectively."},{"id":"cr-s3-f16","session":3,"front":"Adjusting event (IAS10)","back":"Evidence of conditions existing at period-end; requires the financial statements to be adjusted."},{"id":"cr-s3-f17","session":3,"front":"Non-adjusting event (IAS10)","back":"Indicative of conditions arising after period-end; no adjustment, but must be disclosed if material."},{"id":"cr-s3-f18","session":3,"front":"IAS1 vs IAS8 roles","back":"IAS1: what policies must be disclosed (the notes requirement). IAS8: how policies are selected, and when/how they may be changed."},{"id":"cr-s4-f1","session":4,"front":"Statement of cash flows (purpose)","back":"Reports cash inflows/outflows during a period; exists because profit (accruals-based) is not a reliable indicator of cash health."},{"id":"cr-s4-f2","session":4,"front":"Cash (IAS7)","back":"Cash on hand and demand deposits; a bank overdraft is treated as negative cash (netted, not a financing item)."},{"id":"cr-s4-f3","session":4,"front":"Cash equivalents (IAS7)","back":"Short-term, highly liquid investments readily convertible to known cash amounts, with insignificant risk of value change."},{"id":"cr-s4-f4","session":4,"front":"Three IAS7 activity classes","back":"Operating (principal revenue-producing activities), investing (acquisition/disposal of long-term assets/investments), financing (changes in size/composition of equity and borrowings)."},{"id":"cr-s4-f5","session":4,"front":"Direct method","back":"Discloses major classes of operating receipts and payments individually (e.g. cash from customers, cash to suppliers, cash to employees)."},{"id":"cr-s4-f6","session":4,"front":"Indirect method (pre-IFRS18)","back":"Starts from profit before tax, adds back non-cash expenses, subtracts non-cash income, adjusts for working-capital changes, strips out non-operating items."},{"id":"cr-s4-f7","session":4,"front":"Indirect method formula","back":"Cash from operations = Profit before tax + non-cash expenses - non-cash income +/- working capital changes - non-operating items."},{"id":"cr-s4-f8","session":4,"front":"Working capital sign rule","back":"A decrease in a current asset (other than cash) or an increase in a current liability = source of cash (add); the reverse = use of cash (subtract)."},{"id":"cr-s4-f9","session":4,"front":"Pre-IFRS18 interest/dividends/tax treatment","back":"Interest received & dividends received -> investing. Interest paid -> usually operating (or financing). Dividends paid -> operating or financing (choice). Tax -> operating unless tied to investing/financing."},{"id":"cr-s4-f10","session":4,"front":"IFRS18 amendments to IAS7 (3 changes)","back":"1) Indirect method starts from an IFRS18 subtotal, not profit before tax. 2) Dividends paid -> financing (mandatory). 3) Interest paid -> financing in most cases (mandatory)."},{"id":"cr-s4-f11","session":4,"front":"IAS7 disclosure requirement","back":"Reconcile cash/cash-equivalent components to the statement of financial position (mandatory); segment cash flow analysis and undrawn borrowing facilities are only encouraged."},{"id":"cr-s4-f12","session":4,"front":"IFRS18 effective date (as for IAS1)","back":"Mandatory for periods beginning on or after 1 January 2027."},{"id":"cr-s4-f13","session":4,"front":"Common trap: IAS7 vs IFRS18 categories","back":"IAS7's operating/investing/financing (for cash flows) and IFRS18's five P&L categories (operating/investing/financing/income taxes/discontinued operations) are separate schemes for separate statements."},{"id":"cr-s5-f1","session":5,"front":"Three standards, three jobs","back":"IAS32 = presentation/classification (financial asset/liability/equity). IFRS9 = recognition/measurement. IFRS7 = disclosure."},{"id":"cr-s5-f2","session":5,"front":"Financial instrument (IAS32)","back":"Any contract giving rise to a financial asset of one entity and a financial liability or equity instrument of another."},{"id":"cr-s5-f3","session":5,"front":"Financial asset (IAS32)","back":"Cash, an equity instrument of another entity, or a contractual right to receive cash (or another financial asset) from another entity, among other categories."},{"id":"cr-s5-f4","session":5,"front":"Financial liability (IAS32)","back":"A contractual obligation to deliver cash (or another financial asset) to another entity."},{"id":"cr-s5-f5","session":5,"front":"Equity instrument (IAS32)","back":"Any contract evidencing a residual interest in the assets of an entity after deducting all of its liabilities."},{"id":"cr-s5-f6","session":5,"front":"Derivative","back":"Transfers the financial risks of an underlying primary financial instrument; parties effectively take bets on the underlying's future value."},{"id":"cr-s5-f7","session":5,"front":"Two-part equity test (both required)","back":"Part A: no contractual obligation to deliver cash/exchange unfavourably. Part B: will/may be settled in the issuer's own equity instruments. Must satisfy BOTH to be equity."},{"id":"cr-s5-f8","session":5,"front":"Redeemable preference shares","back":"Fail Part A (obligation to redeem in cash) -> classified as a liability, not equity; their 'dividends' are an expense."},{"id":"cr-s5-f9","session":5,"front":"Compound financial instrument","back":"Contains both a liability component and an equity component (e.g. convertible bonds); IAS32 requires split accounting at issuance."},{"id":"cr-s5-f10","session":5,"front":"Split accounting method","back":"Liability component = PV of contractual cash flows discounted at the MARKET rate for an equivalent non-convertible instrument. Equity component = issue proceeds - liability component (residual)."},{"id":"cr-s5-f11","session":5,"front":"Presenting interest/dividends by classification","back":"Liability-related interest/dividends -> profit or loss (expense). Equity distributions -> debited directly to equity, never P&L."},{"id":"cr-s5-f12","session":5,"front":"Recognition (IFRS9) vs measurement (IFRS9)","back":"Recognition = WHEN an asset/liability first appears on the balance sheet. Measurement = the AMOUNT at which it is shown, initially and subsequently."},{"id":"cr-s6-f1","session":6,"front":"IFRS9 recognition rule","back":"A financial asset/liability is recognised only when the entity becomes party to the contractual provisions — the contract, not the cash flow, triggers recognition."},{"id":"cr-s6-f2","session":6,"front":"Initial measurement (assets AND liabilities)","back":"Always fair value at initial recognition, regardless of the category used for subsequent measurement."},{"id":"cr-s6-f3","session":6,"front":"Four measurement categories for financial assets","back":"1) Debt at amortised cost. 2) Debt at FVOCI (recycles to P&L on derecognition). 3) Equity designated at FVOCI (never recycles). 4) FVPL (default/residual — debt, derivatives, equity)."},{"id":"cr-s6-f4","session":6,"front":"Equity-FVOCI designation","back":"An irrevocable designation made at initial recognition, not automatic — must be elected instrument by instrument."},{"id":"cr-s6-f5","session":6,"front":"Amortised cost two-part test","back":"BOTH required: (1) SPPI — cash flows are solely payments of principal and interest; (2) hold-to-collect business model objective."},{"id":"cr-s6-f6","session":6,"front":"Amortised cost (definition)","back":"Initial carrying amount, plus interest earned to date at the effective rate, minus repayments received to date."},{"id":"cr-s6-f7","session":6,"front":"Effective interest method","back":"Calculates interest earned using the rate that exactly discounts estimated future cash receipts to the initial carrying amount; folds in premiums/discounts, not just stated interest."},{"id":"cr-s6-f8","session":6,"front":"Amortised cost formula","back":"Amortised cost = Initial carrying amount + Interest earned (effective rate) - Repayments received to date."},{"id":"cr-s6-f9","session":6,"front":"Zero-coupon bond mechanics","back":"Issued at PV of face value discounted at the effective (yield) rate; carrying amount accretes toward face value via accrued interest each period, with no cash interest paid until maturity."},{"id":"cr-s6-f10","session":6,"front":"Subsequent measurement of liabilities","back":"Amortised cost by default (effective interest method); fair value if held for trading (gains/losses usually to P&L)."},{"id":"cr-s6-f11","session":6,"front":"Trade receivables/payables practical expedient","back":"May use the original invoice amount instead of discounting, when the discounting effect is immaterial."},{"id":"cr-s6-f12","session":6,"front":"Where P&L/OCI land on the balance sheet","back":"Profit or loss flows into retained earnings; OCI flows into accumulated OCI; the two together form total comprehensive income for the period."},{"id":"cr-s6-f13","session":6,"front":"IFRS9 effective date","back":"Replaced IAS39 from 1 January 2018 (earlier application permitted); applies to all entities and financial instruments, subject to 11 scope exceptions."},{"id":"cr-s7-f1","session":7,"front":"IFRS9's measurement scope","back":"Spans initial measurement, subsequent measurement, reclassifications, gains/losses, AND impairment/uncollectability — impairment is part of IFRS9, not separate."},{"id":"cr-s7-f2","session":7,"front":"Expected credit loss (ECL) model","back":"Forward-looking: a loss allowance is recognised for expected credit losses from initial recognition onward, updated each reporting date — replaces IAS39's 'incurred loss' approach."},{"id":"cr-s7-f3","session":7,"front":"Three-stage ECL structure","back":"Stage 1 (no significant credit-risk increase): 12-month ECL. Stage 2 (significant increase, not yet impaired): lifetime ECL. Stage 3 (credit-impaired): lifetime ECL + interest on NET carrying amount."},{"id":"cr-s7-f4","session":7,"front":"IFRS7 purpose","back":"Let users evaluate (a) the significance of financial instruments for the entity's position/performance, and (b) the nature/extent of risks from them and how they're managed."},{"id":"cr-s7-f5","session":7,"front":"IFRS7's three risk categories","back":"Market risk (price exposure: rates, FX, equity prices), credit risk (counterparty default), liquidity risk (difficulty meeting financial-liability obligations)."},{"id":"cr-s7-f6","session":7,"front":"IFRS7 vs IFRS9 vs IAS32 (recap)","back":"IAS32 = classification. IFRS9 = recognition, measurement, reclassification, gains/losses, impairment. IFRS7 = disclosure of significance and risk exposure."},{"id":"cr-s8-f1","session":8,"front":"Berkshire Q1 2018 case shock","back":"Reported net loss of $(1.138)bn despite $5.288bn operating earnings, driven by ~$6.2bn unrealised equity-portfolio losses newly required (by US GAAP ASU 2016-01) to flow through earnings."},{"id":"cr-s8-f2","session":8,"front":"ASU 2016-01 status","back":"A US GAAP rule change, NOT an IFRS rule — used only as a real-world hook to compare against IFRS9's treatment."},{"id":"cr-s8-f3","session":8,"front":"IFRS9 equity default","back":"FVTPL (fair value through profit or loss) — any fair-value change hits profit or loss."},{"id":"cr-s8-f4","session":8,"front":"FVOCI election, four exam-critical features","back":"1) Only for non-trading equity instruments. 2) Instrument-by-instrument, not a blanket policy. 3) Made at initial recognition, irrevocable. 4) Dividends still to P&L; fair-value changes to OCI, never recycled, and no separate ECL model."},{"id":"cr-s8-f5","session":8,"front":"Equity-FVOCI vs debt-FVOCI recycling","back":"Equity-FVOCI: NEVER recycles to P&L, not even on disposal. Debt-FVOCI: DOES recycle to P&L on derecognition. This is the most tested distinction in the course on financial instruments."},{"id":"cr-s8-f6","session":8,"front":"Decision sequence for any financial-instrument question","back":"1) IAS32 classification. 2) IFRS9 initial measurement at fair value. 3) Subsequent measurement (debt: business model + SPPI; equity: FVTPL default/FVOCI election). 4) Presentation: P&L vs OCI."},{"id":"cr-s8-f7","session":8,"front":"The case's own framing","back":"\"A presentation case more than a valuation case\" — nobody disputes the fair value; the debate is which financial statement line shows its movement."},{"id":"cr-s8-f8","session":8,"front":"Three perspectives on what net income should communicate","back":"Buffett's view: fair-value swings on a long-term portfolio obscure operating trends. Standard setter's view: fair value should flow through net income as it occurs. Investor's view: use net income, OCI, operating earnings and disclosures together."},{"id":"cr-s9-f1","session":9,"front":"IAS16 objective","back":"Prescribe accounting for PP&E so users can discern info on the entity's PP&E investment; issues = recognition, carrying amounts, depreciation, impairment."},{"id":"cr-s9-f2","session":9,"front":"IAS16 scope exclusions","back":"PP&E held for sale (IFRS5); biological assets (IAS41); exploration/evaluation assets (IFRS6); mineral rights/reserves; investment property (IAS40)."},{"id":"cr-s9-f3","session":9,"front":"PP&E definition","back":"Tangible assets (a) held for production/supply/rental/admin purposes, and (b) expected to be used for more than one period."},{"id":"cr-s9-f4","session":9,"front":"PP&E recognition test","back":"BOTH required: cost measurable reliably, AND probable future economic benefits will flow to the entity."},{"id":"cr-s9-f5","session":9,"front":"Three elements of initial cost","back":"Purchase price + directly attributable costs (delivery, installation, professional fees, site prep) + estimated dismantling/restoration cost (recognised as a provision)."},{"id":"cr-s9-f6","session":9,"front":"Costs excluded from initial cost","back":"Administrative overheads, feasibility studies, staff training, abnormal waste of materials/labour in self-construction."},{"id":"cr-s9-f7","session":9,"front":"Capitalisation cutoff rule","back":"Stops once the asset is CAPABLE of operating as intended by management — not once it is actually at full planned use/capacity."},{"id":"cr-s9-f8","session":9,"front":"Costs never capitalisable post-cutoff","back":"Costs incurred once capable of operating (even if not yet at full capacity); initial operating losses; relocation/reorganisation costs."},{"id":"cr-s9-f9","session":9,"front":"Component approach (IAS16 par 43)","back":"Each significant part of a PP&E item, with a materially different cost/useful life, is depreciated separately (e.g. aircraft engine vs airframe vs seats)."},{"id":"cr-s9-f10","session":9,"front":"Borrowing costs (IAS23)","back":"Directly attributable to a qualifying asset -> capitalised as part of its cost. All other borrowing costs -> expensed as incurred."},{"id":"cr-s9-f11","session":9,"front":"Qualifying asset (IAS23)","back":"An asset that necessarily takes a substantial period of time to get ready for its intended use or sale."},{"id":"cr-s9-f12","session":9,"front":"Capitalisation rate by funding source","back":"Specific borrowings -> use that borrowing's own interest rate. General borrowings -> weighted average rate across all general borrowings, time-apportioned by months outstanding."},{"id":"cr-s9-f13","session":9,"front":"Capitalised borrowing cost formula","back":"Sum over tranches of: Qualifying expenditure x Weighted average borrowing rate x (Months outstanding / 12)."},{"id":"cr-s10-f1","session":10,"front":"Subsequent costs, capitalise vs expense","back":"Capitalise: additions/improvements/replacements that increase future service potential; major non-routine (e.g. legally mandated) inspections. Expense: ordinary repairs/maintenance; re-arrangement/re-organisation costs."},{"id":"cr-s10-f2","session":10,"front":"Component replacement accounting","back":"Derecognise the old component's remaining carrying amount (recognising any loss) and capitalise the new component's cost — practical application of the component approach."},{"id":"cr-s10-f3","session":10,"front":"Cost model","back":"Cost less accumulated depreciation less accumulated impairment losses (IAS16 par 30)."},{"id":"cr-s10-f4","session":10,"front":"Three depreciation methods","back":"Straight-line (constant charge); diminishing-balance (decreasing charge, appropriate when productivity/revenue is higher early or maintenance rises later); units-of-production (based on output)."},{"id":"cr-s10-f5","session":10,"front":"Land","back":"Not depreciated; must be accounted for separately from any building acquired jointly with it."},{"id":"cr-s10-f6","session":10,"front":"Revaluation model","back":"Carried at fair value at the revaluation date, net of subsequent accumulated depreciation/impairment; applied to an ENTIRE class of PP&E, no selective revaluation."},{"id":"cr-s10-f7","session":10,"front":"Revaluation frequency","back":"Must be carried out regularly; every 3-5 years is sufficient absent significant fluctuations (annual not required)."},{"id":"cr-s10-f8","session":10,"front":"Revaluation surplus/deficit rule (the key mechanical rule)","back":"First surplus -> OCI/reserve. First deficit -> P&L. Subsequent surplus reversing a prior P&L deficit -> credited back to P&L up to that deficit, excess to reserve. Subsequent deficit reversing a prior reserve surplus -> debited against reserve first, excess to P&L."},{"id":"cr-s10-f9","session":10,"front":"Revalued assets continue to be depreciated","back":"Under IAS16's revaluation model, depreciation continues after revaluation (only the rate/base may need adjusting) — contrast with IAS40 fair value model, where depreciation stops."},{"id":"cr-s10-f10","session":10,"front":"IAS40 investment property (definition)","back":"Land or a building (or part of one), held by the owner or lessee (as a right-of-use asset), to earn rentals or for capital appreciation, or both — distinct from owner-occupied property (stays under IAS16)."},{"id":"cr-s10-f11","session":10,"front":"IAS40 fair value model, three key contrasts with IAS16 revaluation","back":"1) Remeasured every YEAR (not 3-5 years). 2) Ceases to be depreciated once fair-valued. 3) Both gains and losses go through P&L directly, never OCI/reserve."},{"id":"cr-s10-f12","session":10,"front":"Investment property initial measurement","back":"At cost, exactly as under IAS16; subsequently the entity chooses between the cost model and the fair value model, applied consistently to the whole class."},{"id":"cr-s11-f1","session":11,"front":"Intangible asset (IAS38), three-part test","back":"Non-monetary + identifiable + without physical substance — all three required simultaneously."},{"id":"cr-s11-f2","session":11,"front":"Identifiability test","back":"Separable (can be sold/transferred/licensed/rented/exchanged separately) OR arises from contractual/legal rights — an 'or' test. Distinguishes a specific intangible from goodwill."},{"id":"cr-s11-f3","session":11,"front":"Control","back":"Ability to control future economic benefits from the item; legal protection (patent, trademark) is one way, not the only way."},{"id":"cr-s11-f4","session":11,"front":"Four acquisition routes and initial measurement","back":"Separate acquisition -> cost. Business combination -> fair value (IFRS3). Government grant -> fair value or nominal + directly attributable costs (IAS20). Internally generated -> capitalised outlays subject to R&D split."},{"id":"cr-s11-f5","session":11,"front":"Items that always fail recognition when internal","back":"Internally generated goodwill, start-up costs, training costs, advertising/promotional costs, reorganisation costs, internally developed customer portfolios/trademarks/mastheads/publishing titles/customer lists."},{"id":"cr-s11-f6","session":11,"front":"Same items via acquisition","back":"Trademarks, customer lists, etc. that fail recognition when internally generated CAN be recognised if acquired from a third party or via a business combination — the problem is internal generation, not the item itself."},{"id":"cr-s11-f7","session":11,"front":"Revaluation model for intangibles","back":"Only permitted where fair value can be determined via an ACTIVE MARKET — rare (examples: production quotas, fishing licences, taxi licences)."},{"id":"cr-s11-f8","session":11,"front":"Finite vs indefinite useful life","back":"Finite -> amortise over useful life + impairment test if indicators exist. Indefinite (and goodwill) -> never amortised, impairment test at least annually. 'Indefinite' does not mean 'infinite.'"},{"id":"cr-s11-f9","session":11,"front":"Useful life cap from legal/contractual rights","back":"Cannot exceed the duration of those rights, but may be shorter if the entity expects shorter use."},{"id":"cr-s11-f10","session":11,"front":"Research expenditure","back":"Always expensed as incurred — no capitalisation permitted, ever."},{"id":"cr-s11-f11","session":11,"front":"Development expenditure, six capitalisation conditions (ALL required)","back":"Technical feasibility; intention to complete and use/sell; ability to use/sell; how it will generate probable future benefits; adequate resources available; reliable measurement of attributable expenditure."},{"id":"cr-s11-f12","session":11,"front":"Add-on module to an in-use asset","back":"Amortised over the REMAINING useful life of the underlying asset, not a fresh full term."},{"id":"cr-s11-f13","session":11,"front":"Website development costs (exercise)","back":"Planning -> expensed. Development -> capitalisable if probable future benefits shown. Content development -> expensed. Operating (running the live site) -> expensed."},{"id":"cr-s11-f14","session":11,"front":"Goodwill treatment","back":"Never amortised; tested for impairment at least annually — same treatment as indefinite-life intangibles."},{"id":"cr-s12-f1","session":12,"front":"Impairment loss","back":"Carrying amount (NBV) minus recoverable amount, when NBV exceeds recoverable amount; no impa
