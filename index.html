al markets."},{"id":"cg-s1-f9","session":"1","front":"Name the five historical governance failures cited in Session 1 and their country/year.","back":"Enron (US, 2001), Parmalat (Italy, 2003), WorldCom (US, 2002), Satyam (India, 2009), Theranos (US, 2015)."},{"id":"cg-s1-f10","session":"1","front":"What recurring ingredients does the lecture identify across Enron, Parmalat, WorldCom, Satyam and Theranos?","back":"Ineffective boards (lacking independence or expertise), conflicts of interest among auditors/advisors/dominant families, weak transparency and internal controls, and excessive concentration of power in a CEO or founder."},{"id":"cg-s1-f11","session":"1","front":"What are the three families of governance response mechanisms?","back":"1) Make markets efficient and rely on them. 2) Define and impose structures, rules and mechanisms (board structure, internal/external controls). 3) Privilege some ownership structures over others (public company, blockholding, institutional-investor ownership)."},{"id":"cg-s1-f12","session":"1","front":"Through what three channels does the market for corporate control operate?","back":"Proxy fights (gathering proxies for an alternative board slate), friendly takeovers (agreed reshaping of governance), and hostile takeovers (a raider buying over 50% of voting shares to gain control)."},{"id":"cg-s1-f13","session":"1","front":"Why is debt sometimes described as a governance device?","back":"Debt carries a reimbursement plan and mandatory interest payments, which reduces free cash flow and managerial discretion to spend it outside the firm's stated objectives."},{"id":"cg-s1-f14","session":"1","front":"What two conflicts does debt as a governance device itself create?","back":"Asset substitution (shareholders tempted into risky investments since they capture the upside while creditors bear the downside) and debt overhang (a highly indebted firm can lose good investment opportunities because it struggles to find new funding)."},{"id":"cg-s1-f15","session":"1","front":"What is the LLSV logic linking legal protection to ownership concentration?","back":"Where legal protection of shareholders/creditors is weak, ownership concentration substitutes for the law (blockholders protect their own interests directly). Where legal protection is strong, dispersed ownership becomes viable because minority shareholders can trust the law."},{"id":"cg-s1-f16","session":"1","front":"In the LLSV table, which legal origin has the highest antidirector rights score, and which has the lowest?","back":"Common law has the highest (4.00 out of 5/6). French civil law has the lowest (2.33, tied with German civil law)."},{"id":"cg-s1-f17","session":"1","front":"What is a fiduciary duty, per this session?","back":"Legal duties directors owe to the corporation, including the duty of loyalty, to pursue the company's objectives rather than personal interests. Directors' fiduciary duties run to shareholders specifically."},{"id":"cg-s1-f18","session":"1","front":"Distinguish residual income rights from residual control rights (as first introduced conceptually via agency costs in Session 1, developed further in Session 2).","back":"Residual income rights are the right to profits left over after obligations are paid. Residual control rights are the right to decide when a contract is silent or incomplete. Both matter because the principal (shareholders) is exposed when contracts are incomplete."},{"id":"cg-s2-f1","session":"2","front":"State the shareholder view's core claim.","back":"The corporation exists primarily to maximize shareholder value, shareholders, as residual claimants, are the ultimate owners, and managers act as their agents."},{"id":"cg-s2-f2","session":"2","front":"List the four core assumptions of the shareholder view.","back":"1) Purpose is to maximize shareholder value. 2) Shareholders are residual claimants of profits. 3) Managers and boards act as agents of shareholders. 4) Stakeholders are considered only instrumentally."},{"id":"cg-s2-f3","session":"2","front":"List the five extended assumptions the shareholder view depends on.","back":"Maximizing shareholder value maximizes corporate value, financial markets are efficient, shareholder value maximization disciplines managers (falling stock price), stock-based incentives align managers with shareholders, and the market for corporate control disciplines managers."},{"id":"cg-s2-f4","session":"2","front":"What is 'the firm as a nexus of contracts'?","back":"The firm is a web of implicit (informal expectations, e.g. job security) and explicit (legal agreements, e.g. salary) contracts regulating the rights and duties of its stakeholders."},{"id":"cg-s2-f5","session":"2","front":"Define residual income rights and residual control rights, and who holds them.","back":"Residual income rights, the right to profits after all contractual obligations are met. Residual control rights, the right to decide when a contract is silent or incomplete. Both allocated to shareholders, because they receive residual income and are most exposed to expropriation when contracts are incomplete."},{"id":"cg-s2-f6","session":"2","front":"What is the key question the ownership-rights session poses?","back":"Who should control a corporation to maximize its long-term survival and prosperity?"},{"id":"cg-s2-f7","session":"2","front":"Compare the property conception and social entity conception of the firm across definition, assets, and managers' role.","back":"Property, nexus of contracts, assets belong to shareholders, managers are agents of shareholders. Social entity, a social institution, assets used for multiple stakeholders, managers are trustees balancing diverse interests."},{"id":"cg-s2-f8","session":"2","front":"What are the four types of stakeholder power in the stakeholder map?","back":"Voting power (equity stakes), political and regulatory power (governments/regulators), environmental and social power (customers, communities, environmental standards), economic power (employees, customers, suppliers, competitors)."},{"id":"cg-s2-f9","session":"2","front":"List the four definitions of what corporate governance is for.","back":"Shareholder definition (maximize shareholder value), stakeholder definition (balance all interests), managerial definition (managers' own interests), firm definition (firm's own long-term survival/competitiveness)."},{"id":"cg-s2-f10","session":"2","front":"What did the 2019 Business Roundtable Statement commit signatory CEOs to?","back":"Delivering long-term value to customers, investing in employees (training, fair pay, diversity), dealing fairly with suppliers, supporting communities, and generating long-term value for shareholders, a voluntary shift from shareholder primacy toward stakeholder capitalism."},{"id":"cg-s2-f11","session":"2","front":"Who echoed the Business Roundtable's message, and how?","back":"BlackRock CEO Larry Fink, by calling on companies to serve a 'social purpose' alongside profit."},{"id":"cg-s2-f12","session":"2","front":"Why are residual control rights allocated specifically to shareholders rather than another stakeholder group?","back":"Because shareholders are the ones who receive residual income and are therefore most exposed to being expropriated by managers when contracts are incomplete, so they need decision rights over matters like dividend policy, capital increases, and board elections."},{"id":"cg-s2-f13","session":"2","front":"Is the shareholder value maximization argument a description of fact or a conditional argument, per the fiche's exam trap?","back":"A conditional argument, it only holds together if the extended assumptions (efficient markets, effective discipline mechanisms) also hold, it is not a description of how all firms always actually behave."},{"id":"cg-s2-f14","session":"2","front":"What limits does the fiche place on ownership rights as a governance solution?","back":"They are an important tool to mitigate conflicts and agency costs, not a guarantee, controlling shareholders can themselves expropriate other stakeholders, and both contracts and legal enforcement are imperfect."},{"id":"cg-s2-f15","session":"2","front":"Give the property-conception and social-entity-conception company examples from the fiche.","back":"Property conception, ExxonMobil (focus on shareholder returns). Social entity conception, Unilever (Sustainable Living Plan, balancing profits with social/environmental goals)."},{"id":"cg-s2-f16","session":"2","front":"What example illustrates the 'shareholder value maximization disciplines managers' extended assumption?","back":"Boeing's CEO being dismissed after the 737 Max crisis, poor performance/reputation damage led to a falling stock price and management change."},{"id":"cg-s3-f1","session":"3","front":"When and how was Enron founded, and how big did it become?","back":"Founded in 1985 in Houston, Texas, from the merger of two gas companies. At its peak it was ranked 7th in the Fortune 500 before collapsing in 2001."},{"id":"cg-s3-f2","session":"3","front":"What made Enron different from a traditional energy company?","back":"It shifted from energy production to energy trading, focusing on financial engineering, derivatives and risk-taking, effectively becoming a 'trading house'."},{"id":"cg-s3-f3","session":"3","front":"Define mark-to-market / accelerated earnings accounting as Enron used it.","back":"A method that allowed Enron to recognize revenues from long-term contracts immediately (the estimated total future profit), instead of spreading them over the life of the contract, disconnecting accounting from actual cash flows."},{"id":"cg-s3-f4","session":"3","front":"Define a Special Purpose Entity (SPE) and how Enron abused it.","back":"A legal entity created outside the main company to hold assets/debt separately. Enron transferred debt to SPEs (keeping it off its own balance sheet), reported only the profits, and used complex opaque structures so banks/auditors wouldn't question them."},{"id":"cg-s3-f5","session":"3","front":"List Enron's five key governance failures.","back":"Aggressive mark-to-market accounting, SPEs hiding debt, the board and auditors (Arthur Andersen) failing to challenge management, a toxic culture of risk-taking/greed/conflicts of interest, and regulatory gaps."},{"id":"cg-s3-f6","session":"3","front":"What is Enron's stated lesson, per the lecture?","back":"Without independent oversight and transparent reporting, complex financial innovations (mark-to-market, SPEs) can be exploited to conceal risk and inflate performance. Effective governance needs strong independent boards, auditor accountability, and regulation that keeps pace with innovation."},{"id":"cg-s3-f7","session":"3","front":"When was Theranos founded, by whom, and what was its peak valuation?","back":"Founded in 2003 by Elizabeth Holmes in Silicon Valley. Reached a $9 billion valuation as a celebrated 'Unicorn' before the fraud was revealed in 2015."},{"id":"cg-s3-f8","session":"3","front":"What three factors made the Theranos scam technically possible?","back":"The proprietary technology was kept secret, demonstrations to investors/partners were misleading, and there was a lack of peer review or external scientific validation of the claimed technology."},{"id":"cg-s3-f9","session":"3","front":"List the three main differences between Theranos and cases like Enron/Satyam.","back":"1) Theranos was early-stage/pre-IPO with no widespread public shareholders. 2) The fraud was scientific/technical, not accounting-based. 3) It was heavily founder-driven, centred on Elizabeth Holmes."},{"id":"cg-s3-f10","session":"3","front":"List Theranos's five key governance failures.","back":"A charismatic founder who concentrated power in herself, no independent board expertise in biotech/medicine, secrecy/opacity limiting investor access to data, unicorn hype culture producing FOMO, and weak due diligence by VCs and retail investors."},{"id":"cg-s3-f11","session":"3","front":"What is Theranos's stated lesson, per the lecture?","back":"Independence, transparency and sector expertise are essential for board oversight in innovative startups."},{"id":"cg-s3-f12","session":"3","front":"What common thread does the lecture draw between Enron and Theranos despite their different fraud mechanisms?","back":"Boards and oversight structures that failed to challenge a dominant management figure or story, accounting engineering in Enron's case, false scientific claims in Theranos's case."},{"id":"cg-s3-f13","session":"3","front":"What role did the Elizabeth Holmes leadership style play at Theranos?","back":"She held centralized power as both CEO and public face, cultivated a cult-like leadership style, and the board, though loyal to her, was inexperienced in biotechnology."},{"id":"cg-s3-f14","session":"3","front":"How did Enron's business model shift affect what kind of company it 'really was'?","back":"It moved from being a traditional gas/energy production utility to effectively a financial trading house focused on derivatives and financial engineering rather than core energy operations."},{"id":"cg-s47-f1","session":"4-7","front":"What are the three board roles?","back":"Strategic task (mission, vision, strategic plans), monitor task (overseeing performance and management behavior), and networking task (reputation, stakeholder relationships)."},{"id":"cg-s47-f2","session":"4-7","front":"List the four types of directors distinguished in the lecture.","back":"CEO, executive (inside) directors, non-executive (outside) directors, and independent directors (a subset of non-executive directors free of compromising ties)."},{"id":"cg-s47-f3","session":"4-7","front":"What is the ideal board size range, per the lecture?","back":"7 to 15 members, balancing enough expertise against efficiency, a board too small lacks expertise, one too large loses efficiency."},{"id":"cg-s47-f4","session":"4-7","front":"Define CEO duality and its main risk.","back":"One person holding both the CEO and Chairman roles simultaneously. Can provide strong leadership but risks excessive concentration of power. Common in the US, rare in the UK."},{"id":"cg-s47-f5","session":"4-7","front":"What is the Lead Independent Director role for?","back":"Appointed specifically when CEO duality exists, to ensure checks and balances, its effectiveness depends on the individual's real independence and involvement."},{"id":"cg-s47-f6","session":"4-7","front":"List the typical board committees.","back":"Audit/Risk/Control, Remuneration, Nomination (Appointments), and increasingly Sustainability, with an executive committee used in specific cases."},{"id":"cg-s47-f7","session":"4-7","front":"What three elements make up the overall board effectiveness framework?","back":"INPUT (structure/composition), PROCESSES (working style, meetings, information, decision-making), and BOARD ROLES (control, service/advice, networking), shaped by contingent variables and stakeholder pressures."},{"id":"cg-s47-f8","session":"4-7","front":"What does the fiche say about board independence at Enron, Theranos and WorldCom?","back":"All three had a majority of outside/independent directors on their boards, yet all failed, showing independence alone is not enough, people and how the board works matter more."},{"id":"cg-s47-f9","session":"4-7","front":"What three process elements does board working style depend on?","back":"Meetings (frequency, duration, quality of setting), information (timely, complete, reliable, covering financials/budgets/strategy/competition), and decision-making style (open debate, avoiding 'board silence')."},{"id":"cg-s47-f10","session":"4-7","front":"Summarize the 2018 Italian board evaluation evidence.","back":"Sample of 202 companies (47 financial, 155 industrial), 84% conducted a board review (27% with an external advisor), but only 24% reported specific governance improvements as a result."},{"id":"cg-s47-f11","session":"4-7","front":"How did external advisor involvement affect Italian board review improvement rates?","back":"Substantially higher improvement rates across the board, e.g. informal meetings/induction programs improved in 35.6% of cases with an advisor versus 4.1% without one."},{"id":"cg-s47-f12","session":"4-7","front":"Distinguish hard law from soft law in board governance.","back":"Hard law, binding legal rules (Civil Code, Consolidated Law on Finance). Soft law, self-regulatory Corporate Governance Codes voluntarily adopted, enforced via 'comply or explain' disclosure rather than legal sanction."},{"id":"cg-s47-f13","session":"4-7","front":"What does 'comply or explain' mean?","back":"Listed firms must disclose reasons for any non-compliance with a Corporate Governance Code, rather than being legally forced to comply, since the codes are non-binding soft law."},{"id":"cg-s47-f14","session":"4-7","front":"Distinguish the Board of Directors from the Top Management Team (TMT).","back":"The board provides guidelines, oversight, and approves strategy/key decisions. The TMT, led by the CEO, develops strategies and business plans that are then submitted to the board for approval and critical review."},{"id":"cg-s47-f15","session":"4-7","front":"Define an independent director precisely.","back":"A non-executive director without financial, professional or personal ties that may compromise their independent judgment, assessed at appointment and re-assessed annually."},{"id":"cg-s47-f16","session":"4-7","front":"List the circumstances that compromise a director's independence, per the Italian Code examples.","back":"Being a significant shareholder, being an executive/top manager of the company or major shareholders in the last 3 years, significant commercial/financial/professional relations in the last 3 years, significant additional remuneration in the last 3 years, more than 9 years of board tenure (within 12), an executive position in a firm where a company executive is also a director, auditor-network ties, and family ties to controlling shareholders/executive directors."},{"id":"cg-s47-f17","session":"4-7","front":"Distinguish the Chairman's role from the CEO's role.","back":"Chairman, organizes/manages board work, sets the agenda, chairs meetings, holds no executive powers except information rights. CEO/Managing Director, manages the company within delegated powers, with certain strategic decisions still requiring board approval."},{"id":"cg-s47-f18","session":"4-7","front":"What are the four main board committees listed?","back":"Appointments Committee (nominations/succession), Remuneration Committee (pay policies), Audit & Risk Committee (internal controls/risk/financial reporting), and the optional Sustainability Committee (ESG/stakeholder engagement)."},{"id":"cg-s47-f19","session":"4-7","front":"How often do boards typically meet, and how much prep time do directors get?","back":"6 to 8 times per year (2 to 4 hours each), with 0.5 to 1 day of study expected in advance of receiving documentation."},{"id":"cg-s47-f20","session":"4-7","front":"List the milestones in Italian board gender quota regulation.","back":"2011 Golfo-Mosca Law (mandatory quotas introduced), 2018 Corporate Governance Code (recommended reserved seats), 2020 Budget Law (quotas extended to six mandates, raised to 40%), 2020 Code update (still 33% for boards specifically, but broadens equal-opportunity principle company-wide)."},{"id":"cg-s47-f21","session":"4-7","front":"What happened to the Italian director gender pay gap between 2012 and 2017?","back":"It actually increased, female executive directors grew in number but saw reduced average compensation, while independent women directors grew steadily but their compensation only slightly increased."},{"id":"cg-s47-f22","session":"4-7","front":"What board responsibilities exist around market relations and integrity safeguards?","back":"Transparent, timely communication with investors with equal access to information for all stakeholders, plus preventing misuse of confidential/price-sensitive information and requiring disclosure/abstention in conflict-of-interest situations."},{"id":"cg-s47-f23","session":"4-7","front":"What does the fiche mean by 'board silence' as a risk?","back":"Passive or disengaged board members failing to participate in open debate and constructive conflict, undermining the decision-making style dimension of board effectiveness."},{"id":"cg-s9-f1","session":"9","front":"List the three models of capitalism and their core logic.","back":"Anglo-Saxon (market/outsider system, dispersed ownership, active markets, easy hostile takeovers). German/Japanese (network/insider system, banks central, cross-shareholdings). Latin (State and family dominant, pyramidal groups, weak financial markets)."},{"id":"cg-s9-f2","session":"9","front":"Define Control-Enhancing Mechanisms (CEMs) and list the three main forms.","back":"Legal/contractual tools letting controlling shareholders exercise voting power disproportionate to cash-flow rights. Three forms, deviation from one-share-one-vote (dual-class shares), shareholders' agreements, and pyramidal groups."},{"id":"cg-s9-f3","session":"9","front":"Walk through the pyramidal group worked example.","back":"A owns 51% of B, B owns 51% of C. A's cash-flow rights in C = 51% x 51% = 26%. A's voting rights in C = 51% (since A controls B which controls C). The gap between 51% voting power and 26% cash-flow rights is what defines the CEM."},{"id":"cg-s9-f4","session":"9","front":"What five factors drive changes in a firm's ownership/governance/strategy system?","back":"Past performance (only extreme results trigger change), owners' values/resources, competitive environment, institutional context, and other contextual conditions (markets, infrastructure, education, technology)."},{"id":"cg-s9-f5","session":"9","front":"List the ownership-strategy archetypes mentioned in the lecture.","back":"Small family firm, large managerial corporation, state-owned company, small venture-backed start-up, franchising network, cooperative, local utility, and joint venture/consortium/association."},{"id":"cg-s9-f6","session":"9","front":"Contrast a cash-rich unconstrained controlling shareholder with one under debt pressure.","back":"Cash-rich, willing to invest heavily long term, open to risky strategies, supports R&D, accepts lower dividends. Debt-constrained, requires high dividends to service its own debt, reluctant to invest/expand, opposes capital increases, favors short-term cash generation."},{"id":"cg-s9-f7","session":"9","front":"What traits make companies more exposed to shareholder activism?","back":"Large underperforming firms, weak managerial ownership, pay-performance misalignment, boards with many independent directors (mixed evidence), and significant institutional ownership."},{"id":"cg-s9-f8","session":"9","front":"Summarize the Aberdeen Standard Investments case.","back":"The largest UK asset manager, $670bn AUM, stakes in 385 listed UK companies. Its Governance & Stewardship team voted against management in 33% of its 'Governance Health Warning' watchlist companies versus 14% of others, illustrating broad portfolio-wide stewardship."},{"id":"cg-s9-f9","session":"9","front":"Summarize the Elliott versus Vivendi contest at TIM (2018).","back":"Elliott (activist hedge fund) took a 5% stake and proposed replacing 6 directors. 8 directors resigned including Vivendi's CEO. A new board was elected with 13/15 independent members. CDP (Italian state investor) entered as a third actor to safeguard TIM as a strategic asset."},{"id":"cg-s9-f10","session":"9","front":"What three distinct goals did Vivendi, Elliott and CDP each pursue at TIM?","back":"Vivendi, industrial control and integrating telecom with media. Elliott, independent value-oriented governance and shorter-term financial returns. CDP, safeguarding TIM as a national strategic asset and rebalancing power between the other two."},{"id":"cg-s9-f11","session":"9","front":"What does the MSCI ESG rating framework measure, and what is its scale?","back":"Companies scored across Environmental, Social and Governance indicators (each measuring a specific risk/opportunity and management quality), aggregated into a rating from AAA (leader) to CCC (laggard)."},{"id":"cg-s9-f12","session":"9","front":"List the seven ESG investment strategies with one example each.","back":"Exclusions (Norway's fund excluding tobacco/coal/weapons), engagement & voting (BlackRock on climate), ESG integration (Goldman Sachs AM), norms-based screening (APG vs UN Global Compact), best in class (RobecoSAM), thematic (iShares Clean Energy ETF), impact investing (Triodos, Leapfrog)."},{"id":"cg-s9-f13","session":"9","front":"Define Italy's Non-Financial Declaration (NFD) and its legal basis.","back":"The Italian implementation (Legislative Decree 254/2016) of EU Directive 2014/95/EU, mandatory since 2017 for large public-interest entities (more than 500 employees), covering environment, social issues, human rights, anti-corruption and workforce policies."},{"id":"cg-s9-f14","session":"9","front":"What is the CSRD, and how does it relate to the NFD?","back":"The Corporate Sustainability Reporting Directive (2024-2026 rollout), introducing ESRS standards, broadening scope to SMEs, and adding assurance requirements. The NFD is the starting point of an ongoing transition toward the CSRD, not the final EU disclosure regime."},{"id":"cg-s9-f15","session":"9","front":"What NFD evidence gap does the lecture highlight?","back":"96% of companies described their main ESG risks and 88% described mitigation methods, but only 13% stated integrating ESG into risk management as an explicit objective, a gap between disclosure and genuine integration."},{"id":"cg-s9-f16","session":"9","front":"What correlation did the FTSE MIB findings show between sustainability plans and incentive systems?","back":"A strong correlation, 95% of companies with a declared sustainability plan also had incentives tied to it, versus only 5% of companies without a sustainability plan."},{"id":"cg-s9-f17","session":"9","front":"List the key ownership dichotomies used for governance analysis.","back":"Controlling vs no controlling shareholder, strong (>50%) vs weak controlling shareholder, unique vs coalition, private vs public, weak vs strong stakeholder pressure, financial vs industrial shareholder, weak vs strong business knowledge, cash-rich vs debt-constrained, weak vs strong institutional investor activism."},{"id":"cg-s9-f18","session":"9","front":"Why does the fiche warn about the folder label 'Session 9' for this content?","back":"The source file's title slide reads 'SESSION 9' but its content actually matches syllabus topic 7 (OGS, shareholder activism, ESG investing), not syllabus topic 9 (private/family firm governance design), Blackboard's own session numbering doesn't line up with the printed syllabus."}]};
const CHEATSHEET = {"da":"## Session 1, Introduction to Regression Models\n\n- A regression model expresses Y (dependent variable) as a function of x1,...,xp (explanatory variables), to know/explain/forecast Y's variability.\n- Equation: Y = β0 + β1x1 + ... + βpxp + ε. \"Linear\" means linear in the β's, not necessarily in the x's.\n- Five assumptions: zero-mean error, homoskedasticity (constant variance), uncorrelated errors, normal errors, no perfect multicollinearity.\n- Least squares picks b0,...,bp to minimize the sum of squared residuals. y-hat estimates the mean of Y, not one individual Y.\n- bj = marginal effect of xj: average change in Y per one-unit increase in xj, other x's held constant.\n- Watch for spurious effects: an omitted variable correlated with both xj and Y can flip or fake a relationship (coastal housing example — age drove both distance and price).\n- CI for βj: point estimate ± Student's t quantile × standard error. Higher confidence → wider interval.\n- Test H0: βj=0 via toss = bj/sbj, or via p-value < α.\n- Never extrapolate y-hat0 outside the observed x range.\n- R² = explained/total deviance, never decreases when adding a variable. Adjusted R² penalizes model size — use it to compare models with different p (only for non-nested comparisons; nested models need the partial F-test from Session 2).\n\n## Session 2, Categorical Variables and F-tests\n\n- Dummy variable: 0/1 coding, 1 = characteristic present. Its coefficient = average Y gap between the two groups, other variables held constant.\n- k>2 categories → k−1 dummies (never k — that creates perfect collinearity with the intercept). The excluded category is the reference; every dummy coefficient compares against it, never against another non-reference category directly.\n- To get a non-reference-vs-non-reference gap (e.g. zone C vs zone B when A is reference), compute the difference of the two fitted values yourself — no single coefficient gives it.\n- Dummy coefficients are tested exactly like quantitative ones (same CI, same t-test).\n- Partial F-test: tests joint significance of a GROUP of variables (e.g. all dummies of one categorical variable) between two nested models (reduced ⊂ complete). One term removed → t-test and partial F-test agree. Several terms removed together → only the partial F-test is valid.\n- Global F-test = partial F-test with the null model (intercept only) as the reduced model. Tests whether the whole model matters at all.\n- Total deviance never changes across models fit on the same Y/sample — only residual and explained deviance move.\n- Not rejecting H0 in an F-test = insufficient evidence, not proof of zero effect.\n\n## Session 3, Transformations and Interactions\n\n- Two hidden assumptions of the base model: linearity (effect of xj constant regardless of xj's own value) and additivity (effect of one variable doesn't depend on another variable's level). Both can be wrong, independently.\n- Non-linearity → fixed by transforming a variable (log(x), x², etc.). Non-additivity → fixed by adding an interaction term (product of two variables). Don't confuse the two fixes.\n- With a transformed variable (e.g. x²), the effect is no longer one fixed coefficient: use either the derivative (local, at one exact point) or the finite difference (real change between two specific x values) — never read the raw coefficient as a flat per-unit effect.\n- log(x) shortcut: a ~1% rise in x → mean(Y) changes by about 0.01·b1 (small-change approximation only).\n- Interaction term x1·x2 lets the effect of x1 depend on x2's level (and vice versa). Quantitative × dummy interaction → two lines with both a different intercept AND a different slope (not just parallel shifts).\n- If the interaction coefficient isn't significant, the model behaves like the no-interaction case (parallel lines) — always check its significance before claiming the effect differs by group.\n- One interaction term → t-test. Several interaction terms together, or a variable appearing in several forms (main effect + interaction + quadratic) → one joint partial F-test, never separate t-tests.\n\n## Session 4, Multicollinearity, Assumption Violations, Influential Points\n\n- Multicollinearity (overlap between x's information) is always present a little — the real question is whether it's high enough to matter.\n- High multicollinearity → inflated standard errors → smaller |t| → larger p-values → risk of wrongly concluding a variable isn't significant, even though the group is jointly significant (check: is the global F-test significant even when individual t-tests aren't? That's the multicollinearity signature).\n- VIFj = 1/(1−Rj²) from regressing xj on the OTHER x's (never on Y). VIF > 10 = conventional \"high\" threshold. Use GVIF for dummy variables.\n- Three remedies: drop a variable, increase n, or use PCA/factor analysis.\n- Residuals-vs-fitted plot: no pattern → assumptions OK. Parabola shape → non-linearity. Funnel shape → heteroskedasticity (different problem, different look).\n- Q-Q plot → checks normality; straight line = good, curvature = violation.\n- Y transformed to log(Y) (log-lin or log-log) can fix heteroskedasticity/restore linearity — but then coefficients read as approximate PERCENTAGE effects on Y, not raw units.\n- Outlier = bad fit on Y (large residual, |residual|>3 rule of thumb). Leverage point = unusual on the x's (not Y). They're judged on different axes — one without the other is possible.\n- Influential = removing it changes the results meaningfully. Measured by dfbeta (per coefficient) or Cook's distance (overall). Not every outlier/leverage point is automatically influential — check directly.\n\n## Session 5, Panel Data Models\n\n- Panel data = n units × T time points, each observed repeatedly (both cross-sectional and time dimensions at once). Balanced panel → exactly n×T observations per variable.\n- Classic regression fails on panel data because repeated observations of the same unit are usually correlated over time — violates the uncorrelated-errors assumption.\n- Pooling Model = plain OLS on all n·T points, ignoring panel structure — generally wrong, same spurious-correlation risk as a naive cross-section.\n- FEM: uit = μi + εit, μi fixed/deterministic per unit (absorbs unobserved, time-constant heterogeneity) → each unit gets its own intercept αi, same slope β for all.\n- REM: same split, but μi is random and must be uncorrelated with the x's. Only α and β are estimated (not n separate μi's) → more efficient when valid.\n- μi (individual error) = persistent, time-constant unit differences. εit (idiosyncratic error) = fluctuations varying by unit AND time (short-term shocks/noise).\n- Hausman test: H0 = REM valid. Reject H0 (small p-value) → use FEM. Don't reject → use REM. (Easy trap: rejecting H0 means REM FAILS, switch away from it — don't invert this.)\n- Predicting a specific panel unit under FEM: always use that unit's own fixef() intercept, never a generic/averaged one.\n- FEM/REM extend to multiple x's exactly like simple → multiple regression: just add more xj terms, same logic for μi/εit.\n\n## Session 6, Logistic regression for binary variables (logit model)\n\n- Odds of an event E with probability p, ODDS = p/(1-p). Increasing correspondence with p, ODDS>1 means p>0.5, ODDS<1 means p<0.5.\n- The logit model uses log(ODDS), the log-odds, which is strictly increasing in p, going to minus infinity as p to 0 and plus infinity as p to 1.\n- Y is dichotomous (0/1), p = E(Y). Model equation, log(p/(1-p)) = beta0 + beta1x1 + ... + betapxp, i.e. log-odds is linear in the x's.\n- Coefficients estimated by Maximum Likelihood (not OLS), R does the computation.\n- e^bj is the odds ratio, quantitative xj, effect of +1 unit; dichotomous xj, effect of xj=1 vs xj=0. Always \"other variables held constant.\"\n- bj>0 means odds (and probability) go up; bj<0 means they go down. e^bj is a factor on the ODDS, not a direct percentage change in probability.\n- Individual test, H0: betaj=0, statistic zoss=bj/SE(bj), approx standard normal under H0, reject if |zoss|>z(alpha/2) or p-value<alpha.\n\n## Session 7, significance tests, prediction, model quality\n\n- Individual Z-test only checks one coefficient. For a group of variables or the whole model, use the chi-square (LRT) test instead.\n- chi2 = RES.DEV(reduced) - RES.DEV(complete), df = difference in residual df of the two models. Global test = partial test with the null model as reduced (q=0).\n- Residual deviance RES.DEV = -2 log L(M). Lower is a better fit.\n- Prediction order, log-odds by substitution, exponentiate for odds, convert to probability, threshold 0.5 (default) for predicted Y.\n- AIC = -2logL(M) + 2(p+1), lower is better. Use the partial chi-square test (not AIC) for nested models specifically.\n- Insurance example to remember, AGE coefficient negative (odds go down with age), VC jointly significant via partial chi-square, 84% correct predictions in the confusion matrix.\n\n## Session 8, multinomial logit model\n\n- Used when Y has k>2 unordered categories (k=2 reduces to Session 6's binary model). k-1 equations, each vs one fixed reference category.\n- log(pi/p1) = beta0i + beta1i x1 + ... , coefficients differ across equations for the same variable, always check which category R picked as reference.\n- Coefficient reading, (e^bji - 1) x 100% = percent change in the odds of Ai vs the reference category, other variables held constant.\n- Individual test same logic as Session 6 (z = bji/SE(bji)). Group/global chi-square tests for the multinomial model exist but are explicitly not covered, don't try to compute them.\n- Prediction, substitute x's into the k-1 equations, exponentiate to get ratios pi/p1, solve with sum(pi)=1 to get each probability.\n- Common trap, a coefficient is always relative to the reference category only, never a statement about the raw probability, and coefficients from different equations are not directly comparable to each other.\n","cr":"## Session 1, Global Financial Reporting Regulation and Accounting Principles\n\n- Agency problem, once ownership separates from control, managers (agents) may hold interests diverging from owners (principals); information asymmetry is the resulting gap financial reporting tries to bridge.\n- Regulation has two motives, market imperfections (efficiency) and protecting unsophisticated investors (wealth redistribution). Three sources, legislation, accounting standards, stock exchange rules.\n- GAAP is jurisdiction specific, IFRS is the IASB's attempt at a global standard operating alongside or instead of local GAAPs.\n- IFRS Foundation appoints and funds the IASB (14 members), not the other way round. Advisory Council sets agenda priorities, IFRIC interprets standards.\n- Due process, topic, Conceptual Framework, consultation, discussion document, exposure draft, final standard.\n- EU endorsement is not automatic, each IFRS needs individual ARC endorsement (advised by EFRAG/SARG), enforced nationally, coordinated by ESMA.\n- IFRS required in 100+ countries, permitted in 14 more, not mandatory in the US.\n- Principles vs rules is officially a false distinction, a mix of both is normal.\n\n## Session 2, The IFRS Conceptual Framework\n\n- Not itself an IFRS, a specific standard prevails in case of conflict. Eight chapters.\n- Sole objective, decision usefulness for investors, lenders, creditors, stewardship is included in it, not separate.\n- Fundamental characteristics, relevance (predictive and or confirmatory value) and faithful representation (complete, neutral, free from material error, not ALL error).\n- Enhancing characteristics, comparability, verifiability, timeliness, understandability, they only help once the fundamentals are already there.\n- Prudence supports neutrality, it does not conflict with it.\n- Five elements, asset (present economic resource from past events), liability (present obligation to transfer a resource), equity (residual interest), income and expenses.\n- Two assumptions, going concern and accruals. Recognition needs relevance, faithful representation, and benefits exceeding costs.\n- Two measurement bases, historical cost and current value (fair value, value in use, fulfilment value).\n\n## Session 3, IAS1 and IFRS18, IAS8, IAS10\n\n- Five components of financial statements, position, profit or loss and OCI, changes in equity, cash flows, notes.\n- Cash flow statement is the only one not on an accruals basis.\n- Current asset or liability tests are OR tests (any one condition), not AND tests.\n- Offsetting is prohibited unless another IFRS specifically allows it.\n- IFRS18 replaces IAS1 only from periods beginning 1 January 2027, introduces five P&L categories and new mandatory subtotals.\n- Accounting policy changes are retrospective (restate comparatives), accounting estimate changes are prospective only, material prior period errors are corrected retrospectively.\n- Adjusting events existed at period end (adjust the numbers), non adjusting events arose after (disclose only if material).\n\n## Session 4, IAS7 Statement of Cash Flows\n\n- Cash flow statement exists because profit is accruals based and not a reliable indicator of cash health.\n- Overdraft counts as negative cash, not a financing item. Three activities, operating, investing, financing.\n- Direct and indirect methods give the same bottom line, only presentation differs. Indirect starts from profit before tax (pre IFRS18) and adjusts for non cash items and working capital changes.\n- Working capital sign rule, a decrease in a current asset or increase in a current liability is a source of cash, add it.\n- Pre IFRS18, interest paid usually operating or financing, dividends paid operating or financing, tax operating unless tied elsewhere.\n- IFRS18 forces dividends paid to financing, and interest paid to financing in most cases, and changes the indirect method's starting subtotal.\n- Reconciliation of cash and cash equivalents to the balance sheet is mandatory, segment cash flow analysis is only encouraged.\n\n## Session 5, Financial Instruments I, IAS32 Presentation and Classification\n\n- Three standards, three jobs, IAS32 presentation and classification, IFRS9 recognition and measurement, IFRS7 disclosure.\n- Substance over form, an instrument's legal label does not determine its classification.\n- Equity test needs BOTH Part A (no obligation to deliver cash or exchange unfavourably) AND Part B (settled in own equity instruments).\n- Redeemable preference shares fail Part A, so they are a liability, their dividends are an expense.\n- Compound instruments (like convertible bonds) get split accounting, liability component is the present value of contractual cash flows at the MARKET rate for an equivalent non convertible instrument, equity component is the residual.\n- Liability related interest and dividends go through profit or loss, equity distributions are debited directly to equity, never through P&L.\n\n## Session 6, Financial Instruments II, IFRS9 Recognition and Measurement\n\n- Recognition happens when the entity becomes party to the contract, not when cash moves.\n- Initial measurement is always fair value, for both assets and liabilities.\n- Four asset categories, amortised cost, debt FVOCI (recycles to P&L eventually), equity FVOCI (designated, never recycles), FVPL (default).\n- Amortised cost test needs BOTH the SPPI cash flow test AND the hold to collect business model, failing either forces fair value.\n- Effective interest rate is calibrated to the instrument's real price and cash flows, not the coupon rate, a zero coupon bond has 0 percent coupon but a positive effective rate.\n- Liabilities default to amortised cost, fair value only if held for trading. Trade receivables and payables can use invoice amount if discounting is immaterial.\n\n## Session 7, Financial Instruments III, Derecognition, Impairment, Disclosure\n\n- Impairment and uncollectability is explicitly one of IFRS9's own measurement topics, alongside initial measurement, subsequent measurement, reclassifications, gains and losses.\n- Expected credit loss model is forward looking, a loss allowance is recognised from initial recognition, no need to wait for a loss event, unlike the old incurred loss model.\n- Three stages, Stage 1 (no significant risk increase) 12 month ECL, Stage 2 (significant increase) lifetime ECL, Stage 3 (credit impaired) lifetime ECL plus interest on the net carrying amount.\n- IFRS7 lets users assess significance of instruments and their risks. Three risk categories, market, credit, liquidity, all three should be covered where relevant, not a choice of one.\n\n## Session 8, Financial Instruments IV, Case Study Berkshire Hathaway\n\n- The case's own rule change (US GAAP ASU 2016 01) is not an IFRS rule, use it only as a comparison hook.\n- Equity investments default to FVTPL under IFRS9, FVOCI needs an irrevocable election, instrument by instrument, only for non trading holdings, at initial recognition.\n- Under FVOCI, dividends still go to P&L, only fair value changes go to OCI, and those OCI amounts NEVER recycle to P&L, not even on disposal, this is the single most tested distinction versus debt FVOCI.\n- No separate ECL impairment model exists for equity FVOCI.\n- Decision sequence for any instrument question, IAS32 classification, IFRS9 initial fair value, subsequent measurement, then presentation (P&L vs OCI).\n- The case is framed as a presentation case, not a valuation case, the debate is which line shows the movement, not what the fair value is.\n\n## Session 9, Non Current Assets I, PP&E Recognition and Initial Cost\n\n- IAS16 excludes assets held for sale, biological assets, exploration assets, mineral rights, and investment property (that is IAS40).\n- PP&E needs (a) use in production, supply, rental or admin AND (b) expected use over more than one period.\n- Recognition needs reliable cost measurement AND probable future economic benefits, both required.\n- Three cost elements, purchase price, directly attributable costs, estimated dismantling and restoration cost as a provision.\n- Excluded, admin overheads, feasibility studies, staff training, abnormal waste.\n- Capitalisation stops once the asset is capable of operating as intended, not once it is actually at full capacity.\n- Component approach, depreciate significant parts separately when useful lives differ (aircraft engine vs seats vs airframe).\n- Borrowing costs on qualifying assets are capitalised, specific borrowing rate for dedicated loans, weighted average rate (time apportioned by months) for general borrowings.\n\n## Session 10, Non Current Assets II, Subsequent Costs, Revaluation, Investment Property\n\n- Capitalise additions, improvements, replacements, major non routine inspections. Expense ordinary repairs and relocation or reorganisation costs.\n- Replacing a component means derecognising the old component's carrying amount and capitalising the new one.\n- Cost model, cost minus accumulated depreciation minus accumulated impairment. Three depreciation methods, straight line, diminishing balance, units of production.\n- Land is never depreciated, must be split from any building bought with it.\n- Revaluation model applies to an entire class, no selective revaluation, needed every 3 to 5 years absent big swings.\n- Surplus deficit rule, first surplus to OCI reserve, first deficit to P&L, later moves reverse the prior one first, splitting between reserve and P&L at the point the prior balance runs out.\n- Revalued PP&E keeps being depreciated. IAS40 investment property under the fair value model is the opposite, remeasured every year, no more depreciation, gains AND losses go straight through P&L, never OCI.\n\n## Session 11, Non Current Assets III, Intangible Assets IAS38\n\n- Three part test, non monetary, identifiable (separable OR from contractual/legal rights), no physical substance.\n- Identifiability is what separates a specific intangible from goodwill.\n- Four acquisition routes, separate acquisition at cost, business combination at fair value (IFRS3), government grant at fair value or nominal (IAS20), internally generated at capitalised outlays subject to the R&D split.\n- Internally generated trademarks, mastheads, customer lists are never recognisable, but the same items ARE recognisable if acquired externally or via a business combination.\n- Finite life intangibles are amortised and impairment tested if indicators exist, indefinite life intangibles and goodwill are never amortised but tested for impairment at least annually.\n- Research is always expensed, development is capitalised only if all six conditions hold simultaneously (technical feasibility, intention, ability to use or sell, probable future benefits, adequate resources, reliable measurement).\n- An add on module to an already in use asset is amortised over the REMAINING useful life of the original asset, not a fresh term.\n\n## Session 12, Impairment of Assets I, IAS36 Recognition, CGUs, Goodwill\n\n- Impairment loss equals carrying amount minus recoverable amount, when carrying amount is higher. Recoverable amount is the higher of fair value less costs to sell and value in use.\n- Indefinite life intangibles, goodwill, and not yet in use assets are tested annually regardless of indicators, everything else only when an indicator appears.\n- External indicators, market value decline, adverse environment changes, rising rates, book value above market cap. Internal indicators, damage, changed use, worse than expected internal reporting.\n- A CGU is the smallest group generating largely independent cash inflows, used when an individual asset cannot be tested on its own, it is a fallback, not a default.\n- Goodwill is allocated to CGUs expected to benefit from synergies, the CGU's own assets are tested before goodwill.\n- Allocation order within a CGU, goodwill absorbs the loss first (down to zero), then the rest is spread pro rata across other assets, never below each asset's own fair value less costs to sell or value in use floor.\n- Goodwill impairment can NEVER be reversed. Other assets can be reversed up to what the carrying amount would have been net of notional depreciation.\n\n## Session 13, Impairments II, Case Study Biosensors International Group\n\n- BIG bought the remaining 50 percent of JWMS for 478 million dollars in 2011, taking intangibles plus goodwill from 4 percent to 62 percent of total assets.\n- Customer relationships dominated the acquired intangibles (131 million net of 162 million total), recognisable specifically because they came from a business combination.\n- Land use rights were not yet amortised because the lease had not started yet, consistent with the capable of operating cutoff rule.\n- Goodwill is measured at cost (consideration minus net identifiable assets and liabilities), never amortised, allocated to CGUs.\n- The actual FY2012 impairment hit three SMALLER CGUs, not JWMS, proof that goodwill testing is CGU specific, not company wide.\n- The no impairment conclusion for JWMS rests entirely on management's own DCF assumptions (18 percent growth, 2 percent terminal growth, 12 percent discount rate), not independently verifiable, market capitalisation is offered as an external cross check.\n\n## Session 14, Provisions, Contingent Liabilities and Contingent Assets IAS37\n\n- Provision recognition needs all three, present obligation from a past event, probable outflow, reliable estimate.\n- Legal obligation comes from contract or law, constructive obligation comes from the entity's own conduct creating a valid expectation, both count as obligating events.\n- Uncertainty spectrum, accrued liabilities (most certain, on balance sheet), provisions (on balance sheet, shown separately), contingent liabilities (notes only, or nothing if remote).\n- One off events use the most likely amount, large populations (warranties) use probability weighted expected value.\n- Discount to present value when material, unwind the discount each period as a finance cost.\n- Never net an expected disposal gain against a provision, even if closely linked.\n- Future operating losses are never a provision, they may trigger an IAS36 impairment test instead. Onerous contracts ARE always provided for.\n- Restructuring provisions need both a detailed formal plan AND a valid expectation raised in those affected, only direct restructuring specific costs count, not ordinary retraining or marketing.\n- Contingent assets are never recognised, disclosed only if probable, become ordinary assets once virtually certain.\n\n## Session 16\n\n- A lease conveys the right to control an identified asset only if the lessee gets both the economic benefits AND the right to direct how/for what purpose it's used.\n- Three reasons firms lease: 100% fixed rate financing, protection against obsolescence, contractual flexibility.\n- IAS17 was a dual model (finance vs operating lease, via risk/reward and purchase-similarity tests). IFRS16 is a single model, lessees recognise a ROU asset and lease liability for essentially every lease.\n- IFRS16 barely changed lessor accounting, mainly added disclosure.\n- Before IFRS16, investors and rating agencies already informally capitalised operating leases with rough rules of thumb (liability roughly 8x lease expense).\n- Three goals of the reform: faithful representation, comparability, less room for manipulation.\n- Recognised amounts are consistently found more value relevant to investors than merely disclosed amounts (multiple settings, not just leases).\n- Real effects, firms restructured leases (shorter terms, variable payments, more capex) after capitalisation rules, sometimes with real costs to investment/profitability/employment.\n\n## Session 17\n\n- Only two recognition exemptions, short term leases (12 months or less) and low value leases, both just expensed straight line.\n- Lease term includes reasonably certain renewal periods and reasonably certain non-exercised termination options, an anti-avoidance rule.\n- ROU asset initial cost = initial lease liability + payments at/before commencement + initial direct costs + estimated restoration costs.\n- Lease liability initial measurement = PV of fixed payments + index/rate variable payments + expected residual guarantee payments + purchase option (if likely) + termination penalties.\n- Subsequent, ROU asset depreciated under IAS16, tested for impairment under IAS36. Lease liability uses effective interest, same rate as at initial measurement.\n- Depreciation and interest can never be combined into one income statement line.\n- Principal payments always go to financing cash flows, interest follows the entity's normal interest presentation policy.\n- Lessor accounting is basically unchanged, still operating vs finance lease classification.\n- General ratio direction, leverage up, asset turnover down, current ratio down, interest coverage down (unverified but logically consistent).\n\n## Session 18\n\n- Tweedie's quip about flying on an aircraft that's on the balance sheet captures exactly what IFRS16 fixed for airlines.\n- Airlines were the second most IFRS16-impacted industry (47% median debt increase, 33% EBITDA increase), because of heavy off balance sheet aircraft leasing.\n- Cathay Pacific 2019, ROU/PP&E and lease liabilities both rose about HKD 19.9-20bn, gearing rose 36.5%, EBITDA rose 31.1%, EPS fell 1.6%, net profit worsened by HKD 86m (depreciation + finance charges slightly exceeded eliminated rent).\n- Total cash flow was unchanged, only the classification across operating/financing shifted.\n- Residual value risk shifted from lessor-only (under old operating leases) to partly lessee-exposed (via ROU asset impairment risk under IFRS16), even without any change to the actual contract.\n- Possible lessee responses, renegotiate leases, shift to variable non-index payments, reconsider lease vs buy.\n- Exam trap, IFRS16 adoption does not always hurt profit, the direction depends on each year's mix of new vs maturing leases and can reverse later in a lease's life.\n\n## Session 19\n\n- Tax expense = current tax + deferred tax.\n- Permanent differences never reverse, no deferred tax (fines, tax exempt interest). Temporary differences do reverse, they create deferred tax.\n- Deferred tax asset, paying more tax now than accounting profit implies (will pay less later). Deferred tax liability, paying less tax now (will pay more later).\n- Balance sheet approach, temporary difference = carrying amount minus tax base. Asset with carrying > tax base, or liability with carrying < tax base, both give a liability. The opposite pairing gives an asset.\n- Common temporary difference sources, depreciation rate gaps, bad debt/warranty timing, pension timing, unrealised vs realised investment income.\n- Deferred tax is always reported undiscounted and always as non-current, regardless of when it's expected to reverse.\n\n## Session 20\n\n- Worked examples confirm, total tax paid always converges to the same amount regardless of accounting vs tax timing, only the timing of payment differs.\n- Valuation allowance, a contra account reducing a deferred tax ASSET (never a liability) when future taxable profit is no longer probable, flows through P&L as a loss to establish, a gain to reverse.\n- Deferred taxes matter more where accounting and tax rules diverge (UK) than where they're closely aligned (Germany, France).\n- For a growing firm, capex driven deferred tax liabilities can keep rolling forward rather than reversing, described as similar to an interest free loan from the government.\n- Academic evidence on the book-tax gap is two sided, associated with lower earnings quality in some studies, but forcing conformity (narrowing the gap) has also been shown to reduce earnings informativeness.\n\n## Session 21\n\n- Sale and leaseback, seller-lessee sells then immediately leases back the same asset. Whole treatment hinges on whether the transfer is a sale under IFRS15 (control transfer).\n- If a sale, ROU asset = previous carrying amount x (PV of leaseback / fair value). Gain recognised = (fair value - carrying amount) x (1 - that same ratio).\n- If not a sale, both sides treat the cash as a loan under IFRS9.\n- Tax rate change adjustment = beginning cumulative timing difference x (old rate - new rate), a one time catch up, never spread forward.\n- DTA and DTL always move in the SAME direction as the tax rate, both rise when the rate rises, both fall when it falls.\n- Self check, the new DTA/DTL balance after a rate change must equal the cumulative timing difference revalued at the new rate.\n\n## Session 22\n\n- Core principle, recognise revenue when control transfers to the customer, not when cash is received. Amount = transaction price.\n- Five steps, identify the contract (5 conditions), identify distinct performance obligations, determine the transaction price, allocate it by stand-alone selling price, recognise as obligations are satisfied.\n- Distinct = customer can benefit on its own AND separately identifiable in the contract. Highly integrated bundles (CRM+consulting, hospital design-build) are ONE obligation.\n- Variable consideration, expected value method for a range of outcomes, most likely amount method for an essentially binary outcome.\n- Point in time vs over time recognition, over time uses output (units, milestones) or input (costs incurred) progress methods.\n- Contract asset (performance done, payment still conditional beyond timing) vs receivable (unconditional except for timing) vs contract liability (paid before performance).\n\n## Session 23\n\n- Loyalty/miles programmes granting a material right are their own performance obligation, allocate part of the transaction price, defer it until redemption or expiry.\n- Right of return, transaction price = expected consideration net of expected returns, PLUS a refund liability and a right-to-recover-goods asset, not instead of the reduced revenue.\n- Non-refundable up-front fees not tied to a distinct service are deferred, recognised over the expected customer relationship period, not just the stated contract term.\n- Contract acquisition/set-up costs meeting the capitalisation criteria are amortised over the same period as the revenue they relate to.\n- Progress on an over time obligation can be measured by output (assessed % complete) or input (cost to cost), and the two need not agree, use whichever faithfully depicts progress. This can even produce a reported loss in a period despite an ultimately profitable contract.\n\n## Session 24\n\n- Full retrospective, restates ALL prior comparative periods shown. Modified retrospective, no restatement, one cumulative catch up to opening retained earnings in the adoption year.\n- General Dynamics (full retrospective, -$684m), business jet contracts moved from two milestone recognition to single point-in-time recognition at delivery, deferring previously recognised profit.\n- Ford (modified retrospective, +$36m), certain previously deferred vehicle sales moved to recognition at shipment, accelerating previously deferred revenue.\n- The sign of the adjustment says nothing about earnings quality, it just reflects whether revenue was deferred (negative) or accelerated (positive) by the new rules.\n- Comparing companies with different transition methods around the adoption year risks mixing a restated and a non-restated historical basis.\n\n## Session 25\n\n- IFRS2 covers share based payment for goods/services only, not dividends or a general cash share issue.\n- Equity-settled, measure goods/services fair value (or equity fair value if unreliable), never remeasured later for market moves. Cash-settled, a liability, remeasured to fair value every period until settlement.\n- No vesting condition, full expense at grant date. Vesting condition present, expense spread over the vesting period.\n- Cost is always fixed at grant date fair value, subsequent share price moves are irrelevant to the P&L charge.\n- Forfeiture (service/non-market condition failure), revise cumulative expense to the revised number expected to vest. Market condition failure, no change at all. Expiry after vesting, pure equity reclassification, zero P&L effect.\n- In the exercise journal entry, share premium is always the balancing plug figure.\n\n## Session 26\n\n- eBay 2000, $48.3m profit as reported (APB25 intrinsic value) versus a $90.7m pro forma LOSS under SFAS123 fair value, same company, same year.\n- APB25, expense = stock fair value minus exercise price at grant date, zero for at-the-money grants (most of eBay's options).\n- SFAS123/IFRS2 style fair value captures full option value including time value via Black-Scholes, not just the immediate spread.\n- The 103.79 vs 62.69 gap (fair value vs exercise price) is time value, driven by eBay's 115% expected volatility, not a pricing error.\n- IFRS2 requires mandatory recognition of the SFAS123-style fair value, closing exactly the gap this case illustrates.\n- The pro forma loss does not mean eBay's business was failing, it's an accounting reclassification of compensation cost, not a cash economics statement.\n\n## Session 27\n\n- Four benefit categories, short term (undiscounted, as earned), post-employment (this session), other long-term (similar mechanics but ALL remeasurement to P&L, no OCI split), termination.\n- Defined contribution, risk on employee, simple expense-as-due accounting. Defined benefit, risk on employer, full actuarial/discounting model via the projected unit credit method.\n- P&L = service cost + net interest (discount rate x opening net position). OCI (never recycled) = all remeasurements.\n- Same discount rate used for the obligation AND for plan assets' interest income.\n- Past service cost (plan amendments) is recognised immediately, not spread over future service, unlike ordinary service cost.\n- Employer contributions and benefits paid are pure balance sheet movements, never P&L items.\n\n## Session 28\n\n- Five standards, IFRS10 (consolidation), IAS27 (parent's separate FS), IAS28 (equity method), IFRS11 (joint arrangements), IFRS12 (disclosure).\n- Control = power + exposure to variable returns + ability to use power to affect returns, all three required together.\n- Protective rights and non-substantive rights never confer power, however extensive they look.\n- Consolidation mechanics, eliminate the investment against the subsidiary's pre-acquisition equity, recognise NCI for the minority share.\n- Fair value of net assets = book equity + step-ups - step-downs, both net of deferred tax (step-up gives a DTL, step-down gives a DTA).\n- Partial goodwill, NCI at proportionate share of net assets, smaller goodwill. Full goodwill, NCI at its own fair value, larger goodwill (includes NCI's own implied share).\n- Negative goodwill (bargain purchase) goes straight to income, the opposite of ordinary goodwill.\n\n## Session 29\n\n- Intra-group balances (loans, receivables, payables) are fully cancelled on consolidation.\n- Unrealised profit is eliminated in full. Downstream (parent to sub) hits group retained earnings only. Upstream (sub to parent) splits proportionately between group retained earnings and NCI.\n- Step-up/step-down adjustments continue post-acquisition, depreciate/amortise over remaining useful life with a partial deferred tax reversal each period.\n- Inventory already written down for unrelated reasons absorbs some/all of the intra-group profit automatically, only eliminate what remains.\n- Fixed asset intra-group sale needs three adjustments together, eliminate the gain, correct depreciation to the original cost basis, restate carrying amount to group-level NBV.\n- Intra-group dividends, eliminate the parent's dividend income against the subsidiary's distribution, only dividends actually paid to NCI reduce NCI's equity.\n- Golden rule, consolidate everything at 100% first, then carve out NCI's share of net income only at the end, using only adjustments that originated with that subsidiary.\n\n## Session 30\n\n- A business = inputs + processes capable of producing outputs, even without outputs yet existing (a research facility with no sales can still qualify).\n- IFRS3 excludes joint arrangements, common control combinations, and JV formation.\n- Four steps, identify the acquirer, determine the acquisition date, measure net assets/NCI/consideration at fair value, recognise goodwill or a bargain purchase.\n- In a reverse acquisition, the accounting acquirer can differ from the legal acquirer, look at who actually ends up controlling the combined entity.\n- Acquisition-related costs (legal, consulting, valuation) are always expensed, never capitalised into goodwill, except debt/equity issuance costs (IFRS9's own rules).\n- Acquisition date = when control actually passes, not necessarily the legal transfer date.\n- Previously unrecognised intangibles (customer relationships etc) can now be recognised at fair value, overriding the acquiree's own historical IAS38 restrictions.\n- Goodwill = consideration + NCI + FV of any previously held interest - net FV of identifiable assets. Step acquisitions remeasure the prior stake to fair value through P&L when control is obtained.\n\n## Session 31\n\n- Lyradon controls Velquanta via 65% equity (variable returns) plus a 4-of-6 board majority with simple majority voting (power and the ability to use it).\n- Alpine's veto rights (dividends, buybacks, capital reduction, financing over EUR 50m) are protective, not substantive, they don't reach ordinary operating/strategic decisions.\n- What would flip this, if Alpine's consent rights reached ordinary budgets/R&D/commercial decisions, or if the financing threshold were low enough to capture routine financing.\n- Acquisition date = 1 July 2024, the completion date, not the 3 June signing date.\n- Fair value of net assets = 13,000 book equity + 17,000 net fair value adjustments (PPE, developed tech, customer relationships, IPR&D, minus a contingent liability) = 30,000 (EUR'000).\n- Goodwill (partial method, cash only) = 48,000 - 65%x30,000 = 28,500, this is a floor, the earn-out's fair value still needs to be added.\n- Previously unrecognised intangibles get recognised now under the fair value threshold, even though Velquanta itself never capitalised them.\n- Transaction costs (EUR 1.2m) are expensed, explicitly kept out of consideration transferred and goodwill.\n","fm":"## Session 1\n\n- Value creation means holding three equilibria together: income statement profitable, balance sheet solvent, cash flow statement cash generative. Toys \"R\" Us failed despite paper profitability.\n- The business plan simulates the company's trajectory; the financial plan tests whether that model is actually sustainable and aligns financial goals with business strategy.\n- Under rising uncertainty (WUI trending up since 1990), use McKinsey's six practices: explicit probabilities, a momentum case, an explicit bear case, consistent macro assumptions, disaggregated inflation, weekly back-testing.\n- Three planning tools differ by horizon and frequency: cash budget is short term and monthly/weekly, financial budget is medium term and annual/quarterly, financial plan is medium-long term (3, 5, 7 years) and annual.\n- Cash budget purpose: forecast periodic cash balances to plan funding needs or surplus deployment. Three-step build: sources, uses, then shortage/surplus.\n- Cost/revenue differs from cash inflow/outflow for three reasons: timing mismatch, non-monetary events like depreciation, events entirely outside the income statement like loan repayments.\n- Cash identity: Cash(EOP) = Cash(BOP) + (Sources − Uses) + Financial income/charges. BOP of month t equals EOP of month t-1.\n- Largest source of cash is normally customer collections, not financing activity, don't default to \"raise debt\" first.\n- In the Clank case, expansion capex (CRM platform) is a large cash outflow with a much smaller depreciation footprint. Know the mechanics, not a specific numeric answer, since input tables are missing from the extraction.\n\n## Session 2\n\n- Root cause behind all six working-capital mistakes: badly designed performance metrics and incentives, not bad luck. Ask \"what is this person's bonus tied to\" on any case question.\n- Mistake 1, managing to the income statement: balance sheet costs like inventory never show up there, so managers have no incentive to avoid locking up cash.\n- Mistake 2, rewarding sales on volume alone inflates both receivables and inventory. The metals refining case cut receivables from 185 to 45 days just by adding a courtesy reminder call.\n- Mistake 3, quality-only production bonuses build WIP inventory customers won't pay for. Refocusing on WIP reduction (not defending the price premium) freed €20 million at a European drive-systems producer.\n- Mistake 4, receivables and payables are separate relationships governed by different bargaining power, never mechanically mirror a supplier term change onto customers.\n- Mistake 5, current ratio and quick ratio: a \"better\" ratio is usually achieved by carrying more receivables/inventory and fewer payables, exactly the wrong direction. A French firm went insolvent six months after proudly reporting improved ratios.\n- Mistake 6, benchmarking only within your industry breeds complacency. Dell was best in class among computer makers but still had huge room to improve once benchmarked against retailers.\n- Building a culture of value beats managing by numbers alone. Toyota's JIT culture rewards constant process experimentation, not blind metric chasing.\n\n## Session 3\n\n- Cash cycle = DI + DSO − DPO = operating cycle (DI+DSO) minus the payable period.\n- DSO = AR ÷ (Sales ÷ 365). DPO = AP ÷ (COGS ÷ 365). DI = Inventory ÷ (COGS ÷ 365). DSO uses sales, DI and DPO both use COGS, a common calculation trap.\n- Worked numbers to remember the pattern: Sales 6,133, COGS 5,464, Inventory 879, AR 764, AP 682 gives DSO 45, DPO 46, DI 59, Cash Cycle 58 days.\n- Walmart (fast-turnover retailer) has a near-zero cash cycle; Boeing (long manufacturing cycle) has one near 179 days, the contrast illustrates the formula.\n- Inventory trade-off: carrying cost rises with order size, order cost falls with order size, optimal order size balances the two. Reorder point triggers replenishment at a minimum threshold.\n- Inventory does not scale proportionally with sales, it rises less than proportionately, an economy of scale. JIT only works with steady, predictable production flow.\n- Four receivables management questions: terms of sale, credit analysis, the credit decision, collection policy.\n- Credit decision rule: E[gain|grant] = p×PV(Revenue−Cost) − (1−p)×PV(Cost), grant only if this beats $0. Goal is maximizing present value, not minimizing bad debts.\n- Concentrate credit-analysis effort on large or doubtful accounts, not spread evenly. An aging schedule tracks overdue receivables.\n\n## Session 4-5\n\n- Three FX exposure types: transaction (already-contracted cash flows), operating/economic (future competitiveness), translation (consolidation accounting only, no cash flow impact).\n- Hedging reduces variability of cash flows around the mean, it does not necessarily raise expected cash flow.\n- Payable: go long forward (agree to buy FX at maturity). Receivable: go short forward (agree to sell FX at maturity).\n- Importer/exporter options rule: importers who owe FX buy calls, exporters who receive FX buy puts, easy to get backwards.\n- Break-even spot rates: receivable/put hedge S*T = F + premium; payable/call hedge S*T = F − premium. Opposite signs because the un-exercised side needs to beat the forward's fixed payoff/cost differently.\n- Option premium is paid regardless of outcome, always net it against the payoff, never treat it as a cost only when exercised.\n- Over-hedging: hedging more currency than actually materializes turns the hedge into a speculative position on the unrealized gap, forcing the firm to buy the missing amount on the spot market to deliver against the forward.\n- Two hedging-policy questions every case raises: when to start hedging (budget stage vs invoicing/certain exposure), how much to hedge (100% vs a smaller conservative share).\n- Forward hedge does not improve the expected outcome, it removes variance, meaning you may give up upside as the price of removing downside. Options sit between the forward and doing nothing.\n- Direct quotation (European investor) = home currency per unit of foreign currency, indirect is the reciprocal. Forward premium formula fN,j = [FN($/j) − S($/j)] ÷ S($/j) × (360÷N), positive = premium/expected to strengthen.\n","cg":"## Session 1\n\n- Four CG definitions differ on whose interests are centred, Shleifer & Vishny (investor returns only), Sheridan & Kendall (owners plus stakeholders plus compliance), Cadbury (board-centred), Blair (whole institutional system).\n- Public company (PC), ownership so fragmented no shareholder bothers to actively govern, shareholders \"vote with their feet\" (sell) instead of contesting board seats.\n- Agency relationship, principal delegates to agent, both utility maximisers, so safeguards are costly. Agency costs = monitoring + bonding + residual losses.\n- Three ownership/board configurations, dispersed+independent board, dispersed+management-dominated board, concentrated+overlapping (adds a majority vs minority shareholder conflict on top of the classic one).\n- Six misbehaviours, empire building (excess risk for personal power) vs shirking (its opposite, risk aversion), wealth extraction, entrenchment, short-termism, favouritism/insider trading.\n- Five historical failures, Enron 2001, Parmalat 2003, WorldCom 2002, Satyam 2009, Theranos 2015, common ingredients are weak boards, conflicts of interest, weak transparency, concentrated power.\n- Three response families, efficient markets, structures/rules/mechanisms, privileged ownership structures, concretised as market for corporate control, blockholders, incentives, fiduciary duties, financial debt.\n- LLSV, weak legal protection means ownership concentration substitutes for the law, strong protection means dispersed ownership becomes viable.\n\n## Session 2\n\n- Shareholder view core claim, maximize shareholder value, shareholders as residual claimants, managers as agents, stakeholders only instrumental.\n- Extended assumptions are conditions the argument depends on (efficient markets, discipline via stock price, stock incentives, market for corporate control), not proven facts.\n- Residual income rights (claim on leftover profit) vs residual control rights (right to decide when contracts are silent), both go to shareholders because they're exposed when contracts are incomplete.\n- Property conception (nexus of contracts, managers as agents) vs social entity conception (social institution, managers as trustees), example ExxonMobil vs Unilever.\n- Four stakeholder power types, voting, political/regulatory, environmental/social, economic.\n- Four definitions of what CG is for, shareholder, stakeholder, managerial, firm.\n- 2019 Business Roundtable, 181 CEOs voluntary statement toward stakeholder capitalism, echoed by Larry Fink, not a legal change.\n\n## Session 3\n\n- Enron shifted from energy production to energy trading, a \"trading house\" built on financial engineering.\n- Mark-to-market let Enron book a 20-year contract's whole estimated future profit immediately, the technique itself isn't fraud, the application was.\n- SPEs hid debt off Enron's own balance sheet while keeping only the profits visible, banks failed to check due to fee conflicts, reputational blindness, and opacity.\n- Enron failures, aggressive accounting, hidden debt via SPEs, board/Arthur Andersen failure to challenge, toxic risk culture, regulatory gaps.\n- Theranos promised blood tests from a finger-prick, hit $9bn valuation, collapsed 2015, fraud was scientific/technical, not accounting, pre-IPO so no public shareholders.\n- Theranos board was loyal to Holmes but lacked biotech expertise, that's the precise failure, not just \"didn't ask questions\".\n- Shared lesson across both, boards failed to challenge a dominant management narrative, different mechanisms, same governance root cause.\n\n## Session 4-7\n\n- Three board roles, strategic, monitor, networking. Ideal size 7 to 15.\n- CEO duality (one person as CEO and Chairman) risks power concentration, common in the US, the Lead Independent Director exists to counterbalance it.\n- Effectiveness framework, input (structure) plus processes (working style) plus board roles, and crucially, Enron/Theranos/WorldCom all had independent-majority boards yet still failed, independence alone is not enough.\n- Board evaluation, Italian evidence, 84% did a review but only 24% reported real improvement, advisor-backed reviews perform much better (35.6% vs 4.1% on one metric).\n- Hard law (Civil Code) vs soft law (Corporate Governance Codes, comply-or-explain, not legally binding).\n- Independence compromised by, being a significant shareholder, executive role in last 3 years, significant relations/remuneration in last 3 years, more than 9 years of tenure (within 12), cross-directorships, auditor ties, family ties to controllers.\n- Board vs TMT, board oversees and approves, TMT (led by CEO) develops strategy/business plans for board approval.\n- Main committees, Appointments, Remuneration, Audit & Risk, optional Sustainability.\n- Italian gender quotas tightened over time (2011 Golfo-Mosca, 2020 Budget Law to 40%), yet the director pay gap still widened 2012-2017.\n\n## Session 9\n\n- Three capitalism models, Anglo-Saxon (market/outsider, dispersed), German/Japanese (network/insider, banks central), Latin (State plus family, pyramidal groups).\n- Control-Enhancing Mechanisms, dual-class shares, shareholders' agreements, pyramidal groups, all create
